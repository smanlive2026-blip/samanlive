<!-- LOCATION: public/profile/details.html - V3 - FULL CODE - NO CUT - MY DETAILS - CUSTOMER ONLY -->
<!-- FLOW: Load -> GET /api/common/profile/me?role=customer -> Form bharo -> Photo badlo (UnifiedProfile -> Cloudinary URL) -> Save -> PUT /api/common/profile/update { role:customer, name, phone, email, gender, city, area, state, pincode, address, language, profilePic } -->
<!-- RULE 1: Is file me localStorage / sessionStorage KAHIN NAHI HOGA - Token sirf AuthCore se, Data sirf Server se -->
<!-- RULE 2: Photo SIRF Cloudinary pe jayegi - Base64 DB me kabhi nahi, /uploads/ me kabhi nahi, Disk pe kabhi nahi -->
<!-- RULE 3: alert() KABHI NAHI - Error sirf hint / msg me likhega, Button hamesha wapas aayega -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>My Details - SAMANLIVE</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
*{box-sizing:border-box;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f1f5f9;margin:0;color:#0f172a}
button{font-family:inherit;cursor:pointer;border:0}
.det-root{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:20px}
.header{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e2e8f0}
.back{width:36px;height:36px;background:#f1f5f9;border:none;border-radius:50%;font-size:20px;font-weight:900;cursor:pointer;flex-shrink:0;line-height:1}
.header b{font-size:16px}
.form{max-width:500px;margin:16px auto;padding:16px;background:#fff;border-radius:12px;border:1px solid #e2e8f0}
.pic-wrap{text-align:center;margin-bottom:16px}
.pic-wrap img{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#f1f5f9}
.pic-wrap label{display:block;margin-top:8px;font-size:12px;font-weight:800;color:#0f172a;cursor:pointer}
.form label{display:block;font-size:12px;font-weight:800;margin-top:12px}
.form input,.form select{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-top:6px;font-family:inherit;font-weight:600;font-size:13px}
.row{display:flex;gap:10px}
.row > div{flex:1}
.hint{margin-top:12px;padding:10px;border-radius:10px;font-size:11px;font-weight:700;line-height:1.5;display:none}
.hint.ok{display:block;background:#dcfce7;color:#166534;border:1px solid #bbf7d0}
.hint.bad{display:block;background:#fee2e2;color:#991b1b;border-color:#fecaca}
.save-btn{width:100%;margin-top:16px;background:#0f172a;color:#fff;padding:14px;border-radius:12px;font-weight:900;cursor:pointer;font-size:14px}
.save-btn:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:600px){ .det-root{max-width:100%} .form{margin:12px} .row{flex-direction:column} }
@media(min-width:900px){ .det-root{max-width:760px} .header{border-radius:0 0 16px 16px} }
</style>
</head>
<body>
<div class="det-root">
  <div class="header"><button class="back" onclick="location.href='/profile.html'">‹</button><b>👤 My Details</b></div>
  <div class="form">
    <div class="pic-wrap">
      <img id="userProfilePic" src="/assets/default-avatar.png" onerror="this.src='/assets/default-avatar.png'">
      <label for="picInput">📷 Change Photo</label>
      <input type="file" id="picInput" accept="image/*" style="display:none">
      <div id="picMsg" style="font-size:11px;color:#64748b;font-weight:600;margin-top:4px"></div>
    </div>

    <label>Full Name *</label><input id="detailName" placeholder="Apna naam" autocomplete="name">
    <label>Phone *</label><input id="detailPhone" placeholder="10 digit phone" maxlength="10" inputmode="numeric" autocomplete="tel">
    <label>Email</label><input id="detailEmail" placeholder="email (optional)" type="email" autocomplete="email">

    <div class="row">
      <div><label>Gender</label>
        <select id="detailGender"><option value="">Select</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
      </div>
      <div><label>Language</label>
        <select id="detailLang"><option value="hi">Hindi - हिन्दी</option><option value="en">English</option><option value="gu">Gujarati - ગુજરાતી</option></select>
      </div>
    </div>

    <label>Address</label><input id="detailAddress" placeholder="Ghar / Shop address" autocomplete="street-address">
    <label>Area</label><input id="detailArea" placeholder="Area / Mohalla">

    <div class="row">
      <div><label>City</label><input id="detailCity" placeholder="City"></div>
      <div><label>State</label><input id="detailState" placeholder="State"></div>
      <div><label>Pincode</label><input id="detailPincode" placeholder="Pincode" maxlength="6" inputmode="numeric"></div>
    </div>

    <div id="detailHint" class="hint"></div>
    <button id="saveBtn" class="save-btn">💾 Save Details</button>
  </div>
</div>

<script src="/shop-templates/common/core/auth-core.js"></script>
<script src="/shop-templates/common/profile/profile-core.js"></script>
<script src="/assets/js/app.js"></script>
<script>
(function(){
  var newProfilePicUrl = '';
  var currentUserId = '';

  // Token - Sirf AuthCore se - Browser storage se KABHI NAHI padhenge
  function getToken(){
    try{ if(window.AuthCore && window.AuthCore.getToken) return window.AuthCore.getToken() || ''; }catch(e){}
    return window.USER_TOKEN || '';
  }
  function getUserId(){
    try{ if(window.AuthCore && window.AuthCore.getUserId) return window.AuthCore.getUserId() || ''; }catch(e){}
    if(window.USER_ID) return window.USER_ID;
    if(window.currentUser && window.currentUser._id) return window.currentUser._id;
    return currentUserId || '';
  }
  function hint(msg, ok){
    var h = document.getElementById('detailHint');
    h.textContent = msg;
    h.className = 'hint ' + (ok ? 'ok' : 'bad');
  }
  function setVal(id, v){
    var el = document.getElementById(id);
    if(el) el.value = v || '';
  }

  // Load - HAMESHA Server se - Ek hi API = /api/common/profile/me?role=customer
  async function load(){
    var token = getToken();
    if(!token){ window.location.href = '/'; return; }
    try{
      var user = null;
      // 1. UnifiedProfile se - Sabse pehle wahi, kyunki wahi FILE 1 hai
      if(window.UnifiedProfile && window.UnifiedProfile.loadMyProfile){
        try{
          var prof = await window.UnifiedProfile.loadMyProfile({ role: 'customer', userId: getUserId() });
          if(prof && prof.success && prof.user) user = prof.user;
        }catch(e){}
      }
      // 2. Seedha /api/common/profile/me - UnifiedProfile na chale toh
      if(!user){
        var data = await fetch('/api/common/profile/me?role=customer&buyerId=' + encodeURIComponent(getUserId()), { headers: { 'Authorization': 'Bearer ' + token, 'x-buyer-id': getUserId() } }).then(function(r){ return r.json(); }).catch(function(){ return null; });
        if(data && data.success && data.user) user = data.user;
      }
      // 3. Last - /api/auth/me - Purana rasta, sirf fallback
      if(!user){
        var data2 = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + token } }).then(function(r){ return r.json(); }).catch(function(){ return null; });
        if(data2 && data2.user) user = data2.user;
      }
      if(!user){ hint('❌ Details load nahi hui - Dobara login karo', false); return; }

      window.currentUser = user;
      currentUserId = user._id || '';
      if(window.USER_ID === undefined) window.USER_ID = currentUserId;

      setVal('detailName', user.name);
      setVal('detailPhone', user.phone);
      setVal('detailEmail', user.email);
      setVal('detailGender', user.gender);
      setVal('detailLang', user.language || (user.preferences && user.preferences.language) || 'hi');
      // Address string ya object dono chalenge
      var addr = '';
      if(typeof user.address === 'string') addr = user.address;
      else if(user.address && typeof user.address === 'object') addr = user.address.line1 || user.address.street || '';
      else if(user.addresses && user.addresses[0]) addr = user.addresses[0].line1 || user.addresses[0].full || '';
      setVal('detailAddress', addr);
      setVal('detailArea', user.area);
      setVal('detailCity', user.city || (user.address && user.address.city) || (user.addresses && user.addresses[0] && user.addresses[0].city) || '');
      setVal('detailState', user.state || (user.address && user.address.state) || '');
      setVal('detailPincode', user.pincode || (user.address && user.address.pincode) || '');

      var pic = user.profilePic || user.avatar || user.photo || '';
      newProfilePicUrl = pic;
      if(pic) document.getElementById('userProfilePic').src = pic;
    }catch(e){ hint('❌ Details load nahi hui - ' + e.message, false); }
  }

  // Photo - UnifiedProfile se Cloudinary pe jayegi - Sirf URL milega, Base64 DB me kabhi nahi jayega
  // UnifiedProfile ke andar alert() nahi hai, Button atakega nahi, Preview ObjectURL se hoga
  document.getElementById('picInput')?.addEventListener('change', async function(){
    var input = this;
    if(!input.files || !input.files[0]) return;
    document.getElementById('picMsg').innerText = 'Upload ho raha hai... Cloudinary pe ja raha hai...';
    try{
      if(window.UnifiedProfile && window.UnifiedProfile.handleFileInput){
        var r = await window.UnifiedProfile.handleFileInput(input, { role: 'customer', previewSelector: '#userProfilePic', msgId: 'picMsg', btnId: 'saveBtn', userId: getUserId(), buyerId: getUserId() });
        if(r && r.success && r.url){
          newProfilePicUrl = r.url;
          document.getElementById('picMsg').innerText = '✅ Photo upload ho gayi - Ab Save Details dabao toh Profile me save hogi';
          return;
        }
        // UnifiedProfile ne msgId me hi error likh diya hoga - Yahan alert nahi marenge
        return;
      }
      document.getElementById('picMsg').innerText = '❌ Photo upload nahi hui - profile-core.js load nahi hua';
    }catch(e){
      document.getElementById('picMsg').innerText = '❌ Photo upload nahi hui - ' + e.message;
    } finally {
      input.value = '';
    }
  });

  // Save - SIRF 1 API - PUT /api/common/profile/update - FILE 2 wali hi API - Dusri API pe chupke nahi jayenge
  document.getElementById('saveBtn')?.addEventListener('click', async function(){
    var btn = this;
    var name = document.getElementById('detailName').value.trim();
    var phone = document.getElementById('detailPhone').value.trim();
    var email = document.getElementById('detailEmail').value.trim();
    var gender = document.getElementById('detailGender').value;
    var lang = document.getElementById('detailLang').value;
    var address = document.getElementById('detailAddress').value.trim();
    var area = document.getElementById('detailArea').value.trim();
    var city = document.getElementById('detailCity').value.trim();
    var state = document.getElementById('detailState').value.trim();
    var pincode = document.getElementById('detailPincode').value.trim();

    if(!name){ hint('❌ Naam chahiye', false); return; }
    if(!/^\d{10}$/.test(phone)){ hint('❌ Sahi 10 digit Phone chahiye', false); return; }
    if(email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ hint('❌ Sahi Email likho ya khaali chhodo', false); return; }
    if(pincode && !/^\d{6}$/.test(pincode)){ hint('❌ Sahi 6 digit Pincode chahiye', false); return; }

    btn.disabled = true; btn.textContent = 'Saving...';
    try{
      var payload = {
        role: 'customer',
        userId: getUserId(),
        buyerId: getUserId(),
        name: name,
        phone: phone,
        email: email,
        gender: gender,
        language: lang,
        address: address,
        area: area,
        city: city,
        state: state,
        pincode: pincode,
        profilePic: newProfilePicUrl,
        avatar: newProfilePicUrl,
        photo: newProfilePicUrl
      };
      var res = await fetch('/api/common/profile/update', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken(), 'x-buyer-id': getUserId() },
        body: JSON.stringify(payload)
      }).then(function(r){ return r.json(); }).catch(function(){ return null; });

      if(res && res.success){
        hint('✅ Save ho gaya - Details Server pe save ho gayi, Photo Cloudinary URL se aayegi', true);
        // NO browser storage save here - USER_NAME / USER_PIC kabhi browser me nahi jayega
        // Verify - Server se dobara mang ke check karo ki sach me save hui ya nahi
        try{
          var chk = await fetch('/api/common/profile/me?role=customer&buyerId=' + encodeURIComponent(getUserId()), { headers: { 'Authorization': 'Bearer ' + getToken(), 'x-buyer-id': getUserId() } }).then(function(r){ return r.json(); }).catch(function(){ return null; });
          if(chk && chk.user){
            var pic2 = chk.user.profilePic || chk.user.avatar || chk.user.photo || '';
            if(newProfilePicUrl && pic2 !== newProfilePicUrl) hint('⚠️ Save toh ho gaya, par Photo Server pe purani hi dikh rahi hai - Dobara Save dabao', false);
          }
        }catch(e){}
      } else {
        hint('❌ Save nahi hua - ' + ((res && (res.message || res.error)) || 'Server check karo'), false);
      }
    }catch(e){ hint('❌ Save nahi hua - ' + e.message, false); }
    btn.disabled = false; btn.textContent = '💾 Save Details';
  });

  document.addEventListener('DOMContentLoaded', load);
  if(document.readyState !== 'loading') load();
})();
</script>
</body>
</html>
