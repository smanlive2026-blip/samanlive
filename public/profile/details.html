<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Details - SAMANLIVE</title>
<link rel="stylesheet" href="/assets/css/main.css">
<style>
body{background:#f1f5f9;margin:0;font-family:Inter,sans-serif}
.header{background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e2e8f0}
.back{width:36px;height:36px;background:#f1f5f9;border:none;border-radius:50%;font-size:20px;font-weight:900;cursor:pointer}
.form{max-width:500px;margin:16px auto;background:#fff;border-radius:16px;padding:20px}
.avatar-wrap{text-align:center;margin-bottom:16px;position:relative}
.avatar-wrap img{width:90px;height:90px;border-radius:50%;border:3px solid #667eea;object-fit:cover;background:#f1f5f9}
.avatar-wrap .cam{position:absolute;bottom:0;left:50%;transform:translateX(20px);width:28px;height:28px;background:#0f172a;color:#fff;border-radius:50%;display:grid;place-items:center;font-size:13px;cursor:pointer;border:2px solid #fff}
.input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:10px;margin-top:6px;font-size:14px;box-sizing:border-box}
label{display:block;font-size:12px;font-weight:800;color:#64748b;margin-top:14px;text-transform:uppercase}
.btn{width:100%;margin-top:20px;background:#0f172a;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;cursor:pointer}
.btn:disabled{opacity:.6}
.success{background:#dcfce7;color:#166534;padding:10px;border-radius:10px;display:none;margin-top:12px;text-align:center;font-weight:700}
.msg{font-size:12px;color:#64748b;text-align:center;margin-top:8px}
.badge{display:inline-block;background:#dcfce7;color:#166534;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800}
</style>
</head>
<body>
<div class="header"><button class="back" onclick="history.back()">‹</button><b>My Details</b><span id="roleBadge" class="badge" style="margin-left:auto">CUSTOMER</span></div>
<div class="form">
  <div class="avatar-wrap">
    <img id="userProfilePic" src="/assets/default-avatar.png" alt="Profile Photo">
    <div class="cam" onclick="document.getElementById('picInput').click()">📷</div><br>
    <input type="file" id="picInput" accept="image/*" style="display:none">
    <button onclick="document.getElementById('picInput').click()" style="margin-top:8px;background:#f1f5f9;border:none;padding:6px 12px;border-radius:8px;font-weight:700;cursor:pointer">📷 Change Photo</button>
    <div id="picMsg" class="msg"></div>
  </div>
  <label>Name *</label><input id="userName" class="input" placeholder="Your name">
  <label>Phone *</label><input id="userPhone" class="input" placeholder="9876543210" maxlength="10">
  <label>Email</label><input id="userEmail" class="input" placeholder="email@example.com">
  <label>Gender</label>
  <select id="userGender" class="input"><option value="">Select</option><option value="male">Male</option><option value="female">Female</option><option value="other">Other</option></select>
  <label>Address</label><input id="userAddress" class="input" placeholder="House, Street">
  <label>City</label><input id="userCity" class="input" placeholder="Surat">
  <label>State</label><input id="userState" class="input" placeholder="Gujarat">
  <label>Pincode</label><input id="userPincode" class="input" placeholder="395007" maxlength="6">
  <label>Language</label><select id="userLang" class="input"><option value="hi">Hindi</option><option value="en">English</option><option value="gu">Gujarati</option></select>
  <div id="successMsg" class="success">✅ Saved successfully!</div>
  <button id="saveBtn" class="btn" onclick="saveDetails()">💾 Save Details</button>
</div>

<!-- V23 - UnifiedProfile sabse pehle load karo, phir details.js -->
<script src="/shop-templates/common/profile/profile-core.js"></script>
<script src="/assets/js/app.js"></script>
<script src="/profile/js/details.js"></script>
</body>
</html>
