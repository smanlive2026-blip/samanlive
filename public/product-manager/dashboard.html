<!-- LOCATION: public/product-manager/dashboard.html - PRODUCT MANAGER DASHBOARD - V14 FINAL -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Manager - Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#f8fafc}.header{background:#0f172a;color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;padding:16px}.stat{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:14px;text-align:center}.stat b{font-size:22px;display:block}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;padding:0 16px 80px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}.card img{width:100%;height:150px;object-fit:cover}.info{padding:10px}.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}.badge-pending{background:#fef3c7;color:#92400e}.badge-approved{background:#dbeafe;color:#1e40af}.badge-assigned{background:#dcfce7;color:#166534}.badge-rejected{background:#fee2e2;color:#991b1b}.btn{padding:8px 12px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-dark{background:#0f172a;color:#fff}.tabs{display:flex;gap:8px;padding:0 16px;overflow:auto}.tab{padding:8px 14px;border-radius:20px;border:1px solid #e2e8f0;background:#fff;cursor:pointer;font-weight:700;font-size:13px}.tab.active{background:#0f172a;color:#fff}</style>
</head><body>
<div class="header"><div><b style="font-weight:900"><i class="fa-solid fa-industry"></i> <span id="pmName">Product Manager</span></b><br><small id="pmArea" style="color:#94a3b8"></small></div><div style="display:flex;gap:8px"><span id="wallet" style="background:#16a34a;padding:6px 10px;border-radius:20px;font-weight:800">₹0</span><button class="btn btn-green" onclick="location.href='./product-form.html?pmId='+pmId"><i class="fa-solid fa-plus"></i> Add Product</button></div></div>
<div class="stats"><div class="stat"><small>Total</small><b id="sTotal">0</b></div><div class="stat"><small>Pending</small><b id="sPending" style="color:#d97706">0</b></div><div class="stat"><small>Approved</small><b id="sApproved" style="color:#2563eb">0</b></div><div class="stat"><small>Assigned</small><b id="sAssigned" style="color:#16a34a">0</b></div><div class="stat"><small>Earning</small><b id="sEarning">₹0</b></div></div>
<div class="tabs"><button class="tab active" data-f="">All</button><button class="tab" data-f="pending">Pending</button><button class="tab" data-f="approved">Approved</button><button class="tab" data-f="assigned">Assigned</button><button class="tab" data-f="rejected">Rejected</button></div>
<div id="grid" class="grid" style="margin-top:12px">Loading...</div>
<script>
// LOCATION: JS - PM Dashboard logic - V14 FINAL
const pmId = new URLSearchParams(location.search).get('pmId') || localStorage.getItem('pmId');
if(!pmId){ document.getElementById('grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px">No PM ID. Login via <a href="./login.html">login</a> or add ?pmId=xxx</div>'; throw new Error('No pmId'); }
let allProducts = [];
async function loadPM(){ const res = await fetch(`/api/product-manager/${pmId}`).then(r=>r.json()); const pm=res.data; if(pm){ document.getElementById('pmName').textContent = pm.name; document.getElementById('pmArea').textContent = `${pm.type} | ${pm.area}, ${pm.city||''}`; document.getElementById('wallet').textContent = `₹${pm.walletBalance||0}`; document.getElementById('sEarning').textContent = `₹${pm.totalEarning||0}`; } }
async function loadProducts(filter=''){ const res = await fetch(`/api/product-pool/my-products/${pmId}`).then(r=>r.json()); allProducts=res.data||[]; render(filter); }
function render(filter){ let list = filter ? allProducts.filter(p=>p.status===filter) : allProducts; document.getElementById('sTotal').textContent = allProducts.length; document.getElementById('sPending').textContent = allProducts.filter(p=>p.status==='pending').length; document.getElementById('sApproved').textContent = allProducts.filter(p=>p.status==='approved').length; document.getElementById('sAssigned').textContent = allProducts.filter(p=>p.status==='assigned').length; const grid=document.getElementById('grid'); if(!list.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:12px">No products in this tab</div>';return;} grid.innerHTML=list.map(p=>`<div class="card"><img src="${p.thumbnail||p.images?.[0]||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'"><div class="info"><div style="display:flex;justify-content:space-between"><b>${p.name}</b><span class="badge badge-${p.status}">${p.status.toUpperCase()}</span></div><small style="color:#64748b">${p.category} | Base ₹${p.basePrice} ${p.finalPrice?`| Final ₹${p.finalPrice}`:''}</small><br><small>Stock: ${p.stock} ${p.unit||''} | Areas: ${(p.areaTags||[]).join(', ')}</small><div style="margin-top:8px;display:flex;gap:6px">${p.status==='pending'?`<button class="btn btn-dark" style="padding:6px 10px;font-size:11px" onclick="delProduct('${p._id}')"><i class="fa-solid fa-trash"></i> Delete</button>`:''}<button class="btn" style="background:#f1f5f9;padding:6px 10px;font-size:11px" onclick="viewPool('${p._id}')">View</button></div></div></div>`).join(''); }
async function delProduct(id){ if(!confirm('Delete this product?')) return; await fetch(`/api/product-pool/${id}`,{method:'DELETE'}); loadProducts(document.querySelector('.tab.active').dataset.f); }
function viewPool(id){ location.href = `../admin-panel/product-pool.html?highlight=${id}`; }
document.querySelectorAll('.tab').forEach(t=>{ t.onclick=()=>{ document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active')); t.classList.add('active'); render(t.dataset.f); }; });
loadPM(); loadProducts();
</script></body></html>
