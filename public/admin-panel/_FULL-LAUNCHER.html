<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SL MASTER DASHBOARD v99 - WORLD CLASS</title>
<link rel="stylesheet" href="./assets/launcher.css?v=999">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <div>
      <h2>🔥 SL MASTER <span>v99</span></h2>
      <p class="sub-text">WORLD CLASS • CACHE BUSTED • PRO</p>
    </div>
    <button id="closeBtn" onclick="Launcher.toggleSidebar()">✕</button>
  </div>

  <div class="search-wrap">
    <input id="search" placeholder="Search files... (Ctrl+K)" autocomplete="off">
    <kbd>⌘K</kbd>
  </div>

  <div id="navList"></div>

  <div class="sidebar-footer">
    <div class="footer-row">
      <span id="count">0 files</span>
      <span id="lastLoad">Not loaded</span>
    </div>
    <div class="footer-actions">
      <button onclick="Launcher.clearCache()">🧹 Clear Cache</button>
      <button onclick="Launcher.toggleFullscreen()">⛶ Fullscreen</button>
    </div>
    <div class="version">samanlive.vercel.app • BUILD 999</div>
  </div>
</div>

<div id="mainWrapper">
  <div id="topbar">
    <div class="top-left">
      <button id="toggleBtn" onclick="Launcher.toggleSidebar()">☰</button>
      <div id="breadcrumb">🏠 / index.html</div>
    </div>
    <div class="top-right">
      <span id="liveClock"></span>
      <button class="icon-btn" onclick="Launcher.reloadCurrent()" title="Reload">↻</button>
    </div>
  </div>
  <div id="mainContainer"></div>
</div>

<div id="toast"></div>
<div id="overlay" onclick="Launcher.toggleSidebar()"></div>
<div id="loader"><div class="spinner"></div><p>Loading...</p></div>

<script>
class SLMasterLauncher {
  constructor(){
    this.files = [
     {id:"index", name:"index.html", icon:"🏠", tag:"13 BTN MAIN", cat:"CORE"},
     {id:"dashboard", name:"dashboard.html", icon:"📊", tag:"ANALYTICS v99", cat:"CORE"},
     {id:"orders", name:"orders.html", icon:"📦", tag:"SUPER ORDERS", cat:"ORDERS"},
     {id:"shops", name:"shops.html", icon:"🏪", tag:"SHOPS", cat:"MANAGEMENT"},
     {id:"users", name:"users.html", icon:"👥", tag:"USERS", cat:"MANAGEMENT"},
     {id:"managers", name:"managers.html", icon:"👔", tag:"MANAGERS", cat:"MANAGEMENT"},
     {id:"delivery", name:"delivery.html", icon:"🛵", tag:"DELIVERY", cat:"MANAGEMENT"},
     {id:"areas", name:"areas.html", icon:"🗺️", tag:"AREAS", cat:"LOCATIONS"},
     {id:"area-dashboard", name:"area-dashboard.html", icon:"📍", tag:"AREA DASH", cat:"LOCATIONS"},
     {id:"area-detail", name:"area-detail.html", icon:"🔍", tag:"AREA DETAIL", cat:"LOCATIONS"},
     {id:"cities", name:"cities.html", icon:"🏙️", tag:"CITIES", cat:"LOCATIONS"},
     {id:"api-routes", name:"api-routes.html", icon:"🔌", tag:"API ROUTES", cat:"DEV"},
     {id:"categories", name:"categories.html", icon:"📂", tag:"CATEGORIES", cat:"CATALOG"},
     {id:"content", name:"content.html", icon:"🎬", tag:"CONTENT", cat:"CATALOG"},
     {id:"coupons", name:"coupons.html", icon:"🎟️", tag:"COUPONS", cat:"MARKETING"},
     {id:"reports", name:"reports.html", icon:"📑", tag:"REPORTS", cat:"ANALYTICS"},
     {id:"settings", name:"settings.html", icon:"⚙️", tag:"SETTINGS", cat:"SYSTEM"},
    ];
    this.currentPage = localStorage.getItem('sl_last_page') || 'index';
    this.init();
  }

  init(){
    this.renderNav(this.files);
    this.bindEvents();
    this.startClock();
    const lastBtn = document.querySelector(`[data-page="${this.currentPage}"]`) || document.querySelector('[data-page="index"]');
    this.loadPage(this.currentPage, lastBtn);
  }

  bindEvents(){
    document.getElementById('search').addEventListener('input', (e)=>{
      const q = e.target.value.toLowerCase();
      const filtered = this.files.filter(f=> f.name.toLowerCase().includes(q) || f.tag.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
      this.renderNav(filtered);
    });
    document.addEventListener('keydown', (e)=>{
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); document.getElementById('search').focus(); }
      if(e.key === 'Escape'){ document.getElementById('sidebar').classList.add('hide'); document.getElementById('overlay').classList.remove('show'); }
    });
  }

  toggleSidebar(){
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    sidebar.classList.toggle('hide');
    if(sidebar.classList.contains('hide')){
      overlay.classList.remove('show');
    } else {
      if(window.innerWidth <= 1024) overlay.classList.add('show');
      else overlay.classList.remove('show');
    }
  }

  renderNav(list){
    const grouped = list.reduce((acc,f)=>{ (acc[f.cat] = acc[f.cat] || []).push(f); return acc; }, {});
    let html = '';
    for(const cat in grouped){
      html += `<div class="nav-cat">${cat}</div>`;
      html += grouped[cat].map(f=>`
        <button class="nav-btn" data-page="${f.id}" onclick="Launcher.loadPage('${f.id}', this)">
          <span><i>${f.icon}</i> ${f.name}</span><b>${f.tag}</b>
        </button>`).join('');
    }
    document.getElementById('navList').innerHTML = html;
    document.getElementById('count').innerText = `${list.length} files`;
  }

  async loadPage(pageName, btnElement){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    if(btnElement) btnElement.classList.add('active');
    localStorage.setItem('sl_last_page', pageName);
    this.currentPage = pageName;

    const container = document.getElementById('mainContainer');
    const loader = document.getElementById('loader');
    loader.classList.add('show');

    if(window.innerWidth <= 1024){
      document.getElementById('sidebar').classList.add('hide');
      document.getElementById('overlay').classList.remove('show');
    }

    try{
      if(window.moduleMap){ window.moduleMap.remove(); window.moduleMap=null; }
      if(window.shopMap){ window.shopMap.remove(); window.shopMap=null; }
      if(window.areaMap){ window.areaMap.remove(); window.areaMap=null; }

      const bust = Date.now();
      const res = await fetch(`${pageName}.html?v=999&t=${bust}`, {cache:'no-store', headers:{'Cache-Control':'no-cache'}});
      if(!res.ok) throw new Error('File not found');
      const html = await res.text();
      container.innerHTML = html;

      container.querySelectorAll('script').forEach(old=>{
        const s = document.createElement('script');
        if(old.src) s.src = old.src + `?t=${bust}`; else s.textContent = old.textContent;
        document.body.appendChild(s); old.remove();
      });

      document.getElementById('breadcrumb').innerText = `🏠 / ${pageName}.html`;
      document.getElementById('lastLoad').innerText = `${pageName} @ ${new Date().toLocaleTimeString()}`;
      this.toast(`Loaded ${pageName}.html`);
    }catch(err){
      container.innerHTML = `<div class="error-box"><h2>⚠️ Load Failed</h2><p>${err.message}</p><button onclick="Launcher.loadPage('${pageName}')">Retry</button></div>`;
      this.toast('Failed to load', 'error');
    }finally{
      loader.classList.remove('show');
    }
  }

  reloadCurrent(){ this.loadPage(this.currentPage, document.querySelector(`[data-page="${this.currentPage}"]`)); }
  clearCache(){ localStorage.clear(); this.toast('Cache Cleared'); setTimeout(()=>location.reload(), 600); }
  toggleFullscreen(){ document.fullscreenElement? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  startClock(){ setInterval(()=>{ const el=document.getElementById('liveClock'); if(el) el.innerText=new Date().toLocaleString(); },1000); }
  toast(msg, type='success'){
    const t=document.getElementById('toast'); t.innerText=msg; t.className=type; t.style.display='block';
    setTimeout(()=>t.style.display='none', 2500);
  }
}
const Launcher = new SLMasterLauncher();
window.Launcher = Launcher;
</script>
</body>
</html>
