<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>SL MASTER DASHBOARD v99 - WORLD CLASS + HISTORY</title>
<link rel="stylesheet" href="./assets/launcher.css?v=999">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="sidebar">
  <div class="sidebar-header">
    <div>
      <h2>🔥 SL MASTER <span>v99</span></h2>
      <p class="sub-text">WORLD CLASS • HISTORY TRACKED</p>
    </div>
    <button id="closeBtn" onclick="Launcher.toggleSidebar()">✕</button>
  </div>

  <div class="search-wrap">
    <input id="search" placeholder="Search files... (Ctrl+K)" autocomplete="off">
    <kbd>⌘K</kbd>
  </div>

  <div id="navList"></div>

  <div class="sidebar-footer">
    <div class="footer-row">
      <span id="count">0 files</span>
      <span id="lastLoad">Not loaded</span>
    </div>
    <div class="footer-actions">
      <button onclick="Launcher.clearCache()">🧹 Clear Cache</button>
      <button onclick="Launcher.showHistory()">📜 History</button>
      <button onclick="Launcher.toggleFullscreen()">⛶ Full</button>
    </div>
    <div class="version">samanlive.vercel.app • BUILD 999</div>
  </div>
</div>

<div id="mainWrapper">
  <div id="topbar">
    <div class="top-left">
      <button id="toggleBtn" onclick="Launcher.toggleSidebar()">☰</button>
      <div id="breadcrumb">🏠 / index.html</div>
    </div>
    <div class="top-right">
      <span id="liveClock"></span>
      <button class="icon-btn" onclick="Launcher.reloadCurrent()" title="Reload">↻</button>
    </div>
  </div>
  <div id="mainContainer"></div>
</div>

<div id="toast"></div>
<div id="overlay" onclick="Launcher.toggleSidebar()"></div>
<div id="loader"><div class="spinner"></div><p>Loading...</p></div>

<!-- ========= HISTORY MODAL ========= -->
<div id="historyModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(2,6,23,.85);backdrop-filter:blur(10px);z-index:99999;padding:20px;overflow-y:auto">
  <div style="max-width:800px;margin:20px auto;background:#fff;border-radius:16px;padding:20px;color:#0f172a">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
      <h2>📜 Page History - Last 100</h2>
      <div style="display:flex;gap:8px">
        <button onclick="Launcher.clearHistory()" style="padding:8px 14px;background:#ef4444;color:#fff;border:none;border-radius:8px">Clear</button>
        <button onclick="document.getElementById('historyModal').style.display='none'" style="padding:8px 14px;background:#0f172a;color:#fff;border:none;border-radius:8px">✕ Close</button>
      </div>
    </div>
    <div id="historyAnalytics" style="background:#f1f5f9;padding:12px;border-radius:10px;margin-bottom:12px;font-size:13px"></div>
    <div id="historyList"></div>
  </div>
</div>

<script>
// ===== GLOBAL HELPERS FOR ALL PAGES =====
window.showToast = window.showToast || function(msg){ const t=document.getElementById('toast'); if(!t) return; t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none',2500); };
window.loadPage = function(p, el){ if(window.Launcher) window.Launcher.loadPage(p, el); };
window.apiCall = window.apiCall || async function(url){
  const base = window.API_BASE || '/api/admin';
  const token = localStorage.getItem('adminToken') || localStorage.getItem('token') || '';
  const res = await fetch(base + url, { headers:{ 'Authorization':'Bearer '+token, 'Content-Type':'application/json' }, cache:'no-store' });
  if(!res.ok) throw new Error('API '+res.status);
  return res.json();
};

// ===== HISTORY TRACKER CLASS - YAHI DALNA THA =====
class SLHistory {
  constructor(){ this.key='sl_master_history_v99'; this.max=100; }
  log(pageName){
    const history = this.getAll();
    const now = new Date();
    const record = { id:Date.now(), page:pageName, url:pageName+'.html', time:now.toLocaleString('en-IN'), timestamp:now.getTime(), duration:'0s' };
    if(history.length>0){ const last=history[0]; last.duration=Math.floor((record.timestamp-last.timestamp)/1000)+'s'; }
    history.unshift(record);
    if(history.length>this.max) history.pop();
    localStorage.setItem(this.key, JSON.stringify(history));
  }
  getAll(){ try{ return JSON.parse(localStorage.getItem(this.key)||'[]'); }catch(e){ return []; } }
  clear(){ localStorage.removeItem(this.key); }
  getAnalytics(){ const h=this.getAll(); const c={}; h.forEach(r=>c[r.page]=(c[r.page]||0)+1); return Object.entries(c).sort((a,b)=>b[1]-a[1]); }
}
window.SLHistory = new SLHistory();

class SLMasterLauncher {
  constructor(){
    this.files = [
     {id:"index", name:"index.html", icon:"🏠", tag:"13 BTN MAIN", cat:"CORE"},
     {id:"dashboard", name:"dashboard.html", icon:"📊", tag:"ANALYTICS v99", cat:"CORE"},
     {id:"orders", name:"orders.html", icon:"📦", tag:"SUPER ORDERS", cat:"ORDERS"},
     {id:"shops", name:"shops.html", icon:"🏪", tag:"SHOPS", cat:"MANAGEMENT"},
     {id:"users", name:"users.html", icon:"👥", tag:"USERS", cat:"MANAGEMENT"},
     {id:"managers", name:"managers.html", icon:"👔", tag:"MANAGERS", cat:"MANAGEMENT"},
     {id:"delivery", name:"delivery.html", icon:"🛵", tag:"DELIVERY", cat:"MANAGEMENT"},
     {id:"areas", name:"areas.html", icon:"🗺️", tag:"AREAS", cat:"LOCATIONS"},
     {id:"area-dashboard", name:"area-dashboard.html", icon:"📍", tag:"AREA DASH", cat:"LOCATIONS"},
     {id:"area-detail", name:"area-detail.html", icon:"🔍", tag:"AREA DETAIL", cat:"LOCATIONS"},
     {id:"cities", name:"cities.html", icon:"🏙️", tag:"CITIES", cat:"LOCATIONS"},
     {id:"api-routes", name:"api-routes.html", icon:"🔌", tag:"API ROUTES", cat:"DEV"},
     {id:"categories", name:"categories.html", icon:"📂", tag:"CATEGORIES", cat:"CATALOG"},
     {id:"content", name:"content.html", icon:"🎬", tag:"CONTENT", cat:"CATALOG"},
     {id:"coupons", name:"coupons.html", icon:"🎟️", tag:"COUPONS", cat:"MARKETING"},
     {id:"reports", name:"reports.html", icon:"📑", tag:"REPORTS", cat:"ANALYTICS"},
     {id:"settings", name:"settings.html", icon:"⚙️", tag:"SETTINGS", cat:"SYSTEM"},
    ];
    this.currentPage = localStorage.getItem('sl_last_page') || 'index';
    this._pageScripts = [];
    this.init();
  }
  cleanupPage(){
    // Purane page ke timer band karo
    if (window.__slDashTimer) { clearInterval(window.__slDashTimer); window.__slDashTimer = null; }
    // Purane page ki script saaf karo - dobara declare wala error band
    this._pageScripts.forEach(s=>{ try{s.remove()}catch(e){} });
    this._pageScripts = [];
    // Purane chart saaf karo
    ['__slAreaChart','__slStatusChart','__slAreaRadiusChart'].forEach(k=>{ if(window[k]){ try{window[k].destroy()}catch(e){} window[k]=null; } });
    if(window.moduleMap){ try{window.moduleMap.remove()}catch(e){} window.moduleMap=null; }
  }
  init(){
    this.renderNav(this.files);
    this.bindEvents();
    this.startClock();
    const lastBtn = document.querySelector(`[data-page="${this.currentPage}"]`) || document.querySelector('[data-page="index"]');
    this.loadPage(this.currentPage, lastBtn);
  }
  bindEvents(){
    document.getElementById('search').addEventListener('input', (e)=>{
      const q = e.target.value.toLowerCase();
      const filtered = this.files.filter(f=> f.name.toLowerCase().includes(q) || f.tag.toLowerCase().includes(q) || f.cat.toLowerCase().includes(q));
      this.renderNav(filtered);
    });
    document.addEventListener('keydown', (e)=>{
      if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); document.getElementById('search').focus(); }
      if(e.key === 'Escape'){ document.getElementById('sidebar').classList.add('hide'); document.getElementById('overlay').classList.remove('show'); document.getElementById('historyModal').style.display='none'; }
    });
  }
  toggleSidebar(){
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    sidebar.classList.toggle('hide');
    if(sidebar.classList.contains('hide')) overlay.classList.remove('show');
    else { if(window.innerWidth <= 1024) overlay.classList.add('show'); else overlay.classList.remove('show'); }
  }
  renderNav(list){
    const grouped = list.reduce((acc,f)=>{ (acc[f.cat] = acc[f.cat] || []).push(f); return acc; }, {});
    let html = '';
    for(const cat in grouped){
      html += `<div class="nav-cat">${cat}</div>`;
      html += grouped[cat].map(f=>`<button class="nav-btn" data-page="${f.id}" onclick="Launcher.loadPage('${f.id}', this)"><span><i>${f.icon}</i> ${f.name}</span><b>${f.tag}</b></button>`).join('');
    }
    document.getElementById('navList').innerHTML = html;
    document.getElementById('count').innerText = `${list.length} files`;
  }
  async loadPage(pageName, btnElement){
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    if(btnElement) btnElement.classList.add('active');

    // YAHAN HISTORY LOG HOGA - IMPORTANT LINE
    localStorage.setItem('sl_last_page', pageName);
    window.SLHistory.log(pageName);
    this.currentPage = pageName;

    const container = document.getElementById('mainContainer');
    const loader = document.getElementById('loader');
    loader.classList.add('show');
    if(window.innerWidth <= 1024){
      document.getElementById('sidebar').classList.add('hide');
      document.getElementById('overlay').classList.remove('show');
    }
    try{
      this.cleanupPage();
      const bust = Date.now();
      const res = await fetch(`${pageName}.html?v=999&t=${bust}`, {cache:'no-store'});
      if(!res.ok) throw new Error('File not found');
      const html = await res.text();
      container.innerHTML = html;
      const scripts = Array.from(container.querySelectorAll('script'));
      for(const old of scripts){
        const s = document.createElement('script');
        s.setAttribute('data-sl-page-script','1');
        if(old.src) { s.src = old.src + (old.src.includes('?')?'&':'?') + `t=${bust}`; }
        else { s.textContent = old.textContent; }
        old.remove();
        document.body.appendChild(s);
        this._pageScripts.push(s);
        if(old.src){ await new Promise(r=>{ s.onload=r; s.onerror=r; }); }
      }
      document.getElementById('breadcrumb').innerText = `🏠 / ${pageName}.html`;
      document.getElementById('lastLoad').innerText = `${pageName} @ ${new Date().toLocaleTimeString()}`;
      this.toast(`Loaded ${pageName}.html`);
    }catch(err){
      container.innerHTML = `<div class="error-box"><h2>⚠️ Load Failed</h2><p>${err.message}</p><button onclick="Launcher.loadPage('${pageName}')">Retry</button></div>`;
    }finally{ loader.classList.remove('show'); }
  }
  showHistory(){
    const list = window.SLHistory.getAll();
    const analytics = window.SLHistory.getAnalytics();
    document.getElementById('historyAnalytics').innerHTML = `<b>Most Visited:</b> ${analytics.map(a=>`${a[0]} (${a[1]})`).join(' • ') || 'No data'}<br><b>Total:</b> ${list.length} records`;
    document.getElementById('historyList').innerHTML = list.map(r=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid #e2e8f0;border-radius:10px;margin:6px 0;background:#f8fafc">
        <span><b>${r.page}.html</b> <small style="color:#64748b">- ${r.time}</small></span>
        <div style="display:flex;gap:6px"><span style="font-size:11px;background:#0f172a;color:#fff;padding:3px 8px;border-radius:20px">${r.duration}</span><button onclick="Launcher.loadPage('${r.page}');document.getElementById('historyModal').style.display='none'" style="font-size:11px;padding:3px 8px;background:#10b981;color:#fff;border:none;border-radius:6px">Open</button></div>
      </div>`).join('') || '<p>No history yet</p>';
    document.getElementById('historyModal').style.display='block';
  }
  clearHistory(){ if(confirm('Clear all history?')){ window.SLHistory.clear(); this.showHistory(); this.toast('History Cleared'); } }
  reloadCurrent(){ this.loadPage(this.currentPage, document.querySelector(`[data-page="${this.currentPage}"]`)); }
  clearCache(){ localStorage.clear(); this.toast('Cache Cleared'); setTimeout(()=>location.reload(), 600); }
  toggleFullscreen(){ document.fullscreenElement? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
  startClock(){ setInterval(()=>{ const el=document.getElementById('liveClock'); if(el) el.innerText=new Date().toLocaleString('en-IN'); },1000); }
  toast(msg){ const t=document.getElementById('toast'); t.innerText=msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 2500); }
}
const Launcher = new SLMasterLauncher();
window.Launcher = Launcher;
</script>
</body>
</html>
