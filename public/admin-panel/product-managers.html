<!-- LOCATION: public/admin-panel/product-managers.html - ADMIN CREATES PM - V14 FINAL - NO MODIFY NEEDED -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Managers - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#f8fafc;display:flex}.sidebar{width:240px;background:#0f172a;color:#fff;padding:20px;position:fixed;height:100vh;overflow:auto}.sidebar a{display:flex;gap:10px;padding:12px;color:#94a3b8;text-decoration:none;border-radius:8px;margin:4px 0}.sidebar a.active,.sidebar a:hover{background:#1e293b;color:#fff}.main{margin-left:240px;flex:1;padding:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.btn{padding:8px 14px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-red{background:#ef4444;color:#fff}input,select{padding:10px;border:1px solid #e2e8f0;border-radius:8px;width:100%;margin:4px 0}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99}.modal.active{display:flex}.modal-content{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:500px;max-height:90vh;overflow:auto}</style>
</head><body>
<div class="sidebar"><h2 style="font-weight:900;margin-bottom:20px">SAMANLIVE</h2><a href="./dashboard.html">Dashboard</a><a href="./product-managers.html" class="active">Product Managers</a><a href="./executives.html">Executives</a><a href="./product-pool.html">Product Pool</a><a href="./area-demands.html">Area Demands</a></div>
<div class="main">
<h1 style="font-weight:900">Product Managers (Admin Creates)</h1><div style="margin:12px 0;display:flex;gap:8px"><button class="btn btn-green" onclick="openCreatePM()"><i class="fa-solid fa-plus"></i> Create PM</button><input id="searchPM" placeholder="Search name, phone, area, type..." style="max-width:300px"><button class="btn btn-dark" onclick="loadPMs()">Refresh</button></div>
<div id="pmGrid" class="grid">Loading...</div>
</div>

<div class="modal" id="pmModal"><div class="modal-content"><div style="display:flex;justify-content:space-between"><h3 style="font-weight:900">Create Product Manager</h3><button class="btn btn-dark" onclick="closeCreatePM()">X</button></div>
<div style="margin-top:10px">
<input id="pmName" placeholder="Name * e.g., Ramesh Kisan"><input id="pmPhone" placeholder="Phone * e.g., 9876543210"><input id="pmEmail" placeholder="Email (optional)">
<select id="pmType"><option value="">Type *</option><option value="kisan">Kisan</option><option value="manufacturer">Manufacturer</option><option value="wholesaler">Wholesaler</option><option value="artisan">Artisan</option><option value="shg">SHG</option><option value="distributor">Distributor</option><option value="pansari">Pansari</option><option value="medical">Medical</option><option value="other">Other</option></select>
<input id="pmCompany" placeholder="Company Name"><input id="pmGst" placeholder="GST (optional)"><input id="pmArea" placeholder="Area * e.g., Naliya"><input id="pmCity" placeholder="City e.g., Bhuj"><input id="pmPincode" placeholder="Pincode">
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="createPM()"><i class="fa-solid fa-save"></i> Create PM - Admin</button><div id="pmMsg" style="margin-top:8px;font-weight:700"></div>
</div></div></div>

<script>
async function loadPMs(){ const q=document.getElementById('searchPM').value.toLowerCase(); const res=await fetch('/api/product-manager/list').then(r=>r.json()); let data=res.data||[]; if(q) data=data.filter(p=> (p.name+' '+p.phone+' '+p.area+' '+p.type).toLowerCase().includes(q)); const grid=document.getElementById('pmGrid'); if(!data.length){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:12px">No PM found. Create one.</div>'; return; } grid.innerHTML=data.map(p=>`<div class="card"><div style="display:flex;justify-content:space-between"><b>${p.name}</b><span style="font-size:10px;padding:3px 8px;border-radius:12px;background:${p.isVerified?'#dcfce7':'#fef3c7'}">${p.isVerified?'VERIFIED':'PENDING'}</span></div><small style="color:#64748b">${p.type} | ${p.area}, ${p.city||''} | ${p.phone}</small><br><small>Products: ${p.totalProducts||0} | Earning: ₹${p.totalEarning||0} | Wallet: ₹${p.walletBalance||0}</small><br><small>Company: ${p.companyName||'-'} | GST: ${p.gst||'-'}</small><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-green" style="padding:6px 10px;font-size:11px" onclick="window.open('/product-manager/dashboard.html?pmId=${p._id}','_blank')"><i class="fa-solid fa-external-link"></i> Open PM Dashboard</button><button class="btn btn-dark" style="padding:6px 10px;font-size:11px" onclick="verifyPM('${p._id}')"><i class="fa-solid fa-check"></i> Verify</button><button class="btn btn-red" style="padding:6px 10px;font-size:11px" onclick="deletePM('${p._id}')"><i class="fa-solid fa-trash"></i> Delete</button></div></div>`).join(''); }
function openCreatePM(){ document.getElementById('pmModal').classList.add('active'); } function closeCreatePM(){ document.getElementById('pmModal').classList.remove('active'); }
async function createPM(){ const body={ name:document.getElementById('pmName').value.trim(), phone:document.getElementById('pmPhone').value.trim(), email:document.getElementById('pmEmail').value.trim(), type:document.getElementById('pmType').value, companyName:document.getElementById('pmCompany').value.trim(), gst:document.getElementById('pmGst').value.trim(), area:document.getElementById('pmArea').value.trim(), city:document.getElementById('pmCity').value.trim(), pincode:document.getElementById('pmPincode').value.trim() }; if(!body.name||!body.phone||!body.type||!body.area){ document.getElementById('pmMsg').textContent='Name, Phone, Type, Area required'; document.getElementById('pmMsg').style.color='red'; return; } document.getElementById('pmMsg').textContent='Creating...'; const res=await fetch('/api/product-manager/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()); if(res.success){ document.getElementById('pmMsg').textContent='PM Created by Admin!'; document.getElementById('pmMsg').style.color='green'; setTimeout(()=>{ closeCreatePM(); loadPMs(); },800); } else { document.getElementById('pmMsg').textContent='Error: '+(res.error||'failed'); document.getElementById('pmMsg').style.color='red'; } }
async function verifyPM(id){ await fetch(`/api/product-manager/verify/${id}`,{method:'PUT'}); loadPMs(); } async function deletePM(id){ if(!confirm('Delete PM?')) return; await fetch(`/api/product-manager/${id}`,{method:'DELETE'}); loadPMs(); }
document.getElementById('searchPM').oninput=loadPMs; loadPMs();
</script></body></html>
