<!-- LOCATION: public/admin-panel/product-managers.html - ADMIN PM CONTROL -->
<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Managers - Admin | SAMANLIVE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f8fafc;display:flex;min-height:100vh}
.sidebar{width:240px;background:#0f172a;color:#fff;padding:20px;position:fixed;height:100vh;overflow:auto}
.sidebar a{display:flex;gap:10px;padding:12px;color:#94a3b8;text-decoration:none;border-radius:8px;margin:4px 0}
.sidebar a.active,.sidebar a:hover{background:#1e293b;color:#fff}
.main{margin-left:240px;flex:1;padding:20px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px}
.top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:16px}
.btn{padding:10px 14px;border-radius:8px;border:0;font-weight:800;cursor:pointer}
.btn-dark{background:#0f172a;color:#fff}
.btn-green{background:#16a34a;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.pm-card{border-left:4px solid #16a34a}
.badge{padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}
.badge-verified{background:#dcfce7;color:#166534}
.badge-pending{background:#fef3c7;color:#92400e}
table{width:100%;border-collapse:collapse}
th,td{padding:10px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:13px}
</style>
</head>
<body>
<div class="sidebar">
  <h2 style="font-weight:900;margin-bottom:20px"><i class="fa-solid fa-leaf"></i> SAMANLIVE</h2>
  <a href="./dashboard.html"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
  <a href="./managers.html"><i class="fa-solid fa-user-tie"></i> Area Managers</a>
  <a href="./product-managers.html" class="active"><i class="fa-solid fa-industry"></i> Product Managers</a>
  <a href="./executives.html"><i class="fa-solid fa-user-secret"></i> Executives</a>
  <a href="./product-pool.html"><i class="fa-solid fa-boxes-stacked"></i> Product Pool</a>
  <a href="./area-demands.html"><i class="fa-solid fa-clipboard-list"></i> Area Demands</a>
  <a href="./shops.html"><i class="fa-solid fa-store"></i> Shops</a>
</div>
<div class="main">
  <div class="top">
    <div><h1 style="font-weight:900">Product Managers</h1><small id="totalCount" style="color:#64748b">Loading...</small></div>
    <div style="display:flex;gap:8px">
      <input id="search" placeholder="Search PM by name, type, area..." style="padding:10px 12px;border:1px solid #e2e8f0;border-radius:8px;min-width:260px">
      <button class="btn btn-dark" id="refreshBtn"><i class="fa-solid fa-rotate"></i> Refresh</button>
    </div>
  </div>
  <div class="card">
    <table><thead><tr><th>Name</th><th>Type</th><th>Area</th><th>Products</th><th>Wallet</th><th>Status</th><th>Action</th></tr></thead>
    <tbody id="pmTable"><tr><td colspan="7" style="text-align:center;padding:40px">Loading PMs...</td></tr></tbody></table>
  </div>
</div>
<script>
const API = '/api/product-manager';
async function loadPMs(){
  try{
    const res = await fetch(`${API}/list`).then(r=>r.json());
    const data = res.data || [];
    document.getElementById('totalCount').textContent = `${data.length} Product Managers found`;
    const tbody = document.getElementById('pmTable');
    if(!data.length){ tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px">No Product Managers yet</td></tr>'; return; }
    tbody.innerHTML = data.map(pm=>`
      <tr>
        <td><b>${pm.name}</b><br><small style="color:#64748b">${pm.phone}</small></td>
        <td><span class="badge" style="background:#f1f5f9">${pm.type}</span><br><small>${pm.companyName||''}</small></td>
        <td>${pm.area||'-'}, ${pm.city||''}</td>
        <td><b>${pm.totalProducts||0}</b></td>
        <td>₹${pm.walletBalance||0}</td>
        <td>${pm.isVerified?'<span class="badge badge-verified">VERIFIED</span>':'<span class="badge badge-pending">PENDING</span>'}</td>
        <td style="display:flex;gap:6px">
          <button class="btn btn-green" style="padding:6px 10px;font-size:11px" onclick="verifyPM('${pm._id}')"><i class="fa-solid fa-check"></i> Verify</button>
          <button class="btn btn-dark" style="padding:6px 10px;font-size:11px" onclick="viewProducts('${pm._id}')"><i class="fa-solid fa-eye"></i></button>
        </td>
      </tr>`).join('');
  }catch(e){ document.getElementById('pmTable').innerHTML = `<tr><td colspan="7" style="color:red">Error: ${e.message}</td></tr>`; }
}
async function verifyPM(id){ if(!confirm('Verify this PM?')) return; await fetch(`${API}/verify/${id}`,{method:'PUT'}); loadPMs(); }
function viewProducts(id){ location.href = `./product-pool.html?pmId=${id}`; }
document.getElementById('refreshBtn').onclick = loadPMs;
document.getElementById('search').oninput = (e)=>{
  const q = e.target.value.toLowerCase();
  [...document.querySelectorAll('#pmTable tr')].forEach(tr=>{ tr.style.display = tr.textContent.toLowerCase().includes(q)?'':'none'; });
};
loadPMs();
</script>
</body></html>
