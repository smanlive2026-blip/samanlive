<!-- LOCATION: public/admin-panel/area-demands.html - V15 FINAL - ADMIN AREA DEMANDS - LINK + EXECUTIVE ASSIGN -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Area Demands - Admin V15</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#f8fafc;display:flex}.sidebar{width:240px;background:#0f172a;color:#fff;padding:20px;position:fixed;height:100vh;overflow:auto}.sidebar a{display:flex;gap:10px;padding:12px;color:#94a3b8;text-decoration:none;border-radius:8px;margin:4px 0}.sidebar a.active,.sidebar a:hover{background:#1e293b;color:#fff}.main{margin-left:240px;flex:1;padding:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}.btn{padding:8px 14px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-red{background:#ef4444;color:#fff}.btn-yellow{background:#eab308;color:#000}input,select,textarea{padding:10px;border:1px solid #e2e8f0;border-radius:8px;width:100%;margin:4px 0}.badge{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:800}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99}.modal.active{display:flex}.modal-content{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:500px;max-height:95vh;overflow:auto}.link-box{background:#f0fdf4;border:2px dashed #16a34a;border-radius:10px;padding:10px;margin-top:8px}</style>
</head><body>
<div class="sidebar"><h2 style="font-weight:900;margin-bottom:20px">SAMANLIVE</h2><a href="./dashboard.html">Dashboard</a><a href="./product-managers.html">Product Managers</a><a href="./executives.html">Executives</a><a href="./product-pool.html">Product Pool</a><a href="./area-demands.html" class="active">Area Demands</a></div>
<div class="main">
<h1 style="font-weight:900">Area Demands - Kya Chahiye Kahan? <span id="count" style="font-size:14px;background:#0f172a;color:#fff;padding:4px 10px;border-radius:20px">0</span></h1>
<div style="margin:12px 0;display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-green" onclick="openCreateDemand()"><i class="fa-solid fa-plus"></i> Create Demand (Admin)</button><select id="filterArea" style="max-width:180px"><option value="">All Areas</option><option value="Naliya">Naliya</option><option value="Bhuj">Bhuj</option><option value="surat">surat</option></select><select id="filterStatus" style="max-width:180px"><option value="">All Status</option><option value="pending">Pending</option><option value="assigned">Assigned</option><option value="fulfilled">Fulfilled</option></select><input id="searchDemand" placeholder="Search product, area..." style="max-width:260px"><button class="btn btn-dark" onclick="loadDemands()">Refresh</button></div>
<div id="demandGrid" class="grid">Loading...</div>
</div>

<div class="modal" id="demandModal"><div class="modal-content"><div style="display:flex;justify-content:space-between"><h3 style="font-weight:900">Create Area Demand</h3><button class="btn btn-dark" onclick="closeCreateDemand()">X</button></div>
<div style="margin-top:10px">
<input id="dArea" placeholder="Area * e.g., Naliya"><input id="dCity" placeholder="City e.g., Bhuj"><input id="dProductName" placeholder="Product Name * e.g., Basmati Rice"><input id="dCategory" placeholder="Category e.g., kirana, medical"><input id="dQuantity" type="number" placeholder="Quantity Needed e.g., 100"><textarea id="dDescription" placeholder="Description - kya chahiye, kyun chahiye"></textarea>
<input id="dManagerPhone" placeholder="Manager Phone (jo demand kar raha hai)"><select id="dPriority"><option value="low">Low Priority</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select>
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="createDemand()"><i class="fa-solid fa-save"></i> Create Demand</button><div id="dMsg" style="margin-top:8px;font-weight:700"></div>
</div></div></div>

<div class="modal" id="assignModal"><div class="modal-content"><div style="display:flex;justify-content:space-between"><h3 style="font-weight:900">Assign to Executive / PM</h3><button class="btn btn-dark" onclick="closeAssign()">X</button></div>
<div style="margin-top:10px"><input id="assignDemandId" type="hidden"><label>Select Executive:</label><select id="execList"></select><label>Select PM Product (from Product Pool):</label><select id="pmProductList"></select><button class="btn btn-green" style="width:100%;margin-top:10px" onclick="doAssign()">Assign & Fulfill</button><div id="assignMsg" style="margin-top:8px;font-weight:700"></div></div></div></div>

<script>
let allDemands=[];
async function loadDemands(){ const area=document.getElementById('filterArea').value.toLowerCase(); const status=document.getElementById('filterStatus').value.toLowerCase(); const q=document.getElementById('searchDemand').value.toLowerCase(); try{ const res=await fetch('/api/area-demand/list').then(r=>r.json()); let data=res.data||res||[]; allDemands=data; if(area) data=data.filter(d=>(d.area||'').toLowerCase().includes(area)); if(status) data=data.filter(d=>(d.status||'pending').toLowerCase()===status); if(q) data=data.filter(d=>(d.productName+' '+d.area+' '+d.description).toLowerCase().includes(q)); document.getElementById('count').textContent=data.length; const grid=document.getElementById('demandGrid'); if(!data.length){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:12px">No Demands. Create one.</div>'; return; } grid.innerHTML=data.map(d=>{ const statusColor=d.status==='fulfilled'?'#dcfce7':d.status==='assigned'?'#fef3c7':'#fee2e2'; return `<div class="card"><div style="display:flex;justify-content:space-between"><b><i class="fa-solid fa-location-dot"></i> ${d.area}, ${d.city||''}</b><span class="badge" style="background:${statusColor}">${(d.status||'pending').toUpperCase()} - ${d.priority||'medium'}</span></div><div style="margin-top:6px"><b style="font-size:16px">${d.productName}</b><br><small style="color:#64748b">Category: ${d.category||'-'} | Qty Needed: ${d.quantity||'-'} | By: ${d.managerPhone||'Admin'}</small><br><small style="color:#334155">${d.description||''}</small></div><div style="margin-top:8px;font-size:11px;color:#64748b">Created: ${new Date(d.createdAt).toLocaleString()}</div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-green" style="padding:6px 10px;font-size:11px" onclick="openAssign('${d._id}','${d.area}','${d.productName}')"><i class="fa-solid fa-link"></i> Assign to Executive</button><button class="btn btn-yellow" style="padding:6px 10px;font-size:11px" onclick="fulfillDemand('${d._id}')"><i class="fa-solid fa-check"></i> Mark Fulfilled</button><button class="btn btn-red" style="padding:6px 10px;font-size:11px" onclick="deleteDemand('${d._id}')"><i class="fa-solid fa-trash"></i> Delete</button></div></div>`}).join(''); }catch(e){ document.getElementById('demandGrid').innerHTML='<p style="color:red">API Error: '+e.message+' - Check /api/area-demand/list route</p>'; } }
function openCreateDemand(){ document.getElementById('demandModal').classList.add('active'); } function closeCreateDemand(){ document.getElementById('demandModal').classList.remove('active'); }
async function createDemand(){ const body={ area:document.getElementById('dArea').value.trim(), city:document.getElementById('dCity').value.trim(), productName:document.getElementById('dProductName').value.trim(), category:document.getElementById('dCategory').value.trim(), quantity:document.getElementById('dQuantity').value, description:document.getElementById('dDescription').value.trim(), managerPhone:document.getElementById('dManagerPhone').value.trim(), priority:document.getElementById('dPriority').value, status:'pending' }; if(!body.area||!body.productName){ document.getElementById('dMsg').textContent='Area & Product Name required'; document.getElementById('dMsg').style.color='red'; return; } document.getElementById('dMsg').textContent='Creating...'; try{ const res=await fetch('/api/area-demand/create',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()); if(res.success||res._id){ document.getElementById('dMsg').textContent='✅ Demand Created!'; document.getElementById('dMsg').style.color='green'; setTimeout(()=>{ closeCreateDemand(); loadDemands(); },800); } else { document.getElementById('dMsg').textContent='Error: '+(res.error||'failed'); document.getElementById('dMsg').style.color='red'; } }catch(err){ document.getElementById('dMsg').textContent='Error: '+err.message; document.getElementById('dMsg').style.color='red'; } }

async function openAssign(demandId, area, productName){ document.getElementById('assignDemandId').value=demandId; document.getElementById('assignModal').classList.add('active'); document.getElementById('assignMsg').textContent='Loading Executives & Products for '+area+'...'; try{ const execRes=await fetch('/api/executive/list').then(r=>r.json()); const execs=execRes.data||[]; document.getElementById('execList').innerHTML=execs.map(e=>`<option value="${e._id}">${e.name} - ${e.phone} - Areas: ${(e.assignedAreas||[]).join(',')||'All'}</option>`).join('')||'<option>No Executives - Create one in executives.html</option>'; const poolRes=await fetch('/api/product-pool/list?area='+area+'&search='+productName).then(r=>r.json()).catch(()=>({data:[]})); let products=poolRes.data||[]; if(!products.length){ const all=await fetch('/api/product-pool/list').then(r=>r.json()).catch(()=>({data:[]})); products=all.data||[]; } document.getElementById('pmProductList').innerHTML=products.map(p=>`<option value="${p._id}">${p.productName||p.name} - ₹${p.basePrice||p.price} - Area: ${(p.areaTags||[p.area]).join(',')} - PM: ${p.pmName||''}</option>`).join('')||'<option>No Product in Pool - Add in product-pool.html</option>'; document.getElementById('assignMsg').textContent=''; }catch(e){ document.getElementById('assignMsg').textContent='Error loading: '+e.message; } }
function closeAssign(){ document.getElementById('assignModal').classList.remove('active'); }
async function doAssign(){ const demandId=document.getElementById('assignDemandId').value; const execId=document.getElementById('execList').value; const productPoolId=document.getElementById('pmProductList').value; if(!execId||!productPoolId){ document.getElementById('assignMsg').textContent='Select Executive & Product'; document.getElementById('assignMsg').style.color='red'; return; } document.getElementById('assignMsg').textContent='Assigning...'; try{ const res=await fetch('/api/area-demand/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({demandId,executiveId:execId,productPoolId})}).then(r=>r.json()); if(res.success){ document.getElementById('assignMsg').textContent='✅ Assigned to Executive! Product will be live.'; document.getElementById('assignMsg').style.color='green'; setTimeout(()=>{ closeAssign(); loadDemands(); },1000); } else { document.getElementById('assignMsg').textContent='Error: '+(res.error||'failed'); document.getElementById('assignMsg').style.color='red'; } }catch(err){ document.getElementById('assignMsg').textContent='Error: '+err.message; } }
async function fulfillDemand(id){ if(!confirm('Mark this demand as fulfilled?')) return; await fetch(`/api/area-demand/fulfill/${id}`,{method:'PUT'}); loadDemands(); }
async function deleteDemand(id){ if(!confirm('Delete demand?')) return; await fetch(`/api/area-demand/${id}`,{method:'DELETE'}); loadDemands(); }
document.getElementById('searchDemand').oninput=loadDemands; document.getElementById('filterArea').onchange=loadDemands; document.getElementById('filterStatus').onchange=loadDemands; loadDemands();
</script></body></html>
