<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMANLIVE Admin Panel v3</title>
    <script>window.addEventListener('pageshow',function(e){if(e.persisted)location.reload()})</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
    <link rel="stylesheet" href="assets/admin.css?v=3">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f8fafc;color:#0f172a}
        .container{max-width:1600px;margin:0 auto}
        .admin-header{background:linear-gradient(135deg,#1e3a8a 0%,#3b82f6 50%,#8b5cf6 100%);padding:16px 20px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
        .admin-header h1{font-size:20px;font-weight:800;color:white;display:flex;align-items:center;gap:10px}
        .admin-header h1::before{content:'⚡';font-size:24px}
        .menu-toggle{display:none;background:rgba(255,255,255,0.2);border:none;border-radius:8px;padding:8px;cursor:pointer;color:white;font-size:24px}
        .admin-navbar{background:white;padding:12px 16px;box-shadow:0 2px 8px rgba(0,0,0,0.06);position:sticky;top:64px;z-index:99;display:flex;flex-wrap:wrap;gap:8px}
        .nav-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;background:#f8fafc;border:2px solid transparent;border-radius:10px;color:#475569;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all 0.2s}
        .nav-btn:hover{background:#eff6ff;border-color:#dbeafe;color:#1e40af;transform:translateY(-2px)}
        .nav-btn.active{background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);color:white;box-shadow:0 4px 14px rgba(59,130,246,0.4);border-color:transparent}
        #mainContainer{padding:24px;min-height:calc(100vh - 140px)}
        .page-loading{display:flex;justify-content:center;align-items:center;min-height:400px;flex-direction:column;gap:16px}
        .loading-spinner{width:50px;height:50px;border:4px solid #e2e8f0;border-top-color:#3b82f6;border-radius:50%;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .nav-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:98}
        .nav-overlay.show{display:block}
        @media(max-width:1024px){
            .admin-navbar{position:fixed;top:0;left:-280px;width:280px;height:100vh;flex-direction:column;padding:80px 16px 16px;overflow-y:auto;transition:left 0.3s;box-shadow:4px 0 20px rgba(0,0,0,0.15)}
            .admin-navbar.show{left:0}
            .nav-btn{width:100%;justify-content:flex-start}
            .menu-toggle{display:block}
        }
    </style>
</head>
<body>
<div class="container">
    <div class="admin-header">
        <h1>SAMANLIVE Control Panel</h1>
        <button class="menu-toggle" onclick="toggleMenu()">☰</button>
    </div>
    <div class="nav-overlay" id="navOverlay" onclick="toggleMenu()"></div>
    <div class="admin-navbar" id="adminNavbar">
        <button class="nav-btn active" onclick="loadPage('dashboard', this)">📊 Dashboard</button>
        <button class="nav-btn" onclick="loadPage('orders', this)">📋 Orders</button>
        <button class="nav-btn" onclick="loadPage('users', this)">👥 Users</button>
        <button class="nav-btn" onclick="loadPage('shops', this)">🏪 Shops</button>
        <button class="nav-btn" onclick="loadPage('area-dashboard', this)">🗺️ Area Dashboard</button>
        <button class="nav-btn" onclick="loadPage('areas', this)">🗺️ Areas</button>
        <button class="nav-btn" onclick="loadPage('cities', this)">🏙️ Cities</button>
        <button class="nav-btn" onclick="loadPage('delivery', this)">🚚 Delivery</button>
        <button class="nav-btn" onclick="loadPage('reports', this)">📈 Reports</button>
        <button class="nav-btn" onclick="loadPage('managers', this)">👔 Managers</button>
        <button class="nav-btn" onclick="loadPage('content', this)">📝 Content</button>
        <button class="nav-btn" onclick="loadPage('api-routes', this)">🔍 API Routes</button>
        <button class="nav-btn" onclick="loadPage('settings', this)">⚙️ Settings</button>
    </div>
    <div id="mainContainer">
        <div class="page-loading">
            <div class="loading-spinner"></div>
            <div>Loading dashboard...</div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
<script src="assets/admin.js?v=3"></script>
<script>
function toggleMenu(){
    const nav = document.getElementById('adminNavbar');
    const overlay = document.getElementById('navOverlay');
    nav.classList.toggle('show');
    overlay.classList.toggle('show');
}
document.addEventListener('DOMContentLoaded',()=>{
    const btn = document.querySelector('.nav-btn.active');
    if(btn) loadPage('dashboard', btn);
});
const _origLoad = window.loadPage;
window.loadPage = function(p,b){
    if(_origLoad) _origLoad(p,b);
    if(window.innerWidth <= 1024){
        const nav = document.getElementById('adminNavbar');
        if(nav.classList.contains('show')) toggleMenu();
    }
}
</script>
</body>
</html>
