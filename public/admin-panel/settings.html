<div class="content">
    <h2>🎨 Site Settings</h2>
    <div class="form-grid">
        <div class="form-group">
            <label>App Name:</label>
            <input type="text" id="settingLogoText" placeholder="SAMAN LIVE">
        </div>

        <!-- ============ HEADER LOGO CONTROL ============ -->
        <div class="form-group full">
            <label>Header Logo - Top Left:</label>
            <div class="logo-upload-wrapper">
                <div class="logo-preview-box">
                    <img id="logoPreview" src="" style="width:60px;height:60px;object-fit:cover;border-radius:10px;background:#f3f4f6;border:2px solid #10b981;">
                </div>
                <div class="logo-upload-controls">
                    <input type="file" id="logoUploadFile" accept="image/*" onchange="previewLogo(event)">
                    <button class="btn-primary" id="uploadLogoBtn" onclick="uploadLogoFile()">📤 Upload Logo</button>
                    <p class="help-text">Recommended: 200x200px. PNG, JPG - Max 1MB</p>
                    <p id="logoUploadStatus" class="status-text"></p>
                </div>
            </div>
        </div>

        <!-- ============ HEADER BANNER CONTROL - UPDATED ============ -->
        <div class="form-group full">
            <label>Header Banner - Image / Video:</label>
            <div class="logo-upload-wrapper">
                <div class="logo-preview-box">
                    <div id="bannerPreviewBox">
                        <img id="bannerPreview" src="" style="width:100%;height:120px;object-fit:cover;border-radius:10px;background:#f3f4f6;">
                    </div>
                </div>
                <div class="logo-upload-controls">
                    <input type="file" id="bannerUploadFile" accept="image/*,video/*" onchange="previewBanner(event)">
                    <button class="btn-primary" id="uploadBannerBtn" onclick="uploadBannerFile()">📤 Upload Banner</button>
                    <p class="help-text">Recommended: Image 1200x300px ya Video MP4 < 20MB. Auto Loop</p>
                    <p id="bannerUploadStatus" class="status-text"></p>
                </div>
            </div>
        </div>
        <div class="form-group">
            <label>Banner Height (px):</label>
            <input type="number" id="settingBannerHeight" value="200" placeholder="200">
        </div>

        <div class="form-group"><label>Header Color:</label><input type="color" id="settingHeaderColor"></div>
        <div class="form-group"><label>Footer Color:</label><input type="color" id="settingFooterColor"></div>
        <div class="form-group full"><label>Footer Text:</label><input type="text" id="settingFooterText"></div>
        <div class="form-group full"><label>Footer About Text:</label><textarea id="settingFooterAbout" rows="3"></textarea></div>
    </div>

    <h3 class="section-title">🔗 Footer Links</h3>
    <div id="footerLinksContainer"></div>
    <button class="btn-success" onclick="addFooterLink()">+ Add Link</button>

    <h3 class="section-title">📱 Social Media Links</h3>
    <div class="form-grid">
        <div class="form-group"><label>Facebook URL:</label><input type="text" id="settingFacebook" placeholder="https://facebook.com/..."></div>
        <div class="form-group"><label>Instagram URL:</label><input type="text" id="settingInstagram" placeholder="https://instagram.com/..."></div>
        <div class="form-group"><label>Twitter URL:</label><input type="text" id="settingTwitter" placeholder="https://twitter.com/..."></div>
        <div class="form-group"><label>YouTube URL:</label><input type="text" id="settingYoutube" placeholder="https://youtube.com/..."></div>
    </div>

    <button class="btn-primary btn-lg" id="saveSettingsBtn" onclick="saveSettings()">💾 Save All Settings</button>
</div>

<script>

let currentSettings = {};

async function apiCall(url, method = 'GET', data = null) {
    const options = { method };
    if (data) {
        if (data instanceof FormData) {
            options.body = data;
        } else {
            options.headers = { 'Content-Type': 'application/json' };
            options.body = JSON.stringify(data);
        }
    }
    const res = await fetch('/api' + url, options);
    if (!res.ok) {
        const errorData = await res.json().catch(()=>({}));
        throw new Error(errorData.error || 'API Error: ' + res.status);
    }
    return res.json();
}

// HELPER FUNCTION - YAHI NAYA ADD KIYA
function renderBannerPreview(url, type) {
    const bannerBox = document.getElementById('bannerPreviewBox');
    if(!url) return;
    if(type === 'video'){
        bannerBox.innerHTML = `<video src="${url}" autoplay muted loop playsinline controls style="width:100%;height:120px;object-fit:cover;border-radius:10px;"></video>`;
    } else {
        bannerBox.innerHTML = `<img id="bannerPreview" src="${url}?v=${Date.now()}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;background:#f3f4f6;">`;
    }
}

async function loadSettings() {
    try {
        currentSettings = await apiCall('/settings');
        document.getElementById('settingLogoText').value = currentSettings.appName || 'SAMAN LIVE';
        document.getElementById('settingHeaderColor').value = currentSettings.headerColor || '#1e40af';
        document.getElementById('settingFooterColor').value = currentSettings.footerColor || '#1e293b';
        document.getElementById('settingFooterText').value = currentSettings.footerText || '';
        document.getElementById('settingFooterAbout').value = currentSettings.footerAbout || '';
        document.getElementById('settingFacebook').value = currentSettings.facebook || '';
        document.getElementById('settingInstagram').value = currentSettings.instagram || '';
        document.getElementById('settingTwitter').value = currentSettings.twitter || '';
        document.getElementById('settingYoutube').value = currentSettings.youtube || '';

        if (currentSettings.headerLogoUrl) {
            document.getElementById('logoPreview').src = currentSettings.headerLogoUrl + '?v=' + Date.now();
        }

        // BANNER LOAD - HELPER USE KIYA
        document.getElementById('settingBannerHeight').value = currentSettings.headerBannerHeight || 200;
        renderBannerPreview(currentSettings.headerBannerUrl, currentSettings.headerBannerType);

        renderFooterLinks();
    } catch (err) { console.error(err) }
}

function renderFooterLinks() {
    const container = document.getElementById('footerLinksContainer');
    const links = currentSettings.footerLinks || [];
    container.innerHTML = links.map((link, i) => `
        <div class="footer-link-row" style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:10px;align-items:end;">
            <div class="form-group"><label>Link Text:</label><input type="text" value="${link.text||''}" onchange="updateFooterLink(${i},'text',this.value)"></div>
            <div class="form-group"><label>Link URL:</label><input type="text" value="${link.url||''}" onchange="updateFooterLink(${i},'url',this.value)"></div>
            <button class="btn-danger btn-sm" onclick="removeFooterLink(${i})">🗑️</button>
        </div>`).join('');
}

window.addFooterLink = () => {
    if (!currentSettings.footerLinks) currentSettings.footerLinks = [];
    currentSettings.footerLinks.push({text:'', url:''});
    renderFooterLinks();
};

window.updateFooterLink = (i, field, value) => { currentSettings.footerLinks[i][field] = value; };
window.removeFooterLink = (i) => { currentSettings.footerLinks.splice(i, 1); renderFooterLinks(); };

// LOGO PREVIEW + UPLOAD
window.previewLogo = (e) => {
    const file = e.target.files[0];
    if (file && file.size > 2 * 1024 * 1024) {
        alert('File size must be less than 2MB');
        e.target.value = '';
        return;
    }
    if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            document.getElementById('logoPreview').src = e.target.result;
        };
        reader.readAsDataURL(file);
    }
};

window.uploadLogoFile = async () => {
    const fileInput = document.getElementById('logoUploadFile');
    const status = document.getElementById('logoUploadStatus');
    const btn = document.getElementById('uploadLogoBtn');
    if (!fileInput.files[0]) return alert('Please select a logo');

    const formData = new FormData();
    formData.append('logo', fileInput.files[0]);

    status.textContent = 'Uploading to Cloudinary...';
    btn.disabled = true;
    try {
        const res = await apiCall('/upload/logo', 'POST', formData);
        currentSettings.headerLogoUrl = res.url;
        document.getElementById('logoPreview').src = res.url + '?v=' + Date.now();
        status.textContent = 'Logo uploaded!';
        setTimeout(() => status.textContent = '', 3000);
    } catch (err) {
        status.textContent = 'Upload failed!';
        console.error(err);
        alert('Upload failed: ' + err.message);
    } finally {
        btn.disabled = false;
    }
};

// BANNER PREVIEW + UPLOAD - FIXED
window.previewBanner = (e) => {
    const file = e.target.files[0];
    if (file && file.size > 20 * 1024 * 1024) {
        alert('File size must be less than 20MB');
        e.target.value = '';
        return;
    }
    if (file) {
        const url = URL.createObjectURL(file);
        const type = file.type.startsWith('video')? 'video' : 'image';
        renderBannerPreview(url, type); // HELPER CALL KIYA
    }
};

window.uploadBannerFile = async () => {
    const fileInput = document.getElementById('bannerUploadFile');
    const status = document.getElementById('bannerUploadStatus');
    const btn = document.getElementById('uploadBannerBtn');
    if (!fileInput.files[0]) return alert('Please select a banner');

    const formData = new FormData();
    formData.append('banner', fileInput.files[0]);

    status.textContent = 'Uploading to Cloudinary...';
    btn.disabled = true;
    try {
        const res = await apiCall('/upload/banner', 'POST', formData);
        currentSettings.headerBannerUrl = res.url;
        currentSettings.headerBannerType = res.type;

        renderBannerPreview(res.url, res.type); // UPLOAD KE BAAD TURANT PREVIEW
        status.textContent = 'Upload successful! Type: ' + res.type;
        setTimeout(() => status.textContent = '', 3000);
    } catch (err) {
        status.textContent = 'Upload failed!';
        console.error(err);
        alert('Upload failed: ' + err.message);
    } finally {
        btn.disabled = false;
    }
};

window.saveSettings = async () => {
    const btn = document.getElementById('saveSettingsBtn');
    btn.disabled = true;
    btn.textContent = 'Saving...';
    const data = {
        appName: document.getElementById('settingLogoText').value,
        headerLogoUrl: currentSettings.headerLogoUrl || '',
        headerBannerUrl: currentSettings.headerBannerUrl || '',
        headerBannerType: currentSettings.headerBannerType || 'image',
        headerBannerHeight: Number(document.getElementById('settingBannerHeight').value),
        headerColor: document.getElementById('settingHeaderColor').value,
        footerColor: document.getElementById('settingFooterColor').value,
        footerText: document.getElementById('settingFooterText').value,
        footerAbout: document.getElementById('settingFooterAbout').value,
        footerLinks: currentSettings.footerLinks || [],
        facebook: document.getElementById('settingFacebook').value,
        instagram: document.getElementById('settingInstagram').value,
        twitter: document.getElementById('settingTwitter').value,
        youtube: document.getElementById('settingYoutube').value
    };
    try {
        await apiCall('/settings', 'PUT', data);
        alert('Settings saved successfully');
        await loadSettings();
    } catch (err) {
        alert('Save failed');
        console.error(err)
    } finally {
        btn.disabled = false;
        btn.textContent = '💾 Save All Settings';
    }
};

loadSettings();
</script>
