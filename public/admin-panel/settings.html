<div class="content" style="max-width:1400px" id="saman-settings-root">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px">
        <h2 style="margin:0">🎨 SAMANLIVE Main App Control - Full Admin</h2>
        <div style="display:flex;gap:8px">
            <button class="btn-secondary" onclick="window.SLSettings.exportSettings()">📤 Export</button>
            <button class="btn-danger" onclick="window.SLSettings.resetSettings()">🔄 Reset</button>
            <button class="btn-primary btn-lg" id="saveSettingsBtn" onclick="window.SLSettings.saveSettings()">💾 Save All Settings</button>
        </div>
    </div>

    <!-- TABS - FIXED ONCLICK -->
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px;border-bottom:2px solid #e2e8f0;scrollbar-width:none">
        <button class="tab-btn active" data-tab="header">🏠 Header</button>
        <button class="tab-btn" data-tab="banner">🖼️ Banner</button>
        <button class="tab-btn" data-tab="product">🛍️ Products</button>
        <button class="tab-btn" data-tab="category">📂 Categories</button>
        <button class="tab-btn" data-tab="nav">🧭 Navigation</button>
        <button class="tab-btn" data-tab="footer">🦶 Footer</button>
        <button class="tab-btn" data-tab="theme">🎨 Theme</button>
    </div>

    <!-- TAB: HEADER -->
    <div id="tab-header" class="tab-content active">
        <h3 class="section-title">🏠 Top Header Control</h3>
        <div class="form-grid">
            <div class="form-group"><label>App Name:</label><input type="text" id="settingLogoText" placeholder="SAMAN LIVE"></div>
            <div class="form-group"><label>Tagline:</label><input type="text" id="settingTagline" placeholder="Best deals..."></div>
            <div class="form-group full">
                <label>Header Logo:</label>
                <div class="logo-upload-wrapper" style="display:flex;gap:20px">
                    <img id="logoPreview" src="" style="width:80px;height:80px;object-fit:cover;border-radius:12px;border:2px solid #10b981;background:#f3f4f6">
                    <div style="flex:1">
                        <input type="file" id="logoUploadFile" accept="image/*">
                        <button class="btn-primary" onclick="window.SLSettings.uploadLogoFile()" style="margin-top:8px">📤 Upload Logo</button>
                        <p id="logoUploadStatus" style="font-size:13px;margin-top:6px"></p>
                        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px">
                            <div><label>Logo Size:</label><input type="range" id="logoSize" min="30" max="80" value="42"><span id="logoSizeVal">42px</span></div>
                            <div><label>Header Height:</label><input type="range" id="headerHeight" min="40" max="100" value="56"><span id="headerHeightVal">56px</span></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="form-group"><label>Header BG:</label><input type="color" id="settingHeaderColor" value="#ffffff"></div>
            <div class="form-group"><label>Text Color:</label><input type="color" id="settingHeaderTextColor" value="#0f172a"></div>
            <div class="form-group"><label>Show Logo:</label><select id="headerShowLogo"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Show Search:</label><select id="headerShowSearch"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Show Cart:</label><select id="headerShowCart"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Show Scanner:</label><select id="headerShowScanner"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Sticky Header:</label><select id="headerSticky"><option value="true">Sticky</option><option value="false">Normal</option></select></div>
        </div>
    </div>

    <!-- TAB: BANNER -->
    <div id="tab-banner" class="tab-content">
        <h3 class="section-title">🖼️ Banner Control</h3>
        <div class="form-grid">
            <div class="form-group full" style="border:2px solid #10b981;padding:15px;border-radius:12px">
                <label>Banner Photo:</label>
                <div style="display:flex;gap:20px"><div id="bannerImagePreviewBox" style="width:300px"><img id="bannerPreview" style="width:100%;height:120px;object-fit:cover;border-radius:10px;background:#f3f4f6"></div>
                <div style="flex:1"><input type="file" id="bannerImageUploadFile" accept="image/*"><button class="btn-primary" onclick="window.SLSettings.uploadBannerImageFile()" style="margin-top:8px">📤 Upload Photo</button><p id="bannerImageUploadStatus"></p></div></div>
            </div>
            <div class="form-group full" style="border:2px solid #3b82f6;padding:15px;border-radius:12px">
                <label>Banner Video:</label>
                <div style="display:flex;gap:20px"><div id="bannerVideoPreviewBox" style="width:300px"><p>No Video</p></div>
                <div style="flex:1"><input type="file" id="bannerVideoUploadFile" accept="video/*"><button class="btn-primary" onclick="window.SLSettings.uploadBannerVideoFile()" style="margin-top:8px">📤 Upload Video</button><p id="bannerVideoUploadStatus"></p></div></div>
            </div>
            <div class="form-group full" style="background:#fef3c7;padding:15px;border-radius:10px;border:2px dashed #f59e0b">
                <label>Main App pe kya dikhega?</label>
                <div style="display:flex;gap:10px;margin-top:10px">
                    <button id="activeImageBtn" class="btn-primary" onclick="window.SLSettings.setActiveBanner('image')" style="flex:1;background:#10b981">🖼️ Photo</button>
                    <button id="activeVideoBtn" class="btn-primary" onclick="window.SLSettings.setActiveBanner('video')" style="flex:1;background:#3b82f6">🎬 Video</button>
                    <button id="activeNoneBtn" class="btn-secondary" onclick="window.SLSettings.setActiveBanner('none')" style="flex:1">🚫 Hide</button>
                </div>
                <p id="activeBannerStatus" style="margin-top:10px;font-weight:bold"></p>
            </div>
            <div class="form-group"><label>Banner Height:</label><input type="number" id="settingBannerHeight" value="200"></div>
            <div class="form-group"><label>Show Banner:</label><select id="bannerShow"><option value="true">Yes</option><option value="false">No</option></select></div>
        </div>
    </div>

    <!-- TAB: PRODUCT -->
    <div id="tab-product" class="tab-content">
        <h3 class="section-title">🛍️ Product Display - Full Control</h3>
        <div class="form-grid">
            <div class="form-group"><label>Card Style:</label><select id="productCardStyle"><option value="card">Card</option><option value="amazon">Amazon</option><option value="flipkart">Flipkart</option><option value="list">List</option><option value="compact">Compact</option><option value="minimal">Minimal</option></select></div>
            <div class="form-group"><label>Card Size:</label><select id="productCardSize"><option value="small">Small 70px</option><option value="medium">Medium 90px</option><option value="large">Large 120px</option><option value="xl">XL 160px</option></select></div>
            <div class="form-group"><label>Scroll Type:</label><select id="productScrollType"><option value="horizontal">Horizontal</option><option value="vertical">Vertical</option><option value="grid">Grid</option><option value="carousel">Carousel</option><option value="infinite">Infinite</option><option value="train">Train Animation</option></select></div>
            <div class="form-group"><label>Per Row (Grid):</label><input type="number" id="productPerRow" min="1" max="6" value="2"></div>
            <div class="form-group"><label>Gap:</label><input type="number" id="productGap" min="0" max="30" value="10"></div>
            <div class="form-group"><label>Border Radius:</label><input type="number" id="productBorderRadius" min="0" max="30" value="12"></div>
            <div class="form-group"><label>Shadow:</label><select id="productShadow"><option value="none">None</option><option value="small">Small</option><option value="medium">Medium</option><option value="large">Large</option></select></div>
            <div class="form-group"><label>Show Discount:</label><select id="productShowDiscount"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Show Shop Name:</label><select id="productShowShopName"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Show Add Cart:</label><select id="productShowAddCart"><option value="true">Yes</option><option value="false">No</option></select></div>
        </div>
    </div>

    <!-- TAB: CATEGORY -->
    <div id="tab-category" class="tab-content">
        <h3 class="section-title">📂 Category / History / Ad</h3>
        <div class="form-grid">
            <div class="form-group"><label>Category Show:</label><select id="categoryShow"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>History Show:</label><select id="historyShow"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Ad Show:</label><select id="adShow"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>History Title:</label><input type="text" id="historyTitle" value="History"></div>
            <div class="form-group"><label>Ad Title:</label><input type="text" id="adTitle" value="Advertisement"></div>
            <div class="form-group"><label>Nearby Title:</label><input type="text" id="nearbyTitle" value="Nearby Product"></div>
        </div>
    </div>

    <!-- TAB: NAV -->
    <div id="tab-nav" class="tab-content">
        <h3 class="section-title">🧭 Bottom Nav - 5 Buttons</h3>
        <div class="form-grid">
            <div class="form-group"><label>Show Nav:</label><select id="bottomNavShow"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>BG Color:</label><input type="color" id="bottomNavColor" value="#ffffff"></div>
            <div class="form-group"><label>Active Color:</label><input type="color" id="bottomNavActiveColor" value="#10b981"></div>
            <div class="form-group"><label>Height:</label><input type="number" id="bottomNavHeight" value="70"></div>
        </div>
        <div id="navButtonsContainer" style="margin-top:15px;background:#f8fafc;padding:15px;border-radius:10px"></div>
    </div>

    <!-- TAB: FOOTER -->
    <div id="tab-footer" class="tab-content">
        <h3 class="section-title">🦶 Footer Full Control</h3>
        <div class="form-grid">
            <div class="form-group"><label>Show Footer:</label><select id="footerShow"><option value="true">Yes</option><option value="false">No</option></select></div>
            <div class="form-group"><label>Style:</label><select id="footerStyle"><option value="modern">Modern</option><option value="simple">Simple</option><option value="compact">Compact</option><option value="detailed">Detailed</option><option value="minimal">Minimal</option></select></div>
            <div class="form-group"><label>BG Color:</label><input type="color" id="settingFooterColor" value="#1f2937"></div>
            <div class="form-group"><label>Text Color:</label><input type="color" id="footerTextColor" value="#ffffff"></div>
            <div class="form-group full"><label>Copyright Text:</label><input type="text" id="settingFooterText"></div>
            <div class="form-group full"><label>About Text:</label><textarea id="settingFooterAbout" rows="3"></textarea></div>
        </div>
        <h4>Links</h4><div id="footerLinksContainer"></div><button class="btn-success" onclick="window.SLSettings.addFooterLink()">+ Add Link</button>
        <h4 style="margin-top:15px">Social</h4>
        <div class="form-grid">
            <div class="form-group"><label>Facebook:</label><input type="text" id="settingFacebook"></div>
            <div class="form-group"><label>Instagram:</label><input type="text" id="settingInstagram"></div>
            <div class="form-group"><label>YouTube:</label><input type="text" id="settingYoutube"></div>
        </div>
    </div>

    <!-- TAB: THEME -->
    <div id="tab-theme" class="tab-content">
        <h3 class="section-title">🎨 Theme Colors</h3>
        <div class="form-grid">
            <div class="form-group"><label>Primary:</label><input type="color" id="primaryColor" value="#0f172a"></div>
            <div class="form-group"><label>Secondary:</label><input type="color" id="secondaryColor" value="#10b981"></div>
            <div class="form-group"><label>Accent:</label><input type="color" id="accentColor" value="#3b82f6"></div>
            <div class="form-group"><label>Background:</label><input type="color" id="backgroundColor" value="#f5f7fa"></div>
        </div>
    </div>

    <button class="btn-primary btn-lg" onclick="window.SLSettings.saveSettings()" style="width:100%;margin-top:20px;padding:16px;font-size:18px">💾 Save All - Main App Update Hoga</button>
</div>

<style>
.tab-btn{padding:10px 18px;border:none;background:#f1f5f9;border-radius:8px;cursor:pointer;font-weight:600;color:#475569;white-space:nowrap}
.tab-btn.active{background:#0f172a;color:#fff}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-title{margin:20px 0 12px;padding-bottom:8px;border-bottom:2px solid #f1f5f9}
</style>

<script>
// LAUNCHER COMPATIBLE - WINDOW OBJECT PE
(function(){
if(window.SLSettings) return;
window.SLSettings = {};
let currentSettings = {};

async function apiCall(url, method='GET', data=null){
    const options={method};
    if(data){
        if(data instanceof FormData) options.body=data;
        else { options.headers={'Content-Type':'application/json'}; options.body=JSON.stringify(data); }
    }
    // Try both /api/settings and /api/admin/settings
    let finalUrl = '/api' + url;
    let res = await fetch(finalUrl, options);
    if(!res.ok && finalUrl.includes('/api/settings')){
        // fallback to /api/admin/settings
        finalUrl = '/api/admin' + url;
        res = await fetch(finalUrl, options);
    }
    if(!res.ok){ const e=await res.json().catch(()=>({})); throw new Error(e.error||'API Error '+res.status); }
    return res.json();
}

function switchTab(tab){
    document.querySelectorAll('#saman-settings-root .tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('#saman-settings-root .tab-content').forEach(c=>c.classList.remove('active'));
    const btn = document.querySelector(`#saman-settings-root .tab-btn[data-tab="${tab}"]`);
    if(btn) btn.classList.add('active');
    const content = document.getElementById(`tab-${tab}`);
    if(content) content.classList.add('active');
}

function renderBannerImagePreview(url){
    const box=document.getElementById('bannerImagePreviewBox');
    if(!box) return;
    if(!url){ box.innerHTML='<p style="opacity:.6">No Photo</p>'; return; }
    box.innerHTML=`<img src="${url}?v=${Date.now()}" style="width:100%;height:120px;object-fit:cover;border-radius:10px">`;
}
function renderBannerVideoPreview(url){
    const box=document.getElementById('bannerVideoPreviewBox');
    if(!box) return;
    if(!url){ box.innerHTML='<p style="opacity:.6">No Video</p>'; return; }
    const cacheUrl=url.includes('blob:')?url:url+'?v='+Date.now();
    box.innerHTML=`<video src="${cacheUrl}" autoplay muted loop playsinline controls style="width:100%;height:120px;object-fit:cover;border-radius:10px"></video>`;
}
function updateActiveStatus(){
    const status=document.getElementById('activeBannerStatus');
    if(!status) return;
    const active=currentSettings.headerBannerActive||'image';
    status.textContent=active==='video'?'✅ VIDEO dikhega':active==='none'?'🚫 Hidden':'✅ PHOTO dikhega';
    const imgBtn=document.getElementById('activeImageBtn'); const vidBtn=document.getElementById('activeVideoBtn'); const noneBtn=document.getElementById('activeNoneBtn');
    if(imgBtn) imgBtn.style.opacity=active==='image'?'1':'0.5';
    if(vidBtn) vidBtn.style.opacity=active==='video'?'1':'0.5';
    if(noneBtn) noneBtn.style.opacity=active==='none'?'1':'0.5';
}

window.SLSettings.setActiveBanner=(type)=>{
    currentSettings.headerBannerActive=type;
    if(type==='video'){ currentSettings.headerBannerUrl=currentSettings.headerBannerVideoUrl; currentSettings.headerBannerType='video'; }
    else if(type==='image'){ currentSettings.headerBannerUrl=currentSettings.headerBannerImageUrl; currentSettings.headerBannerType='image'; }
    else { currentSettings.headerBannerUrl=''; currentSettings.headerBannerType='none'; }
    updateActiveStatus();
};

function renderFooterLinks(){
    const container=document.getElementById('footerLinksContainer');
    if(!container) return;
    const links=currentSettings.footerLinks||[];
    container.innerHTML=links.map((link,i)=>`
        <div style="display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:10px;align-items:end">
            <div class="form-group"><label>Text:</label><input type="text" value="${link.text||''}" oninput="window.SLSettings.updateFooterLink(${i},'text',this.value)"></div>
            <div class="form-group"><label>URL:</label><input type="text" value="${link.url||''}" oninput="window.SLSettings.updateFooterLink(${i},'url',this.value)"></div>
            <button class="btn-danger btn-sm" onclick="window.SLSettings.removeFooterLink(${i})">🗑️</button>
        </div>`).join('');
}
window.SLSettings.addFooterLink=()=>{ if(!currentSettings.footerLinks) currentSettings.footerLinks=[]; currentSettings.footerLinks.push({text:'',url:'',visible:true}); renderFooterLinks(); };
window.SLSettings.updateFooterLink=(i,f,v)=>{ currentSettings.footerLinks[i][f]=v; };
window.SLSettings.removeFooterLink=(i)=>{ currentSettings.footerLinks.splice(i,1); renderFooterLinks(); };

function renderNavButtons(){
    const container=document.getElementById('navButtonsContainer');
    if(!container) return;
    const btns=currentSettings.bottomNavButtons||[];
    container.innerHTML=btns.sort((a,b)=>a.order-b.order).map((b,i)=>`
        <div style="display:grid;grid-template-columns:80px 1fr 80px 60px;gap:8px;margin-bottom:8px;align-items:center;background:#fff;padding:8px;border-radius:8px">
            <input type="text" value="${b.icon||''}" placeholder="Icon" oninput="window.SLSettings.updateNavBtn(${i},'icon',this.value)" style="padding:6px;border:1px solid #e2e8f0;border-radius:6px">
            <input type="text" value="${b.label||''}" placeholder="Label" oninput="window.SLSettings.updateNavBtn(${i},'label',this.value)" style="padding:6px;border:1px solid #e2e8f0;border-radius:6px">
            <select onchange="window.SLSettings.updateNavBtn(${i},'visible',this.value==='true')" style="padding:6px;border-radius:6px"><option value="true" ${b.visible?'selected':''}>Show</option><option value="false" ${!b.visible?'selected':''}>Hide</option></select>
            <input type="number" value="${b.order||i+1}" min="1" max="10" oninput="window.SLSettings.updateNavBtn(${i},'order',parseInt(this.value))" style="padding:6px;border:1px solid #e2e8f0;border-radius:6px">
        </div>`).join('');
}
window.SLSettings.updateNavBtn=(i,f,v)=>{ currentSettings.bottomNavButtons[i][f]=v; };

window.SLSettings.uploadLogoFile=async()=>{
    const fileInput=document.getElementById('logoUploadFile');
    const status=document.getElementById('logoUploadStatus');
    if(!fileInput || !fileInput.files[0]){ alert('Select logo'); return; }
    const formData=new FormData(); formData.append('logo', fileInput.files[0]);
    status.textContent='Uploading...';
    try{
        // Try 3 endpoints - cloudinary wala
        let res;
        try{ res=await apiCall('/upload/logo','POST',formData); }
        catch(e){ 
            // fallback direct upload endpoint
            const fd2=new FormData(); fd2.append('image', fileInput.files[0]);
            const r2=await fetch('/api/media/upload', {method:'POST', body:fd2});
            const j2=await r2.json();
            if(j2.success) res={url:j2.url};
            else throw e;
        }
        currentSettings.headerLogoUrl=res.url;
        document.getElementById('logoPreview').src=res.url+'?v='+Date.now();
        status.textContent='✅ Uploaded! Save karo';
        status.style.color='#10b981';
    }catch(err){ status.textContent='❌ '+err.message; status.style.color='#ef4444'; }
};

window.SLSettings.uploadBannerImageFile=async()=>{
    const fileInput=document.getElementById('bannerImageUploadFile');
    const status=document.getElementById('bannerImageUploadStatus');
    if(!fileInput.files[0]){ alert('Select photo'); return; }
    const formData=new FormData(); formData.append('banner', fileInput.files[0]);
    status.textContent='Uploading...';
    try{ const res=await apiCall('/upload/banner','POST',formData); currentSettings.headerBannerImageUrl=res.url; renderBannerImagePreview(res.url); status.textContent='✅ Uploaded!'; if(confirm('Abhi dikhana hai?')) window.SLSettings.setActiveBanner('image'); }
    catch(err){ status.textContent='❌ '+err.message; }
};
window.SLSettings.uploadBannerVideoFile=async()=>{
    const fileInput=document.getElementById('bannerVideoUploadFile');
    const status=document.getElementById('bannerVideoUploadStatus');
    if(!fileInput.files[0]){ alert('Select video'); return; }
    const formData=new FormData(); formData.append('banner', fileInput.files[0]);
    status.textContent='Uploading Video...';
    try{ const res=await apiCall('/upload/banner','POST',formData); currentSettings.headerBannerVideoUrl=res.url; renderBannerVideoPreview(res.url); status.textContent='✅ Uploaded!'; if(confirm('Abhi dikhana hai?')) window.SLSettings.setActiveBanner('video'); }
    catch(err){ status.textContent='❌ '+err.message; }
};

window.SLSettings.saveSettings=async()=>{
    const btn=document.getElementById('saveSettingsBtn'); if(btn){ btn.disabled=true; btn.textContent='Saving...'; }
    const data={
        appName: document.getElementById('settingLogoText')?.value||'SAMAN LIVE',
        appTagline: document.getElementById('settingTagline')?.value||'',
        headerLogoUrl: currentSettings.headerLogoUrl||'',
        headerLogoSize: parseInt(document.getElementById('logoSize')?.value||42),
        headerHeight: parseInt(document.getElementById('headerHeight')?.value||56),
        headerColor: document.getElementById('settingHeaderColor')?.value||'#ffffff',
        headerTextColor: document.getElementById('settingHeaderTextColor')?.value||'#0f172a',
        headerShowLogo: document.getElementById('headerShowLogo')?.value==='true',
        headerShowSearch: document.getElementById('headerShowSearch')?.value==='true',
        headerShowCart: document.getElementById('headerShowCart')?.value==='true',
        headerShowScanner: document.getElementById('headerShowScanner')?.value==='true',
        headerSticky: document.getElementById('headerSticky')?.value==='true',
        headerBannerUrl: currentSettings.headerBannerActive==='video'?(currentSettings.headerBannerVideoUrl||''):(currentSettings.headerBannerActive==='none'?'':(currentSettings.headerBannerImageUrl||'')),
        headerBannerImageUrl: currentSettings.headerBannerImageUrl||'',
        headerBannerVideoUrl: currentSettings.headerBannerVideoUrl||'',
        headerBannerActive: currentSettings.headerBannerActive||'image',
        headerBannerType: currentSettings.headerBannerActive==='none'?'none':(currentSettings.headerBannerActive||'image'),
        headerBannerHeight: parseInt(document.getElementById('settingBannerHeight')?.value||200),
        bannerShow: document.getElementById('bannerShow')?.value==='true',
        productCardStyle: document.getElementById('productCardStyle')?.value||'card',
        productCardSize: document.getElementById('productCardSize')?.value||'medium',
        productScrollType: document.getElementById('productScrollType')?.value||'horizontal',
        productPerRow: parseInt(document.getElementById('productPerRow')?.value||2),
        productGap: parseInt(document.getElementById('productGap')?.value||10),
        productBorderRadius: parseInt(document.getElementById('productBorderRadius')?.value||12),
        productShadow: document.getElementById('productShadow')?.value||'medium',
        productShowDiscount: document.getElementById('productShowDiscount')?.value==='true',
        productShowShopName: document.getElementById('productShowShopName')?.value==='true',
        productShowAddCart: document.getElementById('productShowAddCart')?.value==='true',
        categoryShow: document.getElementById('categoryShow')?.value==='true',
        historyShow: document.getElementById('historyShow')?.value==='true',
        historyTitle: document.getElementById('historyTitle')?.value||'History',
        adShow: document.getElementById('adShow')?.value==='true',
        adTitle: document.getElementById('adTitle')?.value||'Advertisement',
        nearbyTitle: document.getElementById('nearbyTitle')?.value||'Nearby Product',
        bottomNavShow: document.getElementById('bottomNavShow')?.value==='true',
        bottomNavColor: document.getElementById('bottomNavColor')?.value||'#ffffff',
        bottomNavActiveColor: document.getElementById('bottomNavActiveColor')?.value||'#10b981',
        bottomNavHeight: parseInt(document.getElementById('bottomNavHeight')?.value||70),
        bottomNavButtons: currentSettings.bottomNavButtons||[],
        footerShow: document.getElementById('footerShow')?.value==='true',
        footerStyle: document.getElementById('footerStyle')?.value||'modern',
        footerColor: document.getElementById('settingFooterColor')?.value||'#1f2937',
        footerTextColor: document.getElementById('footerTextColor')?.value||'#ffffff',
        footerText: document.getElementById('settingFooterText')?.value||'',
        footerAbout: document.getElementById('settingFooterAbout')?.value||'',
        footerLinks: currentSettings.footerLinks||[],
        facebook: document.getElementById('settingFacebook')?.value||'',
        instagram: document.getElementById('settingInstagram')?.value||'',
        youtube: document.getElementById('settingYoutube')?.value||'',
        primaryColor: document.getElementById('primaryColor')?.value||'#0f172a',
        secondaryColor: document.getElementById('secondaryColor')?.value||'#10b981',
        accentColor: document.getElementById('accentColor')?.value||'#3b82f6',
        backgroundColor: document.getElementById('backgroundColor')?.value||'#f5f7fa',
    };
    try{
        const res=await apiCall('/settings','PUT',data);
        currentSettings=res.data||res;
        alert('✅ Settings saved! Main app pe jake reload karo - sab update ho jayega');
        localStorage.setItem('settings_updated', Date.now().toString());
    }catch(err){ alert('Save failed: '+err.message); }
    finally{ if(btn){ btn.disabled=false; btn.textContent='💾 Save All Settings'; } }
};

window.SLSettings.exportSettings=async()=>{
    try{ const s=await apiCall('/settings/export'); const blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='samanlive-settings.json'; a.click(); }
    catch(e){ alert(e.message); }
};
window.SLSettings.resetSettings=async()=>{
    if(!confirm('⚠️ Reset to default?')) return;
    try{ await apiCall('/settings/reset','POST'); alert('✅ Reset done'); location.reload(); }
    catch(e){ alert(e.message); }
};

async function loadSettings(){
    try{
        currentSettings=await apiCall('/settings');
        document.getElementById('settingLogoText').value=currentSettings.appName||'SAMAN LIVE';
        document.getElementById('settingTagline').value=currentSettings.appTagline||'';
        document.getElementById('settingHeaderColor').value=currentSettings.headerColor||'#ffffff';
        document.getElementById('settingHeaderTextColor').value=currentSettings.headerTextColor||'#0f172a';
        document.getElementById('logoSize').value=currentSettings.headerLogoSize||42;
        document.getElementById('logoSizeVal').textContent=(currentSettings.headerLogoSize||42)+'px';
        document.getElementById('headerHeight').value=currentSettings.headerHeight||56;
        document.getElementById('headerHeightVal').textContent=(currentSettings.headerHeight||56)+'px';
        if(currentSettings.headerLogoUrl) document.getElementById('logoPreview').src=currentSettings.headerLogoUrl+'?v='+Date.now();
        document.getElementById('settingBannerHeight').value=currentSettings.headerBannerHeight||200;
        document.getElementById('bannerShow').value=String(currentSettings.bannerShow!==false);
        if(!currentSettings.headerBannerImageUrl && currentSettings.headerBannerType!=='video') currentSettings.headerBannerImageUrl=currentSettings.headerBannerUrl||'';
        if(!currentSettings.headerBannerVideoUrl && currentSettings.headerBannerType==='video') currentSettings.headerBannerVideoUrl=currentSettings.headerBannerUrl||'';
        if(!currentSettings.headerBannerActive) currentSettings.headerBannerActive=currentSettings.headerBannerType||'image';
        renderBannerImagePreview(currentSettings.headerBannerImageUrl);
        renderBannerVideoPreview(currentSettings.headerBannerVideoUrl);
        updateActiveStatus();

        document.getElementById('productCardStyle').value=currentSettings.productCardStyle||'card';
        document.getElementById('productCardSize').value=currentSettings.productCardSize||'medium';
        document.getElementById('productScrollType').value=currentSettings.productScrollType||'horizontal';
        document.getElementById('productPerRow').value=currentSettings.productPerRow||2;
        document.getElementById('productGap').value=currentSettings.productGap||10;
        document.getElementById('productBorderRadius').value=currentSettings.productBorderRadius||12;
        document.getElementById('productShadow').value=currentSettings.productShadow||'medium';
        document.getElementById('productShowDiscount').value=String(currentSettings.productShowDiscount!==false);
        document.getElementById('productShowShopName').value=String(currentSettings.productShowShopName!==false);
        document.getElementById('productShowAddCart').value=String(currentSettings.productShowAddCart!==false);

        document.getElementById('categoryShow').value=String(currentSettings.categoryShow!==false);
        document.getElementById('historyShow').value=String(currentSettings.historyShow!==false);
        document.getElementById('historyTitle').value=currentSettings.historyTitle||'History';
        document.getElementById('adShow').value=String(currentSettings.adShow!==false);
        document.getElementById('adTitle').value=currentSettings.adTitle||'Advertisement';
        document.getElementById('nearbyTitle').value=currentSettings.nearbyTitle||'Nearby Product';

        document.getElementById('bottomNavShow').value=String(currentSettings.bottomNavShow!==false);
        document.getElementById('bottomNavColor').value=currentSettings.bottomNavColor||'#ffffff';
        document.getElementById('bottomNavActiveColor').value=currentSettings.bottomNavActiveColor||'#10b981';
        document.getElementById('bottomNavHeight').value=currentSettings.bottomNavHeight||70;

        document.getElementById('footerShow').value=String(currentSettings.footerShow!==false);
        document.getElementById('footerStyle').value=currentSettings.footerStyle||'modern';
        document.getElementById('settingFooterColor').value=currentSettings.footerColor||'#1f2937';
        document.getElementById('footerTextColor').value=currentSettings.footerTextColor||'#ffffff';
        document.getElementById('settingFooterText').value=currentSettings.footerText||'';
        document.getElementById('settingFooterAbout').value=currentSettings.footerAbout||'';
        document.getElementById('settingFacebook').value=currentSettings.facebook||'';
        document.getElementById('settingInstagram').value=currentSettings.instagram||'';
        document.getElementById('settingYoutube').value=currentSettings.youtube||'';

        document.getElementById('primaryColor').value=currentSettings.primaryColor||'#0f172a';
        document.getElementById('secondaryColor').value=currentSettings.secondaryColor||'#10b981';
        document.getElementById('accentColor').value=currentSettings.accentColor||'#3b82f6';
        document.getElementById('backgroundColor').value=currentSettings.backgroundColor||'#f5f7fa';

        renderFooterLinks();
        renderNavButtons();

        // Tab click handler - FIXED FOR LAUNCHER
        document.querySelectorAll('#saman-settings-root .tab-btn').forEach(btn=>{
            btn.addEventListener('click', function(){ switchTab(this.dataset.tab); });
        });
        document.getElementById('logoSize')?.addEventListener('input', function(){ document.getElementById('logoSizeVal').textContent=this.value+'px'; });
        document.getElementById('headerHeight')?.addEventListener('input', function(){ document.getElementById('headerHeightVal').textContent=this.value+'px'; });
        document.getElementById('logoUploadFile')?.addEventListener('change', function(e){
            const file=e.target.files[0]; if(!file) return;
            const reader=new FileReader(); reader.onload=e=>{ document.getElementById('logoPreview').src=e.target.result; }; reader.readAsDataURL(file);
        });
        document.getElementById('bannerImageUploadFile')?.addEventListener('change', function(e){
            const file=e.target.files[0]; if(!file) return; renderBannerImagePreview(URL.createObjectURL(file));
        });
        document.getElementById('bannerVideoUploadFile')?.addEventListener('change', function(e){
            const file=e.target.files[0]; if(!file) return; renderBannerVideoPreview(URL.createObjectURL(file));
        });

    }catch(err){ console.error(err); }
}

// INIT - LAUNCHER MEIN BHI CHALEGA
if(document.readyState==='loading'){
    document.addEventListener('DOMContentLoaded', loadSettings);
} else {
    setTimeout(loadSettings, 100);
}

// Expose switchTab globally for old onclick
window.switchTab = switchTab;

})();
</script>
