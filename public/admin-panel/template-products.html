<!--
FILE: public/admin-panel/template-products.html
KAAM: Admin + Area Manager yaha se sabhi shop ke product dekhenge, search karenge, delete karenge
KYA HO RAHA:
1. Page load pe ProductCore.loadAllProducts() call hoga
2. Filter: template, shop, area ke hisab se product nikalenge
3. Table me dikhayenge - common UI
-->
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>All Products - Admin</title>
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>
    <h2>🛍️ Sabhi Shop ke Products</h2>

    <!-- FILTER SECTION -->
    <div class="filter-box">
        <select id="filterTemplate">
            <option value="">Sabhi Template</option>
            <option value="fruit">Fruit</option>
            <option value="kirana">Kirana</option>
            <option value="medical">Medical</option>
        </select>
        <input type="text" id="filterSearch" placeholder="Product naam se search">
        <button onclick="loadAll()">Search</button>
    </div>

    <!-- PRODUCT TABLE -->
    <table id="productTable">
        <thead>
            <tr>
                <th>Image</th>
                <th>Product</th>
                <th>Shop</th>
                <th>Template</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="productTableBody">
            <tr><td colspan="7">Loading...</td></tr>
        </tbody>
    </table>

    <!-- COMMON FILE ZAROOR INCLUDE KARNA -->
    <script src="/assets/js/product-core.js"></script>
    <script src="assets/admin.js"></script>

    <script>
        /**
         * YE FUNCTION ADMIN WALE PAGE KA HAI
         * KAAM: Common file ko call karke data laana aur table banana
         */
        async function loadAll() {
            const template = document.getElementById('filterTemplate').value;
            const search = document.getElementById('filterSearch').value;

            // 1. COMMON FILE SE SABHI PRODUCT MANGWAO
            const products = await ProductCore.loadAllProducts({ template, search });

            const tbody = document.getElementById('productTableBody');
            
            if(products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7">Koi product nahi mila</td></tr>`;
                return;
            }

            // 2. TABLE BANAO
            tbody.innerHTML = products.map(p => `
                <tr>
                    <td><img src="${p.image}" width="50"></td>
                    <td>${p.name}</td>
                    <td>${p.shopId?.shopName || 'N/A'}</td>
                    <td><span class="badge">${p.template}</span></td>
                    <td>₹${p.price}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button onclick="deleteProd('${p._id}')">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // DELETE FUNCTION
        async function deleteProd(id) {
            if(!confirm("Pakka delete karna hai?")) return;
            const res = await ProductCore.deleteProduct(id);
            if(res.success) {
                alert("Delete ho gaya");
                loadAll(); // table refresh
            }
        }

        // PAGE LOAD PE CHAL JAYE
        loadAll();
    </script>
</body>
</html>
