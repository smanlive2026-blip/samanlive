<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Products - Admin</title>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 500px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Template Products - Ready Made Catalog</h1>
            <button class="btn" onclick="openModal()">+ Naya Product Add Kare</button>
        </div>

        <div class="filters">
            <select id="shopTypeFilter" onchange="loadProducts()">
                <option value="">Sabhi Shop Type</option>
                <option value="kirana">Kirana</option>
                <option value="medical">Medical</option>
                <option value="electronics">Electronics</option>
                <option value="grocery-sweet">Grocery-Sweet</option>
            </select>
        </div>

        <table id="productsTable">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Shop Type</th>
                    <th>Category</th>
                    <th>Product Name</th>
                    <th>Unit</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Add Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2>Naya Template Product</h2>
            <form id="productForm">
                <div class="form-group">
                    <label>Shop Type *</label>
                    <select name="shopType" required>
                        <option value="kirana">Kirana</option>
                        <option value="medical">Medical</option>
                        <option value="electronics">Electronics</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" name="category" placeholder="Dal, Chawal etc">
                </div>
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Default Unit</label>
                    <input type="text" name="defaultUnit" placeholder="kg, piece, ltr">
                </div>
                <button type="submit" class="btn">Save</button>
                <button type="button" class="btn" style="background:#999" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('adminToken');

        async function loadProducts() {
            const shopType = document.getElementById('shopTypeFilter').value;
            const res = await fetch(`/api/admin/template-products?shopType=${shopType}`, {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            
            const tbody = document.querySelector('#productsTable tbody');
            tbody.innerHTML = data.products.map(p => `
                <tr>
                    <td><img src="${p.image}" width="50"></td>
                    <td>${p.shopType}</td>
                    <td>${p.category}</td>
                    <td>${p.name}</td>
                    <td>${p.defaultUnit}</td>
                    <td><button onclick="deleteProduct('${p._id}')">Delete</button></td>
                </tr>
            `).join('');
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const body = Object.fromEntries(formData);
            
            await fetch('/api/admin/template-products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(body)
            });
            
            closeModal();
            loadProducts();
        });

        function openModal() { document.getElementById('productModal').style.display = 'block'; }
        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
        
        loadProducts();
    </script>
</body>
</html>
