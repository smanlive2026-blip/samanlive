<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template Products - Admin</title>
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        .container { max-width: 1200px; margin: 20px auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn { padding: 10px 20px; background: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .btn:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; background: white; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f5f5f5; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index:999; }
        .modal-content { background: white; margin: 5% auto; padding: 20px; width: 500px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        .error { color:red; text-align:center; padding:20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Template Products - Ready Made Catalog</h1>
            <div style="display:flex; gap:10px;">
                <button class="btn" onclick="openModal()">+ Naya Product Add Kare</button>
            </div>
        </div>

        <div class="filters">
            <select id="shopTypeFilter" onchange="loadProducts()">
                <option value="">Sabhi Shop Type</option>
                <option value="kirana">Kirana</option>
                <option value="medical">Medical</option>
                <option value="electronics">Electronics</option>
                <option value="grocery-sweet">Grocery-Sweet</option>
                <option value="achar">Achar</option>
                <option value="auto">Auto</option>
                <option value="bakery">Bakery</option>
                <option value="furniture">Furniture</option>
            </select>
        </div>

        <div id="errorBox"></div>

        <table id="productsTable">
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Shop Type</th>
                    <th>Category</th>
                    <th>Product Name</th>
                    <th>Unit</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody><tr><td colspan="6" style="text-align:center;">Loading...</td></tr></tbody>
        </table>
    </div>

    <!-- Add Product Modal -->
    <div id="productModal" class="modal">
        <div class="modal-content">
            <h2>Naya Template Product</h2>
            <form id="productForm">
                <div class="form-group">
                    <label>Shop Type *</label>
                    <select name="shopType" required>
                        <option value="kirana">Kirana</option>
                        <option value="medical">Medical</option>
                        <option value="electronics">Electronics</option>
                        <option value="achar">Achar</option>
                        <option value="auto">Auto</option>
                        <option value="bakery">Bakery</option>
                        <option value="furniture">Furniture</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <input type="text" name="category" placeholder="Dal, Chawal etc">
                </div>
                <div class="form-group">
                    <label>Product Name *</label>
                    <input type="text" name="name" required>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea name="description" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Default Unit</label>
                    <input type="text" name="defaultUnit" placeholder="kg, piece, ltr">
                </div>
                <button type="submit" class="btn">Save</button>
                <button type="button" class="btn" style="background:#999" onclick="closeModal()">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        // FIX: userToken use karo kyunki admin.js me wahi set hai
        const token = localStorage.getItem('userToken'); 

        async function loadProducts() {
            const shopType = document.getElementById('shopTypeFilter').value;
            const errorBox = document.getElementById('errorBox');
            errorBox.innerHTML = '';
            
            try {
                const res = await fetch(`/api/admin/template-products?shopType=${shopType}`, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                
                if(!res.ok) throw new Error('API Error: ' + res.status);
                
                const data = await res.json();
                
                const tbody = document.querySelector('#productsTable tbody');
                if(!data.products || data.products.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;">Koi product nahi mila</td></tr>`;
                    return;
                }

                tbody.innerHTML = data.products.map(p => `
                    <tr>
                        <td><img src="${p.image || 'https://via.placeholder.com/50'}" width="50"></td>
                        <td>${p.shopType}</td>
                        <td>${p.category}</td>
                        <td>${p.name}</td>
                        <td>${p.defaultUnit}</td>
                        <td><button class="btn" style="background:red; padding:5px 10px;" onclick="deleteProduct('${p._id}')">Delete</button></td>
                    </tr>
                `).join('');
            } catch(err) {
                errorBox.innerHTML = `<div class="error">⚠️ ${err.message}. Login karke aao</div>`;
                console.error(err);
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const body = Object.fromEntries(formData);
            
            await fetch('/api/admin/template-products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                body: JSON.stringify(body)
            });
            
            closeModal();
            loadProducts();
        });

        async function deleteProduct(id) {
            if(!confirm('Delete kare?')) return;
            await fetch('/api/admin/template-products/' + id, {
                method: 'DELETE',
                headers: { 'Authorization': 'Bearer ' + token }
            });
            loadProducts();
        }

        function openModal() { document.getElementById('productModal').style.display = 'block'; }
        function closeModal() { document.getElementById('productModal').style.display = 'none'; }
        
        // Page load hote hi data le aao
        loadProducts();
    </script>
</body>
</html>
