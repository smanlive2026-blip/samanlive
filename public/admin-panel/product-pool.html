<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Product Pool - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#f8fafc;display:flex}.sidebar{width:240px;background:#0f172a;color:#fff;padding:20px;position:fixed;height:100vh}.sidebar a{display:flex;gap:10px;padding:12px;color:#94a3b8;text-decoration:none;border-radius:8px;margin:4px 0}.sidebar a.active,.sidebar a:hover{background:#1e293b;color:#fff}.main{margin-left:240px;flex:1;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}.card img{width:100%;height:160px;object-fit:cover}.info{padding:12px}.btn{padding:8px 12px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-dark{background:#0f172a;color:#fff}</style>
</head><body>
<div class="sidebar"><h2 style="font-weight:900;margin-bottom:20px">SAMANLIVE</h2><a href="./dashboard.html">Dashboard</a><a href="./product-managers.html">Product Managers</a><a href="./executives.html">Executives</a><a href="./product-pool.html" class="active">Product Pool</a><a href="./area-demands.html">Area Demands</a></div>
<div class="main"><h1 style="font-weight:900">Product Pool - Pending Products</h1><div style="margin:12px 0;display:flex;gap:8px"><select id="statusFilter"><option value="pending">Pending</option><option value="approved">Approved</option><option value="assigned">Assigned</option><option value="rejected">Rejected</option><option value="">All</option></select><input id="searchPool" placeholder="Search product..."><button class="btn btn-dark" id="refreshPool">Refresh</button></div><div id="poolGrid" class="grid">Loading...</div></div>
<script>
async function loadPool(){ const status=document.getElementById('statusFilter').value; const url=status?`/api/executive/product-pool?status=${status}`:'/api/executive/product-pool'; const res=await fetch(url).then(r=>r.json()); const data=res.data||[]; const grid=document.getElementById('poolGrid'); if(!data.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:12px">No products</div>';return;} grid.innerHTML=data.map(p=>`<div class="card"><img src="${p.thumbnail||p.images?.[0]||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'"><div class="info"><b>${p.name}</b><br><small style="color:#64748b">${p.category} | Base ₹${p.basePrice} | Stock ${p.stock}</small><br><small>PM: ${p.productManagerId?.name||''} (${p.productManagerId?.type||''})</small><br><small>Areas: ${(p.areaTags||[]).join(', ')}</small><div style="margin-top:8px;display:flex;gap:6px"><button class="btn btn-green" onclick="approve('${p._id}')">Approve</button><button class="btn btn-dark" onclick="reject('${p._id}')">Reject</button><button class="btn" style="background:#f1f5f9" onclick="assign('${p._id}')">Assign</button></div></div></div>`).join(''); }
async function approve(id){ const fp=prompt('Final Price set karo (empty = auto 25% up):'); const body={}; if(fp) body.finalPrice=Number(fp); await fetch(`/api/executive/product-pool/${id}/approve`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}); loadPool(); }
async function reject(id){ const reason=prompt('Reject reason?'); await fetch(`/api/executive/product-pool/${id}/reject`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rejectionReason:reason})}); loadPool(); }
function assign(id){ const area=prompt('Area name? e.g., Naliya'); if(!area) return; const shopType=prompt('Shop type? e.g., kirana','kirana'); const finalPrice=prompt('Final price?'); const execId=prompt('Executive ID? (optional)'); fetch('/api/executive/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productPoolId:id,areaName:area,shopType,finalPrice:finalPrice?Number(finalPrice):undefined,executiveId:execId})}).then(()=>{alert('Assigned! Now visible to shops'); loadPool();}); }
document.getElementById('statusFilter').onchange=loadPool; document.getElementById('refreshPool').onclick=loadPool; loadPool();
</script></body></html>
