<!-- LOCATION: public/admin-panel/executives.html - ADMIN CREATES EXECUTIVE - V14 FINAL -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Executives - Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#f8fafc;display:flex}.sidebar{width:240px;background:#0f172a;color:#fff;padding:20px;position:fixed;height:100vh}.sidebar a{display:flex;gap:10px;padding:12px;color:#94a3b8;text-decoration:none;border-radius:8px;margin:4px 0}.sidebar a.active,.sidebar a:hover{background:#1e293b;color:#fff}.main{margin-left:240px;flex:1;padding:20px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}.btn{padding:8px 14px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-dark{background:#0f172a;color:#fff}.btn-red{background:#ef4444;color:#fff}input{padding:10px;border:1px solid #e2e8f0;border-radius:8px;width:100%;margin:4px 0}.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:99}.modal.active{display:flex}.modal-content{background:#fff;border-radius:12px;padding:20px;width:90%;max-width:500px}</style>
</head><body>
<div class="sidebar"><h2 style="font-weight:900;margin-bottom:20px">SAMANLIVE</h2><a href="./dashboard.html">Dashboard</a><a href="./product-managers.html">Product Managers</a><a href="./executives.html" class="active">Executives</a><a href="./product-pool.html">Product Pool</a><a href="./area-demands.html">Area Demands</a></div>
<div class="main">
<h1 style="font-weight:900">Executives - Kingmaker (Admin Creates)</h1><div style="margin:12px 0;display:flex;gap:8px"><button class="btn btn-green" onclick="openCreateExec()"><i class="fa-solid fa-plus"></i> Create Executive</button><input id="searchExec" placeholder="Search..." style="max-width:300px"><button class="btn btn-dark" onclick="loadExecs()">Refresh</button></div>
<div id="execGrid" class="grid">Loading...</div>
</div>

<div class="modal" id="execModal"><div class="modal-content"><div style="display:flex;justify-content:space-between"><h3 style="font-weight:900">Create Executive - Admin</h3><button class="btn btn-dark" onclick="closeCreateExec()">X</button></div>
<div style="margin-top:10px">
<input id="execName" placeholder="Name * e.g., Rahul Executive"><input id="execPhone" placeholder="Phone *"><input id="execEmail" placeholder="Email (optional)">
<input id="execAreas" placeholder="Assigned Areas comma e.g., Naliya,Bhuj (empty=All India)"><input id="execShopTypes" placeholder="Shop Types comma e.g., kirana,patanjali (empty=All)">
<button class="btn btn-green" style="width:100%;margin-top:10px" onclick="createExec()"><i class="fa-solid fa-crown"></i> Create Executive - Admin</button><div id="execMsg" style="margin-top:8px;font-weight:700"></div>
</div></div></div>

<script>
async function loadExecs(){ const q=document.getElementById('searchExec').value.toLowerCase(); const res=await fetch('/api/executive/list').then(r=>r.json()); let data=res.data||[]; if(q) data=data.filter(e=> (e.name+' '+e.phone+' '+(e.assignedAreas||[]).join(' ')).toLowerCase().includes(q)); const grid=document.getElementById('execGrid'); if(!data.length){ grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;background:#fff;border-radius:12px">No Executive. Create one.</div>'; return; } grid.innerHTML=data.map(e=>`<div class="card"><div style="display:flex;justify-content:space-between"><b><i class="fa-solid fa-crown"></i> ${e.name}</b><span style="font-size:10px;padding:3px 8px;border-radius:12px;background:#dcfce7">ACTIVE</span></div><small style="color:#64748b">${e.phone} | Areas: ${(e.assignedAreas||[]).join(', ')||'All India'} | Shops: ${(e.assignedShopTypes||[]).join(', ')||'All'}</small><br><small>Assigned: ${e.totalAssigned||0} | Wallet: ₹${e.walletBalance||0} | Earning: ₹${e.totalEarning||0}</small><div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><button class="btn btn-green" style="padding:6px 10px;font-size:11px" onclick="window.open('/executive/dashboard.html?execId=${e._id}','_blank')"><i class="fa-solid fa-external-link"></i> Open Kingmaker Dashboard</button><button class="btn btn-red" style="padding:6px 10px;font-size:11px" onclick="deleteExec('${e._id}')"><i class="fa-solid fa-trash"></i> Delete</button></div></div>`).join(''); }
function openCreateExec(){ document.getElementById('execModal').classList.add('active'); } function closeCreateExec(){ document.getElementById('execModal').classList.remove('active'); }
async function createExec(){ const body={ name:document.getElementById('execName').value.trim(), phone:document.getElementById('execPhone').value.trim(), email:document.getElementById('execEmail').value.trim(), assignedAreas:document.getElementById('execAreas').value.split(',').map(s=>s.trim()).filter(Boolean), assignedShopTypes:document.getElementById('execShopTypes').value.split(',').map(s=>s.trim()).filter(Boolean) }; if(!body.name||!body.phone){ document.getElementById('execMsg').textContent='Name Phone required'; document.getElementById('execMsg').style.color='red'; return; } document.getElementById('execMsg').textContent='Creating...'; const res=await fetch('/api/executive/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()); if(res.success){ document.getElementById('execMsg').textContent='Executive Created by Admin!'; document.getElementById('execMsg').style.color='green'; setTimeout(()=>{ closeCreateExec(); loadExecs(); },800); } else { document.getElementById('execMsg').textContent='Error: '+(res.error||'failed'); document.getElementById('execMsg').style.color='red'; } }
async function deleteExec(id){ if(!confirm('Delete Executive?')) return; await fetch(`/api/executive/${id}`,{method:'DELETE'}); loadExecs(); }
document.getElementById('searchExec').oninput=loadExecs; loadExecs();
</script></body></html>
