<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Products - SAMANLIVE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {--primary:#10b981;--danger:#ef4444;--border:#e2e8f0;--bg:#f8fafc;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);padding:20px}
.page-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.btn{padding:10px 20px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.card{background:white;padding:20px;border-radius:12px;border:1px solid var(--border);margin-bottom:20px}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:15px}
.shop-card{padding:15px;border:2px solid var(--border);border-radius:10px;cursor:pointer;transition:0.2s}
.shop-card:hover{border-color:var(--primary)} .shop-card.active{border-color:var(--primary);background:#ecfdf5}
table{width:100%;border-collapse:collapse} th{background:#f8fafc;padding:12px;text-align:left;font-size:13px} td{padding:12px;border-bottom:1px solid var(--border);font-size:14px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center}
.modal.active{display:flex} .modal-content{background:white;padding:30px;border-radius:16px;width:90%;max-width:500px}
.form-group{margin:12px 0} .form-group label{display:block;margin-bottom:6px;font-weight:600;font-size:14px}
.form-group input,.form-group textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px}
.badge{display:inline-block;padding:4px 8px;background:#d1fae5;color:#065f46;border-radius:6px;font-size:12px;font-weight:600}
</style>
</head>
<body>

<div class="page-header">
    <h2>🏪 Shop Products Manager</h2>
    <button class="btn" onclick="showAddProductModal()" id="addProductBtn" disabled><i class="fas fa-plus"></i> Add Product</button>
</div>

<div class="card">
    <h3 style="margin-bottom:15px">Step 1: Select Shop</h3>
    <div id="shopList" class="shop-grid"><p>Loading shops...</p></div>
</div>

<div class="card" id="productSection" style="display:none">
    <div style="display:flex;justify-content:space-between;margin-bottom:15px">
        <h3>Step 2: Products of <span id="selectedShopName" class="badge"></span></h3>
        <button class="btn" style="background:#64748b" onclick="deselectShop()"><i class="fas fa-arrow-left"></i> Back</button>
    </div>
    <table id="productsTable">
        <thead><tr><th>Image</th><th>Name</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
        <tbody><tr><td colspan="5" style="text-align:center">No products</td></tr></tbody>
    </table>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle"><i class="fas fa-plus"></i> Add Product</h2>
        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="productId">
            <div class="form-group"><label>Name *</label><input type="text" id="productName" required></div>
            <div class="form-group"><label>Category</label><input type="text" id="productCategory"></div>
            <div class="form-group"><label>Price ₹ *</label><input type="number" id="productPrice" step="0.01" required></div>
            <div class="form-group"><label>Stock *</label><input type="number" id="productStock" required></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="productImage"></div>
            <button type="submit" class="btn" style="width:100%" id="saveBtn"><i class="fas fa-save"></i> Save</button>
        </form>
        <button onclick="closeProductModal()" style="margin-top:10px;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;background:white;cursor:pointer">Cancel</button>
    </div>
</div>

<script>
const API = '/manager';
const token = localStorage.getItem('managerToken') || localStorage.getItem('token') || '';
let selectedShopId = null;

async function apiCall(endpoint, method = 'GET', body = null) {
    const opts = { method, headers: { 'Authorization': `Bearer ${token}` } };
    if(body) {opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body);}
    const res = await fetch(API + endpoint, opts);
    return res.json();
}

async function loadShops() {
    const res = await apiCall('/my-shops');
    if(res.success){
        document.getElementById('shopList').innerHTML = res.shops.map(shop=>`
            <div class="shop-card" onclick="selectShop('${shop._id}', '${shop.shopName}')">
                <h3>${shop.icon || '🏪'} ${shop.shopName}</h3>
                <p style="font-size:12px;color:#64748b">${shop.address?.line1 || '-'}</p>
            </div>
        `).join('');
    }
}

async function selectShop(shopId, shopName) {
    selectedShopId = shopId;
    document.getElementById('selectedShopName').innerText = shopName;
    document.getElementById('productSection').style.display = 'block';
    document.getElementById('addProductBtn').disabled = false;
    document.querySelectorAll('.shop-card').forEach(c=>c.classList.remove('active'));
    event.currentTarget.classList.add('active');
    const res = await apiCall(`/shop/${shopId}/products`);
    const tbody = document.querySelector('#productsTable tbody');
    tbody.innerHTML = res.products.length ? res.products.map(p=>`
        <tr>
            <td><img src="${p.image}" style="width:50px;height:50px;border-radius:6px"></td>
            <td><strong>${p.name}</strong><br><small>${p.category}</small></td>
            <td>₹${p.price}</td><td>${p.stock}</td>
            <td>
                <button onclick='editProduct(${JSON.stringify(p)})' style="padding:6px;background:#3b82f6;color:white;border:none;border-radius:6px"><i class="fas fa-edit"></i></button>
                <button onclick='deleteProduct("${p._id}")' style="padding:6px;background:var(--danger);color:white;border:none;border-radius:6px"><i class="fas fa-trash"></i></button>
            </td>
        </tr>`).join('') : '<tr><td colspan="5" style="text-align:center">No products</td></tr>';
}

function deselectShop(){selectedShopId=null;document.getElementById('productSection').style.display='none';document.getElementById('addProductBtn').disabled=true;}

window.showAddProductModal = () => {document.getElementById('productForm').reset();document.getElementById('productId').value='';document.getElementById('productModal').classList.add('active');}
window.closeProductModal = () => {document.getElementById('productModal').classList.remove('active');}

window.editProduct = (p) => {
    document.getElementById('productId').value=p._id;
    document.getElementById('productName').value=p.name;
    document.getElementById('productCategory').value=p.category;
    document.getElementById('productPrice').value=p.price;
    document.getElementById('productStock').value=p.stock;
    document.getElementById('productImage').value=p.image;
    document.getElementById('productModal').classList.add('active');
}

window.saveProduct = async (e) => {
    e.preventDefault();
    const id = document.getElementById('productId').value;
    const data = {name:productName.value,category:productCategory.value,price:productPrice.value,stock:productStock.value,image:productImage.value};
    const endpoint = id ? `/shop/${selectedShopId}/product/${id}` : `/shop/${selectedShopId}/add-product`;
    const method = id ? 'PUT' : 'POST';
    await apiCall(endpoint, method, data);
    alert('✅ Saved');
    closeProductModal(); selectShop(selectedShopId, selectedShopName.innerText);
}

window.deleteProduct = async (id) => {
    if(!confirm('Delete?')) return;
    await apiCall(`/shop/${selectedShopId}/product/${id}`, 'DELETE');
    selectShop(selectedShopId, selectedShopName.innerText);
}

document.addEventListener('DOMContentLoaded', loadShops);
</script>
</body>
</html>
