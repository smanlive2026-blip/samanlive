<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Management - SAMANLIVE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {--primary:#10b981;--border:#e2e8f0;--bg:#f8fafc;--text:#1e293b;}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);padding:20px}
.page-header{display:flex;justify-content:space-between;margin-bottom:20px}
.btn{padding:10px 20px;background:var(--primary);color:white;border:none;border-radius:8px;cursor:pointer}
.card{background:white;padding:20px;border-radius:12px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse} th{background:#f8fafc;padding:12px;text-align:left} td{padding:12px;border-bottom:1px solid var(--border)}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:9999;align-items:center;justify-content:center}
.modal.active{display:flex} .modal-content{background:white;padding:30px;border-radius:16px;width:90%;max-width:500px}
</style>
</head>
<body>

<div class="page-header">
    <h2>🛍️ Master Products <span style="font-size:14px;color:#64748b;">Admin Panel</span></h2>
    <button class="btn" onclick="showAddProductModal()"><i class="fas fa-plus"></i> Add Master Product</button>
</div>

<div class="card">
    <table id="productsTable">
        <thead><tr><th>Image</th><th>Name</th><th>Brand</th><th>Category</th><th>Action</th></tr></thead>
        <tbody><tr><td colspan="5">Loading...</td></tr></tbody>
    </table>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Add Master Product</h2>
        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="productId">
            <div style="margin:12px 0"><label>Category *</label>
                <select id="productCategory" required style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
                    <option value="">Loading categories...</option>
                </select>
            </div>
            <div style="margin:12px 0"><label>Product Name *</label>
                <input type="text" id="productName" required style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
            </div>
            <button type="submit" class="btn" style="width:100%">Save Product</button>
        </form>
        <button onclick="closeProductModal()" style="margin-top:10px">Close</button>
    </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('adminToken') || localStorage.getItem('token') || '';
let allProducts = [], allCategories = [];

async function apiCall(endpoint, method = 'GET', body = null) {
    const opts = { method, headers: { 'Authorization': `Bearer ${token}` } };
    if(body) {opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body);}
    const res = await fetch(API + endpoint, opts); 
    return res.json();
}

async function loadProducts() {
    const [res, cats] = await Promise.all([
        apiCall('/master-products'), 
        apiCall('/modules') // ✅ YAHI SE CATEGORY
    ]);
    allProducts = res || [];
    allCategories = cats.modules || cats || [];

    document.getElementById('productCategory').innerHTML =
        '<option value="">Select Category</option>' +
        allCategories.map(c=>`<option value="${c._id}">${c.icon || '📦'} ${c.name}</option>`).join('');

    document.querySelector('#productsTable tbody').innerHTML = allProducts.map(p=>{
        const cat = allCategories.find(c => c._id === p.categoryId);
        return `<tr>
            <td><img src="${p.image||'https://via.placeholder.com/50'}" style="width:50px;height:50px;border-radius:6px;"></td>
            <td>${p.name}</td><td>${p.brand || '-'}</td><td>${cat?.name || '-'}</td>
            <td><button onclick="editProduct('${p._id}')">Edit</button></td>
        </tr>`}).join('');
}

window.showAddProductModal = () => { document.getElementById('productModal').classList.add('active'); }
window.closeProductModal = () => { document.getElementById('productModal').classList.remove('active'); }

window.saveProduct = async (e) => {
    e.preventDefault();
    const data = {
        name: document.getElementById('productName').value,
        categoryId: document.getElementById('productCategory').value
    };
    await apiCall('/master-products','POST',data);
    alert('✅ Saved');
    closeProductModal(); loadProducts();
}

document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
