<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Category Products Manager - SAMANLIVE ADMIN</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {--primary: #6366f1; --primary-dark: #4f46e5; --success: #10b981; --danger: #ef4444; --border: #e2e8f0;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', sans-serif}
body{background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px;}
.container{max-width: 1400px; margin: 0 auto;}
.page-header{background: rgba(255,255,255,0.95); padding: 20px 30px; border-radius: 20px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center;}
.btn{padding: 12px 24px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: 600;}
.card{background: rgba(255,255,255,0.95); padding: 25px; border-radius: 20px; margin-bottom: 25px;}
.category-grid{display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px;}
.category-card{padding: 20px; background: white; border: 2px solid var(--border); border-radius: 16px; cursor: pointer; text-align: center; transition: 0.3s;}
.category-card:hover{border-color: var(--primary); transform: translateY(-5px);}
.category-card.active{border-color: var(--primary); background: #eef2ff;}
table{width: 100%; border-collapse: collapse;} thead{background: var(--primary);}
th{padding: 14px; text-align: left; color: white;} td{padding: 14px; border-bottom: 1px solid var(--border);}
.modal{display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 9999; align-items: center; justify-content: center;}
.modal.active{display: flex;} .modal-content{background: white; padding: 30px; border-radius: 20px; width: 90%; max-width: 550px;}
.form-group{margin: 15px 0;} .form-group input, .form-group select{width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 10px;}
</style>
</head>
<body>

<div class="container">
    <div class="page-header">
        <h2><i class="fas fa-layer-group"></i> Category Products Manager - ADMIN</h2>
        <button class="btn" onclick="showAddProductModal()" id="addProductBtn" disabled><i class="fas fa-plus"></i> Add Product to Category</button>
    </div>

    <div class="card">
        <h3><i class="fas fa-tags"></i> Step 1: Select Category</h3>
        <div id="categoryList" class="category-grid">Loading categories...</div>
    </div>

    <div class="card" id="productSection" style="display:none">
        <h3>Step 2: Products in <span id="selectedCategoryName" style="color:var(--primary)"></span> Category</h3>
        <table id="productsTable">
            <thead><tr><th>Shop</th><th>Product</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
            <tbody><tr><td colspan="5">Select a category</td></tr></tbody>
        </table>
    </div>
</div>

<div id="productModal" class="modal">
    <div class="modal-content">
        <h2>Add Product to <span id="modalCategoryName"></span></h2>
        <form id="productForm" onsubmit="saveProduct(event)">
            <div class="form-group">
                <label>Select Shops in this Category *</label>
                <select id="shopSelect" multiple size="5" required></select>
                <small>Ctrl+Click to select multiple shops</small>
            </div>
            <div class="form-group"><label>Product Name *</label><input type="text" id="productName" required></div>
            <div class="form-group"><label>Price ₹ *</label><input type="number" id="productPrice" step="0.01" required></div>
            <div class="form-group"><label>Stock *</label><input type="number" id="productStock" required></div>
            <div class="form-group"><label>Image URL</label><input type="text" id="productImage"></div>
            <button type="submit" class="btn" style="width:100%">Add to Selected Shops</button>
        </form>
        <button onclick="closeProductModal()" style="margin-top:10px;width:100%;padding:10px;">Cancel</button>
    </div>
</div>

<script>
const API = 'https://samanlive.onrender.com/api/admin';
let selectedCategory = null;
let categoryShops = [];

async function apiCall(endpoint, method = 'GET', body = null) {
    const opts = { method, headers: {'Content-Type': 'application/json'} };
    if(body) opts.body = JSON.stringify(body);
    const res = await fetch(API + endpoint, opts);
    return res.json();
}

// 1. SAARI CATEGORIES NIKALO
async function loadCategories() {
    const res = await apiCall('/shops/all');
    const shops = res.shops;
    const categories = [...new Set(shops.map(s => s.category).filter(Boolean))];
    
    document.getElementById('categoryList').innerHTML = categories.map(cat=>`
        <div class="category-card" onclick="selectCategory('${cat}', event)">
            <i class="fas fa-tag" style="font-size:24px;color:var(--primary)"></i>
            <h4 style="margin-top:10px">${cat}</h4>
            <p style="font-size:12px">${shops.filter(s=>s.category===cat).length} Shops</p>
        </div>
    `).join('');
}

async function selectCategory(category, event) {
    selectedCategory = category;
    document.getElementById('selectedCategoryName').innerText = category;
    document.getElementById('productSection').style.display = 'block';
    document.getElementById('addProductBtn').disabled = false;
    document.querySelectorAll('.category-card').forEach(c=>c.classList.remove('active'));
    event.currentTarget.classList.add('active');

    // Is category ki saari shops
    const res = await apiCall('/shops/all');
    categoryShops = res.shops.filter(s => s.category === category);
    
    // Table me dikhao
    let html = '';
    for(let shop of categoryShops){
        const prodRes = await apiCall(`/shop/${shop._id}/products`);
        prodRes.products.forEach(p=>{
            html += `<tr>
                <td><strong>${shop.shopName}</strong></td>
                <td>${p.name}</td>
                <td>₹${p.price}</td>
                <td>${p.stock}</td>
                <td>-</td>
            </tr>`;
        })
    }
    document.querySelector('#productsTable tbody').innerHTML = html || '<tr><td colspan="5">No products yet</td></tr>';
}

window.showAddProductModal = () => {
    document.getElementById('modalCategoryName').innerText = selectedCategory;
    // Dropdown me shops bharo
    document.getElementById('shopSelect').innerHTML = categoryShops.map(s=>`<option value="${s._id}">${s.shopName}</option>`).join('');
    document.getElementById('productModal').classList.add('active');
}
window.closeProductModal = () => {document.getElementById('productModal').classList.remove('active');}

window.saveProduct = async (e) => {
    e.preventDefault();
    const selectedShops = [...document.getElementById('shopSelect').selectedOptions].map(o=>o.value);
    const data = {name:productName.value, price:productPrice.value, stock:productStock.value, image:productImage.value, category: selectedCategory};
    
    for(let shopId of selectedShops){
        await apiCall(`/shop/${shopId}/add-product`, 'POST', data);
    }
    alert(`✅ Product added to ${selectedShops.length} shops`);
    closeProductModal(); 
    selectCategory(selectedCategory, {currentTarget: document.querySelector('.category-card.active')});
}

setTimeout(loadCategories, 1000);
</script>
</body>
</html>
