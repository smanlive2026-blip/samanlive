<!-- 
File: public/admin-panel/delivery.html
IMPORTANT: Is file ka CSS /public/admin-panel/assets/admin.css me hai
ADMIN ROUTE NEEDED: GET /api/admin/all-delivery-managers
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Delivery Managers - SAMANLIVE Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/admin.css">
    <style>
        .dm-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .dm-table th, .dm-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        .dm-table th { background: #f8fafc; font-weight: 600; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-success { background: #d1fae5; color: #065f46; }
        .badge-danger { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-motorcycle"></i> All Delivery Managers</h1>
            <p>Total Delivery Boys across all Areas</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Delivery Boy List</h2>
                <span id="totalCount" style="font-weight:600;">Loading...</span>
            </div>
            <div style="overflow-x: auto;">
                <table class="dm-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Area Code</th>
                            <th>Area Name</th>
                            <th>Delivery Boy Name</th>
                            <th>Phone</th>
                            <th>Vehicle</th>
                            <th>Manager Code</th>
                            <th>Created By AM</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="allDMTable">
                        <tr><td colspan="9" style="text-align:center; padding: 40px;">
                            <i class="fas fa-spinner fa-spin"></i> Loading...
                        </td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

<script>
const API = '/api';

async function loadAllDeliveryManagers() {
    try {
        const res = await fetch(`${API}/admin/all-delivery-managers`);
        const data = await res.json();
        
        const tbody = document.getElementById('allDMTable');
        document.getElementById('totalCount').textContent = `Total: ${data.managers.length}`;

        if(!data.success || data.managers.length === 0) {
            tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;">Koi Delivery Boy nahi mila</td></tr>`;
            return;
        }
        
        tbody.innerHTML = data.managers.map((dm, i) => `
            <tr>
                <td>${i + 1}</td>
                <td>${dm.areaCode}</td>
                <td>${dm.areaName || '-'}</td>
                <td><strong>${dm.name}</strong></td>
                <td>${dm.phone}</td>
                <td>${dm.vehicleType}</td>
                <td>${dm.managerCode}</td>
                <td>${dm.parentManager?.name || 'N/A'} (${dm.parentManager?.managerCode || '-'})</td>
                <td><span class="badge ${dm.status? 'badge-success' : 'badge-danger'}">${dm.status? 'Active' : 'Inactive'}</span></td>
            </tr>
        `).join('');
    } catch(err) {
        console.error(err);
        document.getElementById('allDMTable').innerHTML = `<tr><td colspan="9" style="text-align:center; color:red;">Error loading data</td></tr>`;
    }
}

loadAllDeliveryManagers();
</script>
</body>
</html>
