<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Products Management - SAMANLIVE</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {--primary:#10b981;--border:#e2e8f0;--bg:#f8fafc;--text:#1e293b;--danger:#ef4444;}
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
body { background: var(--bg); color: var(--text); padding: 20px; }
.page-header {display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;margin-bottom: 20px;}
.btn {padding: 10px 20px; background: var(--primary); color: white; border: none;border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;}
.btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
.card {background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border);}
table { width: 100%; border-collapse: collapse; }
th { background: #f8fafc; padding: 12px; text-align: left; border-bottom: 2px solid var(--border); }
td { padding: 12px; border-bottom: 1px solid var(--border); }
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; }
.toast { position: fixed; top: 20px; right: 20px; background: white; padding: 14px 20px; border-radius: 10px; display: none; }
.toast.show { display: block; }
.btn-icon { padding: 6px 10px; border: none; background: #f1f5f9; border-radius: 6px; cursor: pointer; margin: 0 2px; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="page-header">
    <h2>🛍️ Products Management</h2>
    <div style="display:flex;gap:10px;">
        <button class="btn btn-primary" onclick="openProductLibrary()"><i class="fas fa-book-open"></i> Add From Library</button>
        <button class="btn btn-primary" onclick="showAddProductModal()"><i class="fas fa-plus"></i> Add Manual Product</button>
    </div>
</div>

<div class="card">
    <input type="text" id="productSearch" placeholder="Search..." oninput="searchProducts()" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;margin-bottom:15px;">
    <table id="productsTable">
        <thead><tr><th>Image</th><th>Name</th><th>Shop</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
        <tbody><tr><td colspan="6">Loading...</td></tr></tbody>
    </table>
</div>

<!-- Add/Edit Product Modal -->
<div id="productModal" class="modal">
    <div class="modal-content">
        <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
            <h2 id="modalTitle">Add Product</h2>
            <button onclick="closeProductModal()">×</button>
        </div>
        <form id="productForm" onsubmit="saveProduct(event)">
            <input type="hidden" id="productId">
            <input type="hidden" id="masterProductId">

            <div style="margin-bottom:12px;">
                <label>Product Name *</label>
                <input type="text" id="productName" required style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;">
            </div>
            <div style="margin-bottom:12px;">
                <label>Shop *</label>
                <select id="productShop" required style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;"></select>
            </div>
            <div style="margin-bottom:12px;">
                <label>Category</label>
                <select id="productCategory" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;"></select>
            </div>
            <div style="display:flex;gap:10px;margin-bottom:12px;">
                <div style="flex:1;"><label>Price ₹ *</label><input type="number" id="productPrice" required style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;"></div>
                <div style="flex:1;"><label>Stock *</label><input type="number" id="productStock" required style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;"></div>
            </div>
            <div style="margin-bottom:12px;">
                <label>Upload Photo</label>
                <input type="file" id="productImageFile" accept="image/*" onchange="handleImageUpload(event)" style="width:100%;padding:8px;">
                <img id="imagePreview" style="display:none;margin-top:8px;max-width:100px;border-radius:6px;">
                <input type="hidden" id="productImage">
            </div>
            <button type="submit" id="saveProductBtn" class="btn btn-primary" style="width:100%;margin-top:10px;">Save Product</button>
        </form>
    </div>
</div>

<!-- LIBRARY POPUP -->
<div id="libraryPopup" class="modal">
    <div class="modal-content" style="max-width:95%; height:90%; padding:0; display:flex; flex-direction:column;">
        <div style="padding:20px;display:flex;justify-content:space-between;">
            <h2><i class="fas fa-book-open"></i> Select From Library</h2>
            <button onclick="closeProductLibrary()">×</button>
        </div>
        <iframe src="/local-market/library/index.html" style="flex:1; border:none;"></iframe>
    </div>
</div>

<script>
const API = '/api';
const token = localStorage.getItem('token') || 'demo-token';
let allProducts = [], allShops = [];

async function apiCall(endpoint, method = 'GET', body = null) {
    const opts = { method, headers: { 'Authorization': `Bearer ${token}` } };
    if(body) {opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body);}
    const res = await fetch(API + endpoint, opts); return res.json();
}
function showToast(msg) {const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

async function loadProducts() {
    const res = await apiCall('/shop-products');
    allProducts = res || [];
    const shops = await apiCall('/shops');
    allShops = shops || [];
    document.getElementById('productShop').innerHTML = '<option value="">Select Shop</option>' + allShops.map(s=>`<option value="${s._id}">${s.name}</option>`).join('');
    renderProducts(allProducts);
}

function renderProducts(products) {
    document.querySelector('#productsTable tbody').innerHTML = products.map(p=>`
        <tr>
            <td><img src="${p.image||'https://via.placeholder.com/50'}" style="width:50px;height:50px;border-radius:6px;"></td>
            <td>${p.name}</td><td>${p.shopId?.name}</td><td>₹${p.price}</td><td>${p.stock}</td>
            <td><button class="btn-icon" onclick="editProduct('${p._id}')">✏️</button><button class="btn-icon" onclick="deleteProduct('${p._id}')">🗑️</button></td>
        </tr>`).join('');
}

window.showAddProductModal = () => {
    document.getElementById('modalTitle').textContent = 'Add Manual Product';
    document.getElementById('productForm').reset();
    document.getElementById('productId').value = '';
    document.getElementById('masterProductId').value = ''; // KHALI RAHEGA
    document.getElementById('imagePreview').style.display='none';
    document.getElementById('productModal').classList.add('active');
};
window.closeProductModal = () => document.getElementById('productModal').classList.remove('active');

window.handleImageUpload = (e) => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        document.getElementById('imagePreview').src = ev.target.result;
        document.getElementById('imagePreview').style.display = 'block';
        document.getElementById('productImage').value = ev.target.result;
    }
    reader.readAsDataURL(file);
}

window.saveProduct = async (e) => {
    e.preventDefault();
    const data = {
        name: document.getElementById('productName').value,
        shopId: document.getElementById('productShop').value,
        categoryId: document.getElementById('productCategory').value,
        price: Number(document.getElementById('productPrice').value),
        stock: Number(document.getElementById('productStock').value),
        image: document.getElementById('productImage').value,
        masterProductId: document.getElementById('masterProductId').value || null // AGAR LIBRARY SE HAI TO ID JAYEGI
    };
    const id = document.getElementById('productId').value;
    if(id){await apiCall(`/shop-products/${id}`,'PUT',data);} else {await apiCall('/shop-products','POST',data);}
    showToast('Saved!'); closeProductModal(); loadProducts();
}

window.deleteProduct = async (id) => {if(confirm('Delete?')){await apiCall(`/shop-products/${id}`,'DELETE');loadProducts();}}
window.searchProducts = () => {const q=document.getElementById('productSearch').value.toLowerCase();renderProducts(allProducts.filter(p=>p.name.toLowerCase().includes(q)));}

// LIBRARY
window.openProductLibrary = () => document.getElementById('libraryPopup').classList.add('active');
window.closeProductLibrary = () => document.getElementById('libraryPopup').classList.remove('active');
window.addEventListener('message', (event) => {
    if(event.data.type === 'SELECT_MASTER_PRODUCT') {
        const p = event.data.product;
        showAddProductModal();
        document.getElementById('modalTitle').textContent = 'Add to Shop from Library';
        document.getElementById('masterProductId').value = p._id;
        document.getElementById('productName').value = p.name;
        document.getElementById('productImage').value = p.image;
        showToast(`Selected: ${p.name}`); closeProductLibrary();
    }
});

document.addEventListener('DOMContentLoaded', loadProducts);
</script>
</body>
</html>
