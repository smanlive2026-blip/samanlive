<!-- LOCATION: public/executive/dashboard.html - EXECUTIVE DASHBOARD V14 FINAL - 3 COLUMN KINGMAKER -->
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Executive - Kingmaker Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}body{background:#f1f5f9}.header{background:#0f172a;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:20}.cols{display:grid;grid-template-columns:40% 30% 30%;gap:10px;padding:10px;height:calc(100vh - 60px)}@media(max-width:1000px){.cols{grid-template-columns:1fr;height:auto}}.col{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;display:flex;flex-direction:column}.col-head{padding:10px 12px;border-bottom:1px solid #e2e8f0;font-weight:900;display:flex;justify-content:space-between;align-items:center;background:#f8fafc}.list{overflow:auto;padding:8px;flex:1}.card{border:1px solid #e2e8f0;border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer}.card.selected{border-color:#16a34a;background:#f0fdf4}.card img{width:100%;height:120px;object-fit:cover;border-radius:8px}.badge{padding:2px 6px;border-radius:12px;font-size:10px;font-weight:800}.badge-high{background:#fee2e2;color:#991b1b}.badge-medium{background:#fef3c7;color:#92400e}.badge-low{background:#dcfce7;color:#166534}input,select{padding:8px;border:1px solid #e2e8f0;border-radius:8px;width:100%;margin:4px 0}.btn{padding:8px 12px;border-radius:8px;border:0;font-weight:800;cursor:pointer}.btn-green{background:#16a34a;color:#fff}.btn-dark{background:#0f172a;color:#fff}.assign-box{padding:10px;border-top:2px dashed #16a34a;background:#f0fdf4}</style>
</head><body>
<div class="header"><div><b style="font-weight:900"><i class="fa-solid fa-crown"></i> Executive: <span id="execName">Loading...</span></b><br><small id="execAreas" style="color:#94a3b8"></small></div><div style="display:flex;gap:8px;align-items:center"><span id="execWallet" style="background:#16a34a;padding:6px 10px;border-radius:20px;font-weight:800">₹0</span><button class="btn btn-green" onclick="loadAll()">Refresh</button></div></div>
<div class="cols">
<!-- LEFT: PRODUCT POOL -->
<div class="col"><div class="col-head"><span><i class="fa-solid fa-boxes-stacked"></i> Product Pool (<span id="poolCount">0</span>)</span><select id="poolStatus" style="width:auto"><option value="pending">Pending</option><option value="approved">Approved</option><option value="">All</option></select></div><div style="padding:8px;display:flex;gap:6px"><input id="poolSearch" placeholder="Search product, PM, area..."></div><div id="poolList" class="list">Loading pool...</div></div>
<!-- MIDDLE: AREA DEMANDS -->
<div class="col"><div class="col-head"><span><i class="fa-solid fa-clipboard-list"></i> Area Demands (<span id="demandCount">0</span>)</span><select id="demandStatus" style="width:auto"><option value="open">Open</option><option value="fulfilled">Fulfilled</option><option value="">All</option></select></div><div id="demandList" class="list">Loading demands...</div></div>
<!-- RIGHT: ASSIGN PANEL -->
<div class="col"><div class="col-head"><span><i class="fa-solid fa-handshake"></i> Assign Panel</span><small id="selectedInfo" style="color:#16a34a"></small></div><div class="list"><div id="selectedProduct" style="padding:10px;border:1px dashed #cbd5e1;border-radius:8px;text-align:center;color:#64748b">Select a product from left</div><div id="selectedDemand" style="margin-top:8px;padding:10px;border:1px dashed #cbd5e1;border-radius:8px;text-align:center;color:#64748b">Select a demand from middle (optional)</div><div class="assign-box" style="margin-top:10px"><h4 style="font-weight:800">Final Assignment</h4><input id="finalArea" placeholder="Final Area * e.g., Naliya"><input id="finalShopType" placeholder="Shop Type * e.g., kirana"><input id="finalPrice" type="number" placeholder="Final Price * e.g., 500"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><input id="pmPercent" type="number" value="70" placeholder="PM %"><input id="execPercent" type="number" value="5" placeholder="Exec %"><input id="adminPercent" type="number" value="5" placeholder="Admin %"><input id="shopPercent" type="number" value="20" placeholder="Shop %"></div><button class="btn btn-green" style="width:100%;margin-top:8px;padding:12px;font-size:14px" id="assignBtn"><i class="fa-solid fa-rocket"></i> ASSIGN & PUBLISH TO SHOPS</button><div id="assignMsg" style="margin-top:8px;font-weight:700"></div></div></div></div>
</div>
<script>
// LOCATION: JS - Executive Dashboard Kingmaker Logic - V14 FINAL
const execId = new URLSearchParams(location.search).get('execId') || localStorage.getItem('execId') || '';
let selectedPool = null, selectedDemand = null;
async function loadExec(){ if(!execId) return; const res = await fetch(`/api/executive/list`).then(r=>r.json()); const exec = (res.data||[]).find(e=>e._id===execId) || res.data?.[0]; if(exec){ document.getElementById('execName').textContent = exec.name; document.getElementById('execAreas').textContent = `Areas: ${(exec.assignedAreas||[]).join(', ')||'All India'} | Assigned: ${exec.totalAssigned||0}`; document.getElementById('execWallet').textContent = `₹${exec.walletBalance||0}`; } }
async function loadPool(){ const status=document.getElementById('poolStatus').value; const q=document.getElementById('poolSearch').value.toLowerCase(); const url=status?`/api/executive/product-pool?status=${status}`:'/api/executive/product-pool'; const res=await fetch(url).then(r=>r.json()); let data=res.data||[]; if(q) data=data.filter(p=> (p.name+' '+p.category+' '+(p.productManagerId?.name||'')+' '+(p.areaTags||[]).join(' ')).toLowerCase().includes(q) ); document.getElementById('poolCount').textContent=data.length; const list=document.getElementById('poolList'); if(!data.length){ list.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8">No products</div>'; return; } list.innerHTML=data.map(p=>`<div class="card ${selectedPool?._id===p._id?'selected':''}" onclick="selectPool('${p._id}')"><img src="${p.thumbnail||p.images?.[0]||'https://via.placeholder.com/300'}" onerror="this.src='https://via.placeholder.com/300'"><div style="margin-top:6px"><b>${p.name}</b><br><small style="color:#64748b">${p.category} | Base ₹${p.basePrice} | Stock ${p.stock} | Areas ${(p.areaTags||[]).join(', ')}</small><br><small>PM: ${p.productManagerId?.name||''} (${p.productManagerId?.type||''}) | ${p.productManagerId?.area||''}</small><br><span class="badge" style="background:#f1f5f9">${p.status.toUpperCase()}</span></div></div>`).join(''); window._poolData=data; }
async function loadDemands(){ const status=document.getElementById('demandStatus').value; const url=status?`/api/executive/area-demands?status=${status}`:'/api/executive/area-demands'; const res=await fetch(url).then(r=>r.json()); const data=res.data||[]; document.getElementById('demandCount').textContent=data.length; const list=document.getElementById('demandList'); if(!data.length){ list.innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8">No demands</div>'; return; } list.innerHTML=data.map(d=>`<div class="card ${selectedDemand?._id===d._id?'selected':''}" onclick="selectDemand('${d._id}')"><div style="display:flex;justify-content:space-between"><b>${d.productName}</b><span class="badge badge-${d.priority}">${d.priority.toUpperCase()}</span></div><small style="color:#64748b">Area: ${d.areaName} | Qty: ${d.quantity} | Cat: ${d.productCategory||''}</small><br><small>${d.notes||''}</small><br><small style="color:#94a3b8">${new Date(d.createdAt).toLocaleString()}</small><div style="margin-top:6px"><span class="badge" style="background:#f1f5f9">${d.status.toUpperCase()}</span></div></div>`).join(''); window._demandData=data; }
function selectPool(id){ selectedPool = window._poolData.find(p=>p._id===id); document.getElementById('selectedProduct').innerHTML = `<b>Product:</b> ${selectedPool.name}<br><small>Base ₹${selectedPool.basePrice} | Suggested ₹${selectedPool.suggestedPrice||'auto'}<br>PM: ${selectedPool.productManagerId?.name} (${selectedPool.productManagerId?.phone})</small>`; document.getElementById('finalArea').value = selectedPool.areaTags?.[0]||''; document.getElementById('finalPrice').value = selectedPool.finalPrice || selectedPool.suggestedPrice || Math.round(selectedPool.basePrice*1.25); document.getElementById('selectedInfo').textContent = `${selectedPool.name} selected`; loadPool(); }
function selectDemand(id){ selectedDemand = window._demandData.find(d=>d._id===id); document.getElementById('selectedDemand').innerHTML = `<b>Demand:</b> ${selectedDemand.productName} (${selectedDemand.areaName})<br><small>Qty ${selectedDemand.quantity} | ${selectedDemand.notes||''}</small>`; document.getElementById('finalArea').value = selectedDemand.areaName; loadDemands(); }
async function assign(){ if(!selectedPool){ document.getElementById('assignMsg').textContent='Select product first'; document.getElementById('assignMsg').style.color='red'; return; } const areaName=document.getElementById('finalArea').value.trim(); const shopType=document.getElementById('finalShopType').value.trim()||'kirana'; const finalPrice=Number(document.getElementById('finalPrice').value); if(!areaName||!finalPrice){ document.getElementById('assignMsg').textContent='Area and Final Price required'; document.getElementById('assignMsg').style.color='red'; return; } const body={ productPoolId:selectedPool._id, executiveId:execId||undefined, areaManagerId:selectedDemand?.areaManagerId, areaName, shopType, finalPrice, commission:{ pmPercent:Number(document.getElementById('pmPercent').value)||70, executivePercent:Number(document.getElementById('execPercent').value)||5, adminPercent:Number(document.getElementById('adminPercent').value)||5, shopPercent:Number(document.getElementById('shopPercent').value)||20 } }; document.getElementById('assignMsg').textContent='Assigning...'; const res=await fetch('/api/executive/assign',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json()); if(res.success){ document.getElementById('assignMsg').textContent='SUCCESS! Product live in shops'; document.getElementById('assignMsg').style.color='green'; if(selectedDemand){ await fetch(`/api/area-demand/fulfill/${selectedDemand._id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({fulfilledBy:selectedPool._id,fulfilledByExecutive:execId})}); } selectedPool=null; selectedDemand=null; document.getElementById('selectedProduct').innerHTML='Select a product from left'; document.getElementById('selectedDemand').innerHTML='Select a demand from middle (optional)'; loadAll(); } else{ document.getElementById('assignMsg').textContent='Error: '+(res.error||'failed'); document.getElementById('assignMsg').style.color='red'; } }
function loadAll(){ loadPool(); loadDemands(); loadExec(); }
document.getElementById('poolStatus').onchange=loadPool; document.getElementById('demandStatus').onchange=loadDemands; document.getElementById('poolSearch').oninput=loadPool; document.getElementById('assignBtn').onclick=assign; loadAll();
</script></body></html>
