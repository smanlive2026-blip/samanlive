<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Library - SAMANLIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="library.css">
</head>
<body>
    <div class="lib-wrapper">
        <div class="lib-header">
            <div class="header-left">
                <h1><i class="fa fa-book-open"></i> Product Library</h1>
                <span class="total-count" id="totalCount">0 Products</span>
            </div>
            <div class="header-right">
                <div class="search-box">
                    <i class="fa fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search 1 Lakh+ Products...">
                </div>
                <button class="btn-add" onclick="openAddProductModal()">
                    <i class="fa fa-plus"></i> Add Product
                </button>
            </div>
        </div>

        <div class="lib-body">
            <div class="category-sidebar">
                <h3><i class="fa fa-layer-group"></i> Categories</h3>
                <div id="categoryList"></div>
            </div>

            <div class="product-area">
                <div class="product-grid" id="productGrid"><div class="loader">Loading...</div></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
    </div>

    <div id="addProductModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h2><i class="fa fa-plus-circle"></i> Add New Product</h2>
                <button onclick="closeAddProductModal()">×</button>
            </div>
            <div class="modal-body">
                <form id="addProductForm">
                    <div class="form-group"><label>Category *</label><select id="prodCategory" required></select></div>
                    <div class="form-group"><label>Product Name *</label><input type="text" id="prodName" required></div>
                    <div class="form-group"><label>Brand</label><input type="text" id="prodBrand"></div>
                    <div class="form-group"><label>Upload Photos *</label><input type="file" id="prodPhotos" multiple accept="image/*" required></div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeAddProductModal()">Cancel</button>
                <button class="btn-save" onclick="saveProduct()">Save Product</button>
            </div>
        </div>
    </div>
    <script src="library.js"></script>
</body>
</html>
