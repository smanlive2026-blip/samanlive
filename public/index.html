<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMANLIVE</title>
    <link rel="stylesheet" href="/assets/css/main.css?v=5">
    <script src="/assets/js/shop-template-map.js"></script>
</head>
<body>
    <div class="video-bg"></div>
    <div class="video-overlay"></div>

    <!-- 1. TOP HEADER: LOGO + SEARCH + SCANNER -->
    <header class="top-header">
        <img id="headerLogoImg" src="/assets/images/samanlive-logo.png" alt="Logo" class="header-logo">
        
        <div class="search-box-modern">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search products, shops...">
            <button class="search-btn-modern" onclick="performSearch()">→</button>
            <button class="scanner-btn-inline" onclick="openQRScanner()">📷</button>
        </div>
    </header>

    <!-- 2. HEADER ROW: ADMIN BANNER -->
    <header class="header-banner" id="mainHeaderBanner">
        <img id="headerBannerImg" src="" alt="SamanLive Banner">
        <div class="banner-overlay"></div>
    </header>

    <main class="container">
        <!-- 3. CATEGORY ROW -->
        <section class="category-row">
            <div class="category-chips" id="categoryChips"></div>
        </section>

        <!-- 4. HISTORY ROW -->
        <section class="history-section">
            <h3>History</h3>
            <div class="history-scroll" id="historyProducts"></div>
        </section>

        <!-- 5. ADMIN ADVERTISEMENT ROW -->
        <section class="ad-product-section">
            <h3>Advertisement</h3>
            <div class="ad-product-scroll" id="adminAdContainer"></div>
        </section>

        <!-- 6. NEARBY PRODUCT -->
        <section class="nearby-product-section">
            <h3>Nearby Product</h3>
            <div class="nearby-product-list" id="nearbyProductsRepeat"></div>
        </section>
    </main>

    <!-- 5 BUTTON BOTTOM NAV -->
    <footer class="bottom-nav">
        <button class="nav-btn" onclick="goToProfilePage()">
            <img id="navProfilePic" src="/assets/images/samanlive-logo.png" class="nav-avatar">
            <span>Profile</span>
        </button>
        <button class="nav-btn" onclick="goToDelivery()">
            <span class="nav-icon">🚚</span>
            <span>Delivery</span>
        </button>
        <button class="nav-btn nav-center" onclick="window.location.href='/nearby-shops.html'">
            <div class="nav-center-hex">Local<br>Market</div>
        </button>
        <button class="nav-btn" onclick="scrollToServices()">
            <span class="nav-icon">🛍️</span>
            <span>Service</span>
        </button>
        <button class="nav-btn" onclick="trackChild()">
            <span class="nav-icon">📍</span>
            <span>Track</span>
        </button>
    </footer>

    <!-- PURANA CODE HIDE -->
    <div style="display:none">
        <div id="shopsContent"></div>
        <div id="topProductsContent"></div>
        <div id="serviceGrid"></div>
        <div id="topAdsContainer"></div>
        <div id="campaignContainer"></div>
        <div id="videosContent"></div>
    </div>

    <footer class="footer" id="dynamicFooter">
        <div class="footer-container">
            <div class="footer-col">
                <h3 class="footer-logo" id="footerLogo">SAMAN LIVE</h3>
                <p id="footerAbout">Best deals platform in your city</p>
            </div>
            <div class="footer-col">
                <h4>Quick Links</h4>
                <ul id="footerLinksList"></ul>
            </div>
            <div class="footer-col">
                <h4>Follow Us</h4>
                <div class="social-links" id="footerSocial"></div>
            </div>
        </div>
        <div class="footer-bottom">
            <p id="footerText">© 2026 SAMAN LIVE. All rights reserved.</p>
        </div>
    </footer>

    <script src="/assets/js/product-core.js"></script>  
    <script src="/assets/js/app.js?v=5"></script>
</body>
</html>
