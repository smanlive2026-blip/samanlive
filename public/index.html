<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMANLIVE</title>
    <link rel="stylesheet" href="/assets/css/main.css?v=4">
    <script src="/assets/js/shop-template-map.js"></script>
</head>
<body>
    <div class="video-bg"></div>
    <div class="video-overlay"></div>

    <!-- 1. HEADER ROW: LOGO + LOCATION -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <img id="headerLogo" src="/assets/images/samanlive-logo.png" class="logo-img-fix">
                <span class="logo-text">SAMAN LIVE</span>
            </div>
            <div class="location-display">📍 <span id="userCity">Detecting...</span></div>
        </div>
    </header>

    <!-- 2. SEARCH ROW: SEARCH + SCANNER -->
    <div class="search-row">
        <div class="search-box-modern">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="Search products, shops...">
            <button class="search-btn-modern" onclick="performSearch()">→</button>
        </div>
        <button class="scanner-btn-header" onclick="openQRScanner()">[ ]</button>
    </div>

    <main class="container">
        <!-- 3. CATEGORY ROW: SABHI SHOP TYPE 1 2 3 4 5 6 7 8 9 -->
        <section class="category-row">
            <div class="category-chips" id="categoryChips"></div>
        </section>

        <!-- 4. HISTORY ROW: LAST DEKHE HUE PRODUCT -->
        <section class="history-section">
            <h3>History</h3>
            <div class="history-scroll" id="historyProducts"></div>
        </section>

        <!-- 1. ADMIN ADVERTISEMENT ROW: ADMIN CONTROL -->
        <section class="ad-product-section">
            <h3>Advertisement</h3>
            <div class="ad-product-scroll" id="adminAdContainer"></div>
        </section>

        <!-- 2. NEARBY PRODUCT: JYADA SEARCH WALE - 10 BAAR REPEAT -->
        <section class="nearby-product-section">
            <h3>Nearby Product</h3>
            <div class="nearby-product-list" id="nearbyProductsRepeat"></div>
        </section>
    </main>

    <!-- 5 BUTTON BOTTOM NAV -->
    <footer class="bottom-nav">
        <button class="nav-btn" onclick="goToProfilePage()">
            <img id="navProfilePic" src="/assets/images/samanlive-logo.png" class="nav-avatar">
            <span>Profile</span>
        </button>
        <button class="nav-btn" onclick="goToDelivery()">
            <span>🚚</span>
            <span>Delivery</span>
        </button>
        <button class="nav-btn nav-center" onclick="scrollToNearbyShops()">
            <div class="nav-center-hex">Local<br>Market</div>
        </button>
        <button class="nav-btn" onclick="scrollToServices()">
            <span>🛍️</span>
            <span>Service</span>
        </button>
        <button class="nav-btn" onclick="trackChild()">
            <span>📍</span>
            <span>Track</span>
        </button>
    </footer>

    <!-- PURANA CODE HIDE - FUNCTION NA TOOTE -->
    <div style="display:none">
        <div id="shopsContent"></div>
        <div id="topProductsContent"></div>
        <div id="serviceGrid"></div>
        <div id="topAdsContainer"></div>
        <div id="campaignContainer"></div>
        <div id="videosContent"></div>
    </div>

    <script src="/assets/js/app.js?v=4"></script>
</body>
</html>
