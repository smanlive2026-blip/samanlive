<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f8; }
       .header { background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .tabs { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .tab { background: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
       .tab.active { background: #ec4899; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #ec4899; }
       .btn-buy { background: #ec4899; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin-top: 30px; text-align: center; border: 2px dashed #ec4899; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-flower"></i> <span id="shopName">Bloom Flowers</span></h1>
        <p>Fresh Flowers | Bouquets | Garland | Wedding Decoration | Same Day Delivery</p>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="filter('All')">All 60+</div>
            <div class="tab" onclick="filter('Loose')">Loose 12</div>
            <div class="tab" onclick="filter('Bouquet')">Bouquet 10</div>
            <div class="tab" onclick="filter('Garland')">Garland 8</div>
            <div class="tab" onclick="filter('Pooja')">Pooja 10</div>
            <div class="tab" onclick="filter('Wedding')">Wedding 10</div>
            <div class="tab" onclick="filter('Gift')">Gift 10</div>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="offer-box">
            <h3><i class="fa fa-heart"></i> Special Services</h3>
            <p style="margin-top:10px;">Same Day Delivery | Wedding Decoration | Car Decoration | 24x7 Service</p>
        </div>
    </div>

    <script>
        const products = [
            // LOOSE FLOWERS - 12
            {name: "Red Rose", price: 20, cat: "Loose", unit: "10 pcs", icon: "🌹"}, 
            {name: "White Rose", price: 25, cat: "Loose", unit: "10 pcs", icon: "🌹"},
            {name: "Marigold", price: 15, cat: "Loose", unit: "100 gm", icon: "🌼"},
            {name: "Jasmine", price: 30, cat: "Loose", unit: "100 gm", icon: "🌸"},
            {name: "Tulip", price: 40, cat: "Loose", unit: "5 pcs", icon: "🌷"},
            {name: "Sunflower", price: 35, cat: "Loose", unit: "5 pcs", icon: "🌻"},
            {name: "Lily", price: 30, cat: "Loose", unit: "5 pcs", icon: "🌸"},
            {name: "Orchid", price: 50, cat: "Loose", unit: "5 pcs", icon: "🌸"},
            {name: "Carnation", price: 25, cat: "Loose", unit: "10 pcs", icon: "🌸"},
            {name: "Daisy", price: 20, cat: "Loose", unit: "10 pcs", icon: "🌼"},
            {name: "Gladiolus", price: 30, cat: "Loose", unit: "5 pcs", icon: "🌸"},
            {name: "Gerbera", price: 25, cat: "Loose", unit: "5 pcs", icon: "🌼"},
            
            // BOUQUET - 10
            {name: "Rose Bouquet Small", price: 300, cat: "Bouquet", unit: "1 pcs", icon: "💐"}, 
            {name: "Rose Bouquet Large", price: 600, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Mixed Bouquet", price: 500, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Tulip Bouquet", price: 800, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Sunflower Bouquet", price: 700, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Lily Bouquet", price: 650, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Birthday Bouquet", price: 400, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Anniversary Bouquet", price: 900, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Valentine Bouquet", price: 1200, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            {name: "Premium Bouquet", price: 1500, cat: "Bouquet", unit: "1 pcs", icon: "💐"},
            
            // GARLAND - 8
            {name: "Marigold Garland", price: 100, cat: "Garland", unit: "1 mtr", icon: "🎀"}, 
            {name: "Rose Garland", price: 200, cat: "Garland", unit: "1 mtr", icon: "🎀"},
            {name: "Jasmine Garland", price: 250, cat: "Garland", unit: "1 mtr", icon: "🎀"},
            {name: "Mixed Garland", price: 150, cat: "Garland", unit: "1 mtr", icon: "🎀"},
            {name: "Wedding Garland", price: 500, cat: "Garland", unit: "1 set", icon: "🎀"},
            {name: "Temple Garland", price: 120, cat: "Garland", unit: "1 mtr", icon: "🎀"},
            {name: "Car Garland", price: 300, cat: "Garland", unit: "1 set", icon: "🎀"},
            {name: "Stage Decoration Garland", price: 800, cat: "Garland", unit: "10 mtr", icon: "🎀"},
            
            // POOJA FLOWERS - 10
            {name: "Pooja Thali Set", price: 150, cat: "Pooja", unit: "1 set", icon: "🙏"}, 
            {name: "Marigold for Pooja", price: 50, cat: "Pooja", unit: "250 gm", icon: "🙏"},
            {name: "Rose for Pooja", price: 80, cat: "Pooja", unit: "100 gm", icon: "🙏"},
            {name: "Tulsi Mala", price: 100, cat: "Pooja", unit: "1 pcs", icon: "🙏"},
            {name: "Lotus Flower", price: 40, cat: "Pooja", unit: "5 pcs", icon: "🙏"},
            {name: "Hibiscus", price: 30, cat: "Pooja", unit: "10 pcs", icon: "🙏"},
            {name: "Champa Flower", price: 60, cat: "Pooja", unit: "100 gm", icon: "🙏"},
            {name: "Bela Flower", price: 70, cat: "Pooja", unit: "100 gm", icon: "🙏"},
            {name: "Pooja Combo", price: 200, cat: "Pooja", unit: "1 set", icon: "🙏"},
            {name: "Temple Decoration", price: 1000, cat: "Pooja", unit: "1 set", icon: "🙏"},
            
            // WEDDING - 10
            {name: "Wedding Stage Decor", price: 15000, cat: "Wedding", unit: "1 set", icon: "💒"}, 
            {name: "Mandap Decoration", price: 12000, cat: "Wedding", unit: "1 set", icon: "💒"},
            {name: "Car Decoration", price: 2500, cat: "Wedding", unit: "1 car", icon: "💒"},
            {name: "Room Decoration", price: 5000, cat: "Wedding", unit: "1 room", icon: "💒"},
            {name: "Bride Bouquet", price: 2000, cat: "Wedding", unit: "1 pcs", icon: "💒"},
            {name: "Table Decoration", price: 800, cat: "Wedding", unit: "1 table", icon: "💒"},
            {name: "Entry Gate Decor", price: 10000, cat: "Wedding", unit: "1 gate", icon: "💒"},
            {name: "Flower Chadar", price: 3000, cat: "Wedding", unit: "1 pcs", icon: "💒"},
            {name: "Wedding Combo", price: 25000, cat: "Wedding", unit: "full", icon: "💒"},
            {name: "Photography Backdrop", price: 8000, cat: "Wedding", unit: "1 set", icon: "💒"},
            
            // GIFT - 10
            {name: "Flower Basket", price: 600, cat: "Gift", unit: "1 pcs", icon: "🎁"}, 
            {name: "Flower Box", price: 800, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Congratulations Bouquet", price: 700, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Get Well Bouquet", price: 500, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Thank You Bouquet", price: 450, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Corporate Gift", price: 1000, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Fruit + Flower Basket", price: 1200, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Chocolate + Flower", price: 900, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Teddy + Flower", price: 1100, cat: "Gift", unit: "1 pcs", icon: "🎁"},
            {name: "Premium Gift Hamper", price: 2000, cat: "Gift", unit: "1 pcs", icon: "🎁"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:40px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.unit}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order placed! Same day delivery available')"><i class="fa fa-cart-plus"></i> Order Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
