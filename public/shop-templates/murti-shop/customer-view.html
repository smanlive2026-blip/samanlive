<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murti Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fff7ed; }
       .header { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #f97316; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #f97316; }
       .btn-buy { background: #f97316; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin-top: 30px; text-align: center; border: 2px dashed #f97316; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-om"></i> <span id="shopName">Shri Murti Bhandar</span></h1>
        <p>Marble, Brass, Fiber Murtis | Custom Order | Home Delivery | Pooja Samagri</p>
    </div>

    <div class="container">
        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Festival Offer</h3>
            <p>Free Pooja Kit on Purchase Above ₹5000 | Custom Name Engraving</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Ganesh')">Ganesh</div>
            <div class="filter" onclick="filter('Krishna')">Krishna</div>
            <div class="filter" onclick="filter('Laxmi')">Laxmi</div>
            <div class="filter" onclick="filter('Shiv')">Shiv</div>
            <div class="filter" onclick="filter('Hanuman')">Hanuman</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Ganesh Ji Marble", price: 4500, height: "18 inch", cat: "Ganesh", material: "Marble", icon: "🛕"}, 
            {name: "Krishna Radha Set", price: 6500, height: "24 inch", cat: "Krishna", material: "Fiber", icon: "🛕"},
            {name: "Laxmi Ganesh", price: 3200, height: "12 inch", cat: "Laxmi", material: "Brass", icon: "🛕"},
            {name: "Shivling", price: 2800, height: "15 inch", cat: "Shiv", material: "Marble", icon: "🛕"},
            {name: "Hanuman Ji", price: 3800, height: "20 inch", cat: "Hanuman", material: "Fiber", icon: "🛕"},
            {name: "Durga Mata", price: 8500, height: "30 inch", cat: "Durga", material: "Fiber", icon: "🛕"},
            {name: "Sai Baba", price: 4200, height: "16 inch", cat: "Sai", material: "Marble", icon: "🛕"},
            {name: "Buddha Statue", price: 5500, height: "22 inch", cat: "Buddha", material: "Brass", icon: "🛕"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.material} | ${p.height}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order Placed!')"><i class="fa fa-phone"></i> Order Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
