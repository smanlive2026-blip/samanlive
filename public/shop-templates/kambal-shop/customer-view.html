<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kambal Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0f9ff; }
       .header { background: linear-gradient(135deg, #0ea5e9 0%, #0284c7 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #0ea5e9; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #0ea5e9; }
       .btn-buy { background: #0ea5e9; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin: 30px 0; text-align: center; border: 2px dashed #0ea5e9; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-cloud"></i> <span id="shopName">Shree Kambal Bhandar</span></h1>
        <p>Winter Kambal | AC Blanket | Rajai | Quilt | Wholesale & Retail</p>
    </div>

    <div class="container">
        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Winter Offer</h3>
            <p>Buy 2 Get 10% Off | Free Delivery Above ₹2000 | Wholesale Price Available</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Winter')">Winter</div>
            <div class="filter" onclick="filter('AC')">AC</div>
            <div class="filter" onclick="filter('Fleece')">Fleece</div>
            <div class="filter" onclick="filter('Rajai')">Rajai</div>
            <div class="filter" onclick="filter('Quilt')">Quilt</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Woolen Winter Kambal", price: 1200, size: "90x100 inch", cat: "Winter", brand: "Bombay Dyeing", icon: "🧶"}, 
            {name: "AC Blanket Single", price: 800, size: "60x90 inch", cat: "AC", brand: "Raymond", icon: "🧶"},
            {name: "Fleece Blanket Double", price: 1500, size: "90x100 inch", cat: "Fleece", brand: "Trident", icon: "🧶"},
            {name: "Cotton Rajai", price: 2200, size: "90x100 inch", cat: "Rajai", brand: "Handmade", icon: "🧶"},
            {name: "Designer Quilt", price: 3500, size: "90x100 inch", cat: "Quilt", brand: "Portico", icon: "🧶"},
            {name: "Travel Blanket", price: 600, size: "50x70 inch", cat: "Travel", brand: "Local", icon: "🧶"},
            {name: "Baby Blanket", price: 450, size: "40x60 inch", cat: "Baby", brand: "SoftTouch", icon: "🧶"},
            {name: "Wholesale Pack 10pc", price: 10000, size: "Mix Size", cat: "Wholesale", brand: "Bulk", icon: "🧶"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.brand} | ${p.size}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order Placed!')"><i class="fa fa-phone"></i> Order Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
