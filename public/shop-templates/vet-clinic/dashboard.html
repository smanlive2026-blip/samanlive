<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vet Clinic Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #10b981 0%, #059669 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1600px; margin: 0 auto; }
        
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
       .header h1 { font-size: 28px; color: #065f46; display: flex; align-items: center; gap: 12px; }
        
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #10b981; }
       .stat-card .icon { font-size: 32px; color: #10b981; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
        
       .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
       .btn { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        
       .patient-card { border: 2px solid #d1fae5; border-radius: 16px; padding: 18px; margin-bottom: 15px; }
       .animal-badge { background: #d1fae5; color: #065f46; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; margin-right: 5px; }
       .status { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
       .status.pending { background: #fef3c7; color: #92400e; }
       .status.done { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-house-medical"></i> <span id="shopName">Shree Pashu Chikitsalaya</span></h1>
                <div style="color:#64748b; font-size:14px;">Clinic ID: <span id="shopIdDisplay"></span></div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" id="newCaseBtn"><i class="fa fa-plus"></i> New Case</button>
                <button class="btn" id="homeVisitBtn"><i class="fa fa-truck-medical"></i> Home Visit</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-users"></i></div><h3>Today Patients</h3><div class="value" id="patients">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-stethoscope"></i></div><h3>Treatments</h3><div class="value" id="treatments">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Today Income</h3><div class="value">₹<span id="revenue">0</span></div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-syringe"></i></div><h3>Vaccinations</h3><div class="value" id="vaccine">0</div></div>
        </div>

        <div class="content-grid">
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-list"></i> Today's Appointments</h2>
                    <div id="appointmentList">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-file-medical"></i> Treatment Records</h2>
                    <div id="treatmentList">Loading...</div>
                </div>
            </div>
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-star"></i> Services</h2>
                    <div id="services">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-bell"></i> Follow-up Due</h2>
                    <div id="followup">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
