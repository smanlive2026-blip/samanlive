<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saree Shop Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f472b6 0%, #db2777 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1700px; margin: 0 auto; }
        
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
       .header h1 { font-size: 28px; color: #831843; display: flex; align-items: center; gap: 12px; }
        
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #f472b6; }
       .stat-card .icon { font-size: 32px; color: #f472b6; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
        
       .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
       .btn { background: linear-gradient(135deg, #f472b6 0%, #db2777 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        
       .saree-row { display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #fce7f3; }
       .type-badge { background: #fce7f3; color: #831843; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; margin-right: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-vest"></i> <span id="shopName">Rani Saree Mahal</span></h1>
                <div style="color:#64748b; font-size:14px;">Shop ID: <span id="shopIdDisplay"></span></div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" id="addSareeBtn"><i class="fa fa-plus"></i> Add Saree</button>
                <button class="btn" id="newBillBtn"><i class="fa fa-receipt"></i> New Bill</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-boxes"></i></div><h3>Total Sarees</h3><div class="value" id="products">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-users"></i></div><h3>Today Customers</h3><div class="value" id="customers">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Today Sale</h3><div class="value">₹<span id="revenue">0</span></div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-heart"></i></div><h3>Bridal Sold</h3><div class="value" id="bridal">0</div></div>
        </div>

        <div class="content-grid">
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-list"></i> Inventory</h2>
                    <div id="inventoryList">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-receipt"></i> Recent Bills</h2>
                    <div id="billsList">Loading...</div>
                </div>
            </div>
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-star"></i> Categories</h2>
                    <div id="categories">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-scissors"></i> Tailoring Orders</h2>
                    <div id="tailoring">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
