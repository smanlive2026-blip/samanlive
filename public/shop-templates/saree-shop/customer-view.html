<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saree Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f8; }
       .header { background: linear-gradient(135deg, #f472b6 0%, #db2777 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #f472b6; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #f472b6; }
       .btn-buy { background: #f472b6; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin: 30px 0; text-align: center; border: 2px dashed #f472b6; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-vest"></i> <span id="shopName">Rani Saree Mahal</span></h1>
        <p>Bridal, Designer, Silk, Cotton | Blouse Stitching | Fall Pico | Gift Pack</p>
    </div>

    <div class="container">
        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Shaadi Special Offer</h3>
            <p>Buy 2 Saree Get 1 Blouse Free | Free Fall & Pico | Bridal Combo 20% Off</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Bridal')">Bridal</div>
            <div class="filter" onclick="filter('Designer')">Designer</div>
            <div class="filter" onclick="filter('Silk')">Silk</div>
            <div class="filter" onclick="filter('Cotton')">Cotton</div>
            <div class="filter" onclick="filter('Party')">Party Wear</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Banarasi Bridal Saree", price: 12000, fabric: "Silk", cat: "Bridal", work: "Zari Work", brand: "Varanasi", icon: "👗"}, 
            {name: "Cotton Daily Saree", price: 800, fabric: "Cotton", cat: "Cotton", work: "Print", brand: "Local", icon: "👗"},
            {name: "Designer Party Wear", price: 4500, fabric: "Georgette", cat: "Designer", work: "Stone Work", brand: "Mumbai", icon: "👗"},
            {name: "Kanchipuram Silk", price: 3500, fabric: "Art Silk", cat: "Silk", work: "Border", brand: "South", icon: "👗"},
            {name: "Chiffon Saree", price: 1500, fabric: "Chiffon", cat: "Party", work: "Plain", brand: "Jaipur", icon: "👗"},
            {name: "Bandhej Saree", price: 2200, fabric: "Georgette", cat: "Designer", work: "Bandhej", brand: "Gujarat", icon: "👗"},
            {name: "Blouse Piece", price: 400, fabric: "Silk", cat: "Blouse", work: "Plain", brand: "Matching", icon: "👗"},
            {name: "Bridal Combo 3pc", price: 25000, fabric: "Mix", cat: "Bridal", work: "Full Set", brand: "Combo", icon: "🎁"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.brand} | ${p.fabric} | ${p.work}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order Placed!')"><i class="fa fa-phone"></i> Order Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
