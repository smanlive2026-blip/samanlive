<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursery Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0fdf4; }
       .header { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .tabs { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .tab { background: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
       .tab.active { background: #22c55e; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #22c55e; }
       .btn-buy { background: #22c55e; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin-top: 30px; text-align: center; border: 2px dashed #22c55e; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-seedling"></i> <span id="shopName">Hariyali Nursery</span></h1>
        <p>Indoor & Outdoor Plants | Pots | Fertilizer | Free Planting Service</p>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="filter('All')">All 75+</div>
            <div class="tab" onclick="filter('Indoor')">Indoor 12</div>
            <div class="tab" onclick="filter('Outdoor')">Outdoor 10</div>
            <div class="tab" onclick="filter('Flowering')">Flowering 10</div>
            <div class="tab" onclick="filter('Fruit')">Fruit 8</div>
            <div class="tab" onclick="filter('Medicinal')">Medicinal 8</div>
            <div class="tab" onclick="filter('Pot')">Pots 10</div>
            <div class="tab" onclick="filter('Garden')">Garden 17</div>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Special Services</h3>
            <p style="margin-top:10px;">Free Home Delivery | Free Planting | Garden Setup | Bulk Order Discount</p>
        </div>
    </div>

            {name: "Philodendron", price: 280, cat: "Indoor", icon: "🌿"},

            {name: "Papaya Plant", price: 180, cat: "Fruit", icon: "🥭"},
            {name: "Pomegranate", price: 300, cat: "Fruit", icon: "🍎"},
            {name: "Banana Plant", price: 220, cat: "Fruit", icon: "🍌"},

            {name: "Plant Support Stick", price: 50, cat: "Garden", icon: "📏"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:40px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.cat}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Added to cart! Free planting available')"><i class="fa fa-cart-plus"></i> Buy Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
