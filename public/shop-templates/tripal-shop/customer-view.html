<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tripal Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fffbeb; }
       .header { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #f59e0b; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #f59e0b; }
       .btn-buy { background: #f59e0b; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-warehouse"></i> <span id="shopName">Shree Tripal Bhandar</span></h1>
        <p>Truck Cover, Kheti, Mandi, Construction | 100% Waterproof | UV Protected</p>
    </div>

    <div class="container">
        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Truck')">Truck</div>
            <div class="filter" onclick="filter('Kheti')">Kheti</div>
            <div class="filter" onclick="filter('Mandi')">Mandi</div>
            <div class="filter" onclick="filter('Roof')">Roof</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "HDPE Truck Tripal", price: 1800, size: "20x30 ft", gsm: "120 GSM", cat: "Truck", icon: "🚛"}, 
            {name: "LDPE Kheti Tripal", price: 1200, size: "15x20 ft", gsm: "90 GSM", cat: "Kheti", icon: "🌾"},
            {name: "Canvas Mandi Tripal", price: 3500, size: "25x40 ft", gsm: "200 GSM", cat: "Mandi", icon: "🏪"},
            {name: "UV Roof Tripal", price: 2200, size: "18x24 ft", gsm: "140 GSM", cat: "Roof", icon: "🏠"},
            {name: "Truck Body Cover", price: 4500, size: "32x8 ft", gsm: "160 GSM", cat: "Truck", icon: "🚛"},
            {name: "Construction Tripal", price: 2800, size: "30x30 ft", gsm: "150 GSM", cat: "Construction", icon: "🏗️"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.size} | ${p.gsm}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order Placed!')"><i class="fa fa-phone"></i> Call Order</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
