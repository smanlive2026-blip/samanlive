<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painting Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #eff6ff; }
       .header { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1200px; margin: -30px auto 40px; padding: 0 20px; }
        
       .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 30px 0; }
       .service-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .service-price { font-size: 20px; font-weight: 800; color: #3b82f6; }
       .btn-book { background: #3b82f6; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .calculator { background: white; padding: 30px; border-radius: 20px; margin: 30px 0; }
       .input-group { margin-bottom: 15px; }
       .input-group label { display: block; margin-bottom: 5px; font-weight: 600; }
       .input-group input, .input-group select { width: 100%; padding: 10px; border: 2px solid #dbeafe; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-paint-roller"></i> <span id="shopName">ColorPro Painting Service</span></h1>
        <p>Professional Painters | 1 Year Warranty | Asian Paints, Berger</p>
    </div>

    <div class="container">
        <div class="calculator">
            <h2><i class="fa fa-calculator"></i> Get Instant Estimate</h2>
            <div class="input-group">
                <label>Area in Sqft</label>
                <input type="number" id="area" placeholder="Ex: 1000">
            </div>
            <div class="input-group">
                <label>Service Type</label>
                <select id="serviceType">
                    <option>Interior Painting</option>
                    <option>Exterior Painting</option>
                    <option>Texture Work</option>
                </select>
            </div>
            <button class="btn-book" onclick="calculate()">Calculate Price</button>
            <h3 id="result" style="margin-top:15px; color:#3b82f6;"></h3>
        </div>

        <h2 style="text-align:center; margin:20px 0;">Our Services</h2>
        <div class="service-grid" id="serviceGrid"></div>
    </div>

    <script>
        const services = [
            {name: "Interior Painting", price: "₹18/sqft", desc: "2 Coat + Putty + Primer", icon: "🏠"}, 
            {name: "Exterior Painting", price: "₹22/sqft", desc: "Weatherproof Paint", icon: "🏢"},
            {name: "Texture Design", price: "₹45/sqft", desc: "Royal, Sand, Marble", icon: "🎨"},
            {name: "Waterproofing", price: "₹35/sqft", desc: "Roof + Bathroom", icon: "💧"},
            {name: "Wall Putty", price: "₹12/sqft", desc: "JK, Birla Putty", icon: "🧱"},
            {name: "Office Painting", price: "₹16/sqft", desc: "Quick 48hr Service", icon: "🏢"}
        ];

        document.getElementById('serviceGrid').innerHTML = services.map(s => `
            <div class="service-card">
                <div style="font-size:40px; margin-bottom:10px;">${s.icon}</div>
                <h3>${s.name}</h3>
                <p style="color:#64748b; font-size:14px; margin:8px 0;">${s.desc}</p>
                <div class="service-price">${s.price}</div>
                <button class="btn-book" onclick="alert('Booking Request Sent!')"><i class="fa fa-phone"></i> Book Now</button>
            </div>
        `).join('');

        function calculate() {
            const area = document.getElementById('area').value;
            const type = document.getElementById('serviceType').value;
            let rate = type==='Interior Painting'?18 : type==='Exterior Painting'?22 : 45;
            const total = area * rate;
            document.getElementById('result').innerText = `Estimated Cost: ₹${total}`;
        }
    </script>
</body>
</html>
