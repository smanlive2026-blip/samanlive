<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Footwear Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f5f3ff; }
       .header { background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #8b5cf6; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #8b5cf6; }
       .old-price { text-decoration: line-through; color: #94a3b8; font-size: 14px; }
       .btn-buy { background: #8b5cf6; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-banner { background: white; padding: 25px; border-radius: 20px; margin: 20px 0; text-align: center; border: 2px dashed #8b5cf6; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-shoe-prints"></i> <span id="shopName">StepUp Footwear</span></h1>
        <p>Latest Collection | All Sizes | Free Exchange | 100% Original</p>
    </div>

    <div class="container">
        <div class="offer-banner">
            <h3><i class="fa fa-gift"></i> Festive Offer</h3>
            <p>Buy 2 Get 10% OFF | Buy 3 Get 20% OFF | Free Delivery Above ₹999</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Sports')">Sports</div>
            <div class="filter" onclick="filter('Formal')">Formal</div>
            <div class="filter" onclick="filter('Casual')">Casual</div>
            <div class="filter" onclick="filter('Ladies')">Ladies</div>
            <div class="filter" onclick="filter('Kids')">Kids</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Nike Air Running Shoe", price: 1299, old: 1599, cat: "Sports", icon: "👟"}, 
            {name: "Bata Formal Leather", price: 1899, old: 2199, cat: "Formal", icon: "👞"},
            {name: "Paragon Ladies Sandal", price: 799, old: 999, cat: "Ladies", icon: "👡"},
            {name: "Action Kids Sneaker", price: 599, old: 799, cat: "Kids", icon: "👟"},
            {name: "Woodland Casual Shoe", price: 1499, old: 1799, cat: "Casual", icon: "👟"},
            {name: "Crocs Slipper", price: 899, old: 1099, cat: "Casual", icon: "🩴"},
            {name: "Puma Sports Shoe", price: 1399, old: 1699, cat: "Sports", icon: "👟"},
            {name: "Heels for Women", price: 1099, old: 1399, cat: "Ladies", icon: "👠"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.cat}</p>
                    <div style="margin:10px 0;">
                        <span class="product-price">₹${p.price}</span>
                        <span class="old-price">₹${p.old}</span>
                    </div>
                    <button class="btn-buy" onclick="alert('Added to Cart!')"><i class="fa fa-cart-plus"></i> Add to Cart</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
