<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop View - Common World</title>
<script> 
const p = new URLSearchParams(location.search);
const shopId = p.get('shopId');
const shopType = (p.get('shopType')||localStorage.getItem('shopType')||'kirana').toLowerCase();
if(shopId && shopType){
  location.replace(`/shop-templates/${shopType}/customer-view.html${location.search}`);
} else {
  document.write('<div style="display:grid;place-items:center;height:100vh;font-family:sans-serif;text-align:center"><div><h2>Shop ID missing</h2><p>Open from My Shops</p><a href="/profile.html">Go to Profile</a></div></div>');
}
</script></head><body>Redirecting to shop...</body></html>
