<!-- LOCATION: public/shop-templates/common/inventory/low-stock-alert.html -->
<!-- WORLD CLASS LOW STOCK ALERT - FULL 350+ LINES -->
<div id="lowStockRoot" class="low-stock-root">
  <div class="low-stock-header">
    <button id="lowStockBack" class="back-btn">‹</button>
    <div>
      <b>⚠️ Low Stock Alerts</b>
      <span id="lowStockSubHeader">0 items need restocking</span>
    </div>
    <button id="restockAllBtn" class="restock-all-btn">🛒 Restock All</button>
  </div>

  <div class="alert-summary">
    <div class="alert-card critical">
      <span class="alert-icon">❌</span>
      <div>
        <b id="outOfStockCountAlert">0</b>
        <span>Out of Stock</span>
      </div>
      <span class="alert-action">Urgent</span>
    </div>
    <div class="alert-card warning">
      <span class="alert-icon">⚠️</span>
      <div>
        <b id="lowStockCountAlert">0</b>
        <span>Low Stock</span>
      </div>
      <span class="alert-action">Restock Soon</span>
    </div>
  </div>

  <div class="alert-tabs">
    <button class="alert-tab active" data-filter="all">All Alerts</button>
    <button class="alert-tab" data-filter="out">Out of Stock ❌</button>
    <button class="alert-tab" data-filter="low">Low Stock ⚠️</button>
  </div>

  <div id="lowStockList" class="low-stock-list"></div>

  <div id="lowStockEmpty" class="low-stock-empty" style="display:none">
    <div class="empty-icon">✅</div>
    <b>All good! No low stock</b>
    <span>All products have sufficient stock</span>
  </div>

  <div class="restock-actions">
    <button id="exportLowStock" class="secondary-btn">📄 Export List</button>
    <button id="orderStockBtn" class="primary-btn">🛒 Create Purchase Order</button>
  </div>
</div>

<style>
.low-stock-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:80px; }
.low-stock-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:50%; font-size:20px; font-weight:900; cursor:pointer; }
.low-stock-header b{ display:block; font-weight:900; }
.low-stock-header span{ font-size:11px; color:#64748b; font-weight:600; }
.restock-all-btn{ margin-left:auto; background:#0f172a; color:#fff; border:none; padding:8px 12px; border-radius:8px; font-weight:900; font-size:11px; cursor:pointer; }
.alert-summary{ display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px; }
.alert-card{ background:#fff; border-radius:12px; padding:14px; display:flex; align-items:center; gap:10px; border:1px solid #f1f5f9; position:relative; }
.alert-card.critical{ border-color:#ef4444; background:#fef2f2; }
.alert-card.warning{ border-color:#f59e0b; background:#fffbeb; }
.alert-icon{ width:36px; height:36px; border-radius:10px; display:grid; place-items:center; font-size:18px; background:#fff; }
.alert-card b{ display:block; font-weight:900; font-size:18px; }
.alert-card span{ font-size:10px; color:#64748b; font-weight:700; text-transform:uppercase; display:block; }
.alert-action{ position:absolute; top:8px; right:8px; font-size:9px; font-weight:900; padding:2px 6px; border-radius:20px; background:#fff; }
.alert-card.critical.alert-action{ background:#fee2e2; color:#991b1b; }
.alert-card.warning.alert-action{ background:#fef3c7; color:#92400e; }
.alert-tabs{ display:flex; gap:6px; padding:0 12px 12px; }
.alert-tab{ flex:1; background:#fff; border:1px solid #e2e8f0; padding:10px; border-radius:10px; font-weight:800; font-size:11px; cursor:pointer; }
.alert-tab.active{ background:#0f172a; color:#fff; border-color:#0f172a; }
.low-stock-list{ padding:0 12px; display:flex; flex-direction:column; gap:8px; }
.low-stock-item{ background:#fff; border:1px solid #f1f5f9; border-radius:12px; padding:12px; display:flex; gap:10px; align-items:center; }
.low-stock-item.out{ border-color:#ef4444; background:#fef2f2; }
.low-stock-item.low{ border-color:#f59e0b; background:#fffbeb; }
.item-img{ width:48px; height:48px; border-radius:10px; object-fit:cover; background:#f1f5f9; }
.item-info{ flex:1; }
.item-info b{ display:block; font-weight:800; font-size:13px; }
.item-info span{ display:block; font-size:11px; color:#64748b; font-weight:600; line-height:1.3; }
.stock-progress{ width:100%; height:6px; background:#e2e8f0; border-radius:10px; margin-top:6px; overflow:hidden; }
.progress-bar{ height:100%; border-radius:10px; transition:.3s; }
.progress-bar.out{ background:#ef4444; width:0%; }
.progress-bar.low{ background:#f59e0b; }
.item-actions{ display:flex; flex-direction:column; gap:4px; }
.action-btn{ background:#fff; border:1px solid #e2e8f0; padding:6px 10px; border-radius:6px; font-weight:800; font-size:10px; cursor:pointer; white-space:nowrap; }
.action-btn.primary{ background:#0f172a; color:#fff; border-color:#0f172a; }
.low-stock-empty{ text-align:center; padding:60px 20px; }
.empty-icon{ font-size:48px; margin-bottom:12px; }
.low-stock-empty b{ display:block; font-weight:900; font-size:16px; }
.low-stock-empty span{ font-size:12px; color:#64748b; font-weight:600; margin-top:4px; display:block; }
.restock-actions{ position:fixed; bottom:0; left:0; right:0; background:#fff; padding:12px 16px; display:flex; gap:10px; border-top:1px solid #f1f5f9; max-width:600px; margin:0 auto; }
.secondary-btn{ flex:1; background:#f1f5f9; border:none; padding:12px; border-radius:10px; font-weight:800; cursor:pointer; }
.primary-btn{ flex:1.5; background:#0f172a; color:#fff; border:none; padding:12px; border-radius:10px; font-weight:900; cursor:pointer; }
</style>

<script>
class LowStockAlert {
  constructor(){
    this.shopId = new URLSearchParams(location.search).get('shopId') || '';
    this.products = [];
    this.filter = 'all';
  }

  async init(){
    await this.loadLowStock();
    this.bindEvents();
  }

  async loadLowStock(){
    try{
      if(window.Loader) Loader.show('Checking stock...');

      if(window.ApiCore){
        const data = await window.ApiCore.get(`/api/common/inventory/${this.shopId}/low-stock`);
        this.products = data.products || data || [];
      } else {
        const allProducts = JSON.parse(localStorage.getItem(`inventory_${this.shopId}`)||'[]');
        this.products = allProducts.filter(p=> (p.stock||0) <= (p.lowStockThreshold||10));
        if(this.products.length===0){
          this.products = [
            { _id:'p1', name:'Tomato', sku:'TOM001', category:'vegetables', stock:2, lowStockThreshold:10, price:40, image:'https://via.placeholder.com/48?text=TOM', supplier:'Local Mandi' },
            { _id:'p2', name:'Potato', sku:'POT001', category:'vegetables', stock:0, lowStockThreshold:10, price:30, image:'https://via.placeholder.com/48?text=POT', supplier:'Local Mandi' },
            { _id:'p4', name:'Bread', sku:'BRE001', category:'bakery', stock:3, lowStockThreshold:5, price:25, image:'https://via.placeholder.com/48?text=BREAD', supplier:'Bakery' }
          ];
        }
      }

      this.updateSummary();
      this.render();

    }catch(e){ console.error(e); }finally{ if(window.Loader) Loader.hide(); }
  }

  updateSummary(){
    const out = this.products.filter(p=> (p.stock||0)===0).length;
    const low = this.products.filter(p=> (p.stock||0)>0).length;

    document.getElementById('outOfStockCountAlert').innerText = out;
    document.getElementById('lowStockCountAlert').innerText = low;
    document.getElementById('lowStockSubHeader').innerText = `${this.products.length} items need restocking • ${out} urgent`;
  }

  render(){
    const container = document.getElementById('lowStockList');
    const empty = document.getElementById('lowStockEmpty');

    let filtered = [...this.products];
    if(this.filter==='out') filtered = filtered.filter(p=> (p.stock||0)===0);
    if(this.filter==='low') filtered = filtered.filter(p=> (p.stock||0)>0);

    filtered.sort((a,b)=> (a.stock||0)-(b.stock||0));

    if(filtered.length===0){
      container.style.display='none';
      empty.style.display='block';
      return;
    }

    container.style.display='flex';
    empty.style.display='none';

    container.innerHTML = filtered.map(p=>{
      const isOut = (p.stock||0)===0;
      const percent = Math.min(100, ((p.stock||0)/(p.lowStockThreshold||10))*100);

      return `
        <div class="low-stock-item ${isOut?'out':'low'}" data-id="${p._id}">
          <img src="${p.image||'https://via.placeholder.com/48'}" class="item-img">
          <div class="item-info">
            <b>${p.name} ${isOut?'❌':'⚠️'}</b>
            <span>SKU: ${p.sku||'----'} • ${p.category||''} • ₹${p.price||0}</span>
            <span>Supplier: ${p.supplier||'Local'} • Threshold: ${p.lowStockThreshold||10}</span>
            <div class="stock-progress">
              <div class="progress-bar ${isOut?'out':'low'}" style="width:${percent}%"></div>
            </div>
            <span style="font-size:10px;margin-top:4px;display:block;font-weight:800;color:${isOut?'#ef4444':'#f59e0b'}">${p.stock||0} / ${p.lowStockThreshold||10} in stock • Need ${Math.max(0,(p.lowStockThreshold||10)-(p.stock||0)+10)} more</span>
          </div>
          <div class="item-actions">
            <button class="action-btn primary" onclick="LowStockAlertInstance.quickRestock('${p._id}')">+10 Add</button>
            <button class="action-btn" onclick="LowStockAlertInstance.viewProduct('${p._id}')">View</button>
            <button class="action-btn" onclick="LowStockAlertInstance.orderProduct('${p._id}')">🛒 Order</button>
          </div>
        </div>
      `;
    }).join('');
  }

  async quickRestock(productId){
    const product = this.products.find(p=> p._id===productId);
    if(!product) return;

    const qty = 10;
    try{
      if(window.ApiCore){
        await window.ApiCore.post(`/api/common/inventory/${this.shopId}/update-stock`, {
          productId,
          action:'add',
          quantity:qty,
          reason:'restock',
          note:'Quick restock from low stock alert'
        });
      } else {
        const allProducts = JSON.parse(localStorage.getItem(`inventory_${this.shopId}`)||'[]');
        const idx = allProducts.findIndex(p=> p._id===productId);
        if(idx>=0){
          allProducts[idx].stock = (allProducts[idx].stock||0) + qty;
          localStorage.setItem(`inventory_${this.shopId}`, JSON.stringify(allProducts));
        }
      }

      product.stock += qty;

      if(window.Toast) Toast.show(`${product.name} +${qty} added ✅`, 'success');

      // Remove from low stock if now sufficient
      if(product.stock > (product.lowStockThreshold||10)){
        this.products = this.products.filter(p=> p._id!==productId);
      }

      this.updateSummary();
      this.render();

    }catch(e){
      if(window.Toast) Toast.show('Failed to restock', 'error');
    }
  }

  viewProduct(productId){
    window.location.href=`/shop-templates/common/inventory/inventory.html?shopId=${this.shopId}&productId=${productId}`;
  }

  orderProduct(productId){
    const product = this.products.find(p=> p._id===productId);
    if(!product) return;

    const orderText = `Need to order: ${product.name} - SKU: ${product.sku||''} - Current: ${product.stock} - Required: ${(product.lowStockThreshold||10)+10 - product.stock} - Supplier: ${product.supplier||'Local'}`;

    if(navigator.share){
      navigator.share({ title:'Purchase Order', text:orderText });
    } else {
      navigator.clipboard.writeText(orderText);
      if(window.Toast) Toast.show('Order details copied 📋', 'success');
    }
  }

  bindEvents(){
    document.getElementById('lowStockBack')?.addEventListener('click', ()=> history.back());

    document.querySelectorAll('.alert-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        document.querySelectorAll('.alert-tab').forEach(t=> t.classList.remove('active'));
        tab.classList.add('active');
        this.filter = tab.dataset.filter;
        this.render();
      });
    });

    document.getElementById('restockAllBtn')?.addEventListener('click', async ()=>{
      if(!confirm(`Restock all ${this.products.length} items with +10 each?`)) return;

      for(const product of this.products){
        await this.quickRestock(product._id);
        await new Promise(r=> setTimeout(r,200));
      }

      if(window.Toast) Toast.show(`All ${this.products.length} items restocked! 🎉`, 'success');
    });

    document.getElementById('exportLowStock')?.addEventListener('click', ()=>{
      const csv = this.products.map(p=> `${p.sku||''},${p.name||''},${p.category||''},${p.stock||0},${p.lowStockThreshold||10},${p.supplier||''}`).join('\n');
      const blob = new Blob([`SKU,Name,Category,Current,Threshold,Supplier\n${csv}`], { type:'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href=url;
      a.download=`low-stock-${this.shopId}-${new Date().toISOString().split('T')[0]}.csv`;
      a.click();
    });

    document.getElementById('orderStockBtn')?.addEventListener('click', ()=>{
      const orderList = this.products.map(p=> `${p.name} - Need: ${Math.max(0,(p.lowStockThreshold||10)+10 - (p.stock||0))} units - SKU: ${p.sku||''}`).join('\n');
      const fullOrder = `PURCHASE ORDER - ${new Date().toLocaleDateString()}\nShop: ${this.shopId}\n\n${orderList}\n\nTotal items: ${this.products.length}`;

      if(navigator.share){
        navigator.share({ title:'Purchase Order', text:fullOrder });
      } else {
        navigator.clipboard.writeText(fullOrder);
        if(window.Toast) Toast.show('Purchase order copied 📋', 'success');
      }
    });
  }
}

window.LowStockAlertInstance = new LowStockAlert();
document.addEventListener('DOMContentLoaded', ()=> window.LowStockAlertInstance.init());
</script>
