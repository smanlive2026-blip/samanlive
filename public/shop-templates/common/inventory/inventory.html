<!-- LOCATION: public/shop-templates/common/inventory/inventory.html -->
<!-- WORLD CLASS INVENTORY MANAGEMENT - FULL 400+ LINES -->
<div id="inventoryRoot" class="inventory-root">
  <div class="inventory-header">
    <button id="inventoryBack" class="back-btn">‹</button>
    <div>
      <b>Inventory</b>
      <span id="inventorySubHeader">Total 0 items • Low stock: 0</span>
    </div>
    <div class="header-actions">
      <button id="barcodeScanBtn" class="icon-btn">📷</button>
      <button id="addStockBtn" class="add-btn">+ Add Stock</button>
    </div>
  </div>

  <div class="inventory-stats">
    <div class="stat-card">
      <span class="stat-icon" style="background:#f0fdf4">📦</span>
      <div><b id="totalItems">0</b><span>Total Items</span></div>
    </div>
    <div class="stat-card alert">
      <span class="stat-icon" style="background:#fef3c7">⚠️</span>
      <div><b id="lowStockCount">0</b><span>Low Stock</span></div>
    </div>
    <div class="stat-card">
      <span class="stat-icon" style="background:#fee2e2">❌</span>
      <div><b id="outOfStockCount">0</b><span>Out of Stock</span></div>
    </div>
    <div class="stat-card">
      <span class="stat-icon" style="background:#f0f9ff">💰</span>
      <div><b id="totalStockValue">₹0</b><span>Stock Value</span></div>
    </div>
  </div>

  <div class="inventory-controls">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="inventorySearch" placeholder="Search by name, SKU, barcode..." class="search-input">
      <button id="clearInventorySearch" class="clear-btn" style="display:none">✕</button>
    </div>
    <div class="filter-row">
      <select id="inventoryCategoryFilter" class="filter-select">
        <option value="all">All Categories</option>
        <option value="vegetables">Vegetables</option>
        <option value="fruits">Fruits</option>
        <option value="grocery">Grocery</option>
        <option value="dairy">Dairy</option>
        <option value="bakery">Bakery</option>
      </select>
      <select id="inventoryStockFilter" class="filter-select">
        <option value="all">All Stock</option>
        <option value="low">Low Stock</option>
        <option value="out">Out of Stock</option>
        <option value="in">In Stock</option>
      </select>
      <select id="inventorySort" class="filter-select">
        <option value="name_asc">Name A-Z</option>
        <option value="stock_low">Stock Low to High</option>
        <option value="stock_high">Stock High to Low</option>
        <option value="value_high">Value High to Low</option>
      </select>
    </div>
  </div>

  <div id="inventoryList" class="inventory-list"></div>

  <div id="inventoryEmpty" class="inventory-empty" style="display:none">
    <div class="empty-icon">📦</div>
    <b>No inventory found</b>
    <span>Add products to manage stock</span>
    <button id="emptyAddStock" class="primary-btn">+ Add First Product</button>
  </div>

  <div id="stockUpdateModal" class="stock-modal" style="display:none">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header">
        <b id="stockModalTitle">Update Stock</b>
        <button id="closeStockModal">✕</button>
      </div>
      <div class="modal-body">
        <div class="stock-product-info">
          <img id="stockProductImage" src="https://via.placeholder.com/60" class="stock-product-img">
          <div>
            <b id="stockProductName">Product Name</b>
            <span id="stockProductSku">SKU: ----</span>
            <span id="stockProductCurrent">Current: 0 in stock</span>
          </div>
        </div>

        <div class="stock-action-tabs">
          <button class="stock-tab active" data-action="add">➕ Add Stock</button>
          <button class="stock-tab" data-action="remove">➖ Remove Stock</button>
          <button class="stock-tab" data-action="set">📝 Set Stock</button>
        </div>

        <label>Quantity *</label>
        <div class="qty-control">
          <button id="qtyMinus" class="qty-btn">−</button>
          <input type="number" id="stockQty" value="1" min="1" class="qty-input">
          <button id="qtyPlus" class="qty-btn">+</button>
        </div>

        <label>Reason</label>
        <select id="stockReason" class="modal-input">
          <option value="purchase">🛒 New Purchase</option>
          <option value="return">↩️ Customer Return</option>
          <option value="damage">💔 Damaged / Expired</option>
          <option value="sale">💰 Sale Adjustment</option>
          <option value="correction">✏️ Stock Correction</option>
          <option value="other">📦 Other</option>
        </select>

        <label>Cost per Unit (₹) - for purchase</label>
        <input type="number" id="stockCost" placeholder="0" class="modal-input">

        <label>Note (optional)</label>
        <input type="text" id="stockNote" placeholder="Add note..." class="modal-input">
      </div>
      <div class="modal-actions">
        <button id="cancelStock" class="secondary-btn">Cancel</button>
        <button id="saveStock" class="primary-btn">Update Stock</button>
      </div>
    </div>
  </div>
</div>

<style>

.qty-input{ flex:1; text-align:center; padding:12px; border:1px solid #e2e8f0; border-radius:10px; font-weight:900; font-size:16px; }

<script>
class InventoryPage {
  constructor(){
    this.shopId = new URLSearchParams(location.search).get('shopId') || '';
    this.products = [];
    this.filter = { category:'all', stock:'all', search:'', sort:'name_asc' };
    this.selectedProduct = null;
    this.stockAction = 'add';
  }

  async init(){
    await this.loadInventory();
    this.bindEvents();
  }

  async loadInventory(){
    try{
      if(window.Loader) Loader.show('Loading inventory...');

      if(window.ApiCore){
        const data = await window.ApiCore.get(`/api/common/inventory/${this.shopId}`);
        this.products = data.products || data.inventory || data || [];
      } else {
        this.products = JSON.parse(localStorage.getItem(`inventory_${this.shopId}`)||'[]');
        if(this.products.length===0){
          this.products = [
            { _id:'p1', name:'Tomato', sku:'TOM001', barcode:'890123456789', category:'vegetables', stock:5, lowStockThreshold:10, price:40, cost:30, image:'https://via.placeholder.com/60?text=TOM' },
            { _id:'p2', name:'Potato', sku:'POT001', barcode:'890123456790', category:'vegetables', stock:0, lowStockThreshold:10, price:30, cost:20, image:'https://via.placeholder.com/60?text=POT' },
            { _id:'p3', name:'Milk 500ml', sku:'MIL001', barcode:'890123456791', category:'dairy', stock:25, lowStockThreshold:5, price:28, cost:22, image:'https://via.placeholder.com/60?text=MILK' },
            { _id:'p4', name:'Bread', sku:'BRE001', barcode:'890123456792', category:'bakery', stock:3, lowStockThreshold:5, price:25, cost:18, image:'https://via.placeholder.com/60?text=BREAD' }
          ];
        }
      }

      this.updateStats();
      this.render();

    }catch(e){ console.error(e); }finally{ if(window.Loader) Loader.hide(); }
  }

  updateStats(){
    const total = this.products.length;
    const low = this.products.filter(p=> p.stock>0 && p.stock<= (p.lowStockThreshold||10)).length;
    const out = this.products.filter(p=> p.stock===0).length;
    const value = this.products.reduce((s,p)=> s + (p.stock*(p.cost||p.price||0)),0);

    document.getElementById('totalItems').innerText = total;
    document.getElementById('lowStockCount').innerText = low;
    document.getElementById('outOfStockCount').innerText = out;
    document.getElementById('totalStockValue').innerText = `₹${value}`;
    document.getElementById('inventorySubHeader').innerText = `Total ${total} items • Low stock: ${low} • Out: ${out}`;
  }

  render(){
    const container = document.getElementById('inventoryList');
    const empty = document.getElementById('inventoryEmpty');

    let filtered = [...this.products];

    if(this.filter.category!=='all') filtered = filtered.filter(p=> p.category===this.filter.category);
    if(this.filter.stock==='low') filtered = filtered.filter(p=> p.stock>0 && p.stock<= (p.lowStockThreshold||10));
    if(this.filter.stock==='out') filtered = filtered.filter(p=> p.stock===0);
    if(this.filter.stock==='in') filtered = filtered.filter(p=> p.stock>0);

    if(this.filter.search){
      const q = this.filter.search.toLowerCase();
      filtered = filtered.filter(p=> (p.name||'').toLowerCase().includes(q) || (p.sku||'').toLowerCase().includes(q) || (p.barcode||'').includes(q));
    }

    if(this.filter.sort==='name_asc') filtered.sort((a,b)=> (a.name||'').localeCompare(b.name||''));
    if(this.filter.sort==='stock_low') filtered.sort((a,b)=> (a.stock||0)-(b.stock||0));
    if(this.filter.sort==='stock_high') filtered.sort((a,b)=> (b.stock||0)-(a.stock||0));
    if(this.filter.sort==='value_high') filtered.sort((a,b)=> (b.stock*(b.price||0)) - (a.stock*(a.price||0)));

    if(filtered.length===0){
      container.style.display='none';
      empty.style.display='block';
      return;
    }

    container.style.display='flex';
    empty.style.display='none';

    container.innerHTML = filtered.map(p=>{
      const isLow = p.stock>0 && p.stock<= (p.lowStockThreshold||10);
      const isOut = p.stock===0;
      const stockClass = isOut?'out-of-stock': isLow?'low-stock':'';
      const badgeClass = isOut?'out': isLow?'low':'in';
      const badgeText = isOut?'Out of Stock': isLow?'Low Stock':`${p.stock} in stock`;

      return `
        <div class="inventory-item ${stockClass}" data-id="${p._id}">
          <img src="${p.image||'https://via.placeholder.com/48'}" class="item-image">
          <div class="item-info">
            <b>${p.name}</b>
            <span>SKU: ${p.sku||'----'} • ${p.category||''} • ₹${p.price||0} • Value: ₹${p.stock*(p.cost||p.price||0)}</span>
            <span>Barcode: ${p.barcode||'----'}</span>
          </div>
          <div style="text-align:right">
            <span class="stock-badge ${badgeClass}">${badgeText}</span>
            <div class="item-actions" style="margin-top:6px">
              <button class="item-action-btn" onclick="InventoryPageInstance.openStockModal('${p._id}')">📝 Update</button>
              <button class="item-action-btn" onclick="InventoryPageInstance.viewHistory('${p._id}')">📊 History</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  openStockModal(productId){
    const product = this.products.find(p=> p._id===productId);
    if(!product) return;

    this.selectedProduct = product;
    document.getElementById('stockProductName').innerText = product.name;
    document.getElementById('stockProductSku').innerText = `SKU: ${product.sku||'----'}`;
    document.getElementById('stockProductCurrent').innerText = `Current: ${product.stock} in stock`;
    document.getElementById('stockProductImage').src = product.image||'https://via.placeholder.com/60';
    document.getElementById('stockQty').value = 1;
    document.getElementById('stockModalTitle').innerText = `Update Stock - ${product.name}`;

    document.getElementById('stockUpdateModal').style.display='grid';
  }

  closeStockModal(){
    document.getElementById('stockUpdateModal').style.display='none';
    this.selectedProduct = null;
  }

  async saveStock(){
    if(!this.selectedProduct) return;

    const qty = parseInt(document.getElementById('stockQty').value)||0;
    const reason = document.getElementById('stockReason').value;
    const cost = parseFloat(document.getElementById('stockCost').value)||0;
    const note = document.getElementById('stockNote').value;

    if(qty<=0){
      if(window.Toast) Toast.show('Enter valid quantity', 'warning');
      return;
    }

    let newStock = this.selectedProduct.stock;
    if(this.stockAction==='add') newStock += qty;
    else if(this.stockAction==='remove') newStock = Math.max(0, newStock - qty);
    else if(this.stockAction==='set') newStock = qty;

    const btn = document.getElementById('saveStock');
    btn.innerText='Updating...';
    btn.disabled=true;

    try{
      if(window.ApiCore){
        await window.ApiCore.post(`/api/common/inventory/${this.shopId}/update-stock`, {
          productId: this.selectedProduct._id,
          action: this.stockAction,
          quantity: qty,
          newStock,
          reason,
          cost,
          note
        });
      } else {
        const idx = this.products.findIndex(p=> p._id===this.selectedProduct._id);
        if(idx>=0) this.products[idx].stock = newStock;
        localStorage.setItem(`inventory_${this.shopId}`, JSON.stringify(this.products));
      }

      this.selectedProduct.stock = newStock;
      this.updateStats();
      this.render();
      this.closeStockModal();

      if(window.Toast) Toast.show(`Stock updated to ${newStock} ✅`, 'success');

      // Check low stock alert
      if(newStock<= (this.selectedProduct.lowStockThreshold||10) && newStock>0){
        if(window.Toast) Toast.show(`⚠️ Low stock alert: ${this.selectedProduct.name} only ${newStock} left`, 'warning');
      }

    }catch(e){
      if(window.Toast) Toast.show('Failed to update stock', 'error');
    }finally{
      btn.innerText='Update Stock';
      btn.disabled=false;
    }
  }

  viewHistory(productId){
    window.location.href=`/shop-templates/common/inventory/stock-history.html?shopId=${this.shopId}&productId=${productId}`;
  }

  bindEvents(){
    document.getElementById('inventoryBack')?.addEventListener('click', ()=> history.back());
    document.getElementById('addStockBtn')?.addEventListener('click', ()=> window.location.href=`/shop-templates/common/inventory/inventory.html?shopId=${this.shopId}&add=true`);
    document.getElementById('emptyAddStock')?.addEventListener('click', ()=> window.location.href=`/shop-templates/common/inventory/inventory.html?shopId=${this.shopId}&add=true`);
    document.getElementById('barcodeScanBtn')?.addEventListener('click', ()=> window.location.href=`/shop-templates/common/inventory/barcode-scanner.html?shopId=${this.shopId}`);

    document.getElementById('inventorySearch')?.addEventListener('input', (e)=>{
      this.filter.search = e.target.value;
      document.getElementById('clearInventorySearch').style.display = e.target.value? 'block':'none';
      this.render();
    });

    document.getElementById('clearInventorySearch')?.addEventListener('click', ()=>{
      document.getElementById('inventorySearch').value='';
      this.filter.search='';
      document.getElementById('clearInventorySearch').style.display='none';
      this.render();
    });

    document.getElementById('inventoryCategoryFilter')?.addEventListener('change', (e)=>{ this.filter.category=e.target.value; this.render(); });
    document.getElementById('inventoryStockFilter')?.addEventListener('change', (e)=>{ this.filter.stock=e.target.value; this.render(); });
    document.getElementById('inventorySort')?.addEventListener('change', (e)=>{ this.filter.sort=e.target.value; this.render(); });

    // Stock modal
    document.getElementById('closeStockModal')?.addEventListener('click', ()=> this.closeStockModal());
    document.getElementById('cancelStock')?.addEventListener('click', ()=> this.closeStockModal());
    document.getElementById('stockUpdateModal')?.querySelector('.modal-backdrop')?.addEventListener('click', ()=> this.closeStockModal());
    document.getElementById('saveStock')?.addEventListener('click', ()=> this.saveStock());

    document.getElementById('qtyMinus')?.addEventListener('click', ()=>{
      const input = document.getElementById('stockQty');
      input.value = Math.max(1, parseInt(input.value||1)-1);
    });
    document.getElementById('qtyPlus')?.addEventListener('click', ()=>{
      const input = document.getElementById('stockQty');
      input.value = parseInt(input.value||1)+1;
    });

    document.querySelectorAll('.stock-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        document.querySelectorAll('.stock-tab').forEach(t=> t.classList.remove('active'));
        tab.classList.add('active');
        this.stockAction = tab.dataset.action;
        if(this.stockAction==='set'){
          document.getElementById('stockQty').value = this.selectedProduct?.stock||0;
        }
      });
    });
  }
}

window.InventoryPageInstance = new InventoryPage();
document.addEventListener('DOMContentLoaded', ()=> window.InventoryPageInstance.init());
</script>
