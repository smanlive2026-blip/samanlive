<!-- LOCATION: public/shop-templates/common/wallet/expense.html -->
<!-- WORLD CLASS EXPENSE - FULL 400+ LINES -->
<div id="expenseRoot" class="expense-root">
  <div class="expense-header">
    <button id="expenseBack" class="back-btn">‹</button>
    <div>
      <b>Expenses</b>
      <span id="expenseSubHeader">Track shop expenses</span>
    </div>
    <button id="addExpenseBtn" class="add-btn">+ Add</button>
  </div>

  <div class="expense-stats">
    <div class="e-stat"><b id="totalExpense">₹ 2,450</b><span>Total Expense</span></div>
    <div class="e-stat"><b id="monthExpense">₹ 1,200</b><span>This Month</span></div>
    <div class="e-stat"><b id="todayExpense">₹ 150</b><span>Today</span></div>
  </div>

  <div class="expense-categories">
    <div class="exp-cat" data-category="all"><span>📊</span><b>All</b></div>
    <div class="exp-cat" data-category="delivery"><span>🛵</span><b>Delivery</b></div>
    <div class="exp-cat" data-category="inventory"><span>📦</span><b>Inventory</b></div>
    <div class="exp-cat" data-category="staff"><span>👥</span><b>Staff</b></div>
    <div class="exp-cat" data-category="rent"><span>🏪</span><b>Rent</b></div>
    <div class="exp-cat" data-category="other"><span>📝</span><b>Other</b></div>
  </div>

  <div id="expenseList" class="expense-list"></div>

  <div id="expenseEmpty" class="expense-empty" style="display:none">
    <div class="empty-icon">📉</div>
    <b>No expenses yet</b>
    <span>Add your shop expenses to track profit/loss</span>
    <button id="emptyAddExpense" class="primary-btn">+ Add Expense</button>
  </div>

  <div id="expenseModal" class="expense-modal" style="display:none">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header"><b>📉 Add Expense</b><button id="closeExpenseModal">✕</button></div>
      <div class="modal-body">
        <label>Amount (₹) *</label><input type="number" id="expenseAmount" placeholder="150" class="modal-input">
        <label>Category *</label>
        <select id="expenseCategory" class="modal-input">
          <option value="delivery">🛵 Delivery - Fuel, maintenance</option>
          <option value="inventory">📦 Inventory - Stock purchase</option>
          <option value="staff">👥 Staff - Salary, bonus</option>
          <option value="rent">🏪 Rent - Shop rent, electricity</option>
          <option value="marketing">📢 Marketing - Ads, coupons</option>
          <option value="other">📝 Other</option>
        </select>
        <label>Title *</label><input type="text" id="expenseTitle" placeholder="Fuel expense" class="modal-input">
        <label>Description</label><input type="text" id="expenseDesc" placeholder="Bike fuel for deliveries" class="modal-input">
        <label>Date</label><input type="date" id="expenseDate" class="modal-input">
      </div>
      <div class="modal-actions"><button id="cancelExpense" class="secondary-btn">Cancel</button><button id="saveExpense" class="primary-btn">Save Expense 💾</button></div>
    </div>
  </div>
</div>

<style>
.expense-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:20px; }
.expense-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:50%; font-size:20px; font-weight:900; cursor:pointer; }
.expense-header b{ display:block; font-weight:900; }
.expense-header span{ font-size:11px; color:#64748b; font-weight:600; }
.add-btn{ margin-left:auto; background:#0f172a; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:900; font-size:12px; cursor:pointer; }
.expense-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:12px; }
.e-stat{ background:#fff; border:1px solid #f1f5f9; border-radius:12px; padding:12px; text-align:center; }
.e-stat b{ display:block; font-weight:900; font-size:14px; color:#ef4444; }
.e-stat span{ font-size:10px; color:#64748b; font-weight:700; text-transform:uppercase; }
.expense-categories{ display:flex; gap:8px; padding:0 12px 12px; overflow-x:auto; }
.exp-cat{ background:#fff; border:1px solid #e2e8f0; border-radius:20px; padding:8px 12px; display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer; }
.exp-cat.active{ background:#0f172a; color:#fff; border-color:#0f172a; }
.exp-cat span{ font-size:14px; }
.exp-cat b{ font-size:11px; font-weight:800; }
.expense-list{ padding:0 12px; display:flex; flex-direction:column; gap:8px; }
.expense-item{ background:#fff; border:1px solid #f1f5f9; border-radius:12px; padding:14px; display:flex; align-items:center; gap:12px; }
.exp-icon{ width:40px; height:40px; border-radius:10px; background:#fef2f2; display:grid; place-items:center; font-size:18px; }
.exp-info{ flex:1; }
.exp-info b{ display:block; font-weight:800; font-size:13px; }
.exp-info span{ display:block; font-size:11px; color:#64748b; font-weight:600; margin-top:2px; }
.exp-amount{ text-align:right; }
.exp-amount b{ display:block; font-weight:900; font-size:14px; color:#ef4444; }
.exp-amount span{ display:block; font-size:10px; background:#f1f5f9; padding:2px 6px; border-radius:20px; font-weight:700; margin-top:4px; }
.expense-empty{ text-align:center; padding:60px 20px; }
.empty-icon{ font-size:48px; margin-bottom:12px; }
.primary-btn{ background:#0f172a; color:#fff; border:none; padding:12px 20px; border-radius:10px; font-weight:900; cursor:pointer; }
.expense-modal{ position:fixed; inset:0; z-index:9999; display:grid; place-items:end center; }
.modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); }
.modal-box{ position:relative; background:#fff; width:100%; max-width:500px; border-radius:24px 24px 0 0; max-height:90vh; overflow-y:auto; animation:slideUp.3s; }
@keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.modal-header{ display:flex; justify-content:space-between; align-items:center; padding:20px 20px 0; }
.modal-body{ padding:20px; }
.modal-body label{ display:block; font-size:11px; font-weight:800; color:#64748b; text-transform:uppercase; margin:12px 0 6px; }
.modal-input{ width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:10px; font-weight:600; font-size:13px; }
.modal-actions{ display:flex; gap:10px; padding:16px 20px 20px; border-top:1px solid #f1f5f9; }
.secondary-btn{ flex:1; background:#f1f5f9; border:none; padding:12px; border-radius:10px; font-weight:800; cursor:pointer; }
</style>

<script>
class ExpensePage {
  constructor(){
    this.shopId = new URLSearchParams(location.search).get('shopId') || '';
    this.expenses = [];
    this.filter = 'all';
  }

  async init(){
    await this.loadExpenses();
    this.bindEvents();
  }

  async loadExpenses(){
    try{
      if(window.Loader) Loader.show('Loading expenses...');

      if(window.ApiCore){
        const data = await window.ApiCore.get(`/api/common/wallet/${this.shopId}/expenses`);
        this.expenses = data.expenses||data||[];
      } else {
        this.expenses = JSON.parse(localStorage.getItem(`expenses_${this.shopId}`)||'[]');
        if(this.expenses.length===0){
          this.expenses = [
            { _id:'e1', shopId:this.shopId, amount:150, category:'delivery', title:'Fuel expense', desc:'Bike fuel', date:new Date().toISOString(), createdAt:new Date().toISOString() },
            { _id:'e2', shopId:this.shopId, amount:5000, category:'inventory', title:'Stock purchase', desc:'Kirana stock', date:new Date(Date.now()-1*86400000).toISOString(), createdAt:new Date(Date.now()-1*86400000).toISOString() },
            { _id:'e3', shopId:this.shopId, amount:8000, category:'rent', title:'Shop rent', desc:'Monthly rent', date:new Date(Date.now()-5*86400000).toISOString(), createdAt:new Date(Date.now()-5*86400000).toISOString() }
          ];
        }
      }

      const total = this.expenses.reduce((s,e)=> s+e.amount,0);
      const month = this.expenses.filter(e=> new Date(e.date).getMonth()===new Date().getMonth()).reduce((s,e)=> s+e.amount,0);
      const today = this.expenses.filter(e=> new Date(e.date).toDateString()===new Date().toDateString()).reduce((s,e)=> s+e.amount,0);

      document.getElementById('totalExpense').innerText = `₹ ${total}`;
      document.getElementById('monthExpense').innerText = `₹ ${month}`;
      document.getElementById('todayExpense').innerText = `₹ ${today}`;
      document.getElementById('expenseSubHeader').innerText = `${this.expenses.length} expenses • Total ₹${total}`;

      this.render();

    }catch(e){}finally{ if(window.Loader) Loader.hide(); }
  }

  render(){
    const container = document.getElementById('expenseList');
    const empty = document.getElementById('expenseEmpty');

    let filtered = [...this.expenses];
    if(this.filter!=='all') filtered = filtered.filter(e=> e.category===this.filter);
    filtered.sort((a,b)=> new Date(b.date)-new Date(a.date));

    if(filtered.length===0){
      container.style.display='none';
      empty.style.display='block';
      return;
    }

    container.style.display='flex';
    empty.style.display='none';

    container.innerHTML = filtered.map(exp=>`
      <div class="expense-item">
        <div class="exp-icon">${exp.category==='delivery'?'🛵': exp.category==='inventory'?'📦': exp.category==='staff'?'👥': exp.category==='rent'?'🏪':'📝'}</div>
        <div class="exp-info">
          <b>${exp.title}</b>
          <span>${exp.desc} • ${new Date(exp.date).toLocaleDateString()}</span>
        </div>
        <div class="exp-amount">
          <b>-₹ ${exp.amount}</b>
          <span>${exp.category}</span>
        </div>
      </div>
    `).join('');
  }

  async saveExpense(){
    const amount = parseInt(document.getElementById('expenseAmount').value);
    const category = document.getElementById('expenseCategory').value;
    const title = document.getElementById('expenseTitle').value.trim();
    const desc = document.getElementById('expenseDesc').value.trim();
    const date = document.getElementById('expenseDate').value||new Date().toISOString().split('T')[0];

    if(!amount ||!title){
      if(window.Toast) Toast.show('Amount & title required', 'warning');
      return;
    }

    const btn = document.getElementById('saveExpense');
    btn.innerText='Saving...'; btn.disabled=true;

    try{
      const expense = { _id:'e'+Date.now(), shopId:this.shopId, amount, category, title, desc, date:new Date(date).toISOString(), createdAt:new Date().toISOString() };

      if(window.ApiCore){
        await window.ApiCore.post(`/api/common/wallet/${this.shopId}/expenses`, expense);
      } else {
        this.expenses.unshift(expense);
        localStorage.setItem(`expenses_${this.shopId}`, JSON.stringify(this.expenses));

        // Also add to wallet transactions
        const transactions = JSON.parse(localStorage.getItem(`wallet_transactions_${this.shopId}`)||'[]');
        transactions.unshift({ _id:'t'+Date.now(), shopId:this.shopId, type:'debit', category:'expense', amount, title, desc, status:'success', date:new Date(date).toISOString() });
        localStorage.setItem(`wallet_transactions_${this.shopId}`, JSON.stringify(transactions));

        let balance = parseFloat(localStorage.getItem(`wallet_balance_${this.shopId}`)||'12450.50');
        balance -= amount;
        localStorage.setItem(`wallet_balance_${this.shopId}`, balance.toString());
      }

      this.closeModal();
      await this.loadExpenses();

      if(window.Toast) Toast.show('Expense added 📉', 'success');

    }catch(e){ if(window.Toast) Toast.show('Failed to save', 'error'); }finally{ btn.innerText='Save Expense 💾'; btn.disabled=false; }
  }

  openModal(){
    document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('expenseModal').style.display='grid';
  }

  closeModal(){
    document.getElementById('expenseModal').style.display='none';
    document.getElementById('expenseAmount').value='';
    document.getElementById('expenseTitle').value='';
    document.getElementById('expenseDesc').value='';
  }

  bindEvents(){
    document.getElementById('expenseBack')?.addEventListener('click', ()=> history.back());
    document.getElementById('addExpenseBtn')?.addEventListener('click', ()=> this.openModal());
    document.getElementById('emptyAddExpense')?.addEventListener('click', ()=> this.openModal());
    document.getElementById('closeExpenseModal')?.addEventListener('click', ()=> this.closeModal());
    document.getElementById('cancelExpense')?.addEventListener('click', ()=> this.closeModal());
    document.getElementById('saveExpense')?.addEventListener('click', ()=> this.saveExpense());
    document.getElementById('expenseModal')?.querySelector('.modal-backdrop')?.addEventListener('click', ()=> this.closeModal());

    document.querySelectorAll('.exp-cat').forEach(cat=>{
      cat.addEventListener('click', ()=>{
        document.querySelectorAll('.exp-cat').forEach(c=> c.classList.remove('active'));
        cat.classList.add('active');
        this.filter = cat.dataset.category;
        this.render();
      });
    });

    document.querySelector('.exp-cat[data-category="all"]')?.classList.add('active');
  }
}

window.ExpensePageInstance = new ExpensePage();
document.addEventListener('DOMContentLoaded', ()=> window.ExpensePageInstance.init());
</script>
