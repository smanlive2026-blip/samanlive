<html lang="en">

<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>World Product Form</title>
<link rel="stylesheet" href="./product-form-world.css?v=999">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<div class="form-wrapper">
  <div class="form-header" id="formHeader">
    <div class="icon" id="shopIcon">🛒</div>
    <div><h2 id="shopTitle">Add Product</h2><p id="shopSubtitle">Shop specific</p></div>
  </div>
  <div class="form-body">
    <div class="section"><div class="section-title">⚡ Quick Add</div><div class="quick-add" id="quickAddList"></div></div>
    <form id="productForm">
      <div class="section"><div class="section-title">📦 Basic Info</div>
        <div class="input-group" style="margin-bottom:12px"><label>Product Name *</label><input name="name" id="pName" required></div>
        <div class="grid-2"><div class="input-group"><label>Selling Price *</label><input name="price" type="number" required></div><div class="input-group"><label>MRP</label><input name="mrp" type="number"></div></div>
        <div class="input-group" style="margin-top:12px"><label>Description</label><textarea name="description" rows="2"></textarea></div>
      </div>
      <div class="section"><div class="section-title" id="dynamicTitle">🔧 Shop Details</div><div id="dynamicFields"></div></div>
      <div class="section"><div class="section-title">📊 Stock</div>
        <div class="grid-3"><div class="input-group"><label>Stock</label><input name="stock" type="number" value="10"></div><div class="input-group"><label>Unit</label><select name="unit" id="unitSelect"></select></div><div class="input-group"><label>Low Alert</label><input name="lowStock" type="number" value="2"></div></div>
      </div>
      <div class="section"><div class="section-title">🖼️ Images</div><div class="image-uploader" onclick="document.getElementById('fileInput').click()"><b>Upload Images</b><input type="file" id="fileInput" hidden multiple></div><div class="preview" id="preview"></div></div>
      <button type="submit" class="submit-btn" id="submitBtn">Save Product</button>
    </form>
  </div>
</div>

function getShopType(){const p=new URLSearchParams(location.search);return (p.get('type')||localStorage.getItem('shop_type')||'kirana').toLowerCase().replace('-shop','').replace('shop','');}
function renderShopForm(){
  let type=getShopType();
  if(!SHOP_CONFIG[type]){ // fuzzy match
    const found=Object.keys(SHOP_CONFIG).find(k=>type.includes(k)||k.includes(type));
    if(found) type=found; else type='default';
  }
  const config=SHOP_CONFIG[type];
  document.getElementById('formHeader').style.background=`linear-gradient(135deg, ${config.color}, ${config.color}dd)`;
  document.getElementById('shopIcon').innerText=config.icon;
  document.getElementById('shopTitle').innerText=config.title;
  document.getElementById('shopSubtitle').innerText=config.subtitle;
  document.getElementById('submitBtn').style.background=config.color;
  document.getElementById('unitSelect').innerHTML=config.units.map(u=>`<option>${u}</option>`).join('');
  document.getElementById('quickAddList').innerHTML=config.quick.map(q=>`<button type="button" onclick="fillQuick('${q}')">${q}</button>`).join('');
  document.getElementById('dynamicTitle').innerText=`🔧 ${config.title} Details`;
  document.getElementById('dynamicFields').innerHTML=config.fields.map(f=>{
    let input=''; if(f.type==='select'){input=`<select name="${f.name}">${f.options.map(o=>`<option>${o}</option>`).join('')}</select>`;}else{input=`<input type="${f.type}" name="${f.name}" placeholder="${f.placeholder||''}">`;}
    return `<div class="input-group" style="margin-bottom:12px"><label>${f.label}</label>${input}</div>`;
  }).join('');
  const dyn=document.getElementById('dynamicFields'); if(config.fields.length>1){dyn.style.display='grid';dyn.style.gridTemplateColumns='1fr 1fr';dyn.style.gap='12px';}
}
function fillQuick(name){document.getElementById('pName').value=name;}
document.getElementById('fileInput').addEventListener('change',e=>{
  const preview=document.getElementById('preview'); preview.innerHTML='';
  [...e.target.files].slice(0,5).forEach(file=>{const r=new FileReader(); r.onload=ev=>{preview.innerHTML+=`<img src="${ev.target.result}">`;}; r.readAsDataURL(file);});
});
document.getElementById('productForm').addEventListener('submit',e=>{
  e.preventDefault(); const fd=new FormData(e.target); const data=Object.fromEntries(fd.entries()); data.shopType=getShopType(); data.extraData={}; const cfg=SHOP_CONFIG[data.shopType]||SHOP_CONFIG['default']; cfg.fields.forEach(f=>{if(data[f.name]){data.extraData[f.name]=data[f.name]; delete data[f.name];}}); console.log('FINAL:',data); alert(`✅ ${data.shopType.toUpperCase()} Product Saved!`);
});
renderShopForm();
</script>
