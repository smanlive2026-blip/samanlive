<!-- LOCATION: common/components/toast.html - FULL WORLD CLASS TOAST SYSTEM -->
<div id="toastContainer" class="toast-container"></div>

<style>
.toast-container{
  position:fixed;
  bottom:90px;
  left:50%;
  transform:translateX(-50%);
  z-index:999999;
  display:flex;
  flex-direction:column;
  gap:8px;
  pointer-events:none;
  max-width:90vw;
  width:max-content;
  font-family:Outfit,sans-serif;
}
@media(min-width:768px){
 .toast-container{
    bottom:20px;
    right:20px;
    left:auto;
    transform:none;
  }
}
.toast{
  background:#0f172a;
  color:#fff;
  padding:12px 16px;
  border-radius:12px;
  font-weight:800;
  font-size:13px;
  box-shadow:0 12px 24px rgba(0,0,0,.2), 0 4px 8px rgba(0,0,0,.1);
  display:flex;
  align-items:center;
  gap:10px;
  min-width:200px;
  max-width:380px;
  pointer-events:auto;
  animation:toastIn.4s cubic-bezier(.34,1.56,.64,1);
  position:relative;
  overflow:hidden;
  backdrop-filter:blur(12px);
}
.toast.success{ background:#0f172a; }
.toast.error{ background:#dc2626; }
.toast.warning{ background:#f59e0b; color:#fff; }
.toast.info{ background:#0ea5e9; }
.toast-icon{
  font-size:18px;
  flex-shrink:0;
}
.toast-message{
  flex:1;
  line-height:1.3;
}
.toast-close{
  background:rgba(255,255,255,.2);
  border:none;
  color:#fff;
  width:20px;
  height:20px;
  border-radius:50%;
  font-size:10px;
  cursor:pointer;
  display:grid;
  place-items:center;
  flex-shrink:0;
}
.toast-progress{
  position:absolute;
  bottom:0;
  left:0;
  height:3px;
  background:rgba(255,255,255,.4);
  animation:progress 2.5s linear forwards;
}
@keyframes toastIn{
  from{ transform:translateY(20px) scale(.9); opacity:0; }
  to{ transform:translateY(0) scale(1); opacity:1; }
}
@keyframes toastOut{
  from{ transform:translateY(0) scale(1); opacity:1; }
  to{ transform:translateY(10px) scale(.95); opacity:0; }
}
@keyframes progress{
  from{ width:100%; }
  to{ width:0%; }
}
</style>

<script>
window.Toast = {
  container: null,

  init(){
    this.container = document.getElementById('toastContainer');
    if(!this.container){
      this.container = document.createElement('div');
      this.container.id = 'toastContainer';
      this.container.className = 'toast-container';
      document.body.appendChild(this.container);
    }
  },

  show(message, type = 'success', duration = 2500){
    this.init();

    const icons = {
      success: '✓',
      error: '✕',
      warning: '⚠️',
      info: 'ℹ️'
    };

    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.innerHTML = `
      <span class="toast-icon">${icons[type] || '✓'}</span>
      <span class="toast-message">${message}</span>
      <button class="toast-close">✕</button>
      <div class="toast-progress"></div>
    `;

    // Close button
    toast.querySelector('.toast-close').addEventListener('click', ()=>{
      this.hide(toast);
    });

    // Auto hide
    const timeoutId = setTimeout(()=> this.hide(toast), duration);

    // Pause on hover
    toast.addEventListener('mouseenter', ()=> clearTimeout(timeoutId));
    toast.addEventListener('mouseleave', ()=>{
      setTimeout(()=> this.hide(toast), 1000);
    });

    // Click to dismiss
    toast.addEventListener('click', ()=>{
      if(type!== 'error') this.hide(toast);
    });

    this.container.appendChild(toast);

    // Haptic feedback on mobile
    if(navigator.vibrate){
      if(type === 'success') navigator.vibrate(20);
      else if(type === 'error') navigator.vibrate([20, 30, 20]);
    }

    // Limit to 3 toasts max
    if(this.container.children.length > 3){
      this.hide(this.container.firstChild);
    }

    return toast;
  },

  hide(toast){
    if(!toast ||!toast.parentElement) return;

    toast.style.animation = 'toastOut.3s forwards';
    setTimeout(()=> {
      if(toast.parentElement) toast.remove();
    }, 300);
  },

  success(msg, duration){ return this.show(msg, 'success', duration); },
  error(msg, duration){ return this.show(msg, 'error', duration || 3500); },
  warning(msg, duration){ return this.show(msg, 'warning', duration); },
  info(msg, duration){ return this.show(msg, 'info', duration); },

  // Specific toasts
  cartAdded(productName){
    return this.show(`${productName || 'Product'} added to cart 🛒`, 'success', 2000);
  },

  orderPlaced(orderId){
    return this.show(`Order #${orderId} placed successfully! 🎉`, 'success', 4000);
  },

  copySuccess(){
    return this.show('Copied to clipboard! 📋', 'success', 1500);
  }
};

// Auto init
document.addEventListener('DOMContentLoaded', ()=> window.Toast.init());

// Global shortcut for legacy code
window.showToast = (msg, type) => window.Toast.show(msg, type);
window.toast = window.Toast;
</script>
