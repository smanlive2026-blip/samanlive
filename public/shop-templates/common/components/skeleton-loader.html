<style>
.skeleton-wrapper{
  font-family:Outfit,sans-serif;
}
.skeleton-product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:12px;
}
@media(min-width:768px){
 .skeleton-product-grid{ grid-template-columns:repeat(3,1fr); }
}
@media(min-width:1024px){
 .skeleton-product-grid{ grid-template-columns:repeat(4,1fr); }
}
.sk-card{
  background:#fff;
  border:1px solid #f1f5f9;
  border-radius:16px;
  overflow:hidden;
  padding:8px;
}
.sk-img{
  height:130px;
  background:#e2e8f0;
  border-radius:12px;
}
.sk-content{
  padding:8px 4px 4px;
}
.sk-line{
  height:12px;
  background:#e2e8f0;
  border-radius:6px;
  margin-top:8px;
}
.sk-title{ width:90%; height:14px; }
.sk-subtitle{ width:60%; height:10px; }
.sk-price{ width:40px; height:14px; }
.sk-mrp{ width:30px; height:10px; }
.sk-line-row{
  display:flex;
  gap:8px;
  align-items:center;
  margin-top:8px;
}
.sk-btn{
  height:32px;
  background:#e2e8f0;
  border-radius:10px;
  margin-top:10px;
}
.skeleton-list{
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}
.sk-list-item{
  display:flex;
  gap:12px;
  background:#fff;
  border:1px solid #f1f5f9;
  border-radius:12px;
  padding:12px;
}
.sk-list-img{
  width:60px;
  height:60px;
  background:#e2e8f0;
  border-radius:10px;
  flex-shrink:0;
}
.sk-list-content{ flex:1; }
.skeleton-shop-header{
  display:flex;
  gap:12px;
  padding:16px;
  background:#fff;
  border-bottom:1px solid #f1f5f9;
}
.sk-shop-logo{
  width:48px;
  height:48px;
  background:#e2e8f0;
  border-radius:14px;
  flex-shrink:0;
}
.sk-shop-info{ flex:1; }
.shimmer{
  background:linear-gradient(90deg, #e2e8f0 25%, #f1f5f9 50%, #e2e8f0 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
}
@keyframes shimmer{
  0%{ background-position:-200% 0; }
  100%{ background-position:200% 0; }
}
</style>

<script>
window.SkeletonLoader = {
  show(type = 'productGrid'){
    document.getElementById('skeletonLoader').style.display = 'block';
    document.querySelectorAll('.skeleton-product-grid,.skeleton-list,.skeleton-shop-header').forEach(el=> el.style.display='none');

    if(type === 'productGrid') document.getElementById('skeletonProductGrid').style.display = 'grid';
    else if(type === 'list') document.getElementById('skeletonList').style.display = 'flex';
    else if(type === 'shopHeader') document.getElementById('skeletonShopHeader').style.display = 'flex';
  },

  hide(){
    const el = document.getElementById('skeletonLoader');
    if(el) el.style.display = 'none';
  },

  // Inject skeleton into any container
  inject(containerId, type = 'productGrid', count = 6){
    const container = document.getElementById(containerId);
    if(!container) return;

    if(type === 'productGrid'){
      container.innerHTML = Array(count).fill(0).map(()=>`
        <div class="sk-card">
          <div class="sk-img shimmer"></div>
          <div class="sk-content">
            <div class="sk-line sk-title shimmer"></div>
            <div class="sk-line sk-subtitle shimmer"></div>
            <div class="sk-line-row">
              <div class="sk-line sk-price shimmer"></div>
              <div class="sk-line sk-mrp shimmer"></div>
            </div>
            <div class="sk-btn shimmer"></div>
          </div>
        </div>
      `).join('');
      container.style.display = 'grid';
      container.style.gridTemplateColumns = 'repeat(2,1fr)';
      container.style.gap = '12px';
    }
  }
};

// Auto hide when real content loads
window.addEventListener('products:loaded', ()=> window.SkeletonLoader.hide());
</script>
