<!-- LOCATION: common/components/confirm-modal.html - WORLD CLASS CONFIRM MODAL FULL -->
<div id="confirmModal" class="confirm-modal-overlay" style="display:none">
  <div class="confirm-modal-backdrop"></div>
  <div class="confirm-modal-box">
    <div class="confirm-icon-wrap" id="confirmIconWrap">
      <span id="confirmIcon">⚠️</span>
    </div>
    <h3 id="confirmTitle" class="confirm-title">Are you sure?</h3>
    <p id="confirmMsg" class="confirm-message">This action cannot be undone. Please confirm to continue.</p>
    
    <div class="confirm-input-wrap" id="confirmInputWrap" style="display:none">
      <input id="confirmInput" type="text" placeholder="Type to confirm">
    </div>

    <div class="confirm-actions">
      <button id="confirmCancel" class="confirm-btn cancel">Cancel</button>
      <button id="confirmOk" class="confirm-btn ok">Confirm</button>
    </div>

    <div class="confirm-footer-note" id="confirmFooterNote" style="display:none"></div>
  </div>
</div>

<style>
.confirm-modal-overlay{
  position:fixed;
  inset:0;
  z-index:99999;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:Outfit,sans-serif;
}
.confirm-modal-backdrop{
  position:absolute;
  inset:0;
  background:rgba(15,23,42,.6);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
}
.confirm-modal-box{
  position:relative;
  background:#fff;
  width:100%;
  max-width:380px;
  border-radius:24px;
  padding:24px;
  box-shadow:0 24px 64px rgba(0,0,0,.2);
  animation:modalPop .35s cubic-bezier(.34,1.56,.64,1);
  text-align:center;
}
@keyframes modalPop{
  from{ transform:scale(.85) translateY(20px); opacity:0; }
  to{ transform:scale(1) translateY(0); opacity:1; }
}
.confirm-icon-wrap{
  width:56px;
  height:56px;
  background:#fef3c7;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin:0 auto 16px;
  font-size:28px;
}
.confirm-icon-wrap.danger{ background:#fee2e2; }
.confirm-icon-wrap.success{ background:#dcfce7; }
.confirm-title{
  font-weight:900;
  font-size:18px;
  margin:0 0 8px;
  color:#0f172a;
  line-height:1.3;
}
.confirm-message{
  color:#64748b;
  font-size:13px;
  line-height:1.5;
  margin:0 0 20px;
}
.confirm-input-wrap input{
  width:100%;
  padding:12px 14px;
  border:2px solid #e2e8f0;
  border-radius:12px;
  font-family:Outfit,sans-serif;
  font-weight:600;
  font-size:14px;
  outline:none;
  transition:.2s;
}
.confirm-input-wrap input:focus{
  border-color:#0f172a;
}
.confirm-actions{
  display:flex;
  gap:10px;
  margin-top:4px;
}
.confirm-btn{
  flex:1;
  padding:13px;
  border-radius:12px;
  font-weight:900;
  font-size:14px;
  border:none;
  cursor:pointer;
  transition:.2s;
}
.confirm-btn:active{ transform:scale(.97); }
.confirm-btn.cancel{
  background:#f1f5f9;
  color:#475569;
}
.confirm-btn.ok{
  background:#ef4444;
  color:#fff;
  box-shadow:0 4px 12px rgba(239,68,68,.3);
}
.confirm-footer-note{
  margin-top:12px;
  font-size:11px;
  color:#94a3b8;
  background:#f8fafc;
  padding:8px;
  border-radius:8px;
}
</style>

<script>
window.ConfirmModal = {
  confirmCallback: null,
  cancelCallback: null,

  show(options = {}){
    const {
      title = 'Are you sure?',
      message = 'This action cannot be undone',
      icon = '⚠️',
      iconType = 'warning', // warning, danger, success
      confirmText = 'Confirm',
      cancelText = 'Cancel',
      confirmColor = '#ef4444',
      requireInput = false,
      inputPlaceholder = 'Type CONFIRM',
      inputValue = 'CONFIRM',
      footerNote = '',
      onConfirm = null,
      onCancel = null
    } = options;

    document.getElementById('confirmTitle').innerText = title;
    document.getElementById('confirmMsg').innerText = message;
    document.getElementById('confirmIcon').innerText = icon;
    document.getElementById('confirmOk').innerText = confirmText;
    document.getElementById('confirmCancel').innerText = cancelText;
    document.getElementById('confirmOk').style.background = confirmColor;

    const iconWrap = document.getElementById('confirmIconWrap');
    iconWrap.className = 'confirm-icon-wrap ' + (iconType === 'danger' ? 'danger' : iconType === 'success' ? 'success' : '');

    // Input handling
    const inputWrap = document.getElementById('confirmInputWrap');
    const input = document.getElementById('confirmInput');
    if(requireInput){
      inputWrap.style.display = 'block';
      input.placeholder = inputPlaceholder;
      input.value = '';
      input.dataset.required = inputValue;
      document.getElementById('confirmOk').disabled = true;
      document.getElementById('confirmOk').style.opacity = '.5';
    } else {
      inputWrap.style.display = 'none';
      document.getElementById('confirmOk').disabled = false;
      document.getElementById('confirmOk').style.opacity = '1';
    }

    // Footer note
    const footer = document.getElementById('confirmFooterNote');
    if(footerNote){
      footer.style.display = 'block';
      footer.innerText = footerNote;
    } else {
      footer.style.display = 'none';
    }

    document.getElementById('confirmModal').style.display = 'grid';
    document.body.style.overflow = 'hidden';

    this.confirmCallback = onConfirm;
    this.cancelCallback = onCancel;
  },

  hide(){
    document.getElementById('confirmModal').style.display = 'none';
    document.body.style.overflow = '';
    this.confirmCallback = null;
    this.cancelCallback = null;
  }
};

// Events
document.getElementById('confirmCancel')?.addEventListener('click', ()=>{
  if(window.ConfirmModal.cancelCallback) window.ConfirmModal.cancelCallback();
  window.ConfirmModal.hide();
});

document.getElementById('confirmOk')?.addEventListener('click', ()=>{
  if(window.ConfirmModal.confirmCallback) window.ConfirmModal.confirmCallback();
  window.ConfirmModal.hide();
});

document.getElementById('confirmModal')?.addEventListener('click', (e)=>{
  if(e.target.id === 'confirmModal' || e.target.classList.contains('confirm-modal-backdrop')){
    if(window.ConfirmModal.cancelCallback) window.ConfirmModal.cancelCallback();
    window.ConfirmModal.hide();
  }
});

document.getElementById('confirmInput')?.addEventListener('input', (e)=>{
  const required = e.target.dataset.required;
  const okBtn = document.getElementById('confirmOk');
  if(e.target.value === required){
    okBtn.disabled = false;
    okBtn.style.opacity = '1';
  } else {
    okBtn.disabled = true;
    okBtn.style.opacity = '.5';
  }
});

// Global shortcuts
window.confirmAction = (title, msg, onConfirm) => {
  window.ConfirmModal.show({ title, message: msg, onConfirm });
};

window.confirmDelete = (itemName, onConfirm) => {
  window.ConfirmModal.show({
    title: `Delete ${itemName}?`,
    message: `Are you sure you want to delete ${itemName}? This cannot be undone.`,
    icon: '🗑️',
    iconType: 'danger',
    confirmText: 'Delete',
    confirmColor: '#ef4444',
    onConfirm
  });
};
</script>
