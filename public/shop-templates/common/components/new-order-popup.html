<!-- KAAM: Dukaandaar ke Dashboard pe naya order aane pe popup dikhana. Page nahi hai, component hai. -->
<!-- RULE 1: Ye order nahi banayega, sirf naya order aane ki khabar dega. Order ka kaam Order system karega. -->
<!-- RULE 2: Ek hi order ka popup 2 baar nahi dikhega. OrderId yaad rakhega. -->
<!-- RULE 3: Ye orders/new-order-popup.html wali purani file nahi hai. Wo alag system ki hai, usko haath mat lagana. -->
<!-- RULE 4: Popup band karne pe order gayab nahi hoga, sirf popup band hoga. Order Dashboard pe rahega. -->

<div id="newOrderPopupOverlay" class="new-order-popup-overlay" style="display:none"></div>

<div id="newOrderPopup" class="new-order-popup" style="display:none">
  <div class="new-order-popup-head">
    <div class="new-order-popup-bell">🔔</div>
    <div>
      <b>Naya Order Aaya Hai! 🎉</b>
      <span id="newOrderPopupTime"></span>
    </div>
    <button id="newOrderPopupClose" class="new-order-popup-close" aria-label="Close">✕</button>
  </div>

  <div class="new-order-popup-body">
    <div class="new-order-popup-row">
      <span>Order ID</span>
      <b id="newOrderPopupId">-</b>
    </div>
    <div class="new-order-popup-row">
      <span>Customer</span>
      <b id="newOrderPopupCustomer">-</b>
    </div>
    <div class="new-order-popup-row">
      <span>Items</span>
      <b id="newOrderPopupItems">-</b>
    </div>
    <div class="new-order-popup-row">
      <span>Total</span>
      <b id="newOrderPopupTotal">₹0</b>
    </div>
    <div class="new-order-popup-row">
      <span>Payment</span>
      <b id="newOrderPopupPayment">-</b>
    </div>
    <div id="newOrderPopupAddressWrap" class="new-order-popup-address-wrap" style="display:none">
      <span>Address</span>
      <span id="newOrderPopupAddress"></span>
    </div>
  </div>

  <div class="new-order-popup-btns">
    <button id="newOrderPopupViewBtn" class="new-order-popup-view-btn">Order Dekho →</button>
    <button id="newOrderPopupLaterBtn" class="new-order-popup-later-btn">Baad Me</button>
  </div>
  <div class="new-order-popup-sound-note">🔊 Sound on rakhna, naya order aate hi bajega.</div>
</div>

<style>
.new-order-popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9998}
.new-order-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(380px,92vw);background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);z-index:9999;overflow:hidden}
.new-order-popup-head{display:flex;align-items:center;gap:12px;padding:14px;background:#dcfce7}
.new-order-popup-bell{font-size:28px}
.new-order-popup-head b{font-size:15px;font-weight:900;display:block;font-family:Outfit,sans-serif}
.new-order-popup-head span{font-size:11px;color:#555}
.new-order-popup-close{margin-left:auto;border:0;background:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer}
.new-order-popup-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.new-order-popup-row{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.new-order-popup-row span{color:#666}
.new-order-popup-row b{text-align:right}
.new-order-popup-address-wrap{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#555;padding-top:8px;border-top:1px dashed #ddd}
.new-order-popup-address-wrap span:first-child{color:#666}
.new-order-popup-btns{display:flex;gap:10px;padding:0 14px 14px}
.new-order-popup-view-btn{flex:2;border:0;background:#111827;color:#fff;padding:12px;border-radius:10px;font-weight:900;cursor:pointer}
.new-order-popup-later-btn{flex:1;border:1px solid #ddd;background:#fff;padding:12px;border-radius:10px;font-weight:800;cursor:pointer}
.new-order-popup-sound-note{padding:0 14px 14px;font-size:11px;color:#888;text-align:center}
</style>

<script>
(function () {
  if (window.__SAMAN_NEW_ORDER_POPUP_V1__) return;
  window.__SAMAN_NEW_ORDER_POPUP_V1__ = true;

  var shownIds = {};
  var currentOrder = null;

  function fmt(n) {
    var v = Number(n);
    if (!Number.isFinite(v)) v = 0;
    return '₹' + v.toLocaleString('en-IN');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function playSound() {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.value = 0.2;
      osc.start();
      osc.stop(ctx.currentTime + 0.3);
      setTimeout(function () {
        try {
          var osc2 = ctx.createOscillator();
          var gain2 = ctx.createGain();
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.frequency.value = 880;
          osc2.type = 'sine';
          gain2.gain.value = 0.2;
          osc2.start();
          osc2.stop(ctx.currentTime + 0.3);
        } catch (e) {}
      }, 400);
    } catch (e) {}
  }

  function show(order) {
    if (!order) return;
    var id = order._id || order.id || order.orderId || '';
    if (!id) return;
    // Ek hi order ka popup 2 baar nahi dikhega
    if (shownIds[id]) return;
    shownIds[id] = true;
    currentOrder = order;
    var overlay = document.getElementById('newOrderPopupOverlay');
    var pop = document.getElementById('newOrderPopup');
    if (!overlay || !pop) return;
    var items = order.items || order.products || [];
    var itemText = '';
    if (Array.isArray(items) && items.length) {
      var names = [];
      for (var i = 0; i < Math.min(items.length, 3); i++) {
        var it = items[i];
        var q = Number(it.qty || it.quantity || 1);
        names.push((it.name || it.productName || 'Item') + ' x ' + q);
      }
      itemText = names.join(', ');
      if (items.length > 3) itemText += ' + ' + (items.length - 3) + ' aur';
    } else {
      itemText = 'Item';
    }
    var cust = order.customerName || order.buyerName || order.name || order.customer?.name || 'Customer';
    var phone = order.customerPhone || order.phone || order.buyerPhone || '';
    if (phone) cust += ' (' + phone + ')';
    var total = Number(order.total || order.grandTotal || order.amount || 0);
    var pay = order.paymentMethod || order.payment || 'COD';
    var addr = order.address || order.deliveryAddress || '';
    if (typeof addr === 'object' && addr) addr = addr.fullAddress || addr.address || '';
    var timeEl = document.getElementById('newOrderPopupTime');
    var idEl = document.getElementById('newOrderPopupId');
    var custEl = document.getElementById('newOrderPopupCustomer');
    var itemsEl = document.getElementById('newOrderPopupItems');
    var totalEl = document.getElementById('newOrderPopupTotal');
    var payEl = document.getElementById('newOrderPopupPayment');
    var addrWrap = document.getElementById('newOrderPopupAddressWrap');
    var addrEl = document.getElementById('newOrderPopupAddress');
    if (timeEl) timeEl.textContent = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
    if (idEl) idEl.textContent = '#' + String(id).slice(-6);
    if (custEl) custEl.textContent = cust;
    if (itemsEl) itemsEl.textContent = itemText;
    if (totalEl) totalEl.textContent = fmt(total);
    if (payEl) payEl.textContent = pay.toUpperCase();
    if (addrWrap && addrEl) {
      if (addr) { addrWrap.style.display = 'flex'; addrEl.textContent = addr; }
      else addrWrap.style.display = 'none';
    }
    overlay.style.display = 'block';
    pop.style.display = 'block';
    playSound();
  }

  function closePopup() {
    var overlay = document.getElementById('newOrderPopupOverlay');
    var pop = document.getElementById('newOrderPopup');
    if (overlay) overlay.style.display = 'none';
    if (pop) pop.style.display = 'none';
  }

  window.showNewOrderPopup = show;
  window.closeNewOrderPopup = closePopup;

  document.addEventListener('click', function (e) {
    var t = e.target;
    if (!t) return;
    if (t.id === 'newOrderPopupOverlay' || t.id === 'newOrderPopupClose' || t.id === 'newOrderPopupLaterBtn') {
      closePopup();
      return;
    }
    if (t.id === 'newOrderPopupViewBtn') {
      closePopup();
      // Dashboard pe Order wale hisse pe le jao, order ko delete mat karo
      var el = document.getElementById('ordersSection') || document.getElementById('orders') || document.getElementById('orderList');
      if (el && el.scrollIntoView) el.scrollIntoView({ behavior: 'smooth' });
      if (window.SamanComponents && window.SamanComponents.toast) window.SamanComponents.toast('Naya order upar dikh raha hai', 'success');
    }
  });

  // Socket se naya order aayega toh Dashboard wala isko bulayega - ye khud fetch nahi karega
  document.addEventListener('saman:new-order', function (e) {
    if (e && e.detail) show(e.detail);
  });
  window.addEventListener('new-order', function (e) {
    if (e && e.detail) show(e.detail);
  });
})();
</script>
