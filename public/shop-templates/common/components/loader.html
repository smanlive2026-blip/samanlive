<!-- LOCATION: common/components/loader.html - FULL WORLD CLASS LOADER -->
<div id="globalLoader" class="global-loader" style="display:none">
  <div class="loader-backdrop"></div>
  <div class="loader-box">
    <div class="loader-spinner-wrap">
      <div class="loader-spinner"></div>
      <div class="loader-spinner inner"></div>
      <div class="loader-logo">🛒</div>
    </div>
    <b id="loaderText" class="loader-text">Loading...</b>
    <span id="loaderSubtext" class="loader-subtext">Please wait a moment</span>
    <div class="loader-progress">
      <div id="loaderProgressBar" class="loader-progress-bar"></div>
    </div>
  </div>
</div>

<!-- Inline loader for buttons -->
<div id="btnLoaderTemplate" style="display:none">
  <div class="btn-loader">
    <div class="btn-spinner"></div>
    <span>Loading...</span>
  </div>
</div>

<style>
.global-loader{
  position:fixed;
  inset:0;
  z-index:999999;
  display:grid;
  place-items:center;
  padding:20px;
  font-family:Outfit,sans-serif;
}
.loader-backdrop{
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.85);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
}
.loader-box{
  position:relative;
  background:#fff;
  padding:32px 28px;
  border-radius:24px;
  box-shadow:0 24px 64px rgba(0,0,0,.12);
  text-align:center;
  min-width:200px;
  animation:loaderPop.4s cubic-bezier(.34,1.56,.64,1);
  border:1px solid #f1f5f9;
}
@keyframes loaderPop{
  from{ transform:scale(.8) translateY(20px); opacity:0; }
  to{ transform:scale(1) translateY(0); opacity:1; }
}
.loader-spinner-wrap{
  position:relative;
  width:64px;
  height:64px;
  margin:0 auto 16px;
  display:grid;
  place-items:center;
}
.loader-spinner{
  position:absolute;
  inset:0;
  border:3px solid #f1f5f9;
  border-top-color:#0f172a;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
.loader-spinner.inner{
  inset:8px;
  border:3px solid #f8fafc;
  border-top-color:#0ea5e9;
  animation:spin.7s linear infinite reverse;
}
.loader-logo{
  font-size:24px;
  animation:logoBounce 1.5s infinite;
}
@keyframes logoBounce{
  0%,100%{ transform:scale(1); }
  50%{ transform:scale(1.1); }
}
.loader-text{
  display:block;
  font-weight:900;
  font-size:16px;
  color:#0f172a;
  margin-bottom:4px;
}
.loader-subtext{
  display:block;
  font-size:12px;
  color:#64748b;
  font-weight:600;
  margin-bottom:16px;
}
.loader-progress{
  width:100%;
  height:4px;
  background:#f1f5f9;
  border-radius:20px;
  overflow:hidden;
}
.loader-progress-bar{
  height:100%;
  width:40%;
  background:linear-gradient(90deg,#0f172a,#0ea5e9);
  border-radius:20px;
  animation:progressMove 1.2s infinite;
}
@keyframes progressMove{
  0%{ transform:translateX(-100%); }
  100%{ transform:translateX(350%); }
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Button loader */
.btn-loader{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:800;
  font-size:13px;
}
.btn-spinner{
  width:16px;
  height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin.6s linear infinite;
}
</style>

<script>
window.Loader = {
  timeout: null,
  progressInterval: null,

  show(text = 'Loading...', subtext = 'Please wait a moment'){
    const loader = document.getElementById('globalLoader');
    const textEl = document.getElementById('loaderText');
    const subEl = document.getElementById('loaderSubtext');

    if(textEl) textEl.innerText = text;
    if(subEl) subEl.innerText = subtext;

    if(loader) loader.style.display = 'grid';
    document.body.style.overflow = 'hidden';

    // Auto hide after 15 sec to prevent stuck
    clearTimeout(this.timeout);
    this.timeout = setTimeout(()=> this.hide(), 15000);

    // Animate progress
    this.animateProgress();
  },

  hide(){
    const loader = document.getElementById('globalLoader');
    if(loader){
      loader.style.animation = 'fadeOut.2s forwards';
      setTimeout(()=>{
        loader.style.display = 'none';
        loader.style.animation = '';
      }, 200);
    }
    document.body.style.overflow = '';
    clearTimeout(this.timeout);
    clearInterval(this.progressInterval);
  },

  animateProgress(){
    let width = 0;
    const bar = document.getElementById('loaderProgressBar');
    if(!bar) return;

    clearInterval(this.progressInterval);
    this.progressInterval = setInterval(()=>{
      width += Math.random() * 15;
      if(width > 90) width = 90;
      bar.style.width = width + '%';
    }, 300);
  },

  showButtonLoader(button, text = 'Loading...'){
    if(!button) return;

    button.dataset.originalText = button.innerHTML;
    button.disabled = true;
    button.innerHTML = `
      <div class="btn-loader">
        <div class="btn-spinner"></div>
        <span>${text}</span>
      </div>
    `;
    button.style.opacity = '.8';
    button.style.pointerEvents = 'none';
  },

  hideButtonLoader(button){
    if(!button) return;

    if(button.dataset.originalText){
      button.innerHTML = button.dataset.originalText;
      delete button.dataset.originalText;
    }
    button.disabled = false;
    button.style.opacity = '1';
    button.style.pointerEvents = 'auto';
  }
};

// Global shortcuts
window.showLoader = (text, subtext) => window.Loader.show(text, subtext);
window.hideLoader = () => window.Loader.hide();

// Auto hide loader when page fully loaded
window.addEventListener('load', ()=>{
  setTimeout(()=> window.Loader.hide(), 500);
});

// CSS for fadeOut
const style = document.createElement('style');
style.innerHTML = `@keyframes fadeOut{ from{ opacity:1; } to{ opacity:0; } }`;
document.head.appendChild(style);
</script>
