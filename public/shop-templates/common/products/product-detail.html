<body>
<div class="header">
  <button onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <h1 id="headerTitle">Product Details</h1>
  <div class="cart-wrap" onclick="location.href='../cart/cart.html'">
    <button><i class="fa-solid fa-cart-shopping"></i></button>
    <span class="cart-badge" data-cart-count style="display:none">0</span>
  </div>
</div>

<div class="wrap" id="productRoot">
  <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading product...<br><span style="font-size:12px;font-weight:600;margin-top:6px;display:block">Amazon style details loading</span></div>
</div>

<div class="action-bar" id="actionBar" style="display:none">
  <button class="btn-cart" id="addCartBtn"><i class="fa-solid fa-cart-plus"></i> Add to Cart</button>
  <button class="btn-buy" id="buyNowBtn"><i class="fa-solid fa-bolt"></i> Buy Now</button>
</div>

<script>
let currentProduct = null;
let currentShopId = '';

function getParams(){
  const p = new URLSearchParams(location.search);
  return {
    productId: p.get('productId') || p.get('id') || p.get('product_id') || '',
    shopId: p.get('shopId') || p.get('shop_id') || '',
    shopType: p.get('shopType') || p.get('type') || 'general'
  };
}
function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function loadProduct(){
  const { productId, shopId, shopType } = getParams();
  currentShopId = shopId;
  const root = document.getElementById('productRoot');
  
  try{
    // 1. Cache from main app
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem('last_product')||'null'); }catch(e){}
    if(cached && cached._id===productId) currentProduct = cached;
    
    // 2. WorldProduct API - single
    if(!currentProduct){
      const r = await fetch(`/api/world-products/${encodeURIComponent(productId)}`).then(x=>x.json()).catch(()=>null);
      if(r && r.success && r.data) currentProduct = r.data;
      else if(r && r._id) currentProduct = r;
      else if(r && r.data && r.data._id) currentProduct = r.data;
    }
    // 3. Product API single
    if(!currentProduct){
      const r = await fetch(`/api/products/single/${encodeURIComponent(productId)}`).then(x=>x.json()).catch(()=>null);
      if(r && r.success && r.product) currentProduct = r.product;
    }
    // 4. Shop products list fallback
    if(!currentProduct && shopId){
      const r = await fetch(`/api/world-products?shopId=${encodeURIComponent(shopId)}&limit=100`).then(x=>x.json()).catch(()=>null);
      if(r && r.data) currentProduct = r.data.find(p=>p._id===productId) || r.data[0];
    }
    // 5. Search fallback
    if(!currentProduct){
      const r = await fetch(`/api/world-products?search=${encodeURIComponent(productId.slice(0,8))}&limit=20`).then(x=>x.json()).catch(()=>null);
      if(r && r.data && r.data.length>0) currentProduct = r.data.find(p=>p._id===productId);
    }

    if(!currentProduct){
      root.innerHTML = `<div class="loading"><i class="fa-solid fa-box-open"></i><h3>Product not found</h3><p style="font-size:12px;margin-top:8px;color:#64748b">ID: ${esc(productId)}<br>Shop: ${esc(shopId)}</p><button onclick="history.back()" style="margin-top:20px;background:#0f172a;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:900">Go Back</button></div>`;
      return;
    }

    currentProduct.shopId = currentProduct.shopId || shopId || currentProduct.shop_id || '';
    currentProduct.shopType = currentProduct.shopType || shopType || 'general';
    currentProduct.ownerRole = currentProduct.ownerRole || currentProduct.shopOwnerRole || 'shop_owner';
    currentProduct.ownerId = currentProduct.ownerId || currentProduct.shopId;

    renderProduct(currentProduct);
    loadSimilar(currentProduct);
    
  }catch(e){
    console.error(e);
    root.innerHTML = `<div class="loading"><i class="fa-solid fa-triangle-exclamation"></i> Error: ${esc(e.message)}<br><button onclick="location.reload()" style="margin-top:16px;padding:12px 18px;border-radius:12px;border:none;background:#0f172a;color:#fff;font-weight:900">Retry</button></div>`;
  }
}

function renderProduct(p){
  const root = document.getElementById('productRoot');
  const actionBar = document.getElementById('actionBar');
  
  const images = [];
  if(p.thumbnail) images.push(p.thumbnail);
  if(p.image) images.push(p.image);
  if(Array.isArray(p.images)){
    p.images.forEach(im=>{
      if(typeof im==='string' && im) images.push(im);
      else if(im && im.url) images.push(im.url);
    });
  }
  if(images.length===0) images.push('/assets/default-product.png');
  const uniqImages = [...new Set(images.filter(Boolean))].slice(0,8);

  const price = Number(p.price||0);
  const mrp = Number(p.mrp||p.originalPrice||0);
  const off = mrp>price ? Math.round((1-price/mrp)*100) : 0;
  const stock = Number(p.stock||50);
  const inStock = stock>0;

  document.getElementById('headerTitle').textContent = p.name||'Product';
  document.title = (p.name||'Product') + ' - SAMANLIVE';

  root.innerHTML = `
    <div class="gallery">
      <div class="main-img-wrap">
        ${off>0? `<div class="sale-tag">${off}% OFF</div>` : `<div class="sale-tag" style="background:#16a34a">${inStock?'IN STOCK':'OUT OF STOCK'}</div>`}
        <button class="wish-btn" onclick="toggleWish()"><i class="fa-regular fa-heart"></i></button>
        <img id="mainImg" class="main-img" src="${esc(uniqImages[0])}" onerror="this.src='/assets/default-product.png'">
      </div>
      <div class="thumbs" id="thumbs">
        ${uniqImages.map((img,i)=>`<img src="${esc(img)}" class="${i===0?'active':''}" onclick="changeImg('${esc(img)}', this)" onerror="this.style.display='none'" loading="lazy">`).join('')}
      </div>
    </div>

    <div class="info-card">
      <div class="title">${esc(p.name||'Product')}</div>
      <div class="shop-row">
        <span class="shop-tag"><i class="fa-solid fa-store"></i> ${esc(p.shopName||p.shopType||'Shop')} • ${esc((p.shopId||'').slice(0,6))}</span>
        <span class="verified"><i class="fa-solid fa-circle-check"></i> Verified Seller</span>
        <span class="shop-tag" style="background:#fef3c7;color:#92400e"><i class="fa-solid fa-location-dot"></i> Nearby</span>
      </div>
      <div class="rating">
        <div class="stars"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i></div>
        <span class="rating-text">4.3 • 128 Ratings • 42 Reviews</span>
      </div>
      
      <div class="price-row">
        <span class="price">₹${price.toLocaleString('en-IN')}</span>
        ${mrp>price? `<span class="mrp">₹${mrp.toLocaleString('en-IN')}</span><span class="off">${off}% OFF</span>` : ''}
      </div>
      <div class="emi"><i class="fa-solid fa-credit-card"></i> No Cost EMI from ₹${Math.ceil(price/6).toLocaleString('en-IN')}/month • <span style="color:#2563eb">View Plans</span></div>

      <div class="delivery-box">
        <i class="fa-solid fa-truck-fast"></i>
        <div>
          <b>FREE Delivery • ${inStock?'In Stock':'Out of Stock'}</b>
          <span>Delivery by tomorrow, ${new Date(Date.now()+86400000).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})} • Cash on Delivery available • 7 Days Replacement</span>
          <span style="margin-top:6px;color:#16a34a;font-weight:800"><i class="fa-solid fa-shield-halved"></i> SAMANLIVE Assured • ${stock} units left</span>
        </div>
      </div>

      <div class="offers-row">
        <div class="offer-card"><b><i class="fa-solid fa-building-columns" style="color:#16a34a"></i> Bank Offer</b><span>10% instant discount on SBI Credit Cards, up to ₹500</span></div>
        <div class="offer-card"><b><i class="fa-solid fa-wallet" style="color:#f59e0b"></i> Cashback</b><span>₹20 cashback as SAMAN wallet points</span></div>
        <div class="offer-card"><b><i class="fa-solid fa-tag" style="color:#ef4444"></i> Partner Offer</b><span>Buy 2 items save 5%, Buy 3 save 10%</span></div>
        <div class="offer-card"><b><i class="fa-solid fa-repeat" style="color:#2563eb"></i> No Cost EMI</b><span>₹${Math.ceil(price/6)}/month. Standard EMI also available</span></div>
      </div>

      <div class="highlights">
        <div class="hl"><i class="fa-solid fa-award" style="color:#f59e0b"></i><b>Top<br>Brand</b></div>
        <div class="hl"><i class="fa-solid fa-truck" style="color:#16a34a"></i><b>Free<br>Delivery</b></div>
        <div class="hl"><i class="fa-solid fa-rotate-left" style="color:#2563eb"></i><b>7 Days<br>Replace</b></div>
        <div class="hl"><i class="fa-solid fa-shield" style="color:#0f172a"></i><b>Secure<br>Payment</b></div>
        <div class="hl"><i class="fa-solid fa-leaf" style="color:#16a34a"></i><b>Fresh &<br>Genuine</b></div>
      </div>

      <button class="btn-shop" onclick="goToShop('${esc(p.shopId)}')"><i class="fa-solid fa-store"></i> Visit ${esc(p.shopName||'Shop')} Store • See All ${esc(p.shopType||'')} Products <i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <div class="seller-card">
      <div class="seller-icon">🏪</div>
      <div class="seller-info">
        <b>${esc(p.shopName||p.shopType||'Local Shop')} Seller</b>
        <span>Usually responds in 2 hours • 95% positive ratings • ${esc(p.shopId||'').slice(-6).toUpperCase()} Verified</span>
      </div>
      <i class="fa-solid fa-chevron-right" style="color:#94a3b8"></i>
    </div>

    <div class="details-card">
      <h3><i class="fa-solid fa-circle-info"></i> About this item</h3>
      <div class="desc">${esc(p.description|| (p.name + ' - Best quality product from ' + (p.shopName||'local shop') + '. Fresh, genuine, hygienic and fast delivery across your area. SAMANLIVE assures quality check before delivery.'))}</div>
      
      <h3 style="margin-top:20px"><i class="fa-solid fa-list"></i> Product Details</h3>
      <div class="spec"><span>Brand</span><span>${esc(p.brand||p.extraData?.brand||'Local / SAMANLIVE')}</span></div>
      <div class="spec"><span>Category</span><span>${esc(p.category||p.shopType||'General')}</span></div>
      <div class="spec"><span>Unit / Size</span><span>${esc(p.unit||p.extraData?.unit||'1 piece / 500g')}</span></div>
      <div class="spec"><span>Weight</span><span>${esc(p.weight||p.extraData?.weight||'500g')}</span></div>
      <div class="spec"><span>Stock Status</span><span style="color:${inStock?'#16a34a':'#ef4444'}">${inStock? stock+' In Stock':'Out of Stock'}</span></div>
      <div class="spec"><span>Seller ID</span><span>${esc((p.shopId||'').slice(0,12)||'SAMAN-LOCAL')}</span></div>
      <div class="spec"><span>Sold By</span><span>${esc(p.shopName||'SAMANLIVE Seller')}</span></div>
      <div class="spec"><span>Country</span><span>India • Made in India</span></div>
      <div class="spec" style="border:none"><span>SKU</span><span>SAMAN-${esc((p._id||'').slice(-8).toUpperCase())}</span></div>
    </div>

    <div class="similar" id="similarBox" style="display:none">
      <h3><i class="fa-solid fa-layer-group"></i> Similar Products • Customers also viewed</h3>
      <div class="sim-row" id="simRow"></div>
    </div>

    <div class="details-card" style="margin-bottom:12px">
      <h3><i class="fa-solid fa-star" style="color:#f59e0b"></i> Ratings & Reviews (128)</h3>
      <div style="display:flex;gap:16px;align-items:center;margin-top:8px">
        <div style="text-align:center"><div style="font-size:36px;font-weight:900">4.3</div><div class="stars" style="justify-content:center"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star-half-stroke"></i></div><div style="font-size:11px;color:#64748b;font-weight:700;margin-top:4px">128 Ratings</div></div>
        <div style="flex:1">
          <div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="font-size:11px;width:10px">5</span><div style="flex:1;height:6px;background:#f1f5f9;border-radius:10px"><div style="width:70%;height:100%;background:#16a34a;border-radius:10px"></div></div><span style="font-size:11px;color:#64748b">70%</span></div>
          <div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="font-size:11px;width:10px">4</span><div style="flex:1;height:6px;background:#f1f5f9;border-radius:10px"><div style="width:20%;height:100%;background:#16a34a;border-radius:10px"></div></div><span style="font-size:11px;color:#64748b">20%</span></div>
          <div style="display:flex;align-items:center;gap:8px;margin:3px 0"><span style="font-size:11px;width:10px">3</span><div style="flex:1;height:6px;background:#f1f5f9;border-radius:10px"><div style="width:6%;height:100%;background:#f59e0b;border-radius:10px"></div></div><span style="font-size:11px;color:#64748b">6%</span></div>
        </div>
      </div>
      <div style="margin-top:14px;padding:12px;background:#f8fafc;border-radius:12px">
        <b style="font-size:12px"><i class="fa-solid fa-user"></i> Ramesh S. • Verified Buyer</b><br>
        <div class="stars" style="margin-top:4px"><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i><i class="fa-solid fa-star"></i></div>
        <div style="font-size:12px;font-weight:600;color:#334155;margin-top:6px;line-height:1.5">Bahut badhiya quality, fresh product, delivery bhi fast tha. SAMANLIVE se ab regular lunga.</div>
      </div>
    </div>
  `;

  actionBar.style.display = 'flex';
  document.getElementById('addCartBtn').onclick = ()=> addToCart();
  document.getElementById('buyNowBtn').onclick = ()=> buyNow();
}

function changeImg(src, el){
  const main = document.getElementById('mainImg');
  if(main) main.src = src;
  document.querySelectorAll('.thumbs img').forEach(i=>i.classList.remove('active'));
  if(el) el.classList.add('active');
}
function toggleWish(){
  const btn = document.querySelector('.wish-btn i');
  if(btn.classList.contains('fa-regular')){ btn.classList.remove('fa-regular'); btn.classList.add('fa-solid'); btn.style.color='#ef4444'; }
  else { btn.classList.add('fa-regular'); btn.classList.remove('fa-solid'); btn.style.color=''; }
}

async function addToCart(){
  if(!currentProduct) return;
  try{
    localStorage.setItem('last_shopId', currentProduct.shopId);
    localStorage.setItem('last_supplierId', currentProduct.shopId);
    localStorage.setItem('last_supplierRole', currentProduct.ownerRole||'shop_owner');
    if(window.CartCore && window.CartCore.ready) await window.CartCore.ready;
    const ok = await window.CartCore.add(currentProduct, 1);
    if(ok!==false){
      const btn = document.getElementById('addCartBtn');
      btn.innerHTML = '<i class="fa-solid fa-check"></i> Added • Go to Cart';
      btn.style.background='#dcfce7'; btn.style.borderColor='#16a34a !important'; btn.style.color='#166534';
      setTimeout(()=>{ 
        btn.innerHTML = '<i class="fa-solid fa-cart-plus"></i> Add to Cart';
        btn.style.background=''; btn.style.borderColor=''; btn.style.color='';
      }, 2000);
      if(window.CartCount) window.CartCount.update();
      // Small toast
      const t=document.createElement('div'); t.textContent=`${currentProduct.name||'Product'} added to cart`;
      t.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;z-index:9999;font-size:13px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.2)';
      document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
    }
  }catch(e){ alert('Cart error: '+e.message); }
}

async function buyNow(){
  await addToCart();
  setTimeout(()=>{
    const sid = currentProduct.shopId || currentShopId;
    if(window.CartCore) window.CartCore.goToCheckout(sid);
    else location.href = `../cart/cart.html?shopId=${encodeURIComponent(sid)}`;
  }, 500);
}

function goToShop(shopId){
  if(!shopId) return alert('Shop ID missing');
  const type = currentProduct.shopType || 'dairy';
  location.href = `/shop-templates/${type}/customer-view.html?shopId=${encodeURIComponent(shopId)}&supplierId=${encodeURIComponent(shopId)}&supplierRole=${encodeURIComponent(currentProduct.ownerRole||'shop_owner')}`;
}

async function loadSimilar(p){
  try{
    const r = await fetch(`/api/world-products?shopType=${encodeURIComponent(p.shopType||'general')}&limit=12`).then(x=>x.json()).catch(()=>null);
    let list = (r?.data||[]).filter(x=>x._id!==p._id).slice(0,10);
    if(list.length===0){
      const r2 = await fetch(`/api/world-products?limit=12`).then(x=>x.json()).catch(()=>null);
      list = (r2?.data||[]).filter(x=>x._id!==p._id).slice(0,10);
    }
    if(list.length===0) return;
    const box = document.getElementById('similarBox');
    const row = document.getElementById('simRow');
    box.style.display = 'block';
    row.innerHTML = list.map(it=>`
      <div class="sim-card" onclick="location.href='./product-detail.html?productId=${encodeURIComponent(it._id)}&shopId=${encodeURIComponent(it.shopId||'')} &shopType=${encodeURIComponent(it.shopType||'general')}'">
        <img src="${esc(it.thumbnail||it.image||'/assets/default-product.png')}" onerror="this.src='/assets/default-product.png'" loading="lazy">
        <b>${esc(it.name||'Product')}</b>
        <div class="sim-price">₹${Number(it.price||0).toLocaleString('en-IN')}</div>
        <div class="sim-shop">${esc(it.shopName||it.shopType||'Shop')}</div>
      </div>
    `).join('');
  }catch(e){ console.log('Similar load fail', e); }
}

document.addEventListener('DOMContentLoaded', loadProduct);
</script>
