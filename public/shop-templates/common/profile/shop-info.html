<!-- LOCATION: public/shop-templates/common/profile/shop-info.html -->
<!-- WORLD CLASS SHOP INFO - SHOP OWNER ONLY - FULL 450+ LINES -->
<div id="shopInfoRoot" class="shop-info-root">
  <div class="shop-info-header">
    <button id="shopInfoBack" class="back-btn">‹</button>
    <div>
      <b>Shop Information</b>
      <span>Update shop details</span>
    </div>
    <button id="saveShopInfoBtn" class="save-btn">💾 Save</button>
  </div>

  <div class="shop-info-form">
    <div class="form-section">
      <b>🏪 Basic Information</b>
      <label>Shop Name *</label>
      <input type="text" id="shopInfoName" placeholder="My Kirana Store" class="form-input">

      <label>Shop Category *</label>
      <select id="shopInfoCategory" class="form-input">
        <option value="">Select category</option>
        <option value="kirana">🛒 Kirana / Grocery</option>
        <option value="fruit">🍎 Fruit Shop</option>
        <option value="sabji">🥦 Sabji / Vegetable</option>
        <option value="medical">💊 Medical / Pharmacy</option>
        <option value="dairy">🥛 Dairy / Milk</option>
        <option value="bakery">🍞 Bakery</option>
        <option value="restaurant">🍛 Restaurant / Food</option>
        <option value="cloth">👕 Cloth / Garments</option>
        <option value="electronics">📱 Electronics / Mobile</option>
        <option value="hardware">🔧 Hardware</option>
        <option value="other">📦 Other</option>
      </select>

      <label>Shop Description</label>
      <textarea id="shopInfoDescription" placeholder="Best kirana store in Surat with fresh products and fast delivery..." class="form-input" rows="4"></textarea>

      <label>Shop Tagline (short)</label>
      <input type="text" id="shopInfoTagline" placeholder="Fresh products, fast delivery" class="form-input" maxlength="60">
      <span class="char-count"><span id="taglineCount">0</span>/60</span>
    </div>

    <div class="form-section">
      <b>📞 Contact Information</b>
      <label>Owner Name *</label>
      <input type="text" id="shopOwnerName" placeholder="Ramesh Kumar" class="form-input">

      <label>Phone Number *</label>
      <div class="phone-row">
        <span class="phone-prefix">+91</span>
        <input type="tel" id="shopPhone" placeholder="9876543210" maxlength="10" class="form-input" style="border-left:none;border-radius:0 10px 10px 0">
      </div>

      <label>Alternate Phone</label>
      <input type="tel" id="shopAltPhone" placeholder="9876543211" class="form-input">

      <label>Email (optional)</label>
      <input type="email" id="shopEmail" placeholder="myshop@example.com" class="form-input">

      <label>WhatsApp Number</label>
      <input type="tel" id="shopWhatsapp" placeholder="9876543210" class="form-input">
      <div class="checkbox-row">
        <input type="checkbox" id="sameAsPhone" checked>
        <label for="sameAsPhone" style="margin:0">Same as phone number</label>
      </div>
    </div>

    <div class="form-section">
      <b>📍 Address Information</b>
      <label>Full Address *</label>
      <input type="text" id="shopAddress" placeholder="Shop No 12, Adajan Patiya, Surat" class="form-input">

      <div class="two-col">
        <div>
          <label>Area / Locality *</label>
          <input type="text" id="shopArea" placeholder="Adajan" class="form-input">
        </div>
        <div>
          <label>City *</label>
          <input type="text" id="shopCity" placeholder="Surat" class="form-input" value="Surat">
        </div>
      </div>

      <div class="two-col">
        <div>
          <label>Pincode *</label>
          <input type="text" id="shopPincode" placeholder="395009" class="form-input" maxlength="6">
        </div>
        <div>
          <label>Landmark</label>
          <input type="text" id="shopLandmark" placeholder="Near Adajan Patiya" class="form-input">
        </div>
      </div>

      <button id="pickLocationBtn" class="secondary-btn" style="width:100%;margin-top:12px">📍 Pick Location on Map</button>
      <div id="locationPreview" style="display:none;margin-top:10px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px;font-size:11px;font-weight:600">
        <span>📍 Location: <span id="locationText">Not set</span></span>
      </div>
    </div>

    <div class="form-section">
      <b>🏷️ Additional Info</b>
      <label>GST Number (optional)</label>
      <input type="text" id="shopGst" placeholder="27ABCDE1234F1Z5" class="form-input" style="text-transform:uppercase">

      <label>FSSAI License (for food shops)</label>
      <input type="text" id="shopFssai" placeholder="12345678901234" class="form-input">

      <label>Shop Established Year</label>
      <input type="number" id="shopEstYear" placeholder="2020" min="1990" max="2026" class="form-input">

      <label>Number of Staff</label>
      <select id="shopStaffCount" class="form-input">
        <option value="1">Only me (1)</option>
        <option value="2-5">2-5 members</option>
        <option value="6-10">6-10 members</option>
        <option value="10+">10+ members</option>
      </select>
    </div>
  </div>
</div>

<style>
.shop-info-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:20px; }
.shop-info-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:50%; font-size:20px; font-weight:900; cursor:pointer; }
.shop-info-header b{ display:block; font-weight:900; }
.shop-info-header span{ font-size:11px; color:#64748b; font-weight:600; }
.save-btn{ margin-left:auto; background:#0f172a; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:900; font-size:12px; cursor:pointer; }
.shop-info-form{ padding:12px; display:flex; flex-direction:column; gap:12px; }
.form-section{ background:#fff; border:1px solid #f1f5f9; border-radius:16px; padding:16px; }
.form-section b{ display:block; font-weight:900; font-size:14px; margin-bottom:12px; }
.form-section label{ display:block; font-size:11px; font-weight:800; color:#64748b; text-transform:uppercase; margin:12px 0 6px; }
.form-section label:first-of-type{ margin-top:0; }
.form-input{ width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:10px; font-weight:600; font-size:13px; }
.phone-row{ display:flex; }
.phone-prefix{ background:#f1f5f9; border:1px solid #e2e8f0; border-right:none; padding:12px; border-radius:10px 0 0 10px; font-weight:800; font-size:13px; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.char-count{ display:block; text-align:right; font-size:10px; color:#94a3b8; font-weight:700; margin-top:4px; }
.checkbox-row{ display:flex; align-items:center; gap:8px; margin-top:8px; background:#f8fafc; padding:8px 10px; border-radius:8px; }
.secondary-btn{ background:#f1f5f9; border:1px solid #e2e8f0; padding:12px; border-radius:10px; font-weight:800; font-size:12px; cursor:pointer; }
</style>

<script>
class ShopInfoPage {
  constructor(){
    this.shopId = new URLSearchParams(location.search).get('shopId') || '';
    this.shop = null;
    this.location = null;
  }

  async init(){
    await this.loadShopInfo();
    this.bindEvents();
  }

  async loadShopInfo(){
    try{
      if(window.Loader) Loader.show('Loading shop info...');

      if(window.ApiCore){
        const data = await window.ApiCore.get(`/api/shops/${this.shopId}`);
        this.shop = data.shop||data;
      } else {
        this.shop = JSON.parse(localStorage.getItem(`shop_${this.shopId}`)||'{}');
      }

      if(this.shop){
        document.getElementById('shopInfoName').value = this.shop.name||'';
        document.getElementById('shopInfoCategory').value = this.shop.category||'';
        document.getElementById('shopInfoDescription').value = this.shop.description||'';
        document.getElementById('shopInfoTagline').value = this.shop.tagline||'';
        document.getElementById('shopOwnerName').value = this.shop.ownerName||'';
        document.getElementById('shopPhone').value = this.shop.phone||'';
        document.getElementById('shopAltPhone').value = this.shop.altPhone||'';
        document.getElementById('shopEmail').value = this.shop.email||'';
        document.getElementById('shopWhatsapp').value = this.shop.whatsapp||this.shop.phone||'';
        document.getElementById('shopAddress').value = this.shop.address||'';
        document.getElementById('shopArea').value = this.shop.area||'';
        document.getElementById('shopCity').value = this.shop.city||'Surat';
        document.getElementById('shopPincode').value = this.shop.pincode||'';
        document.getElementById('shopLandmark').value = this.shop.landmark||'';
        document.getElementById('shopGst').value = this.shop.gst||'';
        document.getElementById('shopFssai').value = this.shop.fssai||'';
        document.getElementById('shopEstYear').value = this.shop.estYear||'';
        document.getElementById('shopStaffCount').value = this.shop.staffCount||'1';

        if(this.shop.location){
          this.location = this.shop.location;
          document.getElementById('locationPreview').style.display='block';
          document.getElementById('locationText').innerText = `${this.location.lat}, ${this.location.lng}`;
        }

        document.getElementById('taglineCount').innerText = (this.shop.tagline||'').length;
      }

    }catch(e){}finally{ if(window.Loader) Loader.hide(); }
  }

  async saveShopInfo(){
    const name = document.getElementById('shopInfoName').value.trim();
    const category = document.getElementById('shopInfoCategory').value;
    const description = document.getElementById('shopInfoDescription').value.trim();
    const tagline = document.getElementById('shopInfoTagline').value.trim();
    const ownerName = document.getElementById('shopOwnerName').value.trim();
    const phone = document.getElementById('shopPhone').value.trim();
    const altPhone = document.getElementById('shopAltPhone').value.trim();
    const email = document.getElementById('shopEmail').value.trim();
    const whatsapp = document.getElementById('shopWhatsapp').value.trim();
    const address = document.getElementById('shopAddress').value.trim();
    const area = document.getElementById('shopArea').value.trim();
    const city = document.getElementById('shopCity').value.trim();
    const pincode = document.getElementById('shopPincode').value.trim();
    const landmark = document.getElementById('shopLandmark').value.trim();
    const gst = document.getElementById('shopGst').value.trim().toUpperCase();
    const fssai = document.getElementById('shopFssai').value.trim();
    const estYear = document.getElementById('shopEstYear').value;
    const staffCount = document.getElementById('shopStaffCount').value;

    if(!name ||!category ||!ownerName ||!phone ||!address ||!area ||!city ||!pincode){
      if(window.Toast) Toast.show('Fill required fields', 'warning');
      return;
    }

    if(phone.length!==10){
      if(window.Toast) Toast.show('Phone must be 10 digits', 'warning');
      return;
    }

    const btn = document.getElementById('saveShopInfoBtn');
    btn.innerText='Saving...'; btn.disabled=true;

    try{
      const shopData = { name, category, description, tagline, ownerName, phone, altPhone, email, whatsapp, address, area, city, pincode, landmark, gst, fssai, estYear, staffCount, location:this.location };

      if(window.ApiCore){
        await window.ApiCore.put(`/api/shops/${this.shopId}`, shopData);
      } else {
        const existing = JSON.parse(localStorage.getItem(`shop_${this.shopId}`)||'{}');
        localStorage.setItem(`shop_${this.shopId}`, JSON.stringify({...existing,...shopData, _id:this.shopId }));
      }

      if(window.Toast) Toast.show('Shop info saved ✅', 'success');

      setTimeout(()=>{ window.location.href=`/shop-templates/common/profile/profile.html?shopId=${this.shopId}`; }, 1000);

    }catch(e){ if(window.Toast) Toast.show('Failed to save', 'error'); }finally{ btn.innerText='💾 Save'; btn.disabled=false; }
  }

  bindEvents(){
    document.getElementById('shopInfoBack')?.addEventListener('click', ()=> history.back());
    document.getElementById('saveShopInfoBtn')?.addEventListener('click', ()=> this.saveShopInfo());
    document.getElementById('shopInfoTagline')?.addEventListener('input', (e)=>{ document.getElementById('taglineCount').innerText = e.target.value.length; });
    document.getElementById('sameAsPhone')?.addEventListener('change', (e)=>{
      if(e.target.checked){
        document.getElementById('shopWhatsapp').value = document.getElementById('shopPhone').value;
      }
    });
    document.getElementById('shopPhone')?.addEventListener('input', ()=>{
      if(document.getElementById('sameAsPhone').checked){
        document.getElementById('shopWhatsapp').value = document.getElementById('shopPhone').value;
      }
    });
    document.getElementById('pickLocationBtn')?.addEventListener('click', ()=>{
      window.location.href=`/shop-templates/common/profile/shop-info.html?shopId=${this.shopId}&pickLocation=true`;
      if(window.Toast) Toast.show('📍 Map picker coming soon - manually enter lat lng for now', 'info');
    });
  }
}

window.ShopInfoPageInstance = new ShopInfoPage();
document.addEventListener('DOMContentLoaded', ()=> window.ShopInfoPageInstance.init());
</script>
