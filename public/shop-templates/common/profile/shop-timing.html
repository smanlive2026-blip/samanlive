<!-- LOCATION: public/shop-templates/common/profile/shop-timing.html -->
<!-- WORLD CLASS SHOP TIMING - SHOP OWNER ONLY - FULL 400+ LINES -->
<div id="timingRoot" class="timing-root">
  <div class="timing-header">
    <button id="timingBack" class="back-btn">‹</button>
    <div>
      <b>Shop Timing</b>
      <span>Set open/close hours</span>
    </div>
    <button id="saveTimingBtn" class="save-btn">💾 Save</button>
  </div>

  <div class="timing-status-card">
    <div class="status-left">
      <span class="status-icon" id="statusIcon">🟢</span>
      <div>
        <b id="shopStatusText">Open Now</b>
        <span id="shopStatusTime">Closes at 9:00 PM</span>
      </div>
    </div>
    <label class="toggle-switch">
      <input type="checkbox" id="shopOpenToggle" checked>
      <span class="toggle-slider"></span>
    </label>
  </div>

  <div class="timing-form">
    <div class="form-section">
      <b>⏰ Daily Timing</b>
      <div class="timing-row">
        <span>Opening Time</span>
        <input type="time" id="openingTime" value="09:00" class="time-input">
      </div>
      <div class="timing-row">
        <span>Closing Time</span>
        <input type="time" id="closingTime" value="21:00" class="time-input">
      </div>
      <div class="timing-row">
        <span>Break Time (optional)</span>
        <div class="break-row">
          <input type="time" id="breakStart" class="time-input" style="width:100px">
          <span>to</span>
          <input type="time" id="breakEnd" class="time-input" style="width:100px">
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="is24Hours">
        <label for="is24Hours" style="margin:0"><b>24 Hours Open</b><span>Shop open all day</span></label>
      </div>
    </div>

    <div class="form-section">
      <b>📅 Weekly Schedule</b>
      <div id="weeklySchedule" class="weekly-schedule">
        <!-- Generated by JS -->
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="sameEveryday" checked>
        <label for="sameEveryday" style="margin:0">Same timing everyday</label>
      </div>
    </div>

    <div class="form-section">
      <b>🏖️ Holidays & Special Days</b>
      <div id="holidaysList" class="holidays-list"></div>
      <button id="addHolidayBtn" class="secondary-btn" style="width:100%;margin-top:10px">+ Add Holiday</button>
    </div>

    <div class="form-section">
      <b>⚡ Quick Actions</b>
      <div class="quick-actions">
        <button class="quick-btn" data-action="open">🟢 Open Now</button>
        <button class="quick-btn" data-action="close">🔴 Close Now</button>
        <button class="quick-btn" data-action="busy">🟡 Busy Mode</button>
      </div>
    </div>
  </div>

  <div id="holidayModal" class="holiday-modal" style="display:none">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header"><b>Add Holiday</b><button id="closeHolidayModal">✕</button></div>
      <div class="modal-body">
        <label>Date *</label><input type="date" id="holidayDate" class="modal-input">
        <label>Reason</label><input type="text" id="holidayReason" placeholder="Diwali, Holi, etc" class="modal-input">
      </div>
      <div class="modal-actions"><button id="cancelHoliday" class="secondary-btn">Cancel</button><button id="saveHoliday" class="primary-btn">Add Holiday</button></div>
    </div>
  </div>
</div>

<style>
.timing-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:20px; }
.timing-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:50%; font-size:20px; font-weight:900; cursor:pointer; }
.timing-header b{ display:block; font-weight:900; }
.timing-header span{ font-size:11px; color:#64748b; font-weight:600; }
.save-btn{ margin-left:auto; background:#0f172a; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:900; font-size:12px; cursor:pointer; }
.timing-status-card{ background:#fff; margin:12px; border-radius:16px; padding:16px; border:1px solid #f1f5f9; display:flex; justify-content:space-between; align-items:center; }
.status-left{ display:flex; gap:12px; align-items:center; }
.status-icon{ width:40px; height:40px; background:#f0fdf4; border-radius:10px; display:grid; place-items:center; font-size:20px; }
.status-left b{ display:block; font-weight:900; font-size:14px; }
.status-left span{ font-size:11px; color:#64748b; font-weight:600; }

.toggle-switch input{ opacity:0; width:0; height:0; }

.toggle-switch input:checked +.toggle-slider{ background:#10b981; }
.toggle-switch input:checked +.toggle-slider::before{ transform:translateX(22px); }
.timing-form{ padding:0 12px; display:flex; flex-direction:column; gap:12px; }
.form-section{ background:#fff; border:1px solid #f1f5f9; border-radius:16px; padding:16px; }
.form-section b{ display:block; font-weight:900; font-size:14px; margin-bottom:12px; }
.timing-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid #f1f5f9; }
.timing-row:last-child{ border-bottom:none; }
.timing-row span{ font-size:13px; font-weight:600; }
.time-input{ background:#f1f5f9; border:1px solid #e2e8f0; padding:8px 12px; border-radius:8px; font-weight:700; font-size:13px; }
.break-row{ display:flex; align-items:center; gap:6px; }
.checkbox-row{ display:flex; align-items:flex-start; gap:10px; background:#f8fafc; padding:12px; border-radius:10px; border:1px solid #f1f5f9; margin-top:10px; }
.checkbox-row input{ width:20px; height:20px; margin-top:2px; }

.quick-btn:hover{ background:#0f172a; color:#fff; }

.primary-btn{ flex:1; background:#0f172a; color:#fff; border:none; padding:12px; border-radius:10px; font-weight:900; cursor:pointer; }
</style>

<script>
class ShopTimingPage {
  constructor(){
    this.shopId = new URLSearchParams(location.search).get('shopId') || '';
    this.timing = null;
    this.holidays = [];
    this.weeklySchedule = {};
  }

  async init(){
    this.initWeeklySchedule();
    await this.loadTiming();
    this.bindEvents();
  }

  initWeeklySchedule(){
    const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const container = document.getElementById('weeklySchedule');

    if(container){
      container.innerHTML = days.map(day=>`
        <div class="week-day">
          <input type="checkbox" id="day_${day}" checked>
          <span>${day.slice(0,3)}</span>
          <input type="time" id="open_${day}" value="09:00" class="time-input" style="flex:1">
          <span>to</span>
          <input type="time" id="close_${day}" value="21:00" class="time-input" style="flex:1">
        </div>
      `).join('');
    }

    days.forEach(day=>{
      this.weeklySchedule[day] = { open:true, openingTime:'09:00', closingTime:'21:00' };
    });
  }

  async loadTiming(){
    try{
      if(window.Loader) Loader.show('Loading timing...');

      if(window.ApiCore){
        const data = await window.ApiCore.get(`/api/common/profile/${this.shopId}/timing`);
        this.timing = data.timing||data;
        this.holidays = data.holidays||[];
      } else {
        this.timing = JSON.parse(localStorage.getItem(`timing_${this.shopId}`)||'null')||{ openingTime:'09:00', closingTime:'21:00', isOpen:true, is24Hours:false, breakStart:'', breakEnd:'' };
        this.holidays = JSON.parse(localStorage.getItem(`holidays_${this.shopId}`)||'[]');
        this.weeklySchedule = JSON.parse(localStorage.getItem(`weekly_${this.shopId}`)||'null')||this.weeklySchedule;
      }

      document.getElementById('openingTime').value = this.timing.openingTime||'09:00';
      document.getElementById('closingTime').value = this.timing.closingTime||'21:00';
      document.getElementById('breakStart').value = this.timing.breakStart||'';
      document.getElementById('breakEnd').value = this.timing.breakEnd||'';
      document.getElementById('shopOpenToggle').checked = this.timing.isOpen!==false;
      document.getElementById('is24Hours').checked = this.timing.is24Hours||false;

      this.updateStatus();
      this.renderHolidays();

      Object.keys(this.weeklySchedule).forEach(day=>{
        const schedule = this.weeklySchedule[day];
        const dayCheck = document.getElementById(`day_${day}`);
        const openInput = document.getElementById(`open_${day}`);
        const closeInput = document.getElementById(`close_${day}`);
        if(dayCheck) dayCheck.checked = schedule.open!==false;
        if(openInput) openInput.value = schedule.openingTime||'09:00';
        if(closeInput) closeInput.value = schedule.closingTime||'21:00';
      });

    }catch(e){}finally{ if(window.Loader) Loader.hide(); }
  }

  updateStatus(){
    const isOpen = document.getElementById('shopOpenToggle').checked;
    const openingTime = document.getElementById('openingTime').value;
    const closingTime = document.getElementById('closingTime').value;

    document.getElementById('statusIcon').innerText = isOpen?'🟢':'🔴';
    document.getElementById('shopStatusText').innerText = isOpen?'Open Now':'Closed Now';
    document.getElementById('shopStatusTime').innerText = isOpen?`Closes at ${closingTime}`:`Opens at ${openingTime}`;
  }

  renderHolidays(){
    const container = document.getElementById('holidaysList');
    if(!container) return;

    if(this.holidays.length===0){
      container.innerHTML = `<div style="text-align:center;padding:12px;color:#94a3b8;font-size:11px;font-weight:600">No holidays added<br>Shop open all days</div>`;
      return;
    }

    container.innerHTML = this.holidays.map(h=>`
      <div class="holiday-item">
        <span>📅 ${new Date(h.date).toLocaleDateString()} • ${h.reason||'Holiday'}</span>
        <button onclick="ShopTimingPageInstance.deleteHoliday('${h._id}')" style="background:#fee2e2;color:#991b1b;border:none;padding:4px 8px;border-radius:6px;font-weight:800;cursor:pointer">✕</button>
      </div>
    `).join('');
  }

  async saveTiming(){
    const openingTime = document.getElementById('openingTime').value;
    const closingTime = document.getElementById('closingTime').value;
    const breakStart = document.getElementById('breakStart').value;
    const breakEnd = document.getElementById('breakEnd').value;
    const isOpen = document.getElementById('shopOpenToggle').checked;
    const is24Hours = document.getElementById('is24Hours').checked;

    const weeklySchedule = {};
    ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(day=>{
      weeklySchedule[day] = {
        open: document.getElementById(`day_${day}`)?.checked||false,
        openingTime: document.getElementById(`open_${day}`)?.value||'09:00',
        closingTime: document.getElementById(`close_${day}`)?.value||'21:00'
      };
    });

    const timingData = { openingTime, closingTime, breakStart, breakEnd, isOpen, is24Hours, weeklySchedule, holidays:this.holidays };

    const btn = document.getElementById('saveTimingBtn');
    btn.innerText='Saving...'; btn.disabled=true;

    try{
      if(window.ApiCore){
        await window.ApiCore.put(`/api/common/profile/${this.shopId}/timing`, timingData);
      } else {
        localStorage.setItem(`timing_${this.shopId}`, JSON.stringify(timingData));
        localStorage.setItem(`weekly_${this.shopId}`, JSON.stringify(weeklySchedule));
        localStorage.setItem(`holidays_${this.shopId}`, JSON.stringify(this.holidays));
      }

      if(window.Toast) Toast.show('Shop timing saved ✅', 'success');
      this.updateStatus();

      if(window.SocketCore){
        window.SocketCore.emit('shop-timing-updated', { shopId:this.shopId, timing:timingData });
      }

    }catch(e){ if(window.Toast) Toast.show('Failed to save timing', 'error'); }finally{ btn.innerText='💾 Save'; btn.disabled=false; }
  }

  async addHoliday(){
    const date = document.getElementById('holidayDate').value;
    const reason = document.getElementById('holidayReason').value;

    if(!date){ if(window.Toast) Toast.show('Select date', 'warning'); return; }

    const holiday = { _id:'h'+Date.now(), date, reason:reason||'Holiday' };

    this.holidays.push(holiday);

    if(window.ApiCore){
      await window.ApiCore.post(`/api/common/profile/${this.shopId}/holidays`, holiday).catch(()=>{});
    } else {
      localStorage.setItem(`holidays_${this.shopId}`, JSON.stringify(this.holidays));
    }

    this.renderHolidays();
    this.closeHolidayModal();

    if(window.Toast) Toast.show('Holiday added 🏖️', 'success');
  }

  deleteHoliday(holidayId){
    this.holidays = this.holidays.filter(h=> h._id!==holidayId);
    localStorage.setItem(`holidays_${this.shopId}`, JSON.stringify(this.holidays));
    this.renderHolidays();
  }

  openHolidayModal(){
    document.getElementById('holidayDate').value = new Date().toISOString().split('T')[0];
    document.getElementById('holidayModal').style.display='grid';
  }

  closeHolidayModal(){
    document.getElementById('holidayModal').style.display='none';
  }

  bindEvents(){
    document.getElementById('timingBack')?.addEventListener('click', ()=> history.back());
    document.getElementById('saveTimingBtn')?.addEventListener('click', ()=> this.saveTiming());
    document.getElementById('shopOpenToggle')?.addEventListener('change', ()=> this.updateStatus());
    document.getElementById('addHolidayBtn')?.addEventListener('click', ()=> this.openHolidayModal());
    document.getElementById('closeHolidayModal')?.addEventListener('click', ()=> this.closeHolidayModal());
    document.getElementById('cancelHoliday')?.addEventListener('click', ()=> this.closeHolidayModal());
    document.getElementById('saveHoliday')?.addEventListener('click', ()=> this.addHoliday());
    document.getElementById('holidayModal')?.querySelector('.modal-backdrop')?.addEventListener('click', ()=> this.closeHolidayModal());

    document.getElementById('is24Hours')?.addEventListener('change', (e)=>{
      if(e.target.checked){
        document.getElementById('openingTime').value='00:00';
        document.getElementById('closingTime').value='23:59';
        document.getElementById('openingTime').disabled=true;
        document.getElementById('closingTime').disabled=true;
      } else {
        document.getElementById('openingTime').disabled=false;
        document.getElementById('closingTime').disabled=false;
      }
    });

    document.getElementById('sameEveryday')?.addEventListener('change', (e)=>{
      if(e.target.checked){
        const openingTime = document.getElementById('openingTime').value;
        const closingTime = document.getElementById('closingTime').value;
        ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].forEach(day=>{
          const openInput = document.getElementById(`open_${day}`);
          const closeInput = document.getElementById(`close_${day}`);
          if(openInput) openInput.value = openingTime;
          if(closeInput) closeInput.value = closingTime;
        });
      }
    });

    document.querySelectorAll('.quick-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const action = btn.dataset.action;
        if(action==='open'){
          document.getElementById('shopOpenToggle').checked=true;
          this.updateStatus();
          if(window.Toast) Toast.show('Shop opened 🟢', 'success');
        } else if(action==='close'){
          document.getElementById('shopOpenToggle').checked=false;
          this.updateStatus();
          if(window.Toast) Toast.show('Shop closed 🔴', 'success');
        } else if(action==='busy'){
          if(window.Toast) Toast.show('Busy mode activated 🟡 - orders delayed', 'warning');
        }
        this.saveTiming();
      });
    });
  }
}

window.ShopTimingPageInstance = new ShopTimingPage();
document.addEventListener('DOMContentLoaded', ()=> window.ShopTimingPageInstance.init());
</script>
