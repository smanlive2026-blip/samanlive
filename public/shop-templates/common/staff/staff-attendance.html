<!-- WORLD CLASS STAFF ATTENDANCE - FULL 400+ LINES -->
<div id="attendanceRoot" class="attendance-root">
  <div class="attendance-header">
    <button id="attendanceBack" class="back-btn">‹</button>
    <div>
      <b>Staff Attendance</b>
      <span id="attendanceSubHeader">Track attendance</span>
    </div>
    <button id="markAttendanceBtn" class="mark-btn">✓ Mark</button>
  </div>

  <div class="attendance-stats">
    <div class="a-stat"><b id="presentToday">0</b><span>Present Today</span></div>
    <div class="a-stat"><b id="absentToday">0</b><span>Absent Today</span></div>
    <div class="a-stat"><b id="avgAttendance">0%</b><span>Avg Attendance</span></div>
  </div>

  <div class="attendance-calendar-card">
    <div class="calendar-header">
      <button id="prevMonth" class="cal-nav">‹</button>
      <b id="calendarMonth">October 2026</b>
      <button id="nextMonth" class="cal-nav">›</button>
    </div>
    <div class="calendar-weekdays">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div id="calendarGrid" class="calendar-grid"></div>
    <div class="calendar-legend">
      <span><span class="legend-dot present"></span> Present</span>
      <span><span class="legend-dot absent"></span> Absent</span>
      <span><span class="legend-dot leave"></span> Leave</span>
    </div>
  </div>

  <div class="staff-attendance-list">
    <div class="section-header">
      <b>👥 Today's Attendance</b>
      <span id="attendanceDate" style="font-size:11px;color:#64748b;font-weight:700">Today • 13 Oct</span>
    </div>
    <div id="todayAttendanceList" class="attendance-list"></div>
  </div>

  <div id="markAttendanceModal" class="attendance-modal" style="display:none">
    <div class="modal-backdrop"></div>
    <div class="modal-box">
      <div class="modal-header"><b>Mark Attendance</b><button id="closeAttendanceModal">✕</button></div>
      <div class="modal-body">
        <label>Select Staff *</label>
        <select id="attendanceStaffSelect" class="modal-input"></select>
        <label>Date *</label>
        <input type="date" id="attendanceDateInput" class="modal-input">
        <label>Status *</label>
        <div class="status-tabs">
          <button class="status-tab active present" data-status="present">✅ Present</button>
          <button class="status-tab absent" data-status="absent">❌ Absent</button>
          <button class="status-tab leave" data-status="leave">🏖️ Leave</button>
        </div>
        <div class="two-col">
          <div><label>Check-in Time</label><input type="time" id="attendanceCheckIn" value="09:00" class="modal-input"></div>
          <div><label>Check-out Time</label><input type="time" id="attendanceCheckOut" value="18:00" class="modal-input"></div>
        </div>
        <label>Note</label>
        <input type="text" id="attendanceNote" placeholder="Late by 10 min" class="modal-input">
      </div>
      <div class="modal-actions"><button id="cancelAttendance" class="secondary-btn">Cancel</button><button id="saveAttendance" class="primary-btn">Save Attendance</button></div>
    </div>
  </div>
</div>

<style>
.attendance-root{ font-family:Outfit,sans-serif; max-width:700px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:20px; }
.attendance-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:50%; font-size:20px; font-weight:900; cursor:pointer; }
.attendance-header b{ display:block; font-weight:900; }
.attendance-header span{ font-size:11px; color:#64748b; font-weight:600; }
.mark-btn{ margin-left:auto; background:#0f172a; color:#fff; border:none; padding:8px 14px; border-radius:8px; font-weight:900; font-size:12px; cursor:pointer; }
.attendance-stats{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; padding:12px; }
.a-stat{ background:#fff; border:1px solid #f1f5f9; border-radius:12px; padding:12px; text-align:center; }
.a-stat b{ display:block; font-weight:900; font-size:18px; }
.a-stat span{ font-size:10px; color:#64748b; font-weight:700; text-transform:uppercase; }
.attendance-calendar-card{ background:#fff; margin:0 12px 12px; border-radius:16px; padding:16px; border:1px solid #f1f5f9; }
.calendar-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.calendar-header b{ font-weight:900; }
.cal-nav{ background:#f1f5f9; border:none; width:32px; height:32px; border-radius:50%; font-weight:900; cursor:pointer; }
.calendar-weekdays{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:8px; }
.calendar-weekdays span{ text-align:center; font-size:10px; font-weight:800; color:#64748b; text-transform:uppercase; padding:6px 0; }
.calendar-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.calendar-day{ aspect-ratio:1; display:grid; place-items:center; border-radius:8px; font-size:12px; font-weight:700; cursor:pointer; position:relative; border:1px solid transparent; }
.calendar-day:hover{ border-color:#e2e8f0; }
.calendar-day.other-month{ color:#cbd5e1; }
.calendar-day.today{ background:#0f172a; color:#fff; }
.calendar-day.present{ background:#dcfce7; color:#166534; border-color:#bbf7d0; }
.calendar-day.absent{ background:#fee2e2; color:#991b1b; border-color:#fecaca; }
.calendar-day.leave{ background:#fef3c7; color:#92400e; border-color:#fde68a; }
.calendar-legend{ display:flex; gap:12px; justify-content:center; margin-top:12px; font-size:10px; font-weight:700; }
.legend-dot{ width:10px; height:10px; border-radius:50%; display:inline-block; margin-right:4px; }
.legend-dot.present{ background:#10b981; }
.legend-dot.absent{ background:#ef4444; }
.legend-dot.leave{ background:#f59e0b; }
.staff-attendance-list{ background:#fff; margin:0 12px 12px; border-radius:16px; padding:16px; border:1px solid #f1f5f9; }
.section-header{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.section-header b{ font-weight:900; }
.attendance-list{ display:flex; flex-direction:column; gap:8px; }
.attendance-item{ display:flex; align-items:center; gap:10px; background:#f8fafc; padding:10px; border-radius:10px; }
.attendance-modal{ position:fixed; inset:0; z-index:9999; display:grid; place-items:end center; }
.modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.4); backdrop-filter:blur(4px); }
.modal-box{ position:relative; background:#fff; width:100%; max-width:500px; border-radius:24px 24px 0 0; max-height:90vh; overflow-y:auto; animation:slideUp.3s; }
@keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
.modal-header{ display:flex; justify-content:space-between; align-items:center; padding:20px 20px 0; position:sticky; top:0; background:#fff; }
.modal-body{ padding:20px; }
.modal-body label{ display:block; font-size:11px; font-weight:800; color:#64748b; text-transform:uppercase; margin:12px 0 6px; }
.modal-input{ width:100%; padding:12px; border:1px solid #e2e8f0; border-radius:10px; font-weight:600; font-size:13px; }
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.status-tabs{ display:flex; gap:6px; }
.status-tab{ flex:1; border:1px solid #e2e8f0; padding:10px; border-radius:8px; font-weight:800; font-size:11px; cursor:pointer; background:#fff; }
.status-tab.active.present{ background:#dcfce7; border-color:#10b981; color:#166534; }
.status-tab.active.absent{ background:#fee2e2; border-color:#ef4444; color:#991b1b; }
.status-tab.active.leave{ background:#fef3c7; border-color:#f59e0b; color:#92400e; }
.modal-actions{ display:flex; gap:10px; padding:16px 20px 20px; position:sticky; bottom:0; background:#fff; border-top:1px solid #f1f5f9; }
.secondary-btn{ flex:1; background:#f1f5f9; border:none; padding:12px; border-radius:10px; font-weight:800; cursor:pointer; }
.primary-btn{ flex:1; background:#0f172a; color:#fff; border:none; padding:12px; border-radius:10px; font-weight:900; cursor:pointer; }
</style>

<script>
class StaffAttendancePage {
  constructor(){
    this.shopId = new URLSearchParams(location.search).get('shopId') || '';
    this.staffId = new URLSearchParams(location.search).get('staffId') || '';
    this.staff = [];
    this.attendance = [];
    this.currentMonth = new Date();
    this.selectedStatus = 'present';
  }

  async init(){
    await this.loadStaff();
    await this.loadAttendance();
    this.renderCalendar();
    this.renderTodayAttendance();
    this.bindEvents();
  }

  async loadStaff(){
    try{
      if(window.ApiCore){
        const data = await window.ApiCore.get(`/api/common/staff/${this.shopId}`);
        this.staff = data.staff||data||[];
      } else {
        this.staff = JSON.parse(localStorage.getItem(`staff_${this.shopId}`)||'[]');
      }

      const select = document.getElementById('attendanceStaffSelect');
      if(select){
        select.innerHTML = `<option value="">Select staff</option>` + this.staff.map(s=> `<option value="${s._id}">${s.name} • ${s.role}</option>`).join('');
        if(this.staffId) select.value = this.staffId;
      }

    }catch(e){}
  }

  async loadAttendance(){
    try{
      if(window.ApiCore){
        const data = await window.ApiCore.get(`/api/common/staff/${this.shopId}/attendance?month=${this.currentMonth.getMonth()+1}&year=${this.currentMonth.getFullYear()}`);
        this.attendance = data.attendance||data||[];
      } else {
        this.attendance = JSON.parse(localStorage.getItem(`attendance_${this.shopId}`)||'[]');
        if(this.attendance.length===0){
          // Mock last 10 days
          const today = new Date();
          for(let i=0; i<10; i++){
            const date = new Date(today);
            date.setDate(date.getDate()-i);
            this.staff.forEach(s=>{
              this.attendance.push({ _id:'a'+Date.now()+Math.random(), shopId:this.shopId, staffId:s._id, staffName:s.name, date:date.toISOString().split('T')[0], status: Math.random()>0.2?'present':'absent', checkIn:'09:00', checkOut:'18:00', note:'' });
            });
          }
        }
      }

      this.updateStats();

    }catch(e){}
  }

  updateStats(){
    const today = new Date().toISOString().split('T')[0];
    const todayAttendance = this.attendance.filter(a=> a.date===today);

    const present = todayAttendance.filter(a=> a.status==='present').length || this.staff.filter(s=> s.isActive).length;
    const absent = this.staff.length - present;
    const avg = this.attendance.length? Math.round((this.attendance.filter(a=> a.status==='present').length / this.attendance.length)*100) : 0;

    document.getElementById('presentToday').innerText = present;
    document.getElementById('absentToday').innerText = absent;
    document.getElementById('avgAttendance').innerText = `${avg}%`;
    document.getElementById('attendanceDate').innerText = `Today • ${new Date().toLocaleDateString('en-IN', { day:'numeric', month:'short' })}`;
    document.getElementById('attendanceSubHeader').innerText = `${present} present today • ${absent} absent • ${avg}% avg`;
  }

  renderCalendar(){
    const monthEl = document.getElementById('calendarMonth');
    const grid = document.getElementById('calendarGrid');

    if(!monthEl ||!grid) return;

    monthEl.innerText = this.currentMonth.toLocaleDateString('en-IN', { month:'long', year:'numeric' });

    const year = this.currentMonth.getFullYear();
    const month = this.currentMonth.getMonth();

    const firstDay = new Date(year, month, 1);
    const lastDay = new Date(year, month+1, 0);

    const startDay = firstDay.getDay() ===0? 6 : firstDay.getDay()-1;
    const daysInMonth = lastDay.getDate();

    let html = '';

    for(let i=0; i<startDay; i++){
      const prevDate = new Date(year, month, -startDay+i+1);
      html += `<div class="calendar-day other-month">${prevDate.getDate()}</div>`;
    }

    const today = new Date().toISOString().split('T')[0];

    for(let day=1; day<=daysInMonth; day++){
      const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
      const dayAttendance = this.attendance.filter(a=> a.date===dateStr);

      let status = '';
      if(dayAttendance.length>0){
        const presentCount = dayAttendance.filter(a=> a.status==='present').length;
        const absentCount = dayAttendance.filter(a=> a.status==='absent').length;
        const leaveCount = dayAttendance.filter(a=> a.status==='leave').length;

        if(presentCount>absentCount && presentCount>leaveCount) status='present';
        else if(absentCount>presentCount) status='absent';
        else if(leaveCount>0) status='leave';
      }

      const isToday = dateStr===today;

      html += `<div class="calendar-day ${status} ${isToday?'today':''}" data-date="${dateStr}">${day}</div>`;
    }

    const remaining = 42 - (startDay+daysInMonth);
    for(let i=1; i<=remaining; i++){
      html += `<div class="calendar-day other-month">${i}</div>`;
    }

    grid.innerHTML = html;

    grid.querySelectorAll('.calendar-day').forEach(day=>{
      day.addEventListener('click', ()=>{
        const date = day.dataset.date;
        if(date){
          document.getElementById('attendanceDateInput').value = date;
          this.openModal();
        }
      });
    });
  }

  renderTodayAttendance(){
    const container = document.getElementById('todayAttendanceList');
    if(!container) return;

    const today = new Date().toISOString().split('T')[0];
    const todayAttendance = this.attendance.filter(a=> a.date===today);

    if(this.staff.length===0){
      container.innerHTML = `<div style="text-align:center;padding:20px;color:#94a3b8;font-size:12px;font-weight:600">No staff members</div>`;
      return;
    }

    container.innerHTML = this.staff.map(s=>{
      const attendance = todayAttendance.find(a=> a.staffId===s._id);
      const status = attendance?.status||'present';

      return `
        <div class="attendance-item">
          <div style="width:40px;height:40px;background:#e2e8f0;border-radius:50%;display:grid;place-items:center;font-weight:900">${s.name?.charAt(0)||'S'}</div>
          <div style="flex:1">
            <b style="display:block;font-weight:800;font-size:13px">${s.name||'Staff'} • ${s.role||''}</b>
            <span style="font-size:11px;color:#64748b;font-weight:600">${status==='present'?`✅ Present • ${attendance?.checkIn||'09:00'} - ${attendance?.checkOut||'18:00'}`: status==='absent'?'❌ Absent':'🏖️ On Leave'} ${attendance?.note? `• ${attendance.note}`:''}</span>
          </div>
          <span style="font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px;background:${status==='present'?'#dcfce7': status==='absent'?'#fee2e2':'#fef3c7'};color:${status==='present'?'#166534': status==='absent'?'#991b1b':'#92400e'}">${status.toUpperCase()}</span>
        </div>
      `;
    }).join('');
  }

  openModal(){
    document.getElementById('attendanceDateInput').value = document.getElementById('attendanceDateInput').value || new Date().toISOString().split('T')[0];
    document.getElementById('markAttendanceModal').style.display='grid';
  }

  closeModal(){
    document.getElementById('markAttendanceModal').style.display='none';
  }

  async saveAttendance(){
    const staffId = document.getElementById('attendanceStaffSelect').value;
    const date = document.getElementById('attendanceDateInput').value;
    const checkIn = document.getElementById('attendanceCheckIn').value;
    const checkOut = document.getElementById('attendanceCheckOut').value;
    const note = document.getElementById('attendanceNote').value;

    if(!staffId ||!date){
      if(window.Toast) Toast.show('Select staff and date', 'warning');
      return;
    }

    const staff = this.staff.find(s=> s._id===staffId);
    if(!staff){
      if(window.Toast) Toast.show('Staff not found', 'error');
      return;
    }

    const btn = document.getElementById('saveAttendance');
    btn.innerText='Saving...'; btn.disabled=true;

    try{
      const attendanceData = {
        shopId:this.shopId,
        staffId,
        staffName: staff.name,
        date,
        status:this.selectedStatus,
        checkIn,
        checkOut,
        note
      };

      if(window.ApiCore){
        await window.ApiCore.post(`/api/common/staff/${this.shopId}/attendance`, attendanceData);
      } else {
        // Remove existing for same staff+date
        this.attendance = this.attendance.filter(a=>!(a.staffId===staffId && a.date===date));
        this.attendance.push({ _id:'a'+Date.now(),...attendanceData });
        localStorage.setItem(`attendance_${this.shopId}`, JSON.stringify(this.attendance));
      }

      this.closeModal();
      await this.loadAttendance();
      this.renderCalendar();
      this.renderTodayAttendance();

      if(window.Toast) Toast.show('Attendance marked ✅', 'success');

    }catch(e){ if(window.Toast) Toast.show('Failed to mark attendance', 'error'); }finally{ btn.innerText='Save Attendance'; btn.disabled=false; }
  }

  bindEvents(){
    document.getElementById('attendanceBack')?.addEventListener('click', ()=> history.back());
    document.getElementById('markAttendanceBtn')?.addEventListener('click', ()=> this.openModal());
    document.getElementById('closeAttendanceModal')?.addEventListener('click', ()=> this.closeModal());
    document.getElementById('cancelAttendance')?.addEventListener('click', ()=> this.closeModal());
    document.getElementById('markAttendanceModal')?.querySelector('.modal-backdrop')?.addEventListener('click', ()=> this.closeModal());
    document.getElementById('saveAttendance')?.addEventListener('click', ()=> this.saveAttendance());

    document.getElementById('prevMonth')?.addEventListener('click', ()=>{ this.currentMonth.setMonth(this.currentMonth.getMonth()-1); this.renderCalendar(); });
    document.getElementById('nextMonth')?.addEventListener('click', ()=>{ this.currentMonth.setMonth(this.currentMonth.getMonth()+1); this.renderCalendar(); });

    document.querySelectorAll('.status-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        document.querySelectorAll('.status-tab').forEach(t=> t.classList.remove('active'));
        tab.classList.add('active');
        this.selectedStatus = tab.dataset.status;
      });
    });
  }
}

window.StaffAttendancePageInstance = new StaffAttendancePage();
document.addEventListener('DOMContentLoaded', ()=> window.StaffAttendancePageInstance.init());
</script>
