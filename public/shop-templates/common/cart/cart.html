<!-- LOCATION: public/shop-templates/common/cart/cart.html - V4 DAIRY FIXED - SUPPLIER AWARE + SESSION BACKUP -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cart - Dairy Shop</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f8fafc;padding-bottom:110px}
header{position:sticky;top:0;z-index:50;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
header button{background:#f1f5f9;border:none;width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px}
header h1{font-size:18px;font-weight:900}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.item{background:#fff;border-radius:16px;padding:12px;display:flex;gap:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.04);align-items:center}
.item img{width:64px;height:64px;object-fit:cover;border-radius:12px;background:#f1f5f9}
.info{flex:1}
.name{font-weight:800;font-size:14px}
.price{color:#16a34a;font-weight:900;font-size:14px;margin-top:2px}
.unit{color:#64748b;font-size:11px;font-weight:700}
.qty{display:flex;align-items:center;background:#16a34a;border-radius:10px;overflow:hidden}
.qty button{background:none;border:none;color:#fff;font-size:18px;padding:8px 12px;cursor:pointer;font-weight:900}
.qty span{color:#fff;font-weight:900;min-width:22px;text-align:center}
.remove{background:#fef2f2;border:none;color:#ef4444;width:34px;height:34px;border-radius:10px;cursor:pointer}
.bill{background:#fff;border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.row{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding:6px 0;color:#334155}
.row.total{border-top:1px dashed #e2e8f0;margin-top:8px;padding-top:12px;font-size:16px;font-weight:900;color:#0f172a}
.empty{background:#fff;border-radius:16px;padding:40px 20px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.empty i{font-size:44px;color:#cbd5e1}
.empty h3{margin-top:12px;font-weight:900}
.empty p{color:#64748b;font-weight:700;font-size:13px;margin-top:4px}
.empty button{margin-top:16px;background:#16a34a;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:900;cursor:pointer}
.footer{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 16px;box-shadow:0 -4px 20px rgba(0,0,0,.08);display:flex;gap:12px;align-items:center;max-width:720px;margin:0 auto}
.amt{flex:1}
.amt small{display:block;color:#64748b;font-weight:700;font-size:11px}
.amt b{font-size:18px}
.footer button{background:#16a34a;color:#fff;border:none;padding:14px 20px;border-radius:12px;font-weight:900;cursor:pointer;font-size:15px}
.clearBtn{width:100%;background:none;border:1px solid #fee2e2;color:#ef4444;padding:10px;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px}
.shopTag{background:#f1f5f9;color:#334155;font-size:11px;font-weight:800;padding:4px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
</style>
<script src="../../../assets/js/role-hierarchy.js"></script>
<script src="../core/api-core.js"></script>
</head>
<body>
<header>
  <button onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <h1>🛒 My Cart <span id="cart-badge" data-cart-count style="background:#16a34a;color:#fff;padding:2px 8px;border-radius:99px;font-size:12px;display:none">0</span></h1>
  <div style="margin-left:auto;font-size:12px;color:#64748b" id="shop-label"></div>
</header>

<div class="wrap">
  <div id="cartList"></div>
  <div id="billBox" style="display:none">
    <div class="bill">
      <div class="row"><span>Item Total (<span id="itemCount">0</span> items)</span><span id="subTotal">₹0</span></div>
      <div class="row"><span>Delivery</span><span style="color:#16a34a">FREE</span></div>
      <div class="row total"><span>To Pay</span><span id="grandTotal">₹0</span></div>
    </div>
    <button class="clearBtn" onclick="clearCart()">Clear Cart (This Shop)</button>
    <button class="clearBtn" onclick="clearAllCart()" style="border-color:#e2e8f0;color:#64748b">Clear All Shops</button>
  </div>
</div>

<div class="footer" id="footerBar" style="display:none">
  <div class="amt"><small>Total</small><b id="footerTotal" data-cart-total>₹0</b></div>
  <button id="checkoutBtn">Place Order <i class="fa-solid fa-arrow-right"></i></button>
</div>

<script src="./cart-core.js?v=4-dairy"></script>
<script src="./cart-count.js"></script>
<script>
const listEl = document.getElementById('cartList');
const billBox = document.getElementById('billBox');
const footerBar = document.getElementById('footerBar');

function getUrlIds(){
  const p = new URLSearchParams(location.search);
  return {
    shopId: p.get('shopId') || '',
    supplierId: p.get('supplierId') || p.get('shopId') || ''
  };
}

function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(cartInput){
  const { supplierId, shopId } = getUrlIds();
  let items = [];
  let total = 0;
  let count = 0;

  // V4 LOGIC: supplierId hai to sirf us shop ka cart dikhao (dairy fix)
  if(window.CartCore){
    if(supplierId && supplierId !== 'unknown'){
      items = window.CartCore.getCartBySupplier(supplierId) || [];
      // fallback - agar supplierId se empty hai par memory me hai to first wala le lo (old cart)
      if(items.length===0 && Object.keys(window.CartCore.getAllCarts()).length>0){
        const firstSid = Object.keys(window.CartCore.getAllCarts())[0];
        if(!shopId){ // shopId nahi hai tabhi fallback
          items = window.CartCore.getAllCarts()[firstSid] || [];
        }
      }
    } else {
      items = cartInput?.items || window.CartCore.getCart() || [];
    }
    total = items.reduce((s,i)=> s + (Number(i.price||0)*Number(i.qty||1)),0);
    count = items.reduce((s,i)=> s + (Number(i.qty||1)),0);
  } else {
    items = cartInput?.items || [];
    total = cartInput?.total || 0;
    count = cartInput?.count || 0;
  }

  const shopLabel = document.getElementById('shop-label');
  if(shopLabel){
    if(supplierId) shopLabel.textContent = `Shop: ${supplierId.slice(0,8)}..`;
    else if(items[0]?.shopName) shopLabel.textContent = items[0].shopName;
  }

  if(!items.length){
    listEl.innerHTML = `<div class="empty"><i class="fa-solid fa-cart-shopping"></i><h3>Cart Khali Hai</h3><p>Dairy ka kuch saman add karo, fir yaha dikhega</p><button onclick="goBackToShop()">Shop Par Jao</button></div>`;
    billBox.style.display = 'none';
    footerBar.style.display = 'none';
    return;
  }

  listEl.innerHTML = items.map(it => `
    <div class="item">
      ${it.image? `<img src="${esc(it.image)}" onerror="this.style.display='none'">` : `<div style="width:64px;height:64px;border-radius:12px;background:#f1f5f9;display:grid;place-items:center;font-size:24px">🥛</div>`}
      <div class="info">
        <div class="shopTag">${esc(it.shopName||'Dairy Shop')}</div>
        <div class="name">${esc(it.name)}</div>
        <div class="unit">${esc(it.unit||'ltr')}</div>
        <div class="price">₹${it.price} × ${it.qty} = ₹${it.price * it.qty}</div>
      </div>
      <div class="qty">
        <button onclick="updateQty('${it.productId}', ${it.qty - 1})">−</button>
        <span>${it.qty}</span>
        <button onclick="updateQty('${it.productId}', ${it.qty + 1})">+</button>
      </div>
      <button class="remove" onclick="removeItem('${it.productId}')"><i class="fa-solid fa-trash"></i></button>
    </div>
  `).join('');

  document.getElementById('subTotal').textContent = '₹' + total;
  document.getElementById('grandTotal').textContent = '₹' + total;
  document.getElementById('itemCount').textContent = count;
  document.getElementById('footerTotal').textContent = '₹' + total;
  billBox.style.display = 'block';
  footerBar.style.display = 'flex';

  // checkout btn update with ids
  const checkoutBtn = document.getElementById('checkoutBtn');
  if(checkoutBtn){
    checkoutBtn.onclick = ()=> {
      const ids = getUrlIds();
      const sid = ids.supplierId || items[0]?.ownerId || items[0]?.shopId || Object.keys(window.CartCore.getAllCarts())[0] || '';
      const shid = ids.shopId || sid;
      if(!sid){
        alert('Shop ID missing - shop se fir se add karo');
        return;
      }
      window.CartCore.goToCheckout(sid);
    };
  }
}

function updateQty(pid, newQty){
  const { supplierId } = getUrlIds();
  if(newQty < 1) return removeItem(pid);
  window.CartCore.updateQty(pid, newQty, supplierId || null);
}

function removeItem(pid){
  const { supplierId } = getUrlIds();
  window.CartCore.remove(pid, supplierId || null);
}

async function clearCart(){
  if(!confirm('Is shop ka cart saaf kar du?')) return;
  const { supplierId } = getUrlIds();
  await window.CartCore.clear(supplierId || null);
}

async function clearAllCart(){
  if(!confirm('Saare shops ka cart saaf kar du?')) return;
  await window.CartCore.clear();
}

function goBackToShop(){
  const { shopId } = getUrlIds();
  if(shopId){
    location.href = `/shop-templates/dairy/customer-view.html?shopId=${encodeURIComponent(shopId)}`;
  } else {
    history.back();
  }
}

window.CartCore.onChange(render);
window.CartCore.ready.then(()=> render(window.CartCore.cart));
// immediate render for fast UI (backup se)
setTimeout(()=> render(window.CartCore.cart), 100);
</script>
</body>
</html>
