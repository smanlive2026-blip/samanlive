<!-- LOCATION: public/shop-templates/common/cart/cart.html - V6 WORLD CLASS - CART EMPTY BUG FIXED - ALL CARTS SHOW + RETRY -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cart - SAMANLIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f8fafc;color:#0f172a;padding-bottom:120px}
.header{position:sticky;top:0;z-index:20;background:#fff;display:flex;align-items:center;gap:12px;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.header button{width:38px;height:38px;border:none;background:#f1f5f9;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.header h1{font-size:15px;font-weight:900;flex:1}
.wrap{max-width:760px;margin:0 auto;padding:14px}
.cart-group{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);border:1px solid #f1f5f9}
.cart-group-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cart-group-head b{font-size:14px;font-weight:900;display:flex;align-items:center;gap:6px}
.cart-group-head span{font-size:11px;background:#f1f5f9;padding:4px 8px;border-radius:20px;font-weight:700}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #f8fafc}
.item:last-child{border:none}
.item img{width:56px;height:56px;object-fit:contain;background:#f8fafc;border-radius:12px}
.item-info{flex:1}
.item-info b{font-size:13px;font-weight:800;line-height:1.2;display:block}
.item-info span{font-size:11px;color:#64748b;font-weight:600;display:block;margin-top:2px}
.qty-row{display:flex;align-items:center;gap:8px;margin-top:6px}
.qty-row button{width:28px;height:28px;border:1px solid #e2e8f0;background:#fff;border-radius:8px;cursor:pointer;font-weight:900;display:grid;place-items:center}
.qty-row span{font-size:13px;font-weight:900;min-width:22px;text-align:center}
.item-price{font-size:14px;font-weight:900;text-align:right}
.item-price small{display:block;font-size:11px;color:#94a3b8;font-weight:700}
.actions{display:flex;gap:10px;margin-top:12px}
.actions button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:900;font-size:13px;cursor:pointer}
.btn-checkout{background:#0f172a;color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-clear{background:#fff;border:1px solid #e2e8f0 !important;color:#ef4444}
.summary{background:#fff;border-radius:18px;padding:16px;margin-top:10px;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.summary-row{display:flex;justify-content:space-between;padding:6px 0;font-size:13px;font-weight:700}
.summary-row.total{border-top:1px dashed #e2e8f0;margin-top:6px;padding-top:10px;font-size:16px;font-weight:900}
.empty{padding:50px 20px;text-align:center;background:#fff;border-radius:18px}
.empty i{font-size:40px;color:#cbd5e1;display:block;margin-bottom:12px}
.empty b{font-size:16px;font-weight:900}
.empty p{font-size:12px;color:#64748b;margin-top:6px;font-weight:600}
.debug{font-size:10px;color:#94a3b8;margin-top:10px;background:#f8fafc;padding:8px;border-radius:8px;word-break:break-all}
</style>
<script src="../../../assets/js/role-hierarchy.js"></script>
<script src="../../common/core/api-core.js"></script>
<script src="./cart-core.js?v=6-world"></script>
<script src="./cart-count.js"></script>
</head>
<body>
<div class="header">
  <button onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <h1 id="headerTitle">Your Cart • Loading...</h1>
  <button onclick="location.reload()" style="width:34px"><i class="fa-solid fa-rotate"></i></button>
</div>

<div class="wrap" id="cartRoot">
  <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><b>Cart loading...</b><p>Checking all shops</p></div>
</div>

<script>
let RETRY_COUNT = 0;
const MAX_RETRY = 3;

function getQuery(){
  const p = new URLSearchParams(location.search);
  return {
    shopId: p.get('shopId') || p.get('shop_id') || p.get('supplierId') || '',
    supplierRole: p.get('supplierRole') || p.get('role') || 'shop_owner',
    shopType: p.get('shopType') || ''
  };
}

function esc(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function renderCart(){
  const root = document.getElementById('cartRoot');
  const q = getQuery();
  let supplierId = q.shopId || localStorage.getItem('last_shopId') || localStorage.getItem('last_supplierId') || '';

  // Wait for CartCore
  if(window.CartCore && window.CartCore.ready){
    try{ await window.CartCore.ready; }catch(e){ console.log('CartCore ready timeout'); }
  } else {
    await new Promise(r=> setTimeout(r, 600));
  }

  if(!window.CartCore){
    root.innerHTML = `<div class="empty"><i class="fa-solid fa-triangle-exclamation"></i><b>Cart Core not loaded</b><p>Refresh karo</p><button onclick="location.reload()" style="margin-top:12px;background:#0f172a;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:800">Reload</button></div>`;
    return;
  }

  // WORLD CLASS FIX: Get carts by 3 ways
  let groups = {};
  let flatItems = [];

  try{
    // 1. If supplierId present, try specific
    if(supplierId && supplierId!=='' && supplierId!=='null' && supplierId!=='undefined'){
      const specific = window.CartCore.getCartBySupplier ? window.CartCore.getCartBySupplier(supplierId) : [];
      if(specific && specific.length>0){
        groups[supplierId] = specific;
        flatItems = specific;
      }
    }

    // 2. If still empty, try all carts
    if(flatItems.length===0){
      const all = window.CartCore.getAllCarts ? window.CartCore.getAllCarts() : {};
      const keys = Object.keys(all||{});
      if(keys.length>0){
        groups = all;
        flatItems = Object.values(all).flat();
      } else {
        // Fallback getCart()
        const g = window.CartCore.getCart ? window.CartCore.getCart() : [];
        if(g && g.length>0){
          // Group by shopId
          g.forEach(it=>{
            const sid = it.shopId || it.shop_id || it.ownerId || 'unknown_shop';
            if(!groups[sid]) groups[sid]=[];
            groups[sid].push(it);
          });
          flatItems = g;
        }
      }
    }

    // 3. Final fallback - localStorage backup
    if(flatItems.length===0){
      try{
        const backupKeys = Object.keys(sessionStorage).filter(k=>k.startsWith('cart_bkp_'));
        backupKeys.forEach(k=>{
          try{
            const data = JSON.parse(sessionStorage.getItem(k)||'[]');
            if(Array.isArray(data) && data.length>0){
              const sid = k.replace('cart_bkp_','');
              if(!groups[sid]) groups[sid]=[];
              groups[sid] = groups[sid].concat(data);
              flatItems = flatItems.concat(data);
            }
          }catch(e){}
        });
      }catch(e){}
    }

  }catch(e){
    console.error('Cart grouping error', e);
  }

  console.log('🛒 Cart render attempt', RETRY_COUNT+1, 'supplierId=', supplierId, 'flatItems=', flatItems.length, 'groups=', Object.keys(groups));

  // RETRY LOGIC
  if(flatItems.length===0 && RETRY_COUNT < MAX_RETRY){
    RETRY_COUNT++;
    root.innerHTML = `<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><b>Retrying... (${RETRY_COUNT}/${MAX_RETRY})</b><p>Cart sync ho raha hai</p><div class="debug">supplierId=${esc(supplierId||'empty')} | last_shopId=${esc(localStorage.getItem('last_shopId')||'empty')} | CartCore ready=${!!window.CartCore}</div></div>`;
    setTimeout(renderCart, 1200);
    return;
  }

  if(flatItems.length===0){
    root.innerHTML = `<div class="empty">
      <i class="fa-solid fa-cart-shopping"></i>
      <b>Cart khali hai</b>
      <p>Main app se product Add to Cart karo<br>Ya Product Detail se Buy Now dabao</p>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
        <button onclick="location.href='/index.html'" style="background:#0f172a;color:#fff;border:none;padding:12px 18px;border-radius:12px;font-weight:800"><i class="fa-solid fa-house"></i> Main App Jao</button>
        <button onclick="location.reload()" style="background:#fff;border:1px solid #e2e8f0;padding:12px 18px;border-radius:12px;font-weight:800">Retry</button>
      </div>
      <div class="debug">
        Debug Info:<br>
        URL shopId=${esc(q.shopId||'empty')}<br>
        last_shopId=${esc(localStorage.getItem('last_shopId')||'empty')}<br>
        last_supplierId=${esc(localStorage.getItem('last_supplierId')||'empty')}<br>
        last_supplierRole=${esc(localStorage.getItem('last_supplierRole')||'empty')}<br>
        guest_id=${esc(sessionStorage.getItem('guest_id')||localStorage.getItem('guest_id')||'empty')}<br>
        CartCore exists=${!!window.CartCore} | Retry=${RETRY_COUNT}
      </div>
    </div>`;
    document.getElementById('headerTitle').textContent = 'Your Cart • Empty';
    return;
  }

  // Render groups
  let html = '';
  let grandTotal = 0;
  let grandCount = 0;

  Object.keys(groups).forEach(supplierIdKey=>{
    const items = groups[supplierIdKey];
    if(!items || items.length===0) return;
    const shopName = items[0].shopName || items[0].shopType || items[0].ownerRole || 'Shop';
    const supplierRole = items[0].ownerRole || items[0].shopOwnerRole || localStorage.getItem('last_supplierRole') || 'shop_owner';
    let groupTotal = 0;
    items.forEach(it=>{ groupTotal += Number(it.price||0) * Number(it.qty||it.quantity||1); });
    grandTotal += groupTotal;
    grandCount += items.length;

    html += `<div class="cart-group">
      <div class="cart-group-head">
        <b><i class="fa-solid fa-store"></i> ${esc(shopName)} • ${esc(supplierIdKey.slice(0,10))}</b>
        <span>${items.length} items • ${esc(supplierRole)}</span>
      </div>
      ${items.map((it, idx)=>{
        const price = Number(it.price||0);
        const qty = Number(it.qty||it.quantity||1);
        return `<div class="item">
          <img src="${esc(it.image||it.thumbnail||'/assets/default-product.png')}" onerror="this.src='/assets/default-product.png'">
          <div class="item-info">
            <b>${esc(it.name||it.title||'Product')}</b>
            <span>₹${price} • ${esc(it.unit||'pcs')} • Stock OK</span>
            <div class="qty-row">
              <button onclick="changeQty('${esc(supplierIdKey)}','${esc(it.productId||it._id)}', -1)"><i class="fa-solid fa-minus"></i></button>
              <span>${qty}</span>
              <button onclick="changeQty('${esc(supplierIdKey)}','${esc(it.productId||it._id)}', 1)"><i class="fa-solid fa-plus"></i></button>
              <button onclick="removeItem('${esc(supplierIdKey)}','${esc(it.productId||it._id)}')" style="margin-left:8px;color:#ef4444;border-color:#fecaca"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
          <div class="item-price">₹${(price*qty).toLocaleString('en-IN')}<small>${qty} × ₹${price}</small></div>
        </div>`;
      }).join('')}
      <div class="actions">
        <button class="btn-clear" onclick="clearGroup('${esc(supplierIdKey)}')"><i class="fa-solid fa-trash-can"></i> Clear</button>
        <button class="btn-checkout" onclick="goCheckout('${esc(supplierIdKey)}','${esc(supplierRole)}','${esc(items[0]?.shopType||'general')}')"><i class="fa-solid fa-bag-shopping"></i> Checkout ₹${groupTotal.toLocaleString('en-IN')}</button>
      </div>
    </div>`;
  });

  html += `<div class="summary">
    <div class="summary-row"><span>Subtotal (${grandCount} items)</span><span>₹${grandTotal.toLocaleString('en-IN')}</span></div>
    <div class="summary-row"><span>Delivery Fee</span><span style="color:#16a34a">FREE</span></div>
    <div class="summary-row total"><span>Grand Total</span><span>₹${grandTotal.toLocaleString('en-IN')}</span></div>
    <div style="font-size:11px;color:#64748b;margin-top:8px;font-weight:600"><i class="fa-solid fa-shield"></i> 100% Secure Checkout • ${Object.keys(groups).length} shop(s) • COD Available</div>
    ${Object.keys(groups).length>1? `<div style="margin-top:12px;display:flex;gap:8px"><button onclick="checkoutAll()" style="flex:1;background:#facc15;color:#000;border:none;padding:14px;border-radius:12px;font-weight:900"><i class="fa-solid fa-bolt"></i> Checkout All Shops - ₹${grandTotal.toLocaleString('en-IN')}</button></div>` : ''}
  </div>`;

  root.innerHTML = html;
  document.getElementById('headerTitle').textContent = `Your Cart • ${grandCount} items • ₹${grandTotal.toLocaleString('en-IN')}`;
  if(window.CartCount) window.CartCount.update();
}

async function changeQty(supplierId, productId, delta){
  try{
    if(window.CartCore && window.CartCore.updateQty){
      await window.CartCore.updateQty(supplierId, productId, delta);
    } else if(window.CartCore && window.CartCore.add){
      // fallback
      const all = window.CartCore.getAllCarts ? window.CartCore.getAllCarts() : {};
      const items = all[supplierId] || [];
      const it = items.find(i=> (i.productId||i._id)===productId);
      if(it){
        const newQty = Math.max(1, Number(it.qty||1)+delta);
        it.qty = newQty;
        if(window.CartCore.sync) await window.CartCore.sync(supplierId);
      }
    }
    setTimeout(renderCart, 300);
  }catch(e){ console.error(e); }
}

async function removeItem(supplierId, productId){
  if(!confirm('Remove this item?')) return;
  try{
    if(window.CartCore && window.CartCore.remove){
      await window.CartCore.remove(supplierId, productId);
    }
    renderCart();
  }catch(e){ console.error(e); }
}

async function clearGroup(supplierId){
  if(!confirm('Clear all items from this shop?')) return;
  try{
    if(window.CartCore && window.CartCore.clear) await window.CartCore.clear(supplierId);
    renderCart();
  }catch(e){ console.error(e); }
}

function goCheckout(supplierId, supplierRole, shopType){
  const url = `../checkout/checkout.html?shopId=${encodeURIComponent(supplierId)}&supplierId=${encodeURIComponent(supplierId)}&supplierRole=${encodeURIComponent(supplierRole||'shop_owner')}&shopType=${encodeURIComponent(shopType||'general')}&shopName=${encodeURIComponent(supplierId)}`;
  location.href = url;
}

function checkoutAll(){
  // Checkout first shop (or combined checkout if you build multi-shop)
  const keys = window.CartCore && window.CartCore.getAllCarts ? Object.keys(window.CartCore.getAllCarts()) : [];
  if(keys.length>0) goCheckout(keys[0], 'shop_owner', 'general');
  else alert('Cart empty');
}

document.addEventListener('DOMContentLoaded', ()=>{
  setTimeout(renderCart, 800);
  // Auto retry on focus
  window.addEventListener('focus', ()=>{ RETRY_COUNT=0; renderCart(); });
});
</script>
</body>
</html>
