<!-- LOCATION: common/cart/saved-for-later.html -->
<div id="savedForLater" class="saved-section" style="display:none">
  <h4 style="font-family:Outfit,sans-serif;font-weight:900;margin:16px 0 8px">Saved for Later 🔖</h4>
  <div id="savedItems"></div>
</div>
<script>
class SavedForLater {
  constructor(){ this.shopId = new URLSearchParams(location.search).get('shopId')||''; this.api=`/api/common/cart/${this.shopId}/saved`; }
  async load(){
    try{
      const res = await fetch(`${this.api}?t=${Date.now()}`, {credentials:'include', cache:'no-store'});
      const data = await res.json();
      const items = data.items || [];
      const wrapper = document.getElementById('savedForLater');
      const container = document.getElementById('savedItems');
      if(items.length===0){ wrapper.style.display='none'; return; }
      wrapper.style.display='block';
      container.innerHTML = items.map(it=>`
        <div style="background:#fff;border:1px solid #f1f5f9;border-radius:12px;padding:10px;display:flex;gap:10px;margin-bottom:8px">
          <img src="${it.image||'https://via.placeholder.com/48'}" style="width:48px;height:48px;border-radius:8px">
          <div style="flex:1"><b style="font-size:13px">${it.name}</b><br><span style="font-size:12px;color:#64748b">₹${it.price}</span></div>
          <button onclick="SavedForLater.moveToCart('${it.productId}')" style="background:#0f172a;color:#fff;border:none;padding:6px 10px;border-radius:8px;font-weight:800;font-size:12px">Move to Cart</button>
        </div>
      `).join('');
    }catch(e){ console.error(e); }
  }
  async moveToCart(productId){
    await fetch(`/api/common/cart/${this.shopId}/add`, { method:'POST', headers:{'Content-Type':'application/json'}, credentials:'include', body: JSON.stringify({ productId, qty:1 }) });
    this.load(); if(window.CartCore) CartCore.getCart();
  }
}
window.SavedForLater = new SavedForLater();
document.addEventListener('DOMContentLoaded', ()=> window.SavedForLater.load());
</script>
