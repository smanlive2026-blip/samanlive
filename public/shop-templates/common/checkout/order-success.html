<!-- LOCATION: public/shop-templates/common/checkout/order-success.html - ORDER SUCCESS - WORLD CLASS - NO LOCALSTORAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Done - Saman Lelo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f0fdf4;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{background:#fff;border-radius:20px;padding:32px 24px;text-align:center;max-width:420px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.08)}
.tick{width:84px;height:84px;background:#16a34a;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;color:#fff;font-size:40px}
h1{font-size:22px;font-weight:900}
p{color:#64748b;font-weight:700;font-size:14px;margin-top:8px}
.oid{background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:12px;margin:16px 0;font-weight:900;font-size:15px}
.btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:900;text-decoration:none;margin-top:10px;cursor:pointer;border:none;font-size:15px}
.btn-green{background:#16a34a;color:#fff}
.btn-light{background:#f1f5f9;color:#0f172a}
</style>
</head>
<body>
<div class="card">
  <div class="tick"><i class="fa-solid fa-check"></i></div>
  <h1>Order Lag Gaya!</h1>
  <p>Dukaan ko order mil gaya hai.<br>Jald hi confirm karke bhej denge.</p>
  <div class="oid">Order ID: <span id="oid">...</span></div>
  <a class="btn btn-green" id="ordersBtn" href="#">Mere Orders Dekho</a>
  <button class="btn btn-light" onclick="history.go(-2)">Aur Saman Lo</button>
</div>
<script>
const p = new URLSearchParams(location.search);
const shopId = p.get('shopId') || '';
const orderId = p.get('orderId') || '';
document.getElementById('oid').textContent = orderId || 'N/A';
document.getElementById('ordersBtn').href = `./my-orders.html?shopId=${shopId}`;
</script>
</body>
</html>
