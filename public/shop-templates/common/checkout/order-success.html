<!-- LOCATION: common/checkout/order-success.html - WORLD CLASS SUCCESS -->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Success</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&display=swap" rel="stylesheet"><style>body{margin:0;background:#f8fafc;font-family:Outfit,sans-serif}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}</style></head><body>
<div class="confetti" id="confetti"></div>
<div style="min-height:100vh;display:grid;place-items:center;padding:20px">
  <div style="background:#fff;width:100%;max-width:420px;border-radius:24px;padding:24px;text-align:center;border:1px solid #f1f5f9;box-shadow:0 20px 40px rgba(0,0,0,.08)">
    <div style="width:80px;height:80px;background:#10b981;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:36px;color:#fff">✓</div>
    <h1 style="font-weight:900;font-size:22px;margin:0">Order Placed! 🎉</h1>
    <p style="color:#64748b;font-size:13px;margin:8px 0 0">Thank you for shopping with us</p>
    <div style="background:#f8fafc;border-radius:12px;padding:12px;margin:16px 0;text-align:left"><div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:#64748b">Order ID</span><b id="orderId">#ORD12345</b></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><span style="color:#64748b">Amount</span><b id="orderAmount">₹0</b></div><div style="display:flex;justify-content:space-between;font-size:13px;margin-top:6px"><span style="color:#64748b">Payment</span><b id="orderPayment">COD</b></div></div>
    <button onclick="trackOrder()" style="width:100%;background:#0f172a;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;margin-bottom:8px">Track Order 📦</button>
    <button onclick="continueShopping()" style="width:100%;background:#f1f5f9;border:none;padding:12px;border-radius:12px;font-weight:800">Continue Shopping</button>
  </div>
</div>
<script>
const p = new URLSearchParams(location.search);
const shopId = p.get('shopId')||'';
const orderId = p.get('orderId')||'ORD'+Date.now();
const amount = p.get('amount')||'0';
document.getElementById('orderId').innerText = '#'+orderId;
document.getElementById('orderAmount').innerText = '₹'+amount;
function trackOrder(){ window.location.href = `../track/track-order.html?shopId=${shopId}&orderId=${orderId}`; }
function continueShopping(){ window.location.href = `/shop.html?shopId=${shopId}`; }
// Confetti
const confetti = document.getElementById('confetti');
for(let i=0;i<30;i++){ const d=document.createElement('div'); d.style.cssText=`position:absolute;top:-10px;left:${Math.random()*100}%;width:8px;height:8px;background:${['#10b981','#0ea5e9','#f59e0b','#ef4444','#8b5cf6'][Math.floor(Math.random()*5)]};border-radius:2px;animation:fall ${2+Math.random()*2}s linear forwards;animation-delay:${Math.random()}s`; confetti.appendChild(d); }
const style=document.createElement('style'); style.innerHTML='@keyframes fall{to{transform:translateY(100vh) rotate(720deg)}}'; document.head.appendChild(style);
setTimeout(()=>{ if(window.CartCore){ fetch(`/api/common/cart/${shopId}/clear?userId=${localStorage.getItem('guestId')||'guest'}`, {method:'POST'}); } },1000);
</script>
</body></html>
