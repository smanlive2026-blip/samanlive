<!-- LOCATION: public/shop-templates/common/checkout/my-orders.html - MY ORDERS - WORLD CLASS - NO LOCALSTORAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Orders - Saman Lelo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f8fafc}
header{position:sticky;top:0;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
header button{background:#f1f5f9;border:none;width:38px;height:38px;border-radius:10px;cursor:pointer}
header h1{font-size:18px;font-weight:900}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.order{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.top{display:flex;justify-content:space-between;align-items:center}
.top b{font-size:14px}
.badge{background:#fef9c3;color:#854d0e;padding:4px 10px;border-radius:99px;font-size:11px;font-weight:900;text-transform:capitalize}
.badge.delivered{background:#dcfce7;color:#166534}
.badge.cancelled{background:#fee2e2;color:#991b1b}
.items{margin-top:10px;border-top:1px dashed #e2e8f0;padding-top:10px}
.items div{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:#334155;padding:3px 0}
.total{display:flex;justify-content:space-between;font-weight:900;margin-top:8px;font-size:15px}
.date{color:#94a3b8;font-size:11px;font-weight:700;margin-top:6px}
.empty{background:#fff;border-radius:16px;padding:40px 20px;text-align:center;font-weight:800;color:#64748b}
</style>
</head>
<body>
<header>
  <button onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <h1>📦 My Orders</h1>
</header>
<div class="wrap" id="list"><div class="empty">Loading...</div></div>

<script>
const shopId = new URLSearchParams(location.search).get('shopId') || '';
function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

async function load(){
  const el = document.getElementById('list');
  try{
    let url = `/api/common/checkout/orders/my`;
    if(shopId) url += `?shopId=${shopId}`;
    const res = await fetch(url, { credentials:'include', cache:'no-store' });
    const data = await res.json();
    const orders = data.orders || data.data || [];
    if(!orders.length){ el.innerHTML = `<div class="empty">Abhi koi order nahi hai</div>`; return; }
    el.innerHTML = orders.map(o => `
      <div class="order">
        <div class="top"><b>${esc(o.orderId || o._id)}</b><span class="badge ${esc(o.orderStatus||'')}">${esc(o.orderStatus||'placed')}</span></div>
        <div class="items">${(o.items||[]).map(it=>`<div><span>${esc(it.name)} × ${it.quantity||it.qty||1}</span><span>₹${(it.price||0)*((it.quantity||it.qty||1))}</span></div>`).join('')}</div>
        <div class="total"><span>Total</span><span>₹${o.totalAmount||o.total||0}</span></div>
        <div class="date">${o.createdAt? new Date(o.createdAt).toLocaleString('en-IN') : ''} • ${esc(o.deliveryAddress?.city||'')} ${esc(o.deliveryAddress?.pincode||'')}</div>
      </div>
    `).join('');
  }catch(e){
    el.innerHTML = `<div class="empty">Orders load nahi hue</div>`;
  }
}
load();
</script>
</body>
</html>
