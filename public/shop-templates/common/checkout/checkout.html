<!-- LOCATION: public/shop-templates/common/checkout/checkout.html - V4 DAIRY FIXED -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Checkout - Dairy Shop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap">
<style>
*{font-family:'Outfit',sans-serif;box-sizing:border-box}
body{margin:0;background:#f8fafc;padding:12px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.item img{width:54px;height:54px;border-radius:10px;object-fit:cover}
#place-order-btn:disabled{opacity:.5}
.addr{padding:10px;border:1px solid #e2e8f0;border-radius:10px;margin-bottom:8px;cursor:pointer}
.addr.active{border-color:#000;background:#f1f5f9}
</style>
<!-- Core Deps -->
<script src="../../../assets/js/role-hierarchy.js"></script>
<script src="../../common/core/api-core.js"></script>
<script src="../cart/cart-core.js"></script>
<script src="../cart/cart-count.js"></script>
</head>
<body>

<div class="card">
  <div id="checkout-supplier-name" style="font-weight:800;font-size:18px">Loading shop...</div>
  <div style="font-size:12px;color:#64748b" id="checkout-supplier-role"></div>
</div>

<div class="card">
  <div id="checkout-items">Loading cart...</div>
  <hr style="margin:12px 0">
  <div>Subtotal: <span id="checkout-subtotal">₹0</span></div>
  <div>Commission (5%): <span id="checkout-commission">₹0</span></div>
  <div style="font-weight:800;font-size:18px">Total: <span id="checkout-total">₹0</span></div>
</div>

<div class="card">
  <h3 style="margin:0 0 8px 0">Delivery Address</h3>
  <div id="address-list">Loading addresses...</div>
  <button onclick="HierarchyCheckout.addNewAddress()" style="margin-top:8px;padding:8px 12px;border-radius:8px;border:1px dashed #94a3b8;background:#fff;width:100%">+ Add New Address</button>
</div>

<div class="card" id="gst-section" style="display:none">
  <label><input type="checkbox" id="gst-needed"> GST Invoice chahiye (Business order)</label>
  <input id="gst-number" placeholder="GST Number (22AAAAA0000A1Z5)" style="width:100%;margin-top:8px;padding:10px;border-radius:8px;border:1px solid #cbd5e1;display:none">
</div>

<div class="card">
  <h3 style="margin:0 0 8px 0">Payment Mode</h3>
  <label style="display:block;padding:8px 0"><input type="radio" name="paymentMode" value="cod" checked> COD - Cash on Delivery</label>
  <label style="display:block;padding:8px 0"><input type="radio" name="paymentMode" value="upi"> UPI</label>
  <label style="display:block;padding:8px 0"><input type="radio" name="paymentMode" value="online"> Online Payment</label>
  <label style="display:block;padding:8px 0"><input type="radio" name="paymentMode" value="wallet"> Wallet (Shop Owner/Manager/Area Manager)</label>
  <div id="wallet-balance" style="font-size:12px;color:#059669;margin-top:4px"></div>
</div>

<button id="place-order-btn" style="width:100%;padding:16px;background:#000;color:#fff;border-radius:12px;margin-top:12px;font-weight:800;font-size:16px;border:0">Place Order</button>

<script src="./hierarchy-checkout.js"></script>
</body>
</html>
