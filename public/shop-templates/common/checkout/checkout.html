<!-- LOCATION: common/checkout/checkout.html - MAIN CHECKOUT ENTRY -->
<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet"></head>
<body style="margin:0;background:#f8fafc;font-family:Outfit,sans-serif">
<div id="checkoutRoot"></div>
<script>
const shopId = new URLSearchParams(location.search).get('shopId')||'';
if(shopId){
  // Flow: address -> payment -> success
  window.location.href = `./address-select.html?shopId=${shopId}`;
} else {
  document.getElementById('checkoutRoot').innerHTML = `<div style="height:100vh;display:grid;place-items:center;text-align:center"><div><h2 style="font-weight:900">Shop ID missing</h2><a href="/" style="background:#0f172a;color:#fff;padding:10px 16px;border-radius:10px;text-decoration:none;font-weight:800">Go Home</a></div></div>`;
}
</script>
</body></html>
