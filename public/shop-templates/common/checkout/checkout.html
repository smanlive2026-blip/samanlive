<!-- LOCATION: public/shop-templates/common/checkout/checkout.html - CHECKOUT PAGE - WORLD CLASS - NO LOCALSTORAGE - ADDRESS + ORDER -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Saman Lelo</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f8fafc;padding-bottom:110px}
header{position:sticky;top:0;z-index:50;background:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
header button{background:#f1f5f9;border:none;width:38px;height:38px;border-radius:10px;cursor:pointer}
header h1{font-size:18px;font-weight:900}
.wrap{max-width:720px;margin:0 auto;padding:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.04)}
.card h3{font-size:15px;font-weight:900;margin-bottom:12px}
.item{display:flex;justify-content:space-between;font-weight:700;font-size:13px;padding:6px 0;color:#334155}
.row{display:flex;gap:8px}
.field{margin-bottom:10px;flex:1}
.field label{display:block;font-size:12px;font-weight:800;color:#475569;margin-bottom:5px}
.field input,.field textarea{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:10px;font-weight:700;font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:#16a34a}
.pay{display:flex;gap:10px}
.pay label{flex:1;border:2px solid #e2e8f0;border-radius:12px;padding:12px;text-align:center;font-weight:900;cursor:pointer;font-size:14px}
.pay input{display:none}
.pay label:has(input:checked){border-color:#16a34a;background:#f0fdf4;color:#16a34a}
.totalRow{display:flex;justify-content:space-between;font-weight:900;font-size:16px;border-top:1px dashed #e2e8f0;margin-top:8px;padding-top:12px}
.footer{position:fixed;left:0;right:0;bottom:0;background:#fff;padding:12px 16px;box-shadow:0 -4px 20px rgba(0,0,0,.08);max-width:720px;margin:0 auto}
.footer button{width:100%;background:#16a34a;color:#fff;border:none;padding:15px;border-radius:12px;font-weight:900;cursor:pointer;font-size:16px}
.footer button:disabled{opacity:.6}
#status{margin-top:10px;font-weight:800;font-size:13px;text-align:center}
</style>
</head>
<body>
<header>
  <button onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
  <h1>✅ Checkout</h1>
</header>

<div class="wrap">
  <div class="card">
    <h3>🛒 Order Summary</h3>
    <div id="summaryList"><p style="color:#64748b;font-weight:700;font-size:13px">Loading...</p></div>
    <div class="totalRow"><span>To Pay</span><span id="grandTotal">₹0</span></div>
  </div>

  <div class="card">
    <h3>📍 Delivery Address</h3>
    <div class="row">
      <div class="field"><label>Naam *</label><input id="addr_name" placeholder="Apna naam"></div>
      <div class="field"><label>Phone *</label><input id="addr_phone" type="tel" maxlength="10" placeholder="10 digit number"></div>
    </div>
    <div class="field"><label>Address Line 1 *</label><input id="addr_line1" placeholder="Makan no, gali, area"></div>
    <div class="field"><label>Address Line 2</label><input id="addr_line2" placeholder="Landmark (optional)"></div>
    <div class="row">
      <div class="field"><label>City *</label><input id="addr_city" placeholder="City"></div>
      <div class="field"><label>State</label><input id="addr_state" placeholder="State"></div>
      <div class="field"><label>Pincode *</label><input id="addr_pincode" maxlength="6" placeholder="6 digit"></div>
    </div>
  </div>

  <div class="card">
    <h3>💳 Payment</h3>
    <div class="pay">
      <label><input type="radio" name="pay" value="cod" checked> 💵 Cash on Delivery</label>
      <label><input type="radio" name="pay" value="upi"> 📱 UPI</label>
    </div>
    <div id="status"></div>
  </div>
</div>

<div class="footer">
  <button id="placeBtn" onclick="placeOrder()">Place Order • <span id="btnTotal">₹0</span></button>
</div>

<script src="../cart/cart-core.js?v=1"></script>
<script>
const shopId = new URLSearchParams(location.search).get('shopId') || '';
const statusEl = document.getElementById('status');

function esc(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderSummary(cart){
  const items = cart.items || [];
  if(!items.length){
    document.getElementById('summaryList').innerHTML = '<p style="color:#ef4444;font-weight:800;font-size:13px">Cart khali hai. Pehle kuch add karo.</p>';
    document.getElementById('placeBtn').disabled = true;
    return;
  }
  document.getElementById('summaryList').innerHTML = items.map(it =>
    `<div class="item"><span>${esc(it.name)} × ${it.qty}</span><span>₹${it.price * it.qty}</span></div>`
  ).join('');
  document.getElementById('grandTotal').textContent = '₹' + cart.total;
  document.getElementById('btnTotal').textContent = '₹' + cart.total;
}

window.CartCore.onChange(renderSummary);
window.CartCore.ready.then(()=> renderSummary(window.CartCore.cart));
renderSummary(window.CartCore.cart);

async function placeOrder(){
  const address = {
    name: document.getElementById('addr_name').value.trim(),
    phone: document.getElementById('addr_phone').value.trim(),
    line1: document.getElementById('addr_line1').value.trim(),
    line2: document.getElementById('addr_line2').value.trim(),
    city: document.getElementById('addr_city').value.trim(),
    state: document.getElementById('addr_state').value.trim(),
    pincode: document.getElementById('addr_pincode').value.trim()
  };
  if(!address.name ||!address.phone ||!address.line1 ||!address.city ||!address.pincode){
    statusEl.style.color = '#ef4444';
    statusEl.innerText = '❌ Naam, Phone, Address, City, Pincode - sab bharo';
    return;
  }
  if(!/^\d{10}$/.test(address.phone)){ statusEl.style.color='#ef4444'; statusEl.innerText='❌ Phone 10 digit ka hona chahiye'; return; }
  if(!/^\d{6}$/.test(address.pincode)){ statusEl.style.color='#ef4444'; statusEl.innerText='❌ Pincode 6 digit ka hona chahiye'; return; }

  const paymentMethod = document.querySelector('input[name="pay"]:checked')?.value || 'cod';
  const btn = document.getElementById('placeBtn');
  btn.disabled = true; btn.innerText = 'Order Lag Raha Hai...';
  statusEl.style.color = '#334155'; statusEl.innerText = '';

  try{
    const res = await fetch(`/api/common/checkout/${shopId}/place`, {
      method: 'POST', credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address, paymentMethod })
    });
    const data = await res.json();
    if(!data.success) throw new Error(data.message || 'Order fail');
    statusEl.style.color = '#16a34a';
    statusEl.innerText = `✅ Order Lag Gaya! Order ID: ${data.orderId}`;
    btn.innerText = '✅ Order Done';
    setTimeout(()=>{
      location.href = `./order-success.html?shopId=${shopId}&orderId=${data.orderId}`;
    }, 900);
  }catch(e){
    statusEl.style.color = '#ef4444';
    statusEl.innerText = '❌ ' + e.message;
    btn.disabled = false;
    btn.innerHTML = `Place Order • <span id="btnTotal">₹${window.CartCore.cart.total||0}</span>`;
  }
}
</script>
</body>
</html>
