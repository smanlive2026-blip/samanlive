<!-- Body ke andar jaha total dikhana hai -->
<div id="checkout-supplier-name" style="font-weight:bold"></div>
<div id="checkout-items"></div>
<div>Subtotal: <span id="checkout-subtotal">₹0</span></div>
<div>Commission: <span id="checkout-commission">₹0</span></div>
<div>Total: <span id="checkout-total">₹0</span></div>

<div id="address-list">Loading addresses...</div>

<div id="gst-section" style="display:none">
  <label><input type="checkbox" id="gst-needed"> GST Invoice chahiye</label>
  <input id="gst-number" placeholder="GST Number" style="width:100%;margin-top:6px;padding:8px">
</div>

<div>
  <label><input type="radio" name="paymentMode" value="cod" checked> COD</label>
  <label><input type="radio" name="paymentMode" value="upi"> UPI</label>
  <label><input type="radio" name="paymentMode" value="online"> Online</label>
  <label><input type="radio" name="paymentMode" value="wallet"> Wallet (Shop Owner/Manager)</label>
</div>

<button id="place-order-btn" style="width:100%;padding:14px;background:#000;color:#fff;border-radius:10px;margin-top:12px">Place Order</button>
