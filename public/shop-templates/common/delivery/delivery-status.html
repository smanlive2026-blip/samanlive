<!-- LOCATION: common/delivery/delivery-status.html - WORLD CLASS DELIVERY STATUS -->
<div id="deliveryStatusRoot" class="delivery-status-root">
  <div class="status-header">
    <button id="deliveryStatusBack" class="back-btn">‹</button>
    <b>Delivery Status</b>
    <button id="refreshStatus" class="refresh-btn">🔄 Refresh</button>
  </div>

  <div class="status-summary">
    <div class="summary-card today">
      <span class="summary-icon">📦</span>
      <div class="summary-info">
        <b id="todayDeliveries">0</b>
        <span>Today's Deliveries</span>
      </div>
    </div>
    <div class="summary-card pending">
      <span class="summary-icon">⏳</span>
      <div class="summary-info">
        <b id="pendingDeliveries">0</b>
        <span>Pending</span>
      </div>
    </div>
    <div class="summary-card completed">
      <span class="summary-icon">✅</span>
      <div class="summary-info">
        <b id="completedDeliveries">0</b>
        <span>Completed</span>
      </div>
    </div>
  </div>

  <div class="status-tabs">
    <button class="status-tab active" data-status="all">All</button>
    <button class="status-tab" data-status="out_for_delivery">On Way 🚚</button>
    <button class="status-tab" data-status="delivered">Delivered ✅</button>
    <button class="status-tab" data-status="pending">Pending ⏳</button>
  </div>

  <div id="deliveryStatusList" class="delivery-status-list">
    <div class="delivery-card skeleton">
      <div class="sk-line" style="width:60%;height:14px"></div>
      <div class="sk-line" style="width:40%;height:10px;margin-top:8px"></div>
    </div>
  </div>

  <div id="deliveryStatusEmpty" class="delivery-empty" style="display:none">
    <div class="empty-icon">🚚</div>
    <b>No deliveries found</b>
    <span>All deliveries will appear here</span>
  </div>
</div>

<style>
.delivery-status-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; }
.status-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:50%; font-size:20px; font-weight:900; cursor:pointer; }
.status-header b{ flex:1; font-weight:900; }
.refresh-btn{ background:#f1f5f9; border:none; padding:8px 12px; border-radius:8px; font-weight:800; font-size:12px; cursor:pointer; }
.status-summary{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:12px; }
.summary-card{ background:#fff; border:1px solid #f1f5f9; border-radius:12px; padding:12px; display:flex; gap:8px; align-items:center; }
.summary-icon{ font-size:20px; }
.summary-info b{ display:block; font-weight:900; font-size:18px; }
.summary-info span{ font-size:10px; color:#64748b; font-weight:700; text-transform:uppercase; }
.summary-card.today{ border-color:#0ea5e9; background:#f0f9ff; }
.summary-card.pending{ border-color:#f59e0b; background:#fffbeb; }
.summary-card.completed{ border-color:#10b981; background:#f0fdf4; }
.status-tabs{ display:flex; gap:6px; padding:0 12px 12px; overflow-x:auto; scrollbar-width:none; }
.status-tabs::-webkit-scrollbar{ display:none; }
.status-tab{ background:#fff; border:1px solid #e2e8f0; padding:8px 12px; border-radius:20px; font-weight:800; font-size:11px; white-space:nowrap; cursor:pointer; }
.status-tab.active{ background:#0f172a; color:#fff; border-color:#0f172a; }
.delivery-status-list{ padding:0 12px 12px; display:flex; flex-direction:column; gap:10px; }
.delivery-card{ background:#fff; border:1px solid #f1f5f9; border-radius:14px; padding:14px; display:flex; gap:10px; }
.delivery-card-left{ flex:1; }
.delivery-card-left b{ display:block; font-weight:900; font-size:13px; }
.delivery-card-left span{ display:block; font-size:11px; color:#64748b; font-weight:600; margin-top:2px; line-height:1.3; }
.delivery-status-badge{ font-size:10px; font-weight:900; padding:4px 8px; border-radius:20px; color:#fff; height:fit-content; }
.delivery-status-badge.out_for_delivery{ background:#f59e0b; }
.delivery-status-badge.delivered{ background:#10b981; }
.delivery-status-badge.pending{ background:#94a3b8; }
.delivery-status-badge.placed{ background:#0ea5e9; }
.delivery-empty{ text-align:center; padding:60px 20px; }
.empty-icon{ font-size:48px; margin-bottom:12px; }
.delivery-empty b{ display:block; font-weight:900; font-size:16px; }
.delivery-empty span{ font-size:12px; color:#64748b; font-weight:600; margin-top:4px; display:block; }
.sk-line{ background:#e2e8f0; border-radius:6px; animation:shimmer 1.5s infinite; }
@keyframes shimmer{ 0%{ opacity:.6; } 50%{ opacity:1; } 100%{ opacity:.6; } }
</style>

<script>
class DeliveryStatus {
  constructor(){
    this.shopId = new URLSearchParams(location.search).get('shopId') || '';
    this.deliveries = [];
    this.filter = 'all';
  }

  async init(){
    await this.loadDeliveries();
    this.bindEvents();
    this.initSocket();
  }

  async loadDeliveries(){
    try{
      let data;
      if(window.ApiCore){
        data = await window.ApiCore.get(`/api/common/orders/${this.shopId}`);
        this.deliveries = data.orders || data || [];
      } else {
        this.deliveries = JSON.parse(localStorage.getItem(`orders_${this.shopId}`)||'[]');
      }

      this.updateSummary();
      this.render();
    }catch(e){
      console.error(e);
      document.getElementById('deliveryStatusList').innerHTML = `<div style="text-align:center;padding:20px;color:#ef4444">Failed to load</div>`;
    }
  }

  updateSummary(){
    const today = new Date(); today.setHours(0,0,0,0);
    const todayDeliveries = this.deliveries.filter(o=> new Date(o.createdAt) >= today).length;
    const pending = this.deliveries.filter(o=> ['placed','confirmed','preparing','out_for_delivery'].includes(o.status)).length;
    const completed = this.deliveries.filter(o=> o.status==='delivered').length;

    document.getElementById('todayDeliveries').innerText = todayDeliveries;
    document.getElementById('pendingDeliveries').innerText = pending;
    document.getElementById('completedDeliveries').innerText = completed;
  }

  render(){
    const container = document.getElementById('deliveryStatusList');
    const empty = document.getElementById('deliveryStatusEmpty');

    let filtered = this.deliveries;
    if(this.filter!=='all') filtered = this.deliveries.filter(o=> (o.status||'placed')===this.filter);

    if(filtered.length===0){
      container.style.display='none';
      empty.style.display='block';
      return;
    }

    container.style.display='flex';
    empty.style.display='none';

    container.innerHTML = filtered.map(order=>`
      <div class="delivery-card" onclick="window.DeliveryStatusInstance.openOrder('${order.orderId||order._id}')">
        <div class="delivery-card-left">
          <b>#${(order.orderId||order._id||'').toString().slice(-6).toUpperCase()} • ${order.customerName||'Customer'}</b>
          <span>📍 ${order.customerAddress||order.address||'Address'}</span>
          <span>📦 ${order.items?.length||1} items • ₹${order.total||0} • ${order.paymentMethod||'COD'}</span>
          <span>⏰ ${new Date(order.createdAt).toLocaleString()} • 👦 ${order.deliveryBoyId||'Not assigned'}</span>
        </div>
        <span class="delivery-status-badge ${order.status||'placed'}">${(order.status||'placed').toUpperCase().replace('_',' ')}</span>
      </div>
    `).join('');
  }

  openOrder(orderId){
    window.location.href=`/shop-templates/common/orders/order-detail.html?shopId=${this.shopId}&orderId=${orderId}`;
  }

  bindEvents(){
    document.getElementById('deliveryStatusBack')?.addEventListener('click', ()=> history.back());
    document.getElementById('refreshStatus')?.addEventListener('click', ()=> this.loadDeliveries());

    document.querySelectorAll('.status-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        document.querySelectorAll('.status-tab').forEach(t=> t.classList.remove('active'));
        tab.classList.add('active');
        this.filter = tab.dataset.status;
        this.render();
      });
    });
  }

  initSocket(){
    if(window.SocketCore){
      window.SocketCore.on('delivery-update', ()=> this.loadDeliveries());
      window.SocketCore.on('order-updated', ()=> this.loadDeliveries());
      window.SocketCore.on('order-placed', ()=> this.loadDeliveries());
    }
  }
}

window.DeliveryStatusInstance = new DeliveryStatus();
document.addEventListener('DOMContentLoaded', ()=> window.DeliveryStatusInstance.init());
</script>
