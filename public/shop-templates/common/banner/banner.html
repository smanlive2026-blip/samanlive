<!-- LOCATION: common/banner/banner.html - WORLD CLASS BANNER COMPONENT -->
<div id="commonBannerWrapper" class="common-banner-wrapper">
  <!-- Loader -->
  <div id="bannerLoader" class="banner-loader">
    <div class="banner-skeleton"></div>
  </div>

  <!-- Banner Slider -->
  <div id="bannerSlider" class="banner-slider" style="display:none">
    <div id="bannerTrack" class="banner-track"></div>

    <!-- Dots -->
    <div id="bannerDots" class="banner-dots"></div>

    <!-- Arrows -->
    <button id="bannerPrev" class="banner-arrow prev">‹</button>
    <button id="bannerNext" class="banner-arrow next">›</button>
  </div>

  <!-- Empty State -->
  <div id="bannerEmpty" class="banner-empty" style="display:none">
    <p>🎉 No offers right now</p>
  </div>
</div>

<style>
.common-banner-wrapper{position:relative;width:100%;margin:12px 0;border-radius:16px;overflow:hidden;background:#f8fafc}
.banner-loader{padding:12px}
.banner-skeleton{height:160px;background:linear-gradient(90deg,#e2e8f0 25%,#f1f5f9 50%,#e2e8f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:16px}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.banner-slider{position:relative;width:100%;height:160px;overflow:hidden;border-radius:16px}
@media(min-width:768px){.banner-slider{height:220px}}
.banner-track{display:flex;transition:transform.4s cubic-bezier(.4,0,.2,1);height:100%}
.banner-slide{min-width:100%;height:100%;position:relative;background-size:cover;background-position:center;display:grid;place-items:center;cursor:pointer}
.banner-slide::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.6) 100%)}
.banner-content{position:relative;z-index:1;color:#fff;padding:16px;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.banner-content h3{font-family:Outfit,sans-serif;font-weight:900;font-size:18px;line-height:1.1;margin:0 0 4px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.banner-content p{font-size:12px;opacity:.9;margin:0;font-weight:600}
.banner-badge{position:absolute;top:12px;left:12px;z-index:2;background:#fff;color:#0f172a;font-weight:900;font-size:10px;padding:4px 8px;border-radius:20px;letter-spacing:.5px}
.banner-dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:2}
.banner-dot{width:6px;height:6px;border-radius:20px;background:rgba(255,255,255,.5);transition:all.3s;cursor:pointer}
.banner-dot.active{width:20px;background:#fff}
.banner-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;background:rgba(255,255,255,.9);border:none;width:32px;height:32px;border-radius:50%;font-size:20px;font-weight:900;cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.15);opacity:0;transition:.2s}
.banner-slider:hover.banner-arrow{opacity:1}
.banner-arrow.prev{left:8px}
.banner-arrow.next{right:8px}
.banner-empty{padding:20px;text-align:center;color:#94a3b8;font-weight:700;background:#f8fafc;border:1px dashed #e2e8f0;border-radius:16px}
</style>
