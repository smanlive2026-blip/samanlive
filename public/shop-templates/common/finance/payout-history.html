<!-- LOCATION: public/shop-templates/common/finance/payout-history.html - V1 FINAL - NO DEMO -->
<!-- RULE: Payout hamesha WalletTransaction se. Demo seed kabhi nahi. Nahi hai toh "No payout yet". -->
<div id="payoutRoot" class="payout-root">
  <div class="payout-header">
    <button id="payoutBack" class="back-btn">‹</button>
    <div>
      <b>Payout History</b>
      <span>Your withdrawals</span>
    </div>
  </div>

  <!-- SUMMARY -->
  <div class="payout-summary">
    <div class="payout-card"><span>Total Payout</span><b id="payoutTotal">₹0</b></div>
    <div class="payout-card"><span>Completed</span><b id="payoutCompleted">₹0</b></div>
    <div class="payout-card"><span>Pending</span><b id="payoutPending">₹0</b></div>
  </div>

  <!-- LIST -->
  <div class="payout-section">
    <b>History</b>
    <div id="payoutList"><span class="muted">No payout yet</span></div>
  </div>

  <!-- NOTE -->
  <div class="payout-note">
    <span>💡 Payout Wallet se hota hai. Wallet > Withdraw pe jake payout karo, yahan history aayegi.</span>
    <button id="goWalletBtn" class="wallet-btn">💰 Go to Wallet</button>
  </div>
</div>

<style>
.payout-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:20px; }
.payout-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:10px; font-size:20px; cursor:pointer; }
.payout-header b{ display:block; font-weight:900; font-size:17px; }
.payout-header span{ font-size:11px; color:#64748b; font-weight:600; }
.payout-summary{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:12px; }
.payout-card{ background:#fff; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.payout-card span{ display:block; font-size:11px; color:#64748b; font-weight:700; }
.payout-card b{ display:block; font-size:18px; font-weight:900; margin-top:6px; }
.payout-section{ background:#fff; margin:0 12px 12px; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.payout-section b{ display:block; font-weight:900; margin-bottom:10px; }
.payout-item{ background:#f8fafc; border-radius:10px; padding:12px; margin-top:8px; display:flex; justify-content:space-between; align-items:center; }
.payout-item .left b{ display:block; font-size:14px; font-weight:900; }
.payout-item .left span{ font-size:11px; color:#64748b; font-weight:600; }
.payout-item .right{ text-align:right; }
.payout-item .right b{ font-size:14px; font-weight:900; }
.badge{ display:inline-block; padding:3px 8px; border-radius:20px; font-size:10px; font-weight:900; margin-top:4px; }
.badge.completed{ background:#dcfce7; color:#15803d; }
.badge.pending{ background:#fef9c3; color:#a16207; }
.badge.failed{ background:#fee2e2; color:#dc2626; }
.muted{ font-size:12px; color:#94a3b8; }
.payout-note{ background:#fff; margin:0 12px; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.payout-note span{ display:block; font-size:12px; color:#64748b; font-weight:600; line-height:1.5; }
.wallet-btn{ width:100%; background:#0f172a; color:#fff; border:none; padding:12px; border-radius:10px; font-weight:900; margin-top:10px; cursor:pointer; }
</style>

<script>
class PayoutHistory {
  constructor() {
    this.shopId = new URLSearchParams(location.search).get('shopId') || localStorage.getItem('shopId') || '';
    this.payouts = [];
  }
  async init() {
    await this.load();
    this.bind();
  }
  async load() {
    try {
      if (window.Loader) Loader.show('Loading payouts...');
      if (!this.shopId) { this.render(); return; }
      let d = null;
      if (window.ApiCore && window.ApiCore.get) {
        d = await window.ApiCore.get(`/api/common/finance/${this.shopId}/payout-history`);
      } else {
        const r = await fetch(`/api/common/finance/${this.shopId}/payout-history`);
        d = await r.json();
      }
      // Server se aaya toh wahi, nahi aaya toh [] - Demo kabhi nahi
      this.payouts = (d && d.payouts) ? d.payouts : [];
      const total = (d && typeof d.total === 'number') ? d.total : this.payouts.reduce((s, p) => s + (p.amount || 0), 0);
      const completed = (d && typeof d.completed === 'number') ? d.completed : this.payouts.filter(p => p.status === 'completed').reduce((s, p) => s + (p.amount || 0), 0);
      const pending = (d && typeof d.pending === 'number') ? d.pending : this.payouts.filter(p => p.status === 'pending').reduce((s, p) => s + (p.amount || 0), 0);
      document.getElementById('payoutTotal').innerText = `₹${total.toLocaleString('en-IN')}`;
      document.getElementById('payoutCompleted').innerText = `₹${completed.toLocaleString('en-IN')}`;
      document.getElementById('payoutPending').innerText = `₹${pending.toLocaleString('en-IN')}`;
      this.render();
    } catch (e) {
      console.error(e);
      this.payouts = [];
      this.render();
    } finally { if (window.Loader) Loader.hide(); }
  }
  render() {
    const el = document.getElementById('payoutList');
    if (!this.payouts.length) {
      el.innerHTML = '<span class="muted">No payout yet. Wallet se Withdraw karoge toh yahan dikhega.</span>';
      return;
    }
    el.innerHTML = this.payouts.map(p => {
      const st = (p.status || 'completed').toLowerCase();
      const amt = p.amount || 0;
      const method = p.paymentMethod || p.method || 'wallet';
      const date = new Date(p.createdAt).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
      const title = p.title || p.description || 'Payout';
      return `<div class="payout-item">
        <div class="left"><b>${title}</b><span>${date} • ${method}</span><br><span class="badge ${st}">${st.toUpperCase()}</span></div>
        <div class="right"><b>-₹${amt.toLocaleString('en-IN')}</b></div>
      </div>`;
    }).join('');
  }
  bind() {
    document.getElementById('payoutBack')?.addEventListener('click', () => history.back());
    document.getElementById('goWalletBtn')?.addEventListener('click', () => {
      window.location.href = `/shop-templates/common/wallet/wallet.html?shopId=${this.shopId}`;
    });
  }
}
window.PayoutInstance = new PayoutHistory();
document.addEventListener('DOMContentLoaded', () => window.PayoutInstance.init());
</script>
