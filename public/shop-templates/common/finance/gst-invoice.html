<!-- LOCATION: public/shop-templates/common/finance/gst-invoice.html - V1 FINAL - NO HARDCODE GSTIN -->
<!-- RULE: GSTIN hamesha Shop.gst se. Hardcode 24ABCDE... kabhi nahi. Sample Product kabhi nahi. -->
<div id="gstRoot" class="gst-root">
  <div class="gst-header">
    <button id="gstBack" class="back-btn">‹</button>
    <div>
      <b>GST Invoice</b>
      <span>GST compliant billing</span>
    </div>
    <button id="gstSettingsBtn" class="settings-btn">⚙️ GST Settings</button>
  </div>

  <!-- SHOP GST CARD - SERVER SE -->
  <div class="gst-shop-info">
    <div class="shop-gst-card">
      <b id="gstShopName">Loading...</b>
      <span id="gstShopGstin">GSTIN: Loading...</span>
      <span id="gstNoGstin" style="display:none; color:#dc2626; font-weight:800;">⚠️ GSTIN nahi hai. Profile > Shop Info me GSTIN daalo, tabhi Invoice banega.</span>
    </div>
  </div>

  <!-- CUSTOMER -->
  <div class="gst-section">
    <b>👤 Customer</b>
    <input id="gstCustomerName" class="gst-input" placeholder="Customer Name (optional)" />
    <input id="gstCustomerPhone" class="gst-input" placeholder="Customer Phone (optional)" />
  </div>

  <!-- ITEMS -->
  <div class="gst-items-header">
    <b>Items</b>
    <button id="addGstItem" class="add-item-btn">+ Add Item</button>
  </div>
  <div id="gstItemsList" class="gst-items-list"></div>

  <!-- TOTALS -->
  <div class="gst-totals">
    <div class="total-row"><span>Taxable Amount</span><b id="gstTaxable">₹0</b></div>
    <div class="total-row"><span>CGST (50%)</span><b id="gstCgst">₹0</b></div>
    <div class="total-row"><span>SGST (50%)</span><b id="gstSgst">₹0</b></div>
    <div class="total-row grand"><span>Total (with GST)</span><b id="gstTotal">₹0</b></div>
  </div>

  <div class="gst-actions">
    <button id="createGstInvoice" class="primary-btn">🧾 Create Invoice</button>
  </div>

  <!-- PAST INVOICES -->
  <div class="gst-section">
    <b>🧾 Past Invoices</b>
    <div id="gstInvoiceList"><span class="muted">No invoice yet</span></div>
  </div>
</div>

<style>
.gst-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:20px; }
.gst-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:10px; font-size:20px; cursor:pointer; }
.gst-header b{ display:block; font-weight:900; font-size:17px; }
.gst-header span{ font-size:11px; color:#64748b; font-weight:600; }
.settings-btn{ margin-left:auto; background:#f1f5f9; border:none; padding:8px 12px; border-radius:10px; font-weight:800; font-size:12px; cursor:pointer; }
.gst-shop-info{ padding:12px; }
.shop-gst-card{ background:#fff; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.shop-gst-card b{ display:block; font-weight:900; }
.shop-gst-card span{ display:block; font-size:12px; color:#64748b; margin-top:4px; font-weight:600; }
.gst-section{ background:#fff; margin:0 12px 12px; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.gst-section b{ display:block; font-weight:900; margin-bottom:10px; }
.gst-input{ width:100%; border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px; font-weight:600; box-sizing:border-box; }
.gst-items-header{ display:flex; justify-content:space-between; align-items:center; padding:0 12px 10px; }
.gst-items-header b{ font-weight:900; }
.add-item-btn{ background:#0f172a; color:#fff; border:none; padding:8px 14px; border-radius:10px; font-weight:900; font-size:12px; cursor:pointer; }
.gst-items-list{ padding:0 12px 12px; display:flex; flex-direction:column; gap:10px; }
.gst-item-row{ background:#fff; border:1px solid #f1f5f9; border-radius:14px; padding:12px; }
.item-row-top{ display:flex; justify-content:space-between; gap:8px; margin-bottom:8px; }
.item-row-bottom{ display:grid; grid-template-columns:1fr 1fr 1fr 1fr; gap:8px; }
.item-field label{ display:block; font-size:10px; color:#64748b; font-weight:700; margin-bottom:4px; }
.remove-item-btn{ background:#fee2e2; border:none; width:30px; height:30px; border-radius:8px; cursor:pointer; }
.gst-totals{ background:#fff; margin:0 12px 12px; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.total-row{ display:flex; justify-content:space-between; padding:6px 0; font-size:13px; font-weight:600; }
.total-row.grand{ border-top:1px solid #f1f5f9; margin-top:6px; padding-top:10px; font-size:15px; font-weight:900; }
.gst-actions{ padding:0 12px 12px; }
.primary-btn{ width:100%; background:#0f172a; color:#fff; border:none; padding:14px; border-radius:12px; font-weight:900; cursor:pointer; }
.muted{ font-size:12px; color:#94a3b8; }
.inv-item{ background:#f8fafc; border-radius:10px; padding:10px; margin-top:8px; display:flex; justify-content:space-between; font-size:12px; font-weight:600; }
</style>

<script>
class GstInvoice {
  constructor() {
    this.shopId = new URLSearchParams(location.search).get('shopId') || localStorage.getItem('shopId') || '';
    this.shopGstin = '';
    this.shopName = '';
  }
  async init() {
    await this.loadShop();
    this.addItemRow(); // 1 khaali row - Sample Product nahi
    await this.loadInvoices();
    this.bind();
  }
  // Shop ka asli GSTIN - Server se
  async loadShop() {
    try {
      let d = null;
      if (window.ApiCore && window.ApiCore.get) {
        d = await window.ApiCore.get(`/api/common/finance/${this.shopId}/gst-invoice`);
      } else {
        const r = await fetch(`/api/common/finance/${this.shopId}/gst-invoice`);
        d = await r.json();
      }
      this.shopGstin = (d && d.gstin) ? d.gstin : '';
      this.shopName = (d && d.shopName) ? d.shopName : 'My Shop';
      document.getElementById('gstShopName').innerText = this.shopName;
      if (this.shopGstin) {
        document.getElementById('gstShopGstin').innerText = `GSTIN: ${this.shopGstin}`;
        document.getElementById('gstNoGstin').style.display = 'none';
      } else {
        document.getElementById('gstShopGstin').innerText = 'GSTIN: Not Set';
        document.getElementById('gstNoGstin').style.display = 'block';
      }
      if (d && d.invoices) this.renderInvoices(d.invoices);
    } catch (e) {
      document.getElementById('gstShopName').innerText = 'My Shop';
      document.getElementById('gstShopGstin').innerText = 'GSTIN: Not Set';
      document.getElementById('gstNoGstin').style.display = 'block';
    }
  }
  addItemRow() {
    const list = document.getElementById('gstItemsList');
    const row = document.createElement('div');
    row.className = 'gst-item-row';
    // Value khaali hai - Sample Product / 100 / 118 kabhi nahi
    row.innerHTML = `
      <div class="item-row-top">
        <input type="text" placeholder="Item Name" class="gst-input item-name" value="">
        <button class="remove-item-btn">✕</button>
      </div>
      <div class="item-row-bottom">
        <div class="item-field"><label>Qty</label><input type="number" class="gst-input item-qty" value="1" min="1"></div>
        <div class="item-field"><label>Rate (₹)</label><input type="number" class="gst-input item-rate" value="" placeholder="0"></div>
        <div class="item-field"><label>GST %</label><select class="gst-input item-gst"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option></select></div>
        <div class="item-field"><label>Amount</label><input type="text" class="gst-input item-amount" value="₹0" readonly></div>
      </div>`;
    row.querySelector('.remove-item-btn').addEventListener('click', () => { row.remove(); this.updateTotals(); });
    row.querySelectorAll('input,select').forEach(el => el.addEventListener('input', () => this.updateTotals()));
    list.appendChild(row);
    this.updateTotals();
  }
  getItems() {
    const rows = document.querySelectorAll('.gst-item-row');
    const items = [];
    rows.forEach(r => {
      const name = r.querySelector('.item-name').value.trim();
      const qty = Number(r.querySelector('.item-qty').value || 1);
      const rate = Number(r.querySelector('.item-rate').value || 0);
      const gstRate = Number(r.querySelector('.item-gst').value || 18);
      if (name && rate > 0) items.push({ name, qty, rate, gstRate });
    });
    return items;
  }
  updateTotals() {
    const items = this.getItems();
    let taxable = 0, gstAmt = 0;
    document.querySelectorAll('.gst-item-row').forEach(r => {
      const qty = Number(r.querySelector('.item-qty').value || 1);
      const rate = Number(r.querySelector('.item-rate').value || 0);
      const gr = Number(r.querySelector('.item-gst').value || 18);
      const amt = qty * rate;
      const g = Math.round(amt * gr / 100);
      r.querySelector('.item-amount').value = `₹${amt + g}`;
      taxable += amt; gstAmt += g;
    });
    document.getElementById('gstTaxable').innerText = `₹${taxable}`;
    document.getElementById('gstCgst').innerText = `₹${Math.round(gstAmt / 2)}`;
    document.getElementById('gstSgst').innerText = `₹${Math.round(gstAmt / 2)}`;
    document.getElementById('gstTotal').innerText = `₹${taxable + gstAmt}`;
  }
  async createInvoice() {
    if (!this.shopGstin) {
      if (window.Toast) Toast.show('Pehle GSTIN daalo - Profile > Shop Info me', 'error');
      return;
    }
    const items = this.getItems();
    if (!items.length) {
      if (window.Toast) Toast.show('Item ka naam aur Rate daalo', 'error');
      return;
    }
    try {
      const body = {
        customerName: document.getElementById('gstCustomerName').value.trim(),
        customerPhone: document.getElementById('gstCustomerPhone').value.trim(),
        items, gstRate: 18,
      };
      let d = null;
      if (window.ApiCore && window.ApiCore.post) {
        d = await window.ApiCore.post(`/api/common/finance/${this.shopId}/gst-invoice`, body);
      } else {
        const r = await fetch(`/api/common/finance/${this.shopId}/gst-invoice`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        d = await r.json();
      }
      if (d && d.success) {
        if (window.Toast) Toast.show(`Invoice ${d.invoiceNo} ban gaya`, 'success');
        document.getElementById('gstItemsList').innerHTML = '';
        this.addItemRow();
        this.updateTotals();
        await this.loadInvoices();
      } else {
        if (window.Toast) Toast.show((d && d.error) || 'Invoice nahi bana', 'error');
      }
    } catch (e) { if (window.Toast) Toast.show('Invoice nahi bana', 'error'); }
  }
  async loadInvoices() {
    try {
      let d = null;
      if (window.ApiCore && window.ApiCore.get) d = await window.ApiCore.get(`/api/common/finance/${this.shopId}/gst-invoice`);
      else { const r = await fetch(`/api/common/finance/${this.shopId}/gst-invoice`); d = await r.json(); }
      if (d && d.invoices) this.renderInvoices(d.invoices);
    } catch (e) {}
  }
  renderInvoices(list) {
    const el = document.getElementById('gstInvoiceList');
    if (!list || !list.length) { el.innerHTML = '<span class="muted">No invoice yet</span>'; return; }
    el.innerHTML = list.map(inv => {
      const g = inv.gst || {};
      return `<div class="inv-item"><div><b>${g.invoiceNo || inv.title || 'INV'}</b><br><span>${new Date(inv.createdAt).toLocaleDateString()} • ${g.customerName || 'Customer'}</span></div><b>₹${(g.totalAmount || inv.amount || 0).toLocaleString('en-IN')}</b></div>`;
    }).join('');
  }
  bind() {
    document.getElementById('gstBack')?.addEventListener('click', () => history.back());
    document.getElementById('addGstItem')?.addEventListener('click', () => this.addItemRow());
    document.getElementById('createGstInvoice')?.addEventListener('click', () => this.createInvoice());
    document.getElementById('gstSettingsBtn')?.addEventListener('click', () => { window.location.href = `/shop-templates/common/profile/shop-info.html?shopId=${this.shopId}`; });
  }
}
window.GstInvoiceInstance = new GstInvoice();
document.addEventListener('DOMContentLoaded', () => window.GstInvoiceInstance.init());
</script>
