<!-- LOCATION: public/shop-templates/common/finance/profit-loss.html - V1 FINAL - NO HARDCODE, NO Math.random -->
<!-- RULE: Revenue / Expense sab Server se. Nahi hai toh 0 + "No data yet". Math.random kabhi nahi. -->
<div id="plRoot" class="pl-root">
  <div class="pl-header">
    <button id="plBack" class="back-btn">‹</button>
    <div>
      <b>Profit &amp; Loss</b>
      <span id="plPeriod">This Month</span>
    </div>
    <select id="plPeriodSelect" class="period-select">
      <option value="today">Today</option>
      <option value="week">This Week</option>
      <option value="month" selected>This Month</option>
      <option value="year">This Year</option>
    </select>
  </div>

  <!-- SUMMARY CARDS -->
  <div class="pl-summary">
    <div class="pl-card revenue"><span>💰 Revenue</span><b id="plRevenue">₹0</b><small id="plRevenueSub">0 orders</small></div>
    <div class="pl-card expense"><span>💸 Expense</span><b id="plExpense">₹0</b><small>From Expense Manager</small></div>
    <div class="pl-card profit"><span>📈 Profit</span><b id="plProfit">₹0</b><small id="plProfitSub">0% margin</small></div>
  </div>

  <!-- BREAKDOWN -->
  <div class="detail-section">
    <b>💳 Revenue Breakdown</b>
    <div id="revenueBreakdown" class="breakdown-list"><span class="muted">No data yet</span></div>
  </div>

  <div class="detail-section">
    <b>💸 Expense Breakdown</b>
    <div id="expenseBreakdown" class="breakdown-list"><span class="muted">No expense yet</span></div>
  </div>

  <!-- METRICS -->
  <div class="detail-section">
    <b>📊 Key Metrics</b>
    <div class="metrics-grid">
      <div class="metric"><span>Avg Order Value</span><b id="metricAov">₹0</b></div>
      <div class="metric"><span>Total Orders</span><b id="metricOrders">0</b></div>
      <div class="metric"><span>Profit per Order</span><b id="metricPpo">₹0</b></div>
      <div class="metric"><span>Expense Ratio</span><b id="metricEr">0%</b></div>
    </div>
  </div>

  <!-- CHART -->
  <div class="detail-section">
    <b>📊 Revenue vs Expense</b>
    <canvas id="plChart" height="140"></canvas>
  </div>

  <div class="pl-actions">
    <button id="exportPl" class="secondary-btn">📄 Export Report</button>
    <button id="sharePl" class="primary-btn">↗️ Share Report</button>
  </div>
</div>

<style>
.pl-root{ font-family:Outfit,sans-serif; max-width:600px; margin:0 auto; background:#f8fafc; min-height:100vh; padding-bottom:20px; }
.pl-header{ background:#fff; display:flex; align-items:center; gap:12px; padding:14px 16px; position:sticky; top:0; z-index:10; border-bottom:1px solid #f1f5f9; }
.back-btn{ background:#f1f5f9; border:none; width:36px; height:36px; border-radius:10px; font-size:20px; cursor:pointer; }
.pl-header b{ display:block; font-weight:900; font-size:17px; }
.pl-header span{ font-size:11px; color:#64748b; font-weight:600; }
.period-select{ margin-left:auto; border:1px solid #e2e8f0; border-radius:10px; padding:8px; font-weight:800; font-size:12px; }
.pl-summary{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; padding:12px; }
.pl-card{ background:#fff; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.pl-card span{ display:block; font-size:11px; color:#64748b; font-weight:700; }
.pl-card b{ display:block; font-size:18px; font-weight:900; margin:6px 0 2px; }
.pl-card small{ font-size:10px; color:#94a3b8; font-weight:600; }
.pl-card.profit b{ color:#15803d; }
.pl-card.expense b{ color:#dc2626; }
.detail-section{ background:#fff; margin:0 12px 12px; border:1px solid #f1f5f9; border-radius:14px; padding:14px; }
.detail-section b{ display:block; font-weight:900; margin-bottom:10px; }
.breakdown-list{ display:flex; flex-direction:column; gap:8px; }
.breakdown-row{ display:flex; justify-content:space-between; font-size:13px; font-weight:600; }
.breakdown-row span:last-child{ font-weight:900; }
.muted{ font-size:12px; color:#94a3b8; }
.metrics-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.metric{ background:#f8fafc; border-radius:10px; padding:12px; }
.metric span{ display:block; font-size:11px; color:#64748b; font-weight:600; }
.metric b{ font-size:16px; margin-top:4px; }
.pl-actions{ display:flex; gap:10px; padding:0 12px; }
.primary-btn{ flex:1; background:#0f172a; color:#fff; border:none; padding:12px; border-radius:10px; font-weight:900; cursor:pointer; }
.secondary-btn{ flex:1; background:#fff; border:1px solid #e2e8f0; padding:12px; border-radius:10px; font-weight:900; cursor:pointer; }
</style>

<script>
class ProfitLoss {
  constructor() {
    this.shopId = new URLSearchParams(location.search).get('shopId') || localStorage.getItem('shopId') || '';
    this.period = 'month';
    this.data = null;
  }
  async init() {
    await this.load();
    this.bind();
  }
  async load() {
    try {
      if (window.Loader) Loader.show('Loading P&L...');
      if (!this.shopId) { this.renderEmpty(); return; }
      let d = null;
      if (window.ApiCore && window.ApiCore.get) {
        d = await window.ApiCore.get(`/api/common/finance/${this.shopId}/profit-loss?period=${this.period}`);
      } else {
        const r = await fetch(`/api/common/finance/${this.shopId}/profit-loss?period=${this.period}`);
        d = await r.json();
      }
      // Server se aaya toh wahi, nahi aaya toh 0 - Hardcode kabhi nahi
      this.data = d && d.success ? d : { revenue: 0, expense: 0, profit: 0, totalOrders: 0, avgOrderValue: 0, expenseByCategory: [], revenueByMethod: [] };
      this.render();
    } catch (e) {
      console.error(e);
      this.data = { revenue: 0, expense: 0, profit: 0, totalOrders: 0, avgOrderValue: 0, expenseByCategory: [], revenueByMethod: [] };
      this.render();
    } finally { if (window.Loader) Loader.hide(); }
  }
  render() {
    const d = this.data;
    const rev = d.revenue || 0, exp = d.expense || 0, prof = d.profit || 0;
    const orders = d.totalOrders || 0;
    const margin = rev > 0 ? Math.round(prof / rev * 100) : 0;
    const expRatio = rev > 0 ? Math.round(exp / rev * 100) : 0;
    const ppo = orders > 0 ? Math.round(prof / orders) : 0;

    document.getElementById('plRevenue').innerText = `₹${rev.toLocaleString('en-IN')}`;
    document.getElementById('plRevenueSub').innerText = `${orders} orders`;
    document.getElementById('plExpense').innerText = `₹${exp.toLocaleString('en-IN')}`;
    document.getElementById('plProfit').innerText = `₹${prof.toLocaleString('en-IN')}`;
    document.getElementById('plProfitSub').innerText = `${margin}% margin`;
    document.getElementById('metricAov').innerText = `₹${(d.avgOrderValue || 0).toLocaleString('en-IN')}`;
    document.getElementById('metricOrders').innerText = orders;
    document.getElementById('metricPpo').innerText = `₹${ppo.toLocaleString('en-IN')}`;
    document.getElementById('metricEr').innerText = `${expRatio}%`;

    // Revenue Breakdown - Server se aaya, hardcode nahi
    const revEl = document.getElementById('revenueBreakdown');
    if (d.revenueByMethod && d.revenueByMethod.length) {
      revEl.innerHTML = d.revenueByMethod.map(m => `<div class="breakdown-row"><span>${m.method || 'Other'} Orders</span><span>₹${(m.total || 0).toLocaleString('en-IN')}</span></div>`).join('');
    } else {
      revEl.innerHTML = '<span class="muted">No revenue yet. Order complete hoga toh yahan aayega.</span>';
    }

    // Expense Breakdown - Server se
    const expEl = document.getElementById('expenseBreakdown');
    if (d.expenseByCategory && d.expenseByCategory.length) {
      expEl.innerHTML = d.expenseByCategory.map(c => `<div class="breakdown-row"><span>${c.category}</span><span>₹${(c.total || 0).toLocaleString('en-IN')}</span></div>`).join('');
    } else {
      expEl.innerHTML = '<span class="muted">No expense yet. Expense Manager se add karo.</span>';
    }

    // Chart - Asli data se, Math.random kabhi nahi
    const canvas = document.getElementById('plChart');
    if (canvas && typeof Chart !== 'undefined') {
      if (window.plChart) window.plChart.destroy();
      window.plChart = new Chart(canvas.getContext('2d'), {
        type: 'bar',
        data: { labels: ['Revenue', 'Expense', 'Profit'], datasets: [{ data: [rev, exp, prof], backgroundColor: ['#10b981', '#ef4444', '#0f172a'], borderRadius: 8 }] },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } } }
      });
    }
  }
  renderEmpty() { this.data = { revenue: 0, expense: 0, profit: 0, totalOrders: 0, avgOrderValue: 0, expenseByCategory: [], revenueByMethod: [] }; this.render(); }
  bind() {
    document.getElementById('plBack')?.addEventListener('click', () => history.back());
    document.getElementById('plPeriodSelect')?.addEventListener('change', (e) => {
      this.period = e.target.value;
      document.getElementById('plPeriod').innerText = e.target.options[e.target.selectedIndex].text;
      this.load();
    });
    document.getElementById('exportPl')?.addEventListener('click', () => {
      const d = this.data || {};
      const txt = `Profit & Loss - ${this.period}\nRevenue: ${d.revenue || 0}\nExpense: ${d.expense || 0}\nProfit: ${d.profit || 0}\nOrders: ${d.totalOrders || 0}`;
      const blob = new Blob([txt], { type: 'text/plain' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pl_${this.shopId}_${this.period}.txt`; a.click();
    });
    document.getElementById('sharePl')?.addEventListener('click', () => {
      const d = this.data || {};
      const text = `Meri Dukaan P&L (${this.period}) - Revenue ₹${d.revenue || 0}, Expense ₹${d.expense || 0}, Profit ₹${d.profit || 0}`;
      if (navigator.share) navigator.share({ text }).catch(() => {});
      else if (window.Toast) Toast.show(text, 'success');
    });
  }
}
window.PLInstance = new ProfitLoss();
document.addEventListener('DOMContentLoaded', () => window.PLInstance.init());
</script>
