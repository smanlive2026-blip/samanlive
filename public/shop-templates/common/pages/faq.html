<!-- LOCATION: public/shop-templates/common/pages/faq.html - COMMON - Har Dukaan Ka FAQ Page -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAQ - Common</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f8fafc;color:#0f172a;padding:16px}
.top h2{font-size:20px;font-weight:900}
.top p{font-size:12px;color:#64748b;margin-top:2px}
.search{margin:14px 0}
.search input{width:100%;padding:12px;border:1px solid #e2e8f0;border-radius:12px;font-size:13px;background:#fff}
.cat{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.cat button{white-space:nowrap;padding:8px 14px;border:1px solid #e2e8f0;background:#fff;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
.cat button.active{background:#0f172a;color:#fff}
.item{background:#fff;border:1px solid #eef2f7;border-radius:14px;margin-bottom:10px;overflow:hidden}
.item-head{padding:14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.item-head b{font-size:13px}
.item-head span{font-size:16px;color:#64748b}
.item-body{display:none;padding:0 14px 14px;font-size:13px;color:#475569;line-height:1.6}
.item.open .item-body{display:block}
.item.open .item-head span{transform:rotate(45deg)}
.help{background:#fff;border:1px solid #eef2f7;border-radius:16px;padding:16px;text-align:center;margin-top:14px}
.help p{font-size:13px;color:#64748b}
.help a{display:inline-block;margin-top:10px;padding:10px 18px;background:#0f172a;color:#fff;text-decoration:none;border-radius:10px;font-weight:800;font-size:13px}
.empty{text-align:center;padding:30px;color:#94a3b8;font-weight:700}
</style>
</head>
<body>

<div class="top">
  <h2>❓ Aksar Puche Jaane Wale Sawaal</h2>
  <p id="shopNameTop">Loading...</p>
</div>

<div class="search">
  <input id="searchInput" placeholder="🔍 Sawaal dhoondho... jaise delivery, payment, return" oninput="renderFaq()">
</div>

<div class="cat" id="catBar">
  <button class="active" onclick="setCat('',this)">Sab</button>
  <button onclick="setCat('order',this)">Order</button>
  <button onclick="setCat('delivery',this)">Delivery</button>
  <button onclick="setCat('payment',this)">Payment</button>
  <button onclick="setCat('return',this)">Return</button>
  <button onclick="setCat('other',this)">Aur</button>
</div>

<div id="faqList"></div>

<div class="help">
  <p>Jawaab nahi mila? Dukaan se seedha baat karo</p>
  <a href="#" id="contactBtn">📞 Contact Karo →</a>
</div>

<script>
// ===== SHOP ID URL SE =====
const params = new URLSearchParams(location.search);
const SHOP_ID = params.get('shopId') || params.get('id') || localStorage.getItem('last_shopId') || '';
let CURRENT_CAT = '';

// ===== DEFAULT FAQ - Har Dukaan Ke Liye Same Kaam Karega =====
const DEFAULT_FAQ = [
  { cat:'order', q:'Order kaise karu?', a:'Product ko cart me daalo, address daalo aur Place Order dabao. Order dukaan wale ko turant mil jayega.' },
  { cat:'order', q:'Order cancel kaise karu?', a:'Jab tak order Packed nahi hua, tab tak My Orders me jaake Cancel kar sakte ho. Packed ke baad dukaan wale ko call karo.' },
  { cat:'order', q:'Order ka status kaise dekhu?', a:'My Orders me jaake apna order kholo, wahan Placed → Confirmed → Packed → Delivered sab dikhega.' },
  { cat:'delivery', q:'Delivery kitne time me aayegi?', a:'Aam taur pe same day delivery hoti hai. Tumhare area ke hisaab se 1-3 ghante lag sakte hain.' },
  { cat:'delivery', q:'Delivery charge kitna hai?', a:'Delivery charge order ke total aur tumhare area pe depend karta hai. Checkout pe saaf-saaf dikh jayega.' },
  { cat:'delivery', q:'Delivery Boy ko kaise pehchanu?', a:'Jab order assign hoga, tumhe delivery boy ka naam aur phone dikh jayega. Wahi banda aayega.' },
  { cat:'payment', q:'Kaunse payment chalenge?', a:'Cash on Delivery (COD), UPI, aur Card - teeno chalenge. Checkout pe apna option chuno.' },
  { cat:'payment', q:'Online payment fail ho gaya toh?', a:'Paise kat gaye hain toh 3-5 din me wapas aa jayenge. Order fail dikhe toh dukaan wale ko call karo, wo check kar lega.' },
  { cat:'payment', q:'Kya COD pe extra charge hai?', a:'Nahi, COD pe koi extra charge nahi hai. Jo total dikha hai, wahi dena hai.' },
  { cat:'return', q:'Product kharab aaya toh kya karu?', a:'Delivery ke 24 ghante ke andar dukaan wale ko photo ke saath WhatsApp karo. Wo return / replace kar dega.' },
  { cat:'return', q:'Return ka paisa kab milega?', a:'Product wapas milte hi 2-3 din me refund ho jayega. COD wale ko cash wapas milega.' },
  { cat:'other', q:'Dukaan ka time kya hai?', a:'Aam taur pe subah 9 se raat 9 baje tak. Apni dukaan ka sahi time Contact page pe dekh lo.' },
  { cat:'other', q:'Bulk me maal chahiye toh?', a:'Bulk ke liye dukaan wale ko WhatsApp karo ya Contact page se message bhejo. Bulk ka rate alag hota hai.' },
];

function setCat(cat, btn){
  CURRENT_CAT = cat;
  document.querySelectorAll('#catBar button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderFaq();
}

function renderFaq(){
  const q = (document.getElementById('searchInput').value||'').toLowerCase();
  // Dukaan ka custom FAQ - agar dukaan ne apna banaya hai toh wo bhi dikhega
  let custom = [];
  try{ custom = JSON.parse(localStorage.getItem('custom_faq_'+SHOP_ID)||'[]'); }catch(e){}
  const all = [...custom, ...DEFAULT_FAQ];
  const filtered = all.filter(f => {
    if(CURRENT_CAT && f.cat !== CURRENT_CAT) return false;
    if(q && !(f.q.toLowerCase().includes(q) || f.a.toLowerCase().includes(q))) return false;
    return true;
  });
  const el = document.getElementById('faqList');
  if(!filtered.length){ el.innerHTML = '<div class="empty">Koi sawaal nahi mila<br><span style="font-size:12px">Dusra word try karo ya Contact karo</span></div>'; return; }
  el.innerHTML = filtered.map((f,i)=>`
    <div class="item" onclick="this.classList.toggle('open')">
      <div class="item-head"><b>${f.q}</b><span>+</span></div>
      <div class="item-body">${f.a}</div>
    </div>
  `).join('');
}

async function loadShop(){
  document.getElementById('contactBtn').href = `contact.html?shopId=${SHOP_ID}`;
  if(!SHOP_ID){ document.getElementById('shopNameTop').innerText=''; return; }
  try{
    const API_BASE = window.API_BASE || window.location.origin;
    let shop = null;
    try{ const res = await fetch(`${API_BASE}/api/shops/${SHOP_ID}`); const d = await res.json(); shop = d.shop || d.data || d; }catch(e){}
    if(!shop || !shop.shopName){ try{ shop = JSON.parse(localStorage.getItem('last_shop')||'{}'); }catch(e){ shop={}; } }
    document.getElementById('shopNameTop').innerText = shop.shopName ? `${shop.shopName} - FAQ` : '';
  }catch(e){}
}

loadShop();
renderFaq();
</script>
</body>
</html>
