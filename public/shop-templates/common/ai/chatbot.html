<!-- LOCATION: common/ai/chatbot.html - WORLD CLASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f8fafc;height:100vh;display:flex;flex-direction:column}
.header{height:60px;background:#0f172a;color:#fff;display:flex;align-items:center;padding:0 20px;font-weight:800;gap:10px}
.chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.4}
.user{align-self:flex-end;background:#0ea5e9;color:#fff;border-bottom-right-radius:4px}
.ai{align-self:flex-start;background:#fff;border:1px solid #e2e8f0;border-bottom-left-radius:4px}
.input-area{padding:12px;background:#fff;border-top:1px solid #e2e8f0;display:flex;gap:10px}
.input-area input{flex:1;padding:12px 16px;border:1px solid #e2e8f0;border-radius:30px;outline:none;font-weight:600}
.input-area button{background:#0f172a;color:#fff;border:none;width:44px;height:44px;border-radius:50%;cursor:pointer}
</style>
</head>
<body>
<div class="header">🤖 SamanLive AI - <span id="shopName">Shop Assistant</span></div>
<div class="chat" id="chatBox">
  <div class="msg ai">Namaste! 🙏 Mai aapki madad ke liye hu. Product, price ya order ke baare me puchho.</div>
</div>
<div class="input-area">
  <input id="chatInput" placeholder="Type your question..." onkeypress="if(event.key==='Enter') sendMsg()">
  <button onclick="sendMsg()">➤</button>
</div>
<script src="./chatbot.js"></script>
</body>
</html>
