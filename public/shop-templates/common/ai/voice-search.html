<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Search</title>
<style>
body{font-family:'Outfit',sans-serif;background:#0f172a;color:#fff;height:100vh;display:grid;place-items:center;text-align:center}
.mic{width:120px;height:120px;background:#0ea5e9;border-radius:50%;display:grid;place-items:center;font-size:50px;cursor:pointer;box-shadow:0 0 0 0 rgba(14,165,233,.7);animation:pulse 1.5s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(14,165,233,.7)}70%{box-shadow:0 0 0 30px rgba(14,165,233,0)}100%{box-shadow:0 0 0 0 rgba(14,165,233,0)}}
#result{margin-top:20px;font-size:20px;font-weight:800}
</style>
</head>
<body>
<div>
  <div class="mic" onclick="startVoice()">🎤</div>
  <div id="result">Tap mic & bolo - "Doodh chahiye"</div>
  <div id="products" style="margin-top:20px"></div>
</div>
<script src="./voice-search.js"></script>
</body>
</html>
