<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electronics Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 40px 20px; text-align: center;
            box-shadow: 0 10px 40px rgba(102,126,234,0.3);
        }
        .header h1 { font-size: 36px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 16px; }
        
        .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
        .filters {
            background: white; padding: 20px; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 30px;
            display: flex; gap: 15px; flex-wrap: wrap;
        }
        .filters select, .filters input {
            padding: 12px 16px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px;
        }
        
        .product-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        
        .product-card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); transition: all 0.3s;
        }
        .product-card:hover { transform: translateY(-8px); box-shadow: 0 12px 40px rgba(102,126,234,0.2); }
        
        .product-image {
            width: 100%; height: 220px; background: #f1f5f9;
            display: flex; align-items: center; justify-content: center;
            font-size: 60px; color: #cbd5e1;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .product-info { padding: 20px; }
        .product-brand { color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .product-name { font-size: 18px; font-weight: 700; color: #1e293b; margin: 8px 0; }
        .product-specs { font-size: 12px; color: #94a3b8; margin-bottom: 12px; }
        
        .price-section { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .price { font-size: 24px; font-weight: 800; color: #667eea; }
        .mrp { font-size: 14px; color: #94a3b8; text-decoration: line-through; }
        .discount { background: #dcfce7; color: #166534; padding: 4px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
        
        .warranty { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #64748b; margin-bottom: 15px; }
        
        .btn-group { display: flex; gap: 10px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 10px;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-buy { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-buy:hover { transform: scale(1.05); }
        .btn-whatsapp { background: #25D366; color: white; }
        
        .stock-badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }
        .in-stock { background: #dcfce7; color: #166534; }
        .out-stock { background: #fee2e2; color: #991b1b; }
        
        #loader { text-align: center; padding: 100px 20px; font-size: 18px; color: #64748b; }
        
        .contact-float {
            position: fixed; bottom: 30px; right: 30px;
            background: #25D366; color: white; width: 60px; height: 60px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 28px; box-shadow: 0 8px 30px rgba(37,211,102,0.4); cursor: pointer;
            z-index: 999;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-mobile-alt"></i> <span id="shopName">Electronics Store</span></h1>
        <p>Best Deals on Mobile, Laptop, TV & More</p>
    </div>

    <div class="container">
        <!-- Filters -->
        <div class="filters">
            <select id="categoryFilter">
                <option value="">All Categories</option>
                <option>Mobile</option><option>Laptop</option><option>TV</option>
                <option>AC</option><option>Headphones</option><option>Accessories</option>
            </select>
            <select id="brandFilter">
                <option value="">All Brands</option>
            </select>
            <input type="text" id="searchInput" placeholder="Search products...">
        </div>

        <!-- Products -->
        <div id="loader">Loading products...</div>
        <div class="product-grid" id="productGrid" style="display:none;"></div>
    </div>

    <!-- Floating WhatsApp Button -->
    <div class="contact-float" onclick="contactShop()">
        <i class="fab fa-whatsapp"></i>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shopId');
        let allProducts = [];
        let shopData = null;

        if (!shopId) {
            document.getElementById('loader').innerText = 'Invalid Shop Link';
        }

        async function loadShop() {
            try {
                const res = await fetch(`/api/local-market/shops/${shopId}`);
                shopData = await res.json();
                
                if (!shopData._id) {
                    document.getElementById('loader').innerText = 'Shop Not Found';
                    return;
                }

                document.getElementById('shopName').innerText = shopData.shopName;
                allProducts = shopData.items || shopData.products || [];
                
                loadBrands();
                displayProducts(allProducts);
                document.getElementById('loader').style.display = 'none';
                document.getElementById('productGrid').style.display = 'grid';

            } catch (err) {
                document.getElementById('loader').innerText = 'Failed to load shop';
            }
        }

        function loadBrands() {
            const brands = [...new Set(allProducts.map(p => p.brand).filter(Boolean))];
            const brandFilter = document.getElementById('brandFilter');
            brands.forEach(b => {
                brandFilter.innerHTML += `<option>${b}</option>`;
            });
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            
            if (products.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding:60px;">
                    <i class="fa fa-box-open" style="font-size:60px; color:#cbd5e1;"></i>
                    <h3>No Products Found</h3>
                </div>`;
                return;
            }

            grid.innerHTML = products.map(product => {
                const discount = product.mrp? Math.round(((product.mrp - product.price) / product.mrp) * 100) : 0;
                const inStock = (product.stock || 0) > 0;
                
                return `
                <div class="product-card">
                    <div class="product-image">
                        ${product.image? `<img src="${product.image}" alt="${product.name}">` : `<i class="fa fa-mobile-alt"></i>`}
                    </div>
                    <div class="product-info">
                        <div class="product-brand">${product.brand || 'Generic'}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-specs">${product.specs?.slice(0,2).join(' • ') || product.category}</div>
                        
                        <div class="price-section">
                            <div class="price">₹${product.price}</div>
                            ${product.mrp? `<div class="mrp">₹${product.mrp}</div>` : ''}
                            ${discount > 0? `<div class="discount">${discount}% OFF</div>` : ''}
                        </div>
                        
                        <div class="warranty">
                            <i class="fa fa-shield-alt"></i> ${product.warranty || '1 Year Warranty'}
                        </div>
                        
                        <div style="margin-bottom:15px;">
                            <span class="stock-badge ${inStock? 'in-stock' : 'out-stock'}">
                                ${inStock? `In Stock: ${product.stock}` : 'Out of Stock'}
                            </span>
                        </div>
                        
                        <div class="btn-group">
                            <button class="btn btn-buy" onclick="orderProduct('${product.name}')" ${!inStock? 'disabled' : ''}>
                                <i class="fa fa-shopping-cart"></i> Order Now
                            </button>
                            <button class="btn btn-whatsapp" onclick="whatsappProduct('${product.name}')">
                                <i class="fab fa-whatsapp"></i>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // Filters
        document.getElementById('categoryFilter').onchange = filterProducts;
        document.getElementById('brandFilter').onchange = filterProducts;
        document.getElementById('searchInput').oninput = filterProducts;

        function filterProducts() {
            const cat = document.getElementById('categoryFilter').value;
            const brand = document.getElementById('brandFilter').value;
            const search = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = allProducts;
            if (cat) filtered = filtered.filter(p => p.category === cat);
            if (brand) filtered = filtered.filter(p => p.brand === brand);
            if (search) filtered = filtered.filter(p => p.name.toLowerCase().includes(search));
            
            displayProducts(filtered);
        }

        function orderProduct(productName) {
            alert(`Order placed for ${productName}! Shop will contact you soon.`);
        }

        function whatsappProduct(productName) {
            const msg = `Hi, I want to buy ${productName} from ${shopData.shopName}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function contactShop() {
            const msg = `Hi, I visited your electronics store online`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        loadShop();
    </script>
</body>
</html>
