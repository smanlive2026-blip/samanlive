<!-- LOCATION: public/shop-templates/kirana/user-view.html - V10 WORLD CLASS USER VIEW - PURA COMMON CONNECTED - FULL PRODUCTION -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirana Store - SamanLive - World Class User View</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--green:#10b981;--dark:#020617;--bg:#f8fafc;--border:#e2e8f0}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:var(--bg);color:var(--dark)}
.header{height:60px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:18px;display:flex;gap:8px;align-items:center}.logo span{background:var(--dark);color:#fff;padding:4px 8px;border-radius:8px}
.search{flex:1;max-width:400px;margin:0 16px;display:flex;align-items:center;gap:8px;background:#f8fafc;border:1px solid var(--border);padding:8px 12px;border-radius:12px}
.search input{border:none;background:transparent;outline:none;width:100%;font-weight:600;font-size:13px}
.actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--border);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative}
.icon-btn.badge{position:absolute;top:-6px;right:-6px;background:#ef4444;color:#fff;font-size:9px;font-weight:900;padding:2px 5px;border-radius:20px;min-width:16px;text-align:center}
.banner{margin:16px;border-radius:20px;background:linear-gradient(135deg,#10b981,#059669);color:#fff;padding:20px;display:flex;justify-content:space-between;align-items:center}
.shop-info{padding:0 16px;display:flex;gap:12px;align-items:center;margin-top:10px;flex-wrap:wrap}
.shop-info.pill{background:#fff;border:1px solid var(--border);padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800;display:flex;gap:6px;align-items:center}
.shop-info.pill.open{background:#dcfce7;color:#15803d;border-color:#bbf7d0}.pill.closed{background:#fee2e2;color:#b91c1c}
.cats{display:flex;gap:8px;overflow:auto;padding:12px 16px;scrollbar-width:none}.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:8px 14px;border-radius:20px;background:#fff;border:1px solid var(--border);font-weight:800;font-size:12px;cursor:pointer}
.cat.active{background:var(--dark);color:#fff;border-color:var(--dark)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:12px 16px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
.card{background:#fff;border-radius:18px;border:1px solid #f1f5f9;overflow:hidden;transition:.2s;position:relative}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 24px rgba(0,0,0,.06)}
.card img{width:100%;height:140px;object-fit:cover;background:#f8fafc}
.card.info{padding:10px}.card b{font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:10px;color:#94a3b8;margin-top:2px;font-weight:600}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:900;font-size:14px}.price del{font-size:10px;color:#94a3b8;margin-left:4px}
.add{width:32px;height:32px;border-radius:10px;background:var(--dark);color:#fff;border:none;display:grid;place-items:center;cursor:pointer}
.wish{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid var(--border);display:grid;place-items:center;cursor:pointer}
.wish.active{color:#ef4444;background:#fff}
.cart-drawer{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);z-index:200;display:none}
.cart-drawer.open{display:block}
.cart-panel{position:absolute;right:0;top:0;width:360px;max-width:90vw;height:100%;background:#fff;display:flex;flex-direction:column}
.cart-head{padding:16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-weight:900}
.cart-items{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.cart-foot{padding:14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px}
.btn{padding:12px;border-radius:12px;border:none;font-weight:900;cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center;font-size:13px}
.btn-dark{background:var(--dark);color:#fff}.btn-green{background:var(--green);color:#fff}
.btn-outline{background:#fff;border:1px solid var(--border);color:var(--dark)}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 18px;border-radius:30px;font-weight:700;font-size:12px;display:none;z-index:300}
.empty{grid-column:1/-1;text-align:center;padding:60px 20px;background:#fff;border-radius:20px;border:1px dashed var(--border)}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span id="shopLogoLetter">K</span> <span id="shopName">Kirana Store</span> <small id="shopStatusBadge" class="pill open" style="margin-left:8px;font-size:9px;padding:3px 6px">OPEN</small></div>
  <div class="search"><i class="fa-solid fa-magnifying-glass" style="color:#94a3b8"></i><input id="searchInput" placeholder="Search atta, dal, oil..."><i class="fa-solid fa-microphone" style="color:#94a3b8;cursor:pointer" id="voiceSearchBtn"></i></div>
  <div class="actions">
    <button class="icon-btn" id="wishlistBtn"><i class="fa-regular fa-heart"></i><span class="badge" id="wishlistCount" style="display:none">0</span></button>
    <button class="icon-btn" id="shareBtn"><i class="fa-solid fa-share-nodes"></i></button>
    <button class="icon-btn" id="cartBtn"><i class="fa-solid fa-cart-shopping"></i><span class="badge" id="cartCount">0</span></button>
    <button class="icon-btn" id="profileBtn"><i class="fa-regular fa-user"></i></button>
  </div>
</div>

<div class="banner" id="shopBanner">
  <div><h2 style="font-weight:900" id="bannerTitle">Fresh Kirana Daily</h2><p style="font-size:12px;opacity:.9;margin-top:4px" id="bannerSub">Free delivery in 30 mins • COD available</p></div>
  <div style="font-size:36px">🛒</div>
</div>

<div class="shop-info">
  <div class="pill open" id="openPill"><i class="fa-solid fa-circle" style="font-size:8px"></i> <span id="openText">Open Now</span></div>
  <div class="pill"><i class="fa-solid fa-location-dot"></i> <span id="shopArea">Local Market</span></div>
  <div class="pill"><i class="fa-solid fa-star" style="color:#f59e0b"></i> <span id="shopRating">4.5</span> (120)</div>
  <div class="pill"><i class="fa-solid fa-truck"></i> Free Delivery</div>
</div>

<div class="cats" id="categoryList"></div>
<div class="grid" id="productGrid"></div>

<!-- CART DRAWER - COMMON -->
<div class="cart-drawer" id="cartDrawer">
  <div class="cart-panel">
    <div class="cart-head"><span>Your Cart <span id="cartItemCountText" style="color:#94a3b8">(0)</span></span><button class="icon-btn" id="closeCart"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="cart-items" id="cartItems"></div>
    <div class="cart-foot">
      <div style="display:flex;justify-content:space-between;font-weight:800"><span>Subtotal</span><span id="cartSubtotal">₹0</span></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:#64748b"><span>Delivery</span><span style="color:#10b981">FREE</span></div>
      <button class="btn btn-dark" id="checkoutBtn"><i class="fa-solid fa-bag-shopping"></i> Checkout • <span id="checkoutTotal">₹0</span></button>
      <button class="btn btn-outline" onclick="window.open(`../common/cart/cart.html?shopId=${shopId}`,'_blank')">Open Full Cart (Common)</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- COMMON CORE + MODULES FOR USER VIEW -->
<script src="../common/core/storage-core.js"></script>
<script src="../common/core/error-handler.js"></script>
<script src="../common/core/api-core.js"></script>
<script src="../common/core/auth-core.js"></script>
<script src="../common/core/user-core.js"></script>
<script src="../common/core/socket-core.js"></script>
<script src="../common/cart/cart-core.js"></script>
<script src="../common/wishlist/wishlist.js"></script>
<script src="../common/share/whatsapp-share.js"></script>
<script src="../common/reviews/reviews.js"></script>
<script src="../common/utils/search.js"></script>
<script src="./user-view.js"></script>
</body>
</html>
