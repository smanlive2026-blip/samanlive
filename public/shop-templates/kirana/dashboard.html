<!-- LOCATION: public/shop-templates/kirana/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirana Pro Dashboard - SamanLive</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="./dashboard.css">
</head>
<body>

<header class="topbar">
  <div class="left">
    <div class="logo"><i class="fa-solid fa-store"></i> <span id="shopName">Kirana Store</span></div>
    <small id="shopIdDisplay" style="opacity:.6">ID...</small>
  </div>
  <div class="right">
    <div class="toggle-wrap" id="toggleWrap">
      <div class="toggle-switch on" id="toggleSwitch"></div>
      <span id="toggleText">Open</span>
    </div>
    <button id="viewShopBtn" class="btn-light"><i class="fa fa-eye"></i> View Shop</button>
  </div>
</header>

<div class="stats-grid">
  <div class="stat-card"><i class="fa-solid fa-box"></i><div><b id="productCount">0</b><p>Total Products</p></div></div>
  <div class="stat-card warn"><i class="fa-solid fa-triangle-exclamation"></i><div><b id="lowStockCount">0</b><p>Low Stock</p></div></div>
  <div class="stat-card green"><i class="fa-solid fa-indian-rupee-sign"></i><div><b id="revenue">0</b><p>Revenue</p></div></div>
  <div class="stat-card blue"><i class="fa-solid fa-truck-fast"></i><div><b id="orderCount">0</b><p>Orders Today</p></div></div>
</div>

<div class="action-bar">
  <button id="addProductBtn" class="btn-primary"><i class="fa fa-plus"></i> Add Product</button>
  <button id="quickAddBtn" class="btn-orange"><i class="fa-solid fa-bolt"></i> Quick Add 100 Products</button>
  <input type="text" id="searchInput" placeholder="Search product..." onkeyup="filterProducts()">
</div>

<div class="main-grid">
  <div class="left-panel">
    <h3><i class="fa-solid fa-basket-shopping"></i> Products <span id="prodCountText"></span></h3>
    <div id="productList" class="product-grid"></div>
  </div>
  <div class="right-panel">
    <div class="card">
      <h4><i class="fa-solid fa-arrow-trend-down"></i> Low Stock Alert</h4>
      <div id="lowStock"></div>
    </div>
    <div class="card">
      <h4><i class="fa-solid fa-qrcode"></i> Shop QR</h4>
      <div id="qrBox" style="text-align:center;padding:15px;background:#f8fafc;border-radius:12px;">QR yaha ayega</div>
    </div>
  </div>
</div>

<script src="../common/shop-toggle.js"></script>
<script src="./dashboard.js"></script>
</body>
</html>
