<!-- LOCATION: public/shop-templates/kirana/product-form.html - V15 WORLD + COMMON/PRODUCTS - FASTEST + ROLE BASED -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Product - Kirana World</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap');
*{box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#f1f5f9;margin:0;padding:16px}
.card{background:#fff;max-width:650px;margin:auto;border-radius:18px;padding:20px;box-shadow:0 4px 20px rgba(0,0,0,.06);border:1px solid #e2e8f0}
h2{margin:0 0 14px 0}
label{font-size:13px;font-weight:700;margin-top:12px;display:block;color:#334155}
input,select,textarea{width:100%;padding:11px 12px;margin-top:6px;border:1px solid #e2e8f0;border-radius:10px;font-size:14px;outline:none}
input:focus,select:focus{border-color:#0f172a}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;padding:12px;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:16px;font-size:15px;transition:.2s}
.btn:active{transform:scale(.98)}
.btn-green{background:#16a34a;color:#fff}
.btn-dark{background:#0f172a;color:#fff}
.btn-orange{background:#fff7ed;color:#f97316;border:2px dashed #f97316}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-height:60vh;overflow:auto;margin-top:12px}
.quick-item{border:1px solid #e2e8f0;padding:10px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;background:#fff}
.quick-item b{font-size:13px}
.quick-item small{font-size:11px;color:#64748b}
.quick-item button{background:#0f172a;color:#fff;border:none;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
.badge{font-size:10px;background:#0f172a;color:#fff;padding:2px 6px;border-radius:20px;margin-left:6px}
</style>
</head>
<body>

<div class="card" id="formCard">
  <h2><i class="fa-solid fa-plus"></i> <span id="formTitle">Add Product</span> <span class="badge">WORLD MODEL</span> <span class="badge" style="background:#16a34a">FAST</span></h2>
  <small id="shopInfo" style="color:#64748b;font-weight:600"></small>

  <label>Product Name *</label>
  <input id="name" placeholder="Ex: Aashirvaad Aata 10kg / Parle-G 10Rs">

  <div class="row">
    <div><label>Brand</label><input id="brand" placeholder="Aashirvaad / Parle / Tata"></div>
    <div><label>Category</label>
      <select id="category">
        <option>Atta & Flour</option><option>Rice</option><option>Dal & Pulses</option>
        <option>Oil & Ghee</option><option>Masala</option><option>Salt & Sugar</option>
        <option>Biscuits</option><option>Noodles</option><option>Chips & Namkeen</option>
        <option>Tea & Coffee</option><option>Daily Needs</option><option>Cleaning</option>
        <option>General</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div><label>Price (Selling) *</label><input id="price" type="number" placeholder="460"></div>
    <div><label>MRP</label><input id="mrp" type="number" placeholder="520"></div>
  </div>

  <div class="row">
    <div><label>Stock *</label><input id="stock" type="number" placeholder="20" value="50"></div>
    <div><label>Unit *</label>
      <select id="unit">
        <option value="piece">piece (Parle-G, Lays, Maggi single)</option>
        <option value="packet">packet (Atta 10kg, Maggi family)</option>
        <option value="kg">kg</option>
        <option value="gram">gram</option>
        <option value="litre">litre</option>
        <option value="ml">ml</option>
        <option value="bottle">bottle</option>
        <option value="pouch">pouch</option>
        <option value="box">box</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div><label>Weight / Pack *</label><input id="weight" placeholder="10kg / 55g / 1L / 1 piece"></div>
    <div><label>Low Stock Limit</label><input id="lowStockLimit" type="number" value="10"></div>
  </div>

  <label>Image URL (optional)</label>
  <input id="image" placeholder="https://...">

  <button class="btn btn-green" onclick="saveProduct()" id="saveBtn">Save to World Model 🌍</button>
  <button class="btn btn-dark" onclick="location.href=`./dashboard.html?shopId=${shopId}`">Back to Dashboard</button>
  <button class="btn btn-orange" onclick="showQuick()" id="quickToggleBtn"><i class="fa-solid fa-bolt"></i> Show 100 Quick Products (World Seed)</button>

  <div id="quickBox" style="display:none">
    <h3 style="margin-top:18px">⚡ 100 Quick Products - 1 Click Add - World Seed</h3>
    <div style="display:flex;gap:8px;margin-top:8px">
      <input id="quickSearch" placeholder="Search... aata, oil, parle-g" onkeyup="filterQuick()" style="flex:1">
      <button onclick="addAllQuick()" style="background:#16a34a;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer">Add All 100 in 2s</button>
    </div>
    <div id="quickGrid" class="quick-grid"></div>
    <div id="quickStatus" style="margin-top:10px;font-size:12px;font-weight:700;color:#0f172a"></div>
  </div>

  <div id="status" style="margin-top:12px;font-size:12px;font-weight:700"></div>
</div>

<!-- COMMON PRODUCT SYSTEM -->
<script src="../common/products/product-manager.js"></script>
<script src="./quick-add-products.js"></script>
<script>
// LOCATION: public/shop-templates/kirana/product-form.html - V15 WORLD CONNECTED JS
const urlParams = new URLSearchParams(window.location.search);
const shopId = urlParams.get('shopId');
const editId = urlParams.get('editId');
const isQuickMode = urlParams.get('quick') === '1';
if(!shopId){ alert('ShopId missing - open with ?shopId=ID'); }

document.getElementById('shopInfo').innerText = `ShopId: ${shopId} • Type: kirana • Role: ${window.ProductManager?.role||'dashboard'} • Model: WorldProduct`;

if(isQuickMode){
  document.getElementById('quickBox').style.display='block';
  document.getElementById('formTitle').innerText='Quick Add 100 - World Seed';
  document.getElementById('saveBtn').style.display='none';
  document.getElementById('quickToggleBtn').style.display='none';
}

if(editId){
  document.getElementById('formTitle').innerText='Edit Product - World';
  loadEditData();
}

async function loadEditData(){
  try{
    // World model se load
    const res = await fetch(`/api/world-products/${editId}`).then(r=>r.json());
    const p = res.data || res;
    if(!p.name) throw new Error('Not world product, trying old');
    document.getElementById('name').value=p.name||'';
    document.getElementById('brand').value=p.brand||p.extraData?.brand||'';
    document.getElementById('category').value=p.category||'General';
    document.getElementById('price').value=p.price||'';
    document.getElementById('mrp').value=p.mrp||'';
    document.getElementById('stock').value=p.stock||50;
    document.getElementById('unit').value=p.unit||'piece';
    document.getElementById('weight').value=p.weight||p.extraData?.weight||'';
    document.getElementById('lowStockLimit').value=p.lowStockAlert||10;
    document.getElementById('image').value=p.thumbnail||'';
  }catch(e){
    // Fallback old kirana API
    try{
      const res = await fetch(`/api/shops/kirana/${shopId}`, {cache:'no-store'}).then(r=>r.json());
      const p = res.shop?.products?.find(x=>x._id===editId);
      if(!p) return;
      document.getElementById('name').value=p.name;
      document.getElementById('brand').value=p.brand;
      document.getElementById('category').value=p.category;
      document.getElementById('price').value=p.price;
      document.getElementById('mrp').value=p.mrp;
      document.getElementById('stock').value=p.stock;
      document.getElementById('unit').value=p.unit;
      document.getElementById('weight').value=p.weight;
      document.getElementById('lowStockLimit').value=p.lowStockLimit;
      document.getElementById('image').value=p.image;
    }catch(err){}
  }
}

async function saveProduct(){
  const payload = {
    name: document.getElementById('name').value.trim(),
    brand: document.getElementById('brand').value.trim(),
    category: document.getElementById('category').value,
    price: Number(document.getElementById('price').value),
    mrp: Number(document.getElementById('mrp').value)||undefined,
    stock: Number(document.getElementById('stock').value),
    unit: document.getElementById('unit').value,
    weight: document.getElementById('weight').value.trim(),
    lowStockAlert: Number(document.getElementById('lowStockLimit').value)||10,
    thumbnail: document.getElementById('image').value.trim(),
    shopType: 'kirana',
    shopId: shopId,
    extraData: {
      brand: document.getElementById('brand').value.trim(),
      weight: document.getElementById('weight').value.trim(),
      unit: document.getElementById('unit').value
    }
  };
  if(!payload.name || !payload.price || isNaN(payload.stock)) return alert('Name, Price, Stock bharo bhai');
  
  document.getElementById('status').innerText='Saving to World Model... 🌍';
  document.getElementById('saveBtn').disabled=true;

  try{
    let res;
    if(editId){
      res = await window.WorldProductManager.updateProduct(editId, payload);
    }else{
      res = await window.WorldProductManager.addProduct(payload);
    }

    if(res.success){
      document.getElementById('status').innerText='✅ Saved to World Model - Dashboard + User-View + Admin + Area-Manager sab me dikhega';
      setTimeout(()=> location.href=`./dashboard.html?shopId=${shopId}`, 900);
    }else{
      throw new Error(res.message);
    }
  }catch(e){
    // Fallback old API if world not mounted
    try{
      const url = editId ? `/api/shops/kirana/${shopId}/item/${editId}` : `/api/shops/kirana/${shopId}/item`;
      const method = editId ? 'PUT' : 'POST';
      const res2 = await fetch(url,{method, headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)}).then(r=>r.json());
      if(res2.success){ alert('Saved to Old Model (World fallback)'); location.href=`./dashboard.html?shopId=${shopId}`; }
      else throw e;
    }catch(err){
      document.getElementById('status').innerText='❌ Failed: '+e.message;
      document.getElementById('saveBtn').disabled=false;
    }
  }
}

function showQuick(){
  const box = document.getElementById('quickBox');
  box.style.display = box.style.display==='none' ? 'block' : 'none';
  if(box.style.display==='block') renderQuick(window.KIRANA_QUICK_PRODUCTS||[]);
}

let quickAll = window.KIRANA_QUICK_PRODUCTS||[];

function renderQuick(list){
  const grid = document.getElementById('quickGrid');
  if(!list.length){ grid.innerHTML='<div style="padding:20px;color:#94a3b8">No seed found - check common/products/kirana.seed.js</div>'; return; }
  grid.innerHTML = list.map((p,i)=>`
    <div class="quick-item">
      <div><b>${p.name}</b><br><small>${p.category} • ${p.brand||''} • ₹${p.price} • ${p.unit} ${p.weight||''}</small></div>
      <button onclick='quickAdd(${i})'>Add</button>
    </div>
  `).join('');
}

function filterQuick(){
  const q = document.getElementById('quickSearch').value.toLowerCase();
  const filtered = quickAll.filter(p=> (p.name||'').toLowerCase().includes(q) || (p.category||'').toLowerCase().includes(q) || (p.brand||'').toLowerCase().includes(q));
  renderQuick(filtered);
}

async function quickAdd(index){
  const p = quickAll[index];
  if(!p) return;
  document.getElementById('quickStatus').innerText=`Adding ${p.name}...`;
  const res = await window.WorldProductManager.addProduct({...p, shopId, shopType:'kirana'});
  if(res.success){
    document.getElementById('quickStatus').innerText=`✅ ${p.name} Added to World`;
  }else{
    document.getElementById('quickStatus').innerText=`❌ Failed ${p.name}`;
  }
}

async function addAllQuick(){
  if(!confirm(`Add ${quickAll.length} products to World Model? Shop: ${shopId}`)) return;
  let done=0;
  const statusEl = document.getElementById('quickStatus');
  for(let p of quickAll){
    statusEl.innerText=`Adding ${done+1}/${quickAll.length} - ${p.name}...`;
    const res = await window.WorldProductManager.addProduct({...p, shopId, shopType:'kirana'}).catch(()=>({success:false}));
    if(res.success) done++;
    await new Promise(r=>setTimeout(r, 50)); // speed control
  }
  statusEl.innerText=`✅ ${done}/${quickAll.length} Added to World Model - All roles me dikhega`;
  setTimeout(()=> location.href=`./dashboard.html?shopId=${shopId}`, 1200);
}

if(isQuickMode) renderQuick(quickAll);

window.saveProduct=saveProduct; window.showQuick=showQuick; window.filterQuick=filterQuick; window.quickAdd=quickAdd; window.addAllQuick=addAllQuick;
</script>
</body>
</html>
