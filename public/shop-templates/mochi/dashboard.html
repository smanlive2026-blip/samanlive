<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mochi Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #a16207 0%, #713f12 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1400px; margin: 0 auto; }
        
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
       .header h1 { font-size: 28px; color: #431407; display: flex; align-items: center; gap: 12px; }
        
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #a16207; }
       .stat-card .icon { font-size: 32px; color: #a16207; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
        
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
       .btn { background: linear-gradient(135deg, #a16207 0%, #713f12 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        
       .job-card { border: 2px solid #fef3c7; border-radius: 16px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
       .job-card:hover { border-color: #a16207; }
       .status { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }
       .status.pending { background: #fef3c7; color: #78350f; }
       .status.done { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-shoe-prints"></i> <span id="shopName">Mochi Shop</span></h1>
                <div style="color:#64748b; font-size:14px;">Shop ID: <span id="shopIdDisplay"></span></div>
            </div>
            <button class="btn" id="newJobBtn"><i class="fa fa-plus"></i> New Job</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-tools"></i></div><h3>Pending Jobs</h3><div class="value" id="pendingJobs">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-check-circle"></i></div><h3>Completed</h3><div class="value" id="completedJobs">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Today Earnings</h3><div class="value">₹<span id="todayEarning">0</span></div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-users"></i></div><h3>Total Customers</h3><div class="value" id="customers">0</div></div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-list"></i> Today's Jobs</h2>
            <div id="jobList">Loading...</div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-tag"></i> Service Rate List</h2>
            <div id="serviceList">Loading...</div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
