<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Auto Service Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fff7ed; }
       .header { background: linear-gradient(135deg, #f97316 0%, #c2410c 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .tabs { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .tab { background: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
       .tab.active { background: #f97316; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
       .product-price { font-size: 22px; font-weight: 800; color: #f97316; }
       .btn-book { background: #f97316; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
       .stock { font-size:12px; color:#16a34a; }
       .out { color:#dc2626; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-car-wrench"></i> <span id="shopName">Auto Care Center</span></h1>
        <p id="shopAddress">Car & Bike Service | Genuine Parts | 6 Month Warranty</p>
    </div>

    <div class="container">
        <div class="tabs" id="tabsContainer">
            <div class="tab active" onclick="filterTab('All', this)">All</div>
        </div>

        <div class="product-grid" id="productGrid">Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shopId');
        let allItems = []; // parts + services dono

        // DEFAULT SERVICES - agar dashboard me na ho to ye dikhe
        const defaultServices = [
            {name: "Engine Oil Change", price: 800, cat: "Service", icon: "🛢️"},
            {name: "Brake Service", price: 1200, cat: "Service", icon: "🛑"},
            {name: "AC Service", price: 1500, cat: "Service", icon: "❄️"},
            {name: "Engine Work", price: 8000, cat: "Service", icon: "⚙️"},
            {name: "Car Wash", price: 300, cat: "Service", icon: "🚿"},
            {name: "Battery Change", price: 6500, cat: "Service", icon: "🔋"},
            {name: "Tyre Change", price: 2500, cat: "Service", icon: "🛞"},
            {name: "Denting Painting", price: 10000, cat: "Service", icon: "🎨"}
        ];

        // ICON MAP
        const iconMap = {
            'Engine': '🛢️', 'Brake': '🛑', 'Electrical': '🔋', 'Tyre': '🛞', 'Service': '⚙️'
        };

        async function loadShop() {
            try {
                const res = await fetch(`/api/shops/auto/${shopId}`); // ✅ tera naya backend
                const result = await res.json();
                if(!result.success) return;

                const shop = result.shop;
                document.getElementById('shopName').innerText = shop.shopName;
                document.getElementById('pageTitle').innerText = shop.shopName;
                document.getElementById('shopAddress').innerText = shop.address || 'Genuine Parts | Service';

                // 1. SERVICES: dashboard wale + default
                const dbServices = (shop.services || []).map(s => ({
                    name: s.name, price: s.price, cat: 'Service', icon: '⚙️'
                }));
                const services = dbServices.length > 0 ? dbServices : defaultServices;

                // 2. PARTS: dashboard se aayenge
                const parts = (shop.parts || []).map(p => {
                    // naam se category guess karega
                    let cat = 'Engine';
                    if(p.name.toLowerCase().includes('brake')) cat = 'Brake';
                    else if(p.name.toLowerCase().includes('battery') || p.name.toLowerCase().includes('light')) cat = 'Electrical';
                    else if(p.name.toLowerCase().includes('tyre') || p.name.toLowerCase().includes('wheel')) cat = 'Tyre';

                    return {
                        name: p.name, price: p.price, cat: cat, icon: iconMap[cat] || '🔧',
                        stock: p.stock
                    }
                });

                allItems = [...services, ...parts];
                buildTabs();
                display(allItems);

            } catch(e) {
                console.error(e);
                allItems = defaultServices;
                display(allItems);
            }
        }

        function buildTabs() {
            const categories = ['All', ...new Set(allItems.map(i => i.cat))];
            document.getElementById('tabsContainer').innerHTML = categories.map((cat, i) => `
                <div class="tab ${i===0?'active':''}" onclick="filterTab('${cat}', this)">${cat}</div>
            `).join('');
        }

        function display(items) {
            if(items.length === 0) {
                document.getElementById('productGrid').innerHTML = '<p>No items found</p>';
                return;
            }
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:30px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.cat}</p>
                    <div class="product-price">₹${p.price}</div>
                    ${p.stock !== undefined ? `<div class="stock ${p.stock < 1 ? 'out' : ''}">Stock: ${p.stock}</div>` : ''}
                    <button class="btn-book" onclick="bookItem('${p.name}', '${p.cat}')">
                        ${p.cat==='Service'?'Book Service':'Add to Cart'}
                    </button>
                </div>
            `).join('');
        }

        function filterTab(cat, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat==='All'? allItems : allItems.filter(p => p.cat === cat);
            display(filtered);
        }

        function bookItem(name, cat) {
            if(cat === 'Service') {
                window.location.href = `/shop-templates/auto/book-service.html?shopId=${shopId}&service=${name}`;
            } else {
                alert(`${name} added to cart!`);
                // yaha cart ka logic daal dena
            }
        }

        loadShop();
    </script>
</body>
</html>
