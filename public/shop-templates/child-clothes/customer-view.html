<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Fashion Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fdf2f8; }
       .header { background: linear-gradient(135deg, #ec4899 0%, #db2777 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #ec4899; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #ec4899; }
       .btn-buy { background: #ec4899; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin: 30px 0; text-align: center; border: 2px dashed #ec4899; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-child"></i> <span id="shopName">Cute Kids Fashion</span></h1>
        <p>Age 0 to 12 Years | Boys, Girls, Baby | Cotton & Soft Fabric</p>
    </div>

    <div class="container">
        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Kids Special Offer</h3>
            <p>Buy 2 Get 1 Free | Birthday Combo Pack | Free Gift on ₹1500+</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Boys')">Boys</div>
            <div class="filter" onclick="filter('Girls')">Girls</div>
            <div class="filter" onclick="filter('Baby')">Baby 0-2</div>
            <div class="filter" onclick="filter('Frock')">Frock</div>
            <div class="filter" onclick="filter('T-Shirt')">T-Shirt</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Princess Frock", price: 800, age: "2-6 Years", cat: "Girls", type: "Frock", brand: "Gini & Jony", icon: "👗"}, 
            {name: "Boys T-Shirt", price: 450, age: "3-10 Years", cat: "Boys", type: "T-Shirt", brand: "H&M Kids", icon: "👕"},
            {name: "Baby Romper", price: 600, age: "0-2 Years", cat: "Baby", type: "Romper", brand: "Carter", icon: "👶"},
            {name: "Kids Jeans", price: 900, age: "4-12 Years", cat: "Boys", type: "Jeans", brand: "Levi Kids", icon: "👖"},
            {name: "Girls Jacket", price: 1200, age: "3-8 Years", cat: "Girls", type: "Jacket", brand: "Zara Kids", icon: "🧥"},
            {name: "Party Wear Set", price: 1500, age: "4-10 Years", cat: "Girls", type: "Ethnic", brand: "Biba Kids", icon: "👗"},
            {name: "Boys Shorts", price: 350, age: "3-9 Years", cat: "Boys", type: "Shorts", brand: "Puma Kids", icon: "🩳"},
            {name: "Birthday Combo 3pc", price: 1200, age: "2-8 Years", cat: "Combo", type: "Combo Pack", brand: "Bundle", icon: "🎁"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.brand} | ${p.type} | Age: ${p.age}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Added to Cart!')"><i class="fa fa-cart-plus"></i> Add to Cart</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat || p.type === cat));
        }
        display(products);
    </script>
</body>
</html>
