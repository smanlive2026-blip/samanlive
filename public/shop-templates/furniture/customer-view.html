<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Furniture Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="customer.css">
</head>
<body>
    <div class="top-bar">
        <h2 style="color:#a16207;"><i class="fa fa-couch"></i> <span id="shopNameTop">Shop</span></h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Sofa, Bed, Table...">
            <i class="fa fa-search" style="position:absolute; right:15px; top:14px; color:#94a3b8;"></i>
        </div>
        <a href="#" id="cartBtn" class="cart-btn"><i class="fa fa-cart-shopping"></i> Cart <span id="cartCount">0</span></a>
    </div>

    <div class="banner" id="shopBanner">
     <div class="offer-badge" id="offerBadge" style="display:none;"><i class="fa fa-bolt"></i> <span id="offerText"></span></div>
     <div class="shop-status" id="shopStatus">Loading...</div>
    </div>

    <div class="container" style="max-width:1400px; margin:0 auto; padding:20px;">
        <div class="features">
            <div class="feature"><i class="fa fa-truck-fast"></i><div>Free Delivery</div></div>
            <div class="feature"><i class="fa fa-shield-halved"></i><div>1 Year Warranty</div></div>
            <div class="feature"><i class="fa fa-rotate-left"></i><div>7 Day Return</div></div>
            <div class="feature"><i class="fa fa-headset"></i><div>24x7 Support</div></div>
        </div>

        <div class="categories" id="categories"></div>
        <h2 style="font-size:28px; margin:30px 0 15px;">Trending Products</h2>
        <div class="product-grid" id="productGrid">Loading...</div>
    </div>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <h2>Checkout</h2>
            <div id="cartItems"></div>
            <h3>Total: ₹<span id="totalAmount">0</span></h3>
            <hr style="margin:20px 0;">
            <h3>Delivery Address</h3>
            <input type="text" id="cName" placeholder="Full Name">
            <input type="tel" id="cPhone" placeholder="Phone Number">
            <input type="text" id="cAddress" placeholder="Full Address with Pincode">
            
            <h3>Delivery Slot</h3>
            <select id="deliverySlot">
                <option>Tomorrow 10AM - 2PM</option>
                <option>Tomorrow 2PM - 6PM</option>
                <option>Day After Tomorrow</option>
            </select>

            <h3>Payment Method</h3>
            <div class="payment-option active" onclick="selectPayment(this,'COD')"><i class="fa fa-money-bill"></i> Cash on Delivery</div>
            <div class="payment-option" onclick="selectPayment(this,'UPI')"><i class="fa fa-mobile-screen"></i> UPI / Online Payment</div>
            <div class="payment-option" onclick="selectPayment(this,'CARD')"><i class="fa fa-credit-card"></i> Debit / Credit Card</div>
            <input type="hidden" id="paymentMethod" value="COD">

            <button class="btn-add" style="font-size:16px; padding:15px;" onclick="placeOrder()">Place Order</button>
            <button onclick="closeCheckout()" style="margin-top:10px; width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;">Cancel</button>
        </div>
    </div>

    <div class="modal" id="productModal">
        <div class="modal-content" id="modalContent" style="display:flex; gap:30px;"></div>
    </div>

    <a href="#" id="waBtn" class="sticky-whatsapp" target="_blank"><i class="fa fa-whatsapp"></i></a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shopId');
        const API_BASE = `/api/shops/furniture`; // ✅ YE NAYA HAI
        let shopDataGlobal = {};
        let cart = JSON.parse(localStorage.getItem('cart_'+shopId)) || [];
        let wishlist = JSON.parse(localStorage.getItem('wishlist_'+shopId)) || [];
        let currentFilter = 'all';

        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            updateCartCount();
            document.getElementById('cartBtn').onclick = openCheckout;
            document.getElementById('searchInput').onkeyup = (e) => renderProducts(e.target.value);
        });

        async function loadData() {
            try{
                const res = await fetch(`${API_BASE}/${shopId}`);
                const result = await res.json();
                const shop = result.data || result.shop || result;
                shopDataGlobal = shop;
                shopDataGlobal.items = shopDataGlobal.items || shopDataGlobal.products || [];
                renderShop(shopDataGlobal);

                // WhatsApp button link
                const waBtn = document.getElementById('waBtn');
                if(shopDataGlobal.phone){
                    waBtn.href = `https://wa.me/91${shopDataGlobal.phone}?text=Hello, I need info about your furniture`;
                } else {
                    waBtn.style.display = 'none';
                }
            }catch(err){
                console.error("LOAD ERROR", err);
            }
        }

function renderShop(shop){
    document.getElementById('pageTitle').innerText = shop.shopName || shop.name || 'Furniture Shop';
    document.getElementById('shopNameTop').innerText = shop.shopName || shop.name || 'Shop';
    
    
    // YE WALI 4 LINE REPLACE KAR DE
    const bannerUrl = shop.bannerPhotoUrl || shop.banner || shop.settings?.bannerPhotoUrl || '';
    console.log("BANNER URL MILA:", bannerUrl); // DEBUG KE LIYE
    if(bannerUrl && bannerUrl !== '') {
        document.getElementById('shopBanner').style.cssText += `background-image: url('${bannerUrl}') !important;`;
    }
    
    if(shop.announcement || shop.settings?.announcement){
        document.getElementById('offerBadge').style.display = 'block';
        document.getElementById('offerText').innerText = shop.announcement || shop.settings?.announcement;
    }
    
    const statusEl = document.getElementById('shopStatus');
    const isOpen = shop.isOpen === true || shop.settings?.isOpen === true;
    statusEl.innerText = isOpen? 'Open Now' : 'Closed';
    statusEl.style.background = isOpen? '#22c55e' : '#ef4444';

    const cats = [...new Set(shop.items.map(i => i.category || 'General'))];
    document.getElementById('categories').innerHTML = '<div class="cat-btn active" onclick="filterCat(\'all\',event)">All</div>' + 
        cats.map(c => `<div class="cat-btn" onclick="filterCat('${c}',event)">${c}</div>`).join('');
    
    renderProducts();
}
        function filterCat(cat,event){
            currentFilter = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts();
        }

        function renderProducts(search=''){
            const grid = document.getElementById('productGrid');
            let items = shopDataGlobal.items.filter(i => i.available !== false);
            if(currentFilter !== 'all') items = items.filter(i => (i.category || 'General') === currentFilter);
            if(search) items = items.filter(i => (i.name || '').toLowerCase().includes(search.toLowerCase()));

            if(!items.length) return grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Koi product nahi mila</p>';

            grid.innerHTML = items.map(item => {
                const id = item._id || item.id;
                return `
                <div class="product-card">
                    <div class="wishlist ${wishlist.includes(id)?'active':''}" onclick="toggleWishlist('${id}')"><i class="fa fa-heart"></i></div>
                    <img src="${item.image || item.img || 'https://placehold.co/300x200'}" onclick='openModal(${JSON.stringify(item).replace(/"/g, '&quot;')})'>
                    <div class="product-info">
                        <div class="rating"><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star-half"></i> 4.8</div>
                        <h3 onclick='openModal(${JSON.stringify(item).replace(/"/g, '&quot;')})' style="cursor:pointer; font-size:16px; margin:5px 0;">${item.name}</h3>
                        <div><span class="price">₹${item.price}</span> <span style="text-decoration:line-through; color:#94a3b8; font-size:14px;">₹${Number(item.price)+2000}</span></div>
                        
                        <div class="badge-row">
                            <div class="badge"><i class="fa fa-credit-card"></i> No Cost EMI</div>
                            <div class="badge"><i class="fa fa-truck"></i> Free Install</div>
                        </div>

                        <div class="delivery-tag"><i class="fa fa-truck"></i> Free Delivery by Tomorrow</div>
                        <button class="btn-add" onclick="addToCart('${id}', '${item.name}', ${item.price})"><i class="fa fa-plus"></i> Add to Cart</button>
                    </div>
                </div>
            `}).join('');
        }

        function openModal(item){
            const id = item._id || item.id;
            document.getElementById('productModal').style.display = 'flex';
            document.getElementById('modalContent').innerHTML = `
                <img src="${item.image || item.img}" style="width:400px; height:400px; object-fit:cover; border-radius:15px;">
                <div style="flex:1;">
                    <h2>${item.name}</h2>
                    <div class="rating"><i class="fa fa-star"></i> 4.8 (120 Reviews)</div>
                    <h1 style="color:#a16207; margin:15px 0;">₹${item.price}</h1>
                    <p>${item.desc || item.description || ''}</p>
                    <p style="margin:10px 0;"><b>Material:</b> ${item.specs?.material || 'Wood'}</p>
                    <p><b>Warranty:</b> ${item.specs?.warranty || '1 Year'}</p>
                    <p><b>Delivery:</b> Free, Tomorrow</p>
                    <div style="margin:20px 0; padding:15px; background:#f0fdf4; border-radius:10px;"><i class="fa fa-check"></i> 7 Days Easy Return</div>
                    <button class="btn-add" style="padding:15px; font-size:16px;" onclick="addToCart('${id}', '${item.name}', ${item.price}); closeModal()">Add to Cart</button>
                    <button class="call-btn" onclick="window.location.href='tel:91${shopDataGlobal.phone}'"><i class="fa fa-phone"></i> Call Now</button>
                </div>
            `;
        }
        function closeModal(){ document.getElementById('productModal').style.display = 'none'; }
        document.getElementById('productModal').onclick = (e) => { if(e.target.id === 'productModal') closeModal(); }

        function toggleWishlist(id){
            if(wishlist.includes(id)) wishlist = wishlist.filter(w => w !== id);
            else wishlist.push(id);
            localStorage.setItem('wishlist_'+shopId, JSON.stringify(wishlist));
            renderProducts();
        }

        function addToCart(id, name, price){
            const existing = cart.find(i => i.id === id);
            if(existing) existing.qty++; else cart.push({id, name, price, qty: 1});
            localStorage.setItem('cart_'+shopId, JSON.stringify(cart));
            updateCartCount();
            alert(name + ' added to cart ✅');
        }
        function updateCartCount(){ document.getElementById('cartCount').innerText = cart.reduce((a,b) => a+b.qty, 0); }

        function openCheckout(){
            document.getElementById('checkoutModal').style.display = 'flex';
            let total = 0;
            document.getElementById('cartItems').innerHTML = cart.map(item => {
                total += item.price * item.qty;
                return `<div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #eee;">${item.name} x ${item.qty} <b>₹${item.price * item.qty}</b></div>`
            }).join('') || '<p>Cart Khali hai</p>';
            document.getElementById('totalAmount').innerText = total;
        }
        function closeCheckout(){ document.getElementById('checkoutModal').style.display = 'none'; }
        document.getElementById('checkoutModal').onclick = (e) => { if(e.target.id === 'checkoutModal') closeCheckout(); }
        
        function selectPayment(el, method){
            document.querySelectorAll('.payment-option').forEach(p => p.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('paymentMethod').value = method;
        }

        async function placeOrder(){
            const orderData = {
                customerName: document.getElementById('cName').value,
                customerPhone: document.getElementById('cPhone').value,
                customerAddress: document.getElementById('cAddress').value,
                deliverySlot: document.getElementById('deliverySlot').value,
                paymentMethod: document.getElementById('paymentMethod').value,
                items: cart,
                total: Number(document.getElementById('totalAmount').innerText),
                status: 'pending'
            };
            if(!orderData.customerName || !orderData.customerPhone) return alert('Details bharo');

            const res = await fetch(`${API_BASE}/${shopId}/order`, {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify(orderData)
            });
            const result = await res.json();

            let msg = `*NEW ORDER* - ${shopDataGlobal.shopName || shopDataGlobal.name}\n\n`;
            cart.forEach(i => msg += `${i.name} x ${i.qty} = ₹${i.price*i.qty}\n`);
            msg += `\n*Total:* ₹${orderData.total}\n*Payment:* ${orderData.paymentMethod}\n*Delivery:* ${orderData.deliverySlot}\n*Address:* ${orderData.customerAddress}`;
            if(shopDataGlobal.phone) window.open(`https://wa.me/91${shopDataGlobal.phone}?text=${encodeURIComponent(msg)}`, '_blank');
            
            localStorage.removeItem('cart_'+shopId);
            alert('Order Placed! Tracking ID: ' + result.trackingId + '. Owner will contact you soon.');
            closeCheckout();
            location.reload();
        }
    </script>
</body>
</html>
