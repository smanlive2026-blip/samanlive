<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fffbeb; }
       .header { background: linear-gradient(135deg, #a16207 0%, #78350f 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .tabs { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .tab { background: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
       .tab.active { background: #a16207; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
       .product-price { font-size: 22px; font-weight: 800; color: #a16207; }
       .btn-buy { background: #a16207; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin-top: 30px; text-align: center; border: 2px dashed #a16207; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-couch"></i> <span id="shopName">Royal Furniture</span></h1>
        <p>Home & Office Furniture | EMI Available | Free Home Delivery</p>
    </div>

    <div class="container">
        <div class="tabs" id="tabs">
            <div class="tab active" onclick="filter('All', this)">All</div>
        </div>

        <div class="product-grid" id="productGrid">Loading...</div>

        <div class="offer-box" id="offerBox">
            <h3><i class="fa fa-gift"></i> Special Offers</h3>
            <p style="margin-top:10px;">0% EMI Available | 5 Year Warranty | Free Assembly & Delivery</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shopId');
        let products = [];

        async function loadData(){
            const res = await fetch(`/api/furniture/${shopId}`);
            const result = await res.json();
            if(result.success){
                products = result.data.items || [];
                document.getElementById('shopName').innerText = result.data.shopName || 'Royal Furniture';
                renderTabs();
                filter('All', document.querySelector('.tab'));
            }
        }

        function renderTabs(){
            const cats = ['All', ...new Set(products.map(p => p.category))];
            document.getElementById('tabs').innerHTML = cats.map(c => 
                `<div class="tab" onclick="filter('${c}', this)">${c}</div>`
            ).join('');
        }

        function display(items) {
            if(!items.length) return document.getElementById('productGrid').innerHTML = '<p>No products</p>';
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <img src="${p.image || 'https://placehold.co/300x180/a16207/fff?text=Furniture'}" style="width:100%; height:180px; object-fit:cover; border-radius:12px; margin-bottom:10px;">
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.category}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="placeOrder('${p.id}')"><i class="fa fa-cart-plus"></i> Buy Now</button>
                </div>
            `).join('');
        }

        function filter(cat, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            const filtered = cat==='All'? products : products.filter(p => p.category === cat);
            el.innerText = `${cat} ${filtered.length}`;
            display(filtered);
        }

        async function placeOrder(itemId){
            const item = products.find(p => p.id == itemId);
            const order = {
                customerName: prompt('Name?'),
                phone: prompt('Phone?'),
                address: prompt('Address?'),
                items: [{...item, qty: 1}],
                total: item.price
            }
            await fetch(`/api/furniture/${shopId}/order`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(order)
            });
            alert('Order placed! Shop wale ko call aayega');
        }

        loadData();
    </script>
</body>
</html>
