    body{background:#f8fafc; padding:20px;}

    .product-card{background:white; border-radius:16px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.06); transition:0.3s;}

    .product-card img{width:100%; height:200px; object-fit:cover;}
    .product-info{padding:15px;}
    .product-info h4{font-size:16px; margin-bottom:5px;}
    .product-info p{color:#64748b; font-size:13px; height:40px; overflow:hidden;}
    .price{font-size:20px; font-weight:700; color:#a16207; margin:10px 0;}
    .btn-add{background:#a16207; color:white; border:none; padding:10px 16px; border-radius:10px; width:100%; cursor:pointer; font-weight:600;}
    .btn-added{background:#16a34a; cursor:not-allowed;}
    .filters{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
    .filter-btn{padding:8px 16px; border:2px solid #e2e8f0; background:white; border-radius:20px; cursor:pointer; font-weight:600;}
    .filter-btn.active{background:#a16207; color:white; border-color:#a16207;}
    .category-tag{font-size:11px; background:#fffbeb; color:#a16207; padding:3px 8px; border-radius:6px; display:inline-block; margin-bottom:8px;}
</style>

];

async function loadData(){
    const res = await fetch(`/api/shops/${shopId}`);
    const result = await res.json();
    const shop = result.data || result.shop;
    myShopItems = shop.items || [];
    renderProducts(allProducts);
}

function renderProducts(products){
    document.getElementById('productGrid').innerHTML = products.map(p => {
        const alreadyAdded = myShopItems.some(i => i.name === p.name);
        return `
        <div class="product-card">
            <img src="${p.image}">
            <div class="product-info">
                <span class="category-tag">${p.category}</span>
                <h4>${p.name}</h4>
                <p>${p.desc}</p>
                <div class="price">₹${p.price.toLocaleString()}</div>
                <button class="btn-add ${alreadyAdded?'btn-added':''}" onclick="addToShop(JSON.stringify(${JSON.stringify(p).replace(/"/g, '&quot;')}))" ${alreadyAdded?'disabled':''}>
                    ${alreadyAdded?'<i class="fa fa-check"></i> Added':'<i class="fa fa-plus"></i> Add to My Shop'}
                </button>
            </div>
        </div>
        `
    }).join('');
}

// GOLDEN RULE: POST /api/shops/:shopId/item
async function addToShop(productStr){
    const product = JSON.parse(productStr.replace(/&quot;/g, '"'));
    
    const newItem = {
        id: Date.now().toString(),
        name: product.name,
        category: product.category,
        price: product.price,
        stock: product.stock,
        unit: product.unit,
        desc: product.desc,
        image: product.image,
        available: true
    };

    const res = await fetch(`/api/shops/${shopId}/item`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(newItem)
    });

    const result = await res.json();
    if(result.success){
        alert(`${product.name} Added to your shop ✅`);
        loadData();
    } else {
        alert('Error: ' + result.error);
    }
}

function filterCat(cat, el){
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if(cat === 'All') renderProducts(allProducts);
    else renderProducts(allProducts.filter(p => p.category === cat));
}

document.getElementById('search').onkeyup = (e) => {
    const val = e.target.value.toLowerCase();
    renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(val) || p.category.toLowerCase().includes(val)));
}

loadData();
</script>
