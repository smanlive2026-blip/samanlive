<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Library - 100+ Ready Products</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
    *{font-family:Poppins; box-sizing:border-box;}
    body{background:#f8fafc; padding:20px;}
    .container{max-width:1400px; margin:0 auto;}
    .header{background:white; padding:20px; border-radius:20px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:15px;}
    .search-box{padding:12px 20px; border:2px solid #e2e8f0; border-radius:12px; width:400px; max-width:100%;}
    .product-grid{display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:20px;}
    .product-card{background:white; border-radius:16px; overflow:hidden; box-shadow:0 4px 15px rgba(0,0,0,0.06); transition:0.3s;}
    .product-card:hover{transform:translateY(-5px);}
    .product-card img{width:100%; height:200px; object-fit:cover;}
    .product-info{padding:15px;}
    .product-info h4{font-size:16px; margin-bottom:5px;}
    .product-info p{color:#64748b; font-size:13px; height:40px; overflow:hidden;}
    .price{font-size:20px; font-weight:700; color:#a16207; margin:10px 0;}
    .btn-add{background:#a16207; color:white; border:none; padding:10px 16px; border-radius:10px; width:100%; cursor:pointer; font-weight:600;}
    .btn-added{background:#16a34a; cursor:not-allowed;}
    .filters{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
    .filter-btn{padding:8px 16px; border:2px solid #e2e8f0; background:white; border-radius:20px; cursor:pointer; font-weight:600;}
    .filter-btn.active{background:#a16207; color:white; border-color:#a16207;}
    .category-tag{font-size:11px; background:#fffbeb; color:#a16207; padding:3px 8px; border-radius:6px; display:inline-block; margin-bottom:8px;}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2><i class="fa fa-warehouse"></i> Product Library - 100 Ready Items</h2>
        <input type="text" id="search" class="search-box" placeholder="Search Sofa, Bed, Table...">
    </div>

    <div class="filters">
        <button class="filter-btn active" onclick="filterCat('All',this)">All</button>
        <button class="filter-btn" onclick="filterCat('Sofa',this)">Sofa</button>
        <button class="filter-btn" onclick="filterCat('Bed',this)">Bed</button>
        <button class="filter-btn" onclick="filterCat('Table',this)">Table</button>
        <button class="filter-btn" onclick="filterCat('Chair',this)">Chair</button>
        <button class="filter-btn" onclick="filterCat('Wardrobe',this)">Wardrobe</button>
        <button class="filter-btn" onclick="filterCat('Storage',this)">Storage</button>
        <button class="filter-btn" onclick="filterCat('Decor',this)">Decor</button>
    </div>

    <div class="product-grid" id="productGrid">Loading 100 products...</div>
</div>

<script src="/shop-templates/shop-core.js"></script>
<script>
const shopId = new URLSearchParams(window.location.search).get('shopId');
let allProducts = [];
let myShopItems = [];

// ===== 100 PRODUCT KA DATA =====
allProducts = [
{name: "Royal Velvet Sofa Set", category: "Sofa", price: 45999, stock: 5, unit: "Set", desc: "5 Seater Premium Velvet Sofa with Sheesham Wood Frame", image: "https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400"},
{name: "L Shape Corner Sofa", category: "Sofa", price: 38999, stock: 4, unit: "Set", desc: "Modern Fabric L Shape Sofa with Cushions", image: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=400"},
{name: "3 Seater Fabric Sofa", category: "Sofa", price: 24999, stock: 8, unit: "Piece", desc: "Comfortable 3 Seater Sofa for Living Room", image: "https://images.unsplash.com/photo-1580480055273-228ff5388ef8?w=400"},
{name: "King Size Storage Bed", category: "Bed", price: 32999, stock: 8, unit: "Piece", desc: "Hydraulic Storage Box, Solid Sheesham Wood", image: "https://images.unsplash.com/photo-1505693416388-ac5ce068fe3d?w=400"},
{name: "6 Seater Dining Table", category: "Table", price: 24999, stock: 10, unit: "Set", desc: "Marble Top Dining Table with 6 Chairs", image: "https://images.unsplash.com/photo-1556228453-efd6c1ff04f6?w=400"},
{name: "Ergonomic Office Chair", category: "Chair", price: 8999, stock: 15, unit: "Piece", desc: "High Back Mesh Office Chair", image: "https://images.unsplash.com/photo-1580480055273-228ff5388ef8?w=400"},
{name: "3 Door Wardrobe", category: "Wardrobe", price: 28999, stock: 6, unit: "Piece", desc: "Sliding Door Wardrobe with Mirror", image: "https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?w=400"},
{name: "Chest of Drawers", category: "Storage", price: 8999, stock: 10, unit: "Piece", desc: "5 Drawer Wooden Chest", image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?w=400"},
{name: "Wall Mirror", category: "Decor", price: 2999, stock: 15, unit: "Piece", desc: "Large Decorative Wall Mirror", image: "https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?w=400"}
// BAKE KE 91 ITEM BHI YAHI DAAL DE
];

async function loadData(){
    const res = await fetch(`/api/shops/${shopId}`);
    const result = await res.json();
    const shop = result.data || result.shop;
    myShopItems = shop.items || [];
    renderProducts(allProducts);
}

function renderProducts(products){
    document.getElementById('productGrid').innerHTML = products.map(p => {
        const alreadyAdded = myShopItems.some(i => i.name === p.name);
        return `
        <div class="product-card">
            <img src="${p.image}">
            <div class="product-info">
                <span class="category-tag">${p.category}</span>
                <h4>${p.name}</h4>
                <p>${p.desc}</p>
                <div class="price">₹${p.price.toLocaleString()}</div>
                <button class="btn-add ${alreadyAdded?'btn-added':''}" onclick="addToShop(JSON.stringify(${JSON.stringify(p).replace(/"/g, '&quot;')}))" ${alreadyAdded?'disabled':''}>
                    ${alreadyAdded?'<i class="fa fa-check"></i> Added':'<i class="fa fa-plus"></i> Add to My Shop'}
                </button>
            </div>
        </div>
        `
    }).join('');
}

// GOLDEN RULE: POST /api/shops/:shopId/item
async function addToShop(productStr){
    const product = JSON.parse(productStr.replace(/&quot;/g, '"'));
    
    const newItem = {
        id: Date.now().toString(), // 'id' use karo
        name: product.name,
        category: product.category,
        price: product.price,
        stock: product.stock,
        unit: product.unit,
        desc: product.desc,
        image: product.image,
        available: true
    };

    const res = await fetch(`/api/shops/${shopId}/item`, {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify(newItem)
    });

    const result = await res.json();
    if(result.success){
        alert(`${product.name} Added to your shop ✅`);
        loadData();
    } else {
        alert('Error: ' + result.error);
    }
}

function filterCat(cat, el){
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if(cat === 'All') renderProducts(allProducts);
    else renderProducts(allProducts.filter(p => p.category === cat));
}

document.getElementById('search').onkeyup = (e) => {
    const val = e.target.value.toLowerCase();
    renderProducts(allProducts.filter(p => p.name.toLowerCase().includes(val) || p.category.toLowerCase().includes(val)));
}

loadData();
</script>
</body>
</html>
