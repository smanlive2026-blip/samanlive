<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suit Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; }
       .header { background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #3b82f6; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #3b82f6; }
       .btn-buy { background: #3b82f6; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin: 30px 0; text-align: center; border: 2px dashed #3b82f6; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-user-tie"></i> <span id="shopName">Royal Suit Palace</span></h1>
        <p>Mens & Ladies | Wedding, Party, Daily Wear | Tailoring | 3 Day Delivery</p>
    </div>

    <div class="container">
        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Shaadi Season Offer</h3>
            <p>Buy Sherwani Get Kurta Free | Ladies Suit 15% Off | Free Alteration</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Men')">Men</div>
            <div class="filter" onclick="filter('Women')">Women</div>
            <div class="filter" onclick="filter('Kids')">Kids</div>
            <div class="filter" onclick="filter('Sherwani')">Sherwani</div>
            <div class="filter" onclick="filter('Salwar Suit')">Salwar Suit</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Wedding Sherwani", price: 8000, size: "38,40,42", cat: "Men", type: "Sherwani", fabric: "Silk", icon: "👔"}, 
            {name: "Ladies Salwar Suit", price: 2500, size: "S,M,L,XL", cat: "Women", type: "Salwar Suit", fabric: "Cotton", icon: "👗"},
            {name: "Mens Indo-Western", price: 5000, size: "38,40,42", cat: "Men", type: "Indo-Western", fabric: "Jute Silk", icon: "👔"},
            {name: "Kids Kurta Pajama", price: 1200, size: "26,28,30", cat: "Kids", type: "Kurta", fabric: "Cotton", icon: "👔"},
            {name: "Ladies Anarkali", price: 3500, size: "S,M,L,XL", cat: "Women", type: "Anarkali", fabric: "Georgette", icon: "👗"},
            {name: "Mens Kurta Set", price: 1800, size: "38,40,42", cat: "Men", type: "Kurta", fabric: "Cotton", icon: "👔"},
            {name: "Ladies Palazzo Set", price: 2200, size: "S,M,L", cat: "Women", type: "Palazzo", fabric: "Rayon", icon: "👗"},
            {name: "Designer Lehenga", price: 12000, size: "S,M,L", cat: "Women", type: "Lehenga", fabric: "Silk", icon: "👗"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.fabric} | ${p.type} | Size: ${p.size}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order Placed!')"><i class="fa fa-phone"></i> Order Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat || p.type === cat));
        }
        display(products);
    </script>
</body>
</html>
