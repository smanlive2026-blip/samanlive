<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewellery Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #facc15 0%, #eab308 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1600px; margin: 0 auto; }
        
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
       .header h1 { font-size: 28px; color: #713f12; display: flex; align-items: center; gap: 12px; }
        
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #facc15; }
       .stat-card .icon { font-size: 32px; color: #facc15; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
        
       .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
       .btn { background: linear-gradient(135deg, #facc15 0%, #eab308 100%); color: #713f12; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; }
       .btn:hover { transform: translateY(-2px); }
       .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white; }
        
       .jewellery-card { border: 2px solid #fef9c3; border-radius: 16px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
       .gold-badge { background: #fef9c3; color: #713f12; padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
       
       /* CATALOG MODAL */
       #catalogModal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:9999; backdrop-filter:blur(4px); align-items:center; justify-content:center; }
       #catalogModal > div { background:white; border-radius:20px; max-width:900px; width:95%; max-height:85vh; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-gem"></i> <span id="shopName">Shri Ram Jewellers</span></h1>
                <div style="color:#64748b; font-size:14px;">Shop ID: <span id="shopIdDisplay"></span></div>
            </div>
            <div style="display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn" id="addItemBtn"><i class="fa fa-plus"></i> Add Item</button>
                
                <!-- NAYA CATALOG BUTTON -->
                <button class="btn btn-success" onclick="openCatalog()"><i class="fa fa-store"></i> Catalog se Add Kare</button>
                
                <button class="btn" id="newOrderBtn"><i class="fa fa-receipt"></i> New Bill</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-ring"></i></div><h3>Total Items</h3><div class="value" id="items">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-users"></i></div><h3>Today Customers</h3><div class="value" id="customers">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Today Sale</h3><div class="value">₹<span id="revenue">0</span></div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-weight-scale"></i></div><h3>Gold Rate/10g</h3><div class="value">₹<span id="goldRate">72000</span></div></div>
        </div>

        <div class="content-grid">
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-list"></i> Inventory</h2>
                    <div id="inventoryList">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-receipt"></i> Recent Bills</h2>
                    <div id="billsList">Loading...</div>
                </div>
            </div>
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-calendar"></i> Custom Orders</h2>
                    <div id="customOrders">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-star"></i> Categories</h2>
                    <div id="categories">Loading...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- CATALOG MODAL -->
    <div id="catalogModal">
        <div>
            <div style="padding:20px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between; align-items:center;">
                <h2 style="margin:0; font-size:20px; color:#713f12;"><i class="fa fa-gem"></i> Ready Made Jewellery Catalog - 100+ Items</h2>
                <button onclick="closeCatalog()" style="background:none; border:none; font-size:28px; cursor:pointer; color:#64748b;">×</button>
            </div>
            <div style="padding:20px;">
                <input type="text" id="searchCatalog" placeholder="Search Jewellery... Ring, Necklace, Bangles..." onkeyup="filterCatalog()" style="width:100%; padding:12px; border:2px solid #fef9c3; border-radius:10px; margin-bottom:15px; font-size:14px;">
                <div id="catalogList" style="overflow-y:auto; max-height:60vh;"></div>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
