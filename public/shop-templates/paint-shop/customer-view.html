<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paint Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fff7ed; }
       .header { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #f97316; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #f97316; }
       .btn-buy { background: #f97316; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin-top: 30px; text-align: center; border: 2px dashed #f97316; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-paint-can"></i> <span id="shopName">Rang Mahal Paint Shop</span></h1>
        <p>Asian Paints, Berger, Nerolac | Color Mixing | Home Delivery</p>
    </div>

    <div class="container">
        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Contractor Offer</h3>
            <p>5% Extra Discount on Bulk Purchase | Free Brush Set Above ₹5000</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Interior')">Interior</div>
            <div class="filter" onclick="filter('Exterior')">Exterior</div>
            <div class="filter" onclick="filter('Enamel')">Enamel</div>
            <div class="filter" onclick="filter('Putty')">Putty</div>
            <div class="filter" onclick="filter('Tools')">Tools</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Asian Apex Ultima", price: 2800, size: "20L", cat: "Exterior", brand: "Asian", icon: "🎨"}, 
            {name: "Berger Silk Breeze", price: 3200, size: "10L", cat: "Interior", brand: "Berger", icon: "🖌️"},
            {name: "Nerolac Impressions", price: 2400, size: "10L", cat: "Interior", brand: "Nerolac", icon: "🎨"},
            {name: "JK Wall Putty", price: 450, size: "40kg", cat: "Putty", brand: "JK", icon: "🧱"},
            {name: "Indigo Enamel", price: 600, size: "1L", cat: "Enamel", brand: "Indigo", icon: "🖌️"},
            {name: "Asian Primer", price: 1200, size: "10L", cat: "Primer", brand: "Asian", icon: "🎨"},
            {name: "Paint Brush Set", price: 350, size: "5pcs", cat: "Tools", brand: "Local", icon: "🖌️"},
            {name: "Distemper 20kg", price: 900, size: "20kg", cat: "Distemper", brand: "Birla", icon: "🎨"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.brand} | ${p.size}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Added to Cart!')"><i class="fa fa-cart-plus"></i> Add to Cart</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
