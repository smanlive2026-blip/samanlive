<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Door Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fffbeb; }
       .header { background: linear-gradient(135deg, #a16207 0%, #713f12 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #a16207; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #a16207; }
       .btn-buy { background: #a16207; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .service-box { background: white; padding: 25px; border-radius: 20px; margin: 30px 0; text-align: center; border: 2px dashed #a16207; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-door-closed"></i> <span id="shopName">Shree Door & Furniture</span></h1>
        <p>Wooden, Steel, PVC Door | Custom Size | Fitting | 5 Year Warranty</p>
    </div>

    <div class="container">
        <div class="service-box">
            <h3><i class="fa fa-tools"></i> Free Services</h3>
            <p>Door Measurement | Installation | Polish | Hardware Fitting | Home Delivery</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Wooden')">Wooden</div>
            <div class="filter" onclick="filter('Steel')">Steel</div>
            <div class="filter" onclick="filter('Flush')">Flush</div>
            <div class="filter" onclick="filter('PVC')">PVC</div>
            <div class="filter" onclick="filter('Glass')">Glass</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Teak Wood Door", price: 8500, size: "7x3 ft", cat: "Wooden", icon: "🚪"}, 
            {name: "Steel Safety Door", price: 12000, size: "7x3 ft", cat: "Steel", icon: "🚪"},
            {name: "Flush Door MDF", price: 3200, size: "7x3 ft", cat: "Flush", icon: "🚪"},
            {name: "PVC Bathroom Door", price: 2800, size: "6.5x2.5 ft", cat: "PVC", icon: "🚪"},
            {name: "Designer Glass Door", price: 15000, size: "7x4 ft", cat: "Glass", icon: "🚪"},
            {name: "Folding Door", price: 6500, size: "7x5 ft", cat: "Folding", icon: "🚪"},
            {name: "Door Lock Set", price: 800, size: "Standard", cat: "Hardware", icon: "🔒"},
            {name: "Door Frame Teak", price: 2500, size: "7x3 ft", cat: "Frame", icon: "🪵"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">Size: ${p.size} | 5 Year Warranty</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order Placed!')"><i class="fa fa-phone"></i> Call for Order</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
