<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Fresh Fruits - Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="customer.css"> <!-- CSS ALAG FILE -->
</head>
<body>
    <div class="banner" id="shopBanner"></div> <!-- 1. BANNER ADD KIYA -->

    <div class="header">
        <div class="header-top">
            <div class="shop-info">
                <img src="https://placehold.co/60x60/fff/22c55e?text=Logo" id="ownerImg" class="shop-logo"> <!-- 2. LOGO ADD KIYA -->
                <h1><i class="fa fa-apple-alt"></i> <span id="shopName">Fresh Fruits</span></h1>
                <span id="shopStatus" class="status"><i class="fa fa-circle"></i> OPEN</span>
            </div>
            <button class="cart-btn" onclick="toggleCart()"><i class="fa fa-shopping-cart"></i><span class="cart-count" id="cartCount">0</span></button>
        </div>
        <div class="search-bar"><i class="fa fa-search"></i><input type="text" id="searchInput" placeholder="Search fruits..."></div>
    </div>

    <div class="announcement" id="announcementBox" style="display: none;"></div>

    <div class="categories" id="categories">
        <button class="cat-btn active" onclick="filterCat('all', event)">All</button>
    </div>

    <div class="container">
        <div class="product-grid" id="productGrid">Loading...</div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <h2 style="margin-bottom: 20px;">Your Cart <i class="fa fa-times" style="float: right; cursor: pointer;" onclick="toggleCart()"></i></h2>
        <div id="cartItems"></div>
        <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f1f5f9;">
            <div style="display: flex; justify-content: space-between; font-size: 18px; font-weight: 700; margin-bottom: 15px;">
                <span>Subtotal:</span><span>₹<span id="cartTotal">0</span></span>
            </div>
            <div style="margin-bottom: 15px;">
                <input type="text" id="custName" placeholder="Your Name" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px; margin-bottom:8px;">
                <input type="tel" id="custPhone" placeholder="Your WhatsApp Number" style="width:100%; padding:10px; border:1px solid #ddd; border-radius:8px;">
            </div>
            <button class="checkout-btn" onclick="placeOrder()"><i class="fa fa-whatsapp"></i> Order on WhatsApp</button>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="location.reload()"><i class="fa fa-home"></i><div>Home</div></div>
        <div class="nav-item" onclick="location.href='about.html?shopId='+shopId"><i class="fa fa-info-circle"></i><div>About</div></div>
        <div class="nav-item" onclick="location.href='contact.html?shopId='+shopId"><i class="fa fa-phone"></i><div>Contact</div></div>
        <div class="nav-item" onclick="location.href='offers.html?shopId='+shopId"><i class="fa fa-tag"></i><div>Offers</div></div>
    </div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const shopId = urlParams.get('shopId');
const API_BASE = `/api/fruit`;
let shopData = {};
let cart = JSON.parse(localStorage.getItem('cart_'+shopId)) || [];
let currentFilter = 'all';

document.addEventListener('DOMContentLoaded', () => {
    loadData();
    updateCartCount();
    document.getElementById('searchInput').onkeyup = (e) => renderProducts(e.target.value);
});

async function loadData() {
    try{
        const res = await fetch(`${API_BASE}/${shopId}`);
        const result = await res.json();
        shopData = result.shop || result.data || result;
        shopData.items = shopData.items || [];
        renderAll();
    }catch(err){
        console.error("LOAD ERROR:", err);
    }
}

function renderAll(){
    // 3. BANNER + LOGO SET KARNA ADD KIYA
    const bannerUrl = shopData.banner || shopData.bannerPhotoUrl || shopData.settings?.bannerPhotoUrl;
    if(bannerUrl) document.getElementById('shopBanner').style.background = `url(${bannerUrl}) center/cover`;

    const logoUrl = shopData.ownerPhotoUrl || shopData.settings?.ownerPhotoUrl;
    if(logoUrl) document.getElementById('ownerImg').src = logoUrl;

    document.getElementById('pageTitle').innerText = shopData.shopName || 'Fresh Fruits';
    document.getElementById('shopName').innerText = shopData.shopName || 'Fresh Fruits';
    
    const isOpen = shopData.isOpen ?? shopData.settings?.isOpen ?? true;
    document.getElementById('shopStatus').innerHTML = `<i class="fa fa-circle"></i> ${isOpen ? 'OPEN' : 'CLOSED'}`;
    document.getElementById('shopStatus').style.background = isOpen ? 'rgba(34,197,94,0.3)' : 'rgba(239,68,68,0.3)';

    if(shopData.announcement || shopData.settings?.announcement){
        document.getElementById('announcementBox').style.display = 'block';
        document.getElementById('announcementBox').innerText = shopData.announcement || shopData.settings?.announcement;
    }

    const cats = [...new Set(shopData.items.map(i => i.category || 'General'))];
    document.getElementById('categories').innerHTML = '<button class="cat-btn active" onclick="filterCat(\'all\', event)">All</button>' + 
        cats.map(c => `<button class="cat-btn" onclick="filterCat('${c}',event)">${c}</button>`).join('');
    
    renderProducts();
}

function filterCat(cat, event){
    currentFilter = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    renderProducts();
}

function renderProducts(search=''){
    const grid = document.getElementById('productGrid');
    let items = shopData.items.filter(i => i.available !== false);
    if(currentFilter !== 'all') items = items.filter(i => (i.category || 'General') === currentFilter);
    if(search) items = items.filter(i => (i.name || '').toLowerCase().includes(search.toLowerCase()));

    if(!items.length) return grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1; color:#64748b;">Koi product nahi mila</p>';

    grid.innerHTML = items.map(item => {
        const id = item.id || item._id;
        const inCart = cart.find(c => c.id === id);
        return `
        <div class="product-card">
            <img src="${item.image || 'https://placehold.co/300x200/22c55e/fff?text=Fruit'}" class="product-img">
            <div class="product-name">${item.name}</div>
            <div class="product-price">₹${item.price} <span class="product-unit">/ ${item.unit || 'Kg'}</span></div>
            ${inCart ? 
                `<div class="qty-control">
                    <button class="qty-btn" onclick="updateQty('${id}', -1)">-</button>
                    <span>${inCart.qty}</span>
                    <button class="qty-btn" onclick="updateQty('${id}', 1)">+</button>
                </div>` :
                `<button class="add-btn" onclick="addToCart('${id}', '${item.name}', ${item.price})">ADD</button>`
            }
        </div>
    `}).join('');
}

function addToCart(id, name, price){
    const existing = cart.find(i => i.id === id);
    if(existing) existing.qty++; else cart.push({id, name, price, qty: 1});
    saveCart();
}
function updateQty(id, change){
    const item = cart.find(i => i.id === id);
    if(item) item.qty += change;
    if(item.qty <= 0) cart = cart.filter(i => i.id !== id);
    saveCart();
}
function saveCart(){
    localStorage.setItem('cart_'+shopId, JSON.stringify(cart));
    updateCartCount();
    renderProducts();
    renderCart();
}
function updateCartCount(){ 
    document.getElementById('cartCount').innerText = cart.reduce((a,b) => a+b.qty, 0); 
}
function toggleCart(){
    document.getElementById('cartSidebar').classList.toggle('active');
    document.getElementById('overlay').classList.toggle('active');
    renderCart();
}
function renderCart(){
    const cartItems = document.getElementById('cartItems');
    let total = 0;
    cartItems.innerHTML = cart.map(item => {
        total += item.price * item.qty;
        return `<div class="cart-item">
            <img src="https://placehold.co/50x50/22c55e/fff">
            <div style="flex:1;">
                <div style="font-weight:600;">${item.name}</div>
                <div>₹${item.price} x ${item.qty}</div>
            </div>
            <div style="font-weight:700;">₹${item.price * item.qty}</div>
        </div>`
    }).join('') || '<p>Cart Khali hai</p>';
    document.getElementById('cartTotal').innerText = total;
}

function placeOrder(){
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    if(!name || !phone) return alert('Name aur Number bharo');
    if(cart.length === 0) return alert('Cart khali hai');

    let msg = `*NEW ORDER - ${shopData.shopName}*\n\n`;
    cart.forEach(i => msg += `${i.name} x ${i.qty} = ₹${i.price*i.qty}\n`);
    msg += `\n*Total:* ₹${document.getElementById('cartTotal').innerText}`;
    msg += `\n*Name:* ${name}\n*Phone:* ${phone}`;
    
    const shopPhone = shopData.phone || '91XXXXXXXXXX';
    window.open(`https://wa.me/${shopPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    
    localStorage.removeItem('cart_'+shopId);
    cart = [];
    saveCart();
    toggleCart();
    alert('Order bhej diya WhatsApp pe ✅');
}
</script>
</body>
</html>
