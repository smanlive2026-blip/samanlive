<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { 
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px;
        }
        .box { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 20px; 
            text-align: center; 
            max-width: 400px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .icon { 
            font-size: 70px; 
            color: #22c55e; 
            margin-bottom: 20px; 
        }
        h1 { 
            color: #14532d; 
            margin-bottom: 10px; 
            font-size: 28px;
        }
        p { 
            color: #64748b; 
            margin-bottom: 25px; 
            line-height: 1.6;
        }
        .btn { 
            background: linear-gradient(135deg, #22c55e 0%, #15803d 100%);
            color: white; 
            padding: 14px 28px; 
            border-radius: 12px; 
            text-decoration: none; 
            font-weight: 700; 
            display: inline-block;
            transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="box">
        <div class="icon"><i class="fa fa-check-circle"></i></div>
        <h1>Order Placed!</h1>
        <p>Shop owner ko WhatsApp par message chala gaya hai. 
        Wo jald hi contact karenge.</p>
        <a href="#" class="btn" onclick="goHome()">Continue Shopping</a>
    </div>

    <script>
        const shopId = new URLSearchParams(window.location.search).get('shopId');
        localStorage.removeItem('cart_'+shopId); // cart clear

        function goHome(){
            location.href = `customer-view.html?shopId=${shopId}`;
        }
    </script>
</body>
</html>
