<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairy Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #0284c7 0%, #075985 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1400px; margin: 0 auto; }
        
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
       .header h1 { font-size: 28px; color: #0c4a6e; display: flex; align-items: center; gap: 12px; }
        
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #0284c7; }
       .stat-card .icon { font-size: 32px; color: #0284c7; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
        
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
       .btn { background: linear-gradient(135deg, #0284c7 0%, #075985 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        
       .subscription-card { border: 2px solid #e0f2fe; border-radius: 16px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
       .status { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }
       .status.active { background: #dcfce7; color: #166534; }
       .status.pause { background: #fef3c7; color: #78350f; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-cow"></i> <span id="shopName">Dairy Shop</span></h1>
                <div style="color:#64748b; font-size:14px;">Shop ID: <span id="shopIdDisplay"></span></div>
            </div>
            <button class="btn" id="addProductBtn"><i class="fa fa-plus"></i> Add Product</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-users"></i></div><h3>Active Subscriptions</h3><div class="value" id="subscriptions">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-droplet"></i></div><h3>Today Milk Sold</h3><div class="value"><span id="milkSold">0</span> L</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-boxes"></i></div><h3>Products</h3><div class="value" id="products">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Today Collection</h3><div class="value">₹<span id="collection">0</span></div></div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-calendar-check"></i> Today's Subscriptions</h2>
            <div id="subscriptionList">Loading...</div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-list"></i> Product Stock</h2>
            <div id="productList">Loading...</div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
