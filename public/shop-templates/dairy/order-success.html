<!-- LOCATION: public/shop-templates/dairy/order-success.html - V7 WORLD CLASS -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Success - Gopal Dairy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--milk:#0ea5e9;--dark:#0f172a;--bg:#f8fafc;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:var(--bg);color:var(--dark);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#fff;border-radius:28px;border:1px solid #e2e8f0;padding:28px;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.08)}
.check{width:80px;height:80px;background:var(--green);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:36px;margin:0 auto 16px;animation:pop .6s cubic-bezier(.16,1,.3,1)}
@keyframes pop{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
h1{font-weight:900;font-size:24px;line-height:1.1}
p{color:#64748b;font-size:13px;font-weight:600;margin-top:6px;line-height:1.4}
.details{background:#f8fafc;border:1px solid #f1f5f9;border-radius:16px;padding:14px;margin:18px 0;text-align:left}
.row{display:flex;justify-content:space-between;margin:6px 0;font-size:13px;font-weight:600}
.row.total{font-weight:900;font-size:15px;border-top:1px dashed #e2e8f0;padding-top:10px;margin-top:10px}
.btn{width:100%;padding:14px;border-radius:14px;border:none;font-weight:900;font-size:14px;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center;margin-top:10px}
.btn-dark{background:var(--dark);color:#fff}
.btn-milk{background:var(--milk);color:#fff}
.btn-light{background:#f1f5f9;color:var(--dark)}
.badge{display:inline-flex;gap:6px;align-items:center;background:#e0f2fe;color:#0369a1;padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;margin-top:12px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:999}
.confetti span{position:absolute;animation:fall 3s linear infinite}
@keyframes fall{0%{transform:translateY(-100vh) rotate(0)}100%{transform:translateY(100vh) rotate(720deg)}}
</style>
</head>
<body data-page="success" data-shop="dairy">

<div class="confetti" id="confetti"></div>

<div class="card">
  <div class="check"><i class="fa-solid fa-check"></i></div>
  <h1>Order Placed! 🥛</h1>
  <p id="subText">Taaza doodh subah 6 baje aapke ghar pahuch jayega</p>

  <div class="badge" id="orderBadge"><i class="fa-solid fa-receipt"></i> <span id="orderIdShow">Order #DAIRY12345</span></div>

  <div class="details">
    <div class="row"><span>Shop</span><b id="shopName">Gopal Dairy</b></div>
    <div class="row"><span>Slot</span><b id="slotShow">Morning 6-9 AM</b></div>
    <div class="row"><span>Type</span><b id="typeShow">One-time</b></div>
    <div class="row"><span>Payment</span><b id="payShow">COD</b></div>
    <div class="row total"><span>Total Paid</span><span id="totalShow" style="color:var(--green)">₹0</span></div>
  </div>

  <div style="background:#0f172a;color:#fff;border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;text-align:left;margin-bottom:14px">
    <img src="https://i.pravatar.cc/100?img=12" style="width:48px;height:48px;border-radius:50%">
    <div><b style="font-size:13px">Ramu Yadav - Delivery Boy</b><br><small style="color:#94a3b8">⭐ 4.9 | 3 saal se dairy me</small></div>
    <a href="tel:9000000000" style="margin-left:auto;background:var(--green);color:#fff;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;text-decoration:none"><i class="fa-solid fa-phone"></i></a>
  </div>

  <button class="btn btn-dark" onclick="trackOrder()"><i class="fa-solid fa-map-location-dot"></i> Track Order Live</button>
  <button class="btn btn-milk" onclick="goShop()"><i class="fa-solid fa-bag-shopping"></i> Continue Shopping</button>
  <button class="btn btn-light" onclick="shareOrder()"><i class="fa-solid fa-share-nodes"></i> Share Order</button>

  <p style="margin-top:14px;font-size:11px">Order ID ka screenshot le lo, delivery boy puchhega</p>
</div>

<script src="../shop-templates/shop-core.js"></script>
<script src="../common/track/track-core.js"></script>
<script src="../common/core/socket-core.js"></script>
<script>
const SHOP_ID = new URLSearchParams(location.search).get('shopId') || localStorage.getItem('lastShopId') || 'DAIRY123';
const ORDER_ID = new URLSearchParams(location.search).get('orderId') || localStorage.getItem(`last_order_${SHOP_ID}`) || Date.now().toString();

document.getElementById('orderIdShow').innerText = 'Order #' + ORDER_ID.slice(-8).toUpperCase();

function initSuccess(){
  if(window.ShopCore) ShopCore.init(SHOP_ID,'dairy');
  
  // Old order data se info bharo
  try{
    const lastOrder = JSON.parse(localStorage.getItem(`last_order_${SHOP_ID}`)||'{}');
    if(lastOrder.customer) document.getElementById('shopName').innerText = lastOrder.shopId || 'Gopal Dairy';
    const slot = localStorage.getItem(`delivery_slot_${SHOP_ID}`) || lastOrder.deliverySlot || 'morning';
    const isSub = localStorage.getItem(`is_sub_${SHOP_ID}`)==='true' || lastOrder.isSubscription;
    const pay = localStorage.getItem(`pay_method_${SHOP_ID}`) || lastOrder.paymentMethod || 'COD';
    const total = localStorage.getItem(`cart_total_${SHOP_ID}`) || lastOrder.total || '0';
    document.getElementById('slotShow').innerText = slot==='morning'? 'Morning 6-9 AM' : 'Evening 5-8 PM';
    document.getElementById('typeShow').innerText = isSub? 'Daily Subscription (10% OFF)' : 'One-time';
    document.getElementById('payShow').innerText = pay.toUpperCase();
    document.getElementById('totalShow').innerText = '₹'+total;
    document.getElementById('subText').innerText = isSub? 'Roz subah 6 baje doodh aayega, cancel anytime' : 'Taaza doodh '+ (slot==='morning'? 'subah 6 baje':'sham 5 baje') +' aapke ghar';
  }catch(e){}

  // Clear cart after success - common/cart
  if(window.CommonCart) CommonCart.clear(SHOP_ID);
  localStorage.removeItem(`cart_${SHOP_ID}`);
  localStorage.removeItem(`cart_${SHOP_ID}_new`);
  localStorage.setItem(`last_success_${SHOP_ID}`, ORDER_ID);

  // Confetti
  spawnConfetti();
  
  // Vibrate
  navigator.vibrate && navigator.vibrate([100,50,100]);
}

function spawnConfetti(){
  const c = document.getElementById('confetti');
  const emojis = ['🥛','🎉','✨','🧈','🥤'];
  for(let i=0;i<20;i++){
    const s = document.createElement('span');
    s.innerText = emojis[Math.floor(Math.random()*emojis.length)];
    s.style.left = Math.random()*100+'vw';
    s.style.animationDelay = Math.random()*1+'s';
    s.style.fontSize = (16+Math.random()*16)+'px';
    c.appendChild(s);
  }
}

function trackOrder(){
  location.href = `./track-order.html?shopId=${SHOP_ID}&orderId=${ORDER_ID}`;
}

function goShop(){
  location.href = `./customer-view.html?shopId=${SHOP_ID}`;
}

function shareOrder(){
  const text = `Maine Gopal Dairy se doodh order kiya! Order ID: ${ORDER_ID.slice(-8).toUpperCase()} - ${document.getElementById('slotShow').innerText} me aayega. 🥛`;
  if(navigator.share){
    navigator.share({title:'Gopal Dairy Order', text});
  }else{
    navigator.clipboard.writeText(text);
    alert('Order details copied! 📋');
  }
}

document.addEventListener('DOMContentLoaded', initSuccess);
</script>
</body>
</html>
