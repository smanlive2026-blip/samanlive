<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Gopal Dairy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root{--milk:#0ea5e9;--dark:#0f172a;--bg:#f8fafc;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:var(--bg);padding-bottom:140px}
.header{background:white;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:10}
.item{background:white;margin:10px 16px;border-radius:16px;padding:12px;display:flex;gap:12px;align-items:center;box-shadow:0 2px 8px #00006}
.item img{width:70px;height:70px;border-radius:12px;object-fit:cover}
.qty{display:flex;align-items:center;gap:10px;background:#f1f5f9;border-radius:20px;padding:4px 10px}
.qty button{width:24px;height:24px;border-radius:50%;border:none;background:white;font-weight:700;cursor:pointer}
.bill{background:white;margin:16px;border-radius:16px;padding:16px}
.row{display:flex;justify-content:space-between;margin:8px 0;font-size:14px}
.row.total{font-weight:800;font-size:16px;border-top:1px dashed #e2e8f0;padding-top:10px}
.delivery-slot{margin:16px;background:white;border-radius:16px;padding:16px}
.slot{display:flex;gap:10px;margin-top:10px}
.slot div{flex:1;padding:10px;border:1px solid #e2e8f0;border-radius:12px;text-align:center;cursor:pointer}
.slot div.active{border-color:var(--milk);background:#e0f2fe;color:var(--milk);font-weight:700}
.bottom{position:fixed;bottom:0;left:0;right:0;background:white;padding:16px;box-shadow:0 -4px 20px #0001}
.btn{width:100%;padding:14px;background:var(--dark);color:white;border:none;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer}
.empty{text-align:center;padding:60px 20px}
</style>
</head>
<body data-page="cart" data-shop="dairy">

<div class="header"><i class="fa-solid fa-arrow-left" onclick="history.back()"></i><h3>Your Dairy Basket</h3></div>

<div id="cartItems"></div>

<div class="delivery-slot" id="slotBox">
  <h4>🕕 Delivery Slot - Dairy Special</h4>
  <div class="slot">
    <div class="active" onclick="selectSlot(this,'morning')"><i class="fa-solid fa-sun"></i><br>Subah<br><small>6-9 AM</small></div>
    <div onclick="selectSlot(this,'evening')"><i class="fa-solid fa-moon"></i><br>Sham<br><small>5-8 PM</small></div>
  </div>
  <div style="margin-top:12px">
    <label style="font-size:13px"><input type="checkbox" id="isSubscription"> 🔄 Isko Daily Subscription banao? (10% OFF)</label>
  </div>
</div>

<div class="bill" id="billBox">
  <h4>Bill Details</h4>
  <div class="row"><span>Item Total</span><span id="itemTotal">₹0</span></div>
  <div class="row"><span>Delivery</span><span style="color:var(--green)">FREE</span></div>
  <div class="row"><span>Subscription Discount</span><span id="discount">-₹0</span></div>
  <div class="row total"><span>To Pay</span><span id="toPay">₹0</span></div>
</div>

<div class="bottom">
  <button class="btn" onclick="goCheckout()">Checkout <i class="fa-solid fa-arrow-right"></i></button>
</div>

<!-- COMMON CART CORE - PEHLE LOAD HOGA -->
<script src="../common/cart/cart-core.js"></script>
<script src="../common/cart/cart-count.js"></script>
<script src="../shop-templates/shop-core.js"></script>

<script>
const SHOP_ID = new URLSearchParams(window.location.search).get('shopId') || localStorage.getItem('lastShopId') || 'DAIRY123';
let PRODUCTS = JSON.parse(localStorage.getItem(`products_${SHOP_ID}`)||'[]');
let SELECTED_SLOT = 'morning';
let CART = [];

// Mock if empty - DB se nahi aaya toh
if(!PRODUCTS.length){
  PRODUCTS = [
    {name:'Full Cream Milk 1Ltr', price:62, img:'https://images.unsplash.com/photo-1550583724-b2692b85b150', unit:'1 Ltr'},
    {name:'Desi Dahi 500g', price:45, img:'https://images.unsplash.com/photo-1488477181946-64290103bbd6', unit:'500g'},
  ];
}

function renderCart(){
  // COMMON SE CART LO
  CART = window.CommonCart? CommonCart.getCart(SHOP_ID) : JSON.parse(localStorage.getItem(`cart_${SHOP_ID}`)||'[]');

  const box = document.getElementById('cartItems');
  if(!CART.length){
    box.innerHTML = `<div class="empty"><h2>🥛 Basket Khali Hai</h2><p>Thoda doodh-dahi add karo</p><button class="btn" style="margin-top:16px;width:auto;padding:10px 20px" onclick="location.href='./customer-view.html?shopId=${SHOP_ID}'">Shop pe jao</button></div>`;
    document.getElementById('billBox').style.display='none';
    document.getElementById('slotBox').style.display='none';
    return;
  }
  document.getElementById('billBox').style.display='block';
  document.getElementById('slotBox').style.display='block';

  box.innerHTML = CART.map((c,i)=> {
    const p = PRODUCTS[c.idx] || PRODUCTS[0];
    return `<div class="item">
      <img src="${p.imageUrl||p.img}">
      <div style="flex:1"><b style="font-size:14px">${p.name}</b><br><small>₹${p.price} | ${p.unit||'1 Ltr'}</small>
        <div class="qty" style="margin-top:6px"><button onclick="changeQty(${i},-1)">-</button><span>${c.qty}</span><button onclick="changeQty(${i},1)">+</button></div>
      </div>
      <div><b>₹${p.price*c.qty}</b><br><i class="fa-solid fa-trash" style="color:red;margin-top:8px;cursor:pointer" onclick="removeItem(${i})"></i></div>
    </div>`;
  }).join('');
  calculateBill();
}

// COMMON CART USE KAR RAHE HAIN
function changeQty(i,delta){
  if(window.CommonCart){
    CART = CommonCart.updateQty(SHOP_ID, i, delta);
  } else {
    CART[i].qty += delta;
    if(CART[i].qty<=0) CART.splice(i,1);
    localStorage.setItem(`cart_${SHOP_ID}`, JSON.stringify(CART));
  }
  renderCart();
}
function removeItem(i){
  if(window.CommonCart){
    CommonCart.remove(SHOP_ID, i);
    CART = CommonCart.getCart(SHOP_ID);
  } else {
    CART.splice(i,1);
    localStorage.setItem(`cart_${SHOP_ID}`, JSON.stringify(CART));
  }
  renderCart();
}

function calculateBill(){
  let total = 0;
  CART.forEach(c=>{
    const p = PRODUCTS[c.idx] || PRODUCTS[0];
    total += p.price * c.qty;
  });
  let discount = document.getElementById('isSubscription').checked? total*0.1 : 0;
  document.getElementById('itemTotal').innerText = `₹${total}`;
  document.getElementById('discount').innerText = `-₹${discount.toFixed(0)}`;
  document.getElementById('toPay').innerText = `₹${(total-discount).toFixed(0)}`;
  // Final amount ko checkout ke liye save
  localStorage.setItem(`cart_total_${SHOP_ID}`, (total-discount).toFixed(0));
}

window.selectSlot = (el,slot)=>{
  document.querySelectorAll('.slot div').forEach(d=>d.classList.remove('active'));
  el.classList.add('active'); SELECTED_SLOT = slot;
}
document.getElementById('isSubscription').onchange = calculateBill;

function goCheckout(){
  localStorage.setItem(`delivery_slot_${SHOP_ID}`, SELECTED_SLOT);
  localStorage.setItem(`is_sub_${SHOP_ID}`, document.getElementById('isSubscription').checked);
  location.href = `./checkout.html?shopId=${SHOP_ID}`;
}

// INIT
document.addEventListener('DOMContentLoaded', ()=>{
  ShopCore.init(SHOP_ID, 'dairy');
  renderCart();
});
</script>
</body>
</html>
