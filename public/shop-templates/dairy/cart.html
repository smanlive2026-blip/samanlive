<!-- LOCATION: public/shop-templates/dairy/cart.html - V7 WORLD CLASS + OLD LOGIC -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Gopal Dairy</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--milk:#0ea5e9;--dark:#0f172a;--bg:#f8fafc;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:var(--bg);padding-bottom:140px}
.header{height:60px;background:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e2e8f0}
.item{background:#fff;margin:10px 16px;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;border:1px solid #f1f5f9;transition:.2s}
.item img{width:72px;height:72px;border-radius:14px;object-fit:cover}
.qty{display:flex;align-items:center;gap:8px;background:#f1f5f9;border-radius:20px;padding:4px 8px;margin-top:8px}
.qty button{width:28px;height:28px;border-radius:50%;border:none;background:#fff;font-weight:900;cursor:pointer;box-shadow:0 2px 6px #0001}
.bill{background:#fff;margin:16px;border-radius:20px;padding:16px;border:1px solid #e2e8f0}
.row{display:flex;justify-content:space-between;margin:8px 0;font-size:13px;font-weight:600}
.row.total{font-weight:900;font-size:16px;border-top:1px dashed #e2e8f0;padding-top:12px}
.slot-box{background:#fff;margin:16px;border-radius:20px;padding:16px;border:1px solid #e2e8f0}
.slot-grid{display:flex;gap:10px;margin-top:12px}
.slot{flex:1;padding:12px;border:2px solid #e2e8f0;border-radius:14px;text-align:center;cursor:pointer;font-weight:800;font-size:13px}
.slot.active{border-color:var(--milk);background:#e0f2fe;color:#0369a1}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:16px;border-top:1px solid #e2e8f0;box-shadow:0 -10px 30px rgba(0,0,0,.06)}
.btn{width:100%;padding:14px;background:var(--dark);color:#fff;border:none;border-radius:14px;font-weight:900;font-size:15px;cursor:pointer;display:flex;gap:8px;justify-content:center;align-items:center}
.empty{text-align:center;padding:60px 20px}
#toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;font-size:13px;display:none;z-index:999}
</style>
</head>
<body data-page="cart" data-shop="dairy">
<div class="header"><i class="fa-solid fa-arrow-left" onclick="history.back()" style="width:36px;height:36px;background:#f1f5f9;display:grid;place-items:center;border-radius:10px;cursor:pointer"></i><h3 style="font-weight:900">Your Basket</h3><small id="shopIdDisplay" style="margin-left:auto;background:#f1f5f9;padding:4px 8px;border-radius:8px;font-size:10px"></small></div>
<div id="cartItems"></div>
<div class="slot-box" id="slotBox"><h4 style="font-weight:900">🕕 Delivery Slot - Dairy Special</h4><div class="slot-grid"><div class="slot active" onclick="selectSlot(this,'morning')"><i class="fa-solid fa-sun"></i><br>Subah<br><small>6-9 AM</small></div><div class="slot" onclick="selectSlot(this,'evening')"><i class="fa-solid fa-moon"></i><br>Sham<br><small>5-8 PM</small></div></div><label style="display:flex;gap:8px;align-items:center;margin-top:14px;font-size:13px;font-weight:700"><input type="checkbox" id="isSubscription" style="width:18px;height:18px"> 🔄 Daily Subscription banao? (10% OFF)</label></div>
<div class="bill" id="billBox"><h4 style="font-weight:900">Bill Details</h4><div class="row"><span>Item Total</span><span id="itemTotal">₹0</span></div><div class="row"><span>Delivery</span><span style="color:var(--green)">FREE</span></div><div class="row" id="discRow"><span>Subscription Discount</span><span id="discount" style="color:var(--green)">-₹0</span></div><div class="row total"><span>To Pay</span><span id="toPay">₹0</span></div></div>
<div class="bottom"><button class="btn" onclick="goCheckout()">Checkout <i class="fa-solid fa-arrow-right"></i> • <span id="bottomPay">₹0</span></button></div>
<div id="toast"></div>
<script src="../shop-templates/shop-core.js"></script>
<script src="../common/cart/cart-core.js"></script>
<script src="../common/cart/cart-count.js"></script>
<script>
const SHOP_ID = new URLSearchParams(location.search).get('shopId') || localStorage.getItem('lastShopId') || 'DAIRY123';
document.getElementById('shopIdDisplay').innerText='ID: '+SHOP_ID.slice(-6);
let PRODUCTS=[]; let SELECTED_SLOT=localStorage.getItem(`delivery_slot_${SHOP_ID}`)||'morning'; let CART=[];
function toast(m){const t=document.getElementById('toast');t.innerText=m;t.style.display='block';setTimeout(()=>t.style.display='none',2000);}
async function loadProducts(){ try{ const r=await fetch(`/api/shops/dairy/${SHOP_ID}?t=${Date.now()}`,{cache:'no-store'}); const d=await r.json(); PRODUCTS=d.shop.products||[]; if(!PRODUCTS.length) throw new Error(); }catch(e){ PRODUCTS=JSON.parse(localStorage.getItem(`products_${SHOP_ID}`)||'[]'); if(!PRODUCTS.length) PRODUCTS=[{name:'Full Cream Milk 1Ltr',price:62,img:'https://images.unsplash.com/photo-1550583724-b2692b85b150',unit:'1 Ltr'},{name:'Desi Dahi 500g',price:45,img:'https://images.unsplash.com/photo-1488477181946-64290103bbd6',unit:'500g'}]; } renderCart(); }
function renderCart(){ CART=window.CommonCart? CommonCart.getCart(SHOP_ID) : JSON.parse(localStorage.getItem(`cart_${SHOP_ID}`)||'[]'); const box=document.getElementById('cartItems'); if(!CART.length){ box.innerHTML=`<div class="empty"><div style="font-size:60px">🥛</div><h2 style="font-weight:900;margin-top:10px">Basket Khali Hai</h2><p style="color:#94a3b8;font-size:13px;margin-top:4px">Thoda doodh-dahi add karo</p><button class="btn" style="margin-top:16px;width:auto;padding:10px 20px" onclick="location.href='./customer-view.html?shopId=${SHOP_ID}'">Shop pe jao</button></div>`; document.getElementById('billBox').style.display='none'; document.getElementById('slotBox').style.display='none'; return; } document.getElementById('billBox').style.display='block'; document.getElementById('slotBox').style.display='block'; box.innerHTML=CART.map((c,i)=>{ const p=PRODUCTS[c.idx]||PRODUCTS[0]||{name:'Milk',price:60,img:''}; const img=p.imageUrl||p.image||p.img||''; return `<div class="item"><img src="${img}" onerror="this.src='https://placehold.co/100/e0f2fe/0ea5e9?text=Milk'"><div style="flex:1"><b style="font-size:14px">${p.name||p.name}</b><br><small style="color:#94a3b8">₹${p.price} | ${p.unit||'1 Ltr'}</small><div class="qty"><button onclick="changeQty(${i},-1)">-</button><span>${c.qty}</span><button onclick="changeQty(${i},1)">+</button></div></div><div style="text-align:right"><b>₹${p.price*c.qty}</b><br><i class="fa-solid fa-trash" style="color:#ef4444;margin-top:8px;cursor:pointer" onclick="removeItem(${i})"></i></div></div>`; }).join(''); calculateBill(); }
function changeQty(i,d){ if(window.CommonCart){ CART=CommonCart.updateQty(SHOP_ID,i,d);} else { CART[i].qty+=d; if(CART[i].qty<=0) CART.splice(i,1); localStorage.setItem(`cart_${SHOP_ID}`,JSON.stringify(CART)); } renderCart(); if(window.CartCount) CartCount.refresh(SHOP_ID); }
function removeItem(i){ if(window.CommonCart){ CommonCart.remove(SHOP_ID,i); CART=CommonCart.getCart(SHOP_ID);} else { CART.splice(i,1); localStorage.setItem(`cart_${SHOP_ID}`,JSON.stringify(CART)); } renderCart(); toast('Removed'); }
function calculateBill(){ let total=0; CART.forEach(c=>{ const p=PRODUCTS[c.idx]||PRODUCTS[0]; total+=p.price*c.qty; }); let disc=document.getElementById('isSubscription').checked? total*0.1:0; document.getElementById('itemTotal').innerText=`₹${total}`; document.getElementById('discount').innerText=`-₹${disc.toFixed(0)}`; document.getElementById('toPay').innerText=`₹${(total-disc).toFixed(0)}`; document.getElementById('bottomPay').innerText=`₹${(total-disc).toFixed(0)}`; localStorage.setItem(`cart_total_${SHOP_ID}`,(total-disc).toFixed(0)); }
window.selectSlot=(el,s)=>{ document.querySelectorAll('.slot').forEach(d=>d.classList.remove('active')); el.classList.add('active'); SELECTED_SLOT=s; localStorage.setItem(`delivery_slot_${SHOP_ID}`,s); };
document.getElementById('isSubscription').onchange=()=>{ localStorage.setItem(`is_sub_${SHOP_ID}`,document.getElementById('isSubscription').checked); calculateBill(); };
function goCheckout(){ localStorage.setItem(`delivery_slot_${SHOP_ID}`,SELECTED_SLOT); localStorage.setItem(`is_sub_${SHOP_ID}`,document.getElementById('isSubscription').checked); location.href=`./checkout.html?shopId=${SHOP_ID}`; }
document.addEventListener('DOMContentLoaded',()=>{ if(window.ShopCore) ShopCore.init(SHOP_ID,'dairy'); loadProducts(); const savedSlot=localStorage.getItem(`delivery_slot_${SHOP_ID}`); if(savedSlot){ document.querySelectorAll('.slot').forEach(s=>{ if(s.textContent.toLowerCase().includes(savedSlot)) s.classList.add('active'); else s.classList.remove('active'); }); } document.getElementById('isSubscription').checked=localStorage.getItem(`is_sub_${SHOP_ID}`)==='true'; });
</script>
</body>
</html>
