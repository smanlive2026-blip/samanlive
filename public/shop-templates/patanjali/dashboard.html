<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patanjali Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1400px; margin: 0 auto; }
        
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
       .header h1 { font-size: 28px; color: #14532d; display: flex; align-items: center; gap: 12px; }
        
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #16a34a; }
       .stat-card .icon { font-size: 32px; color: #16a34a; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
        
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
       .btn { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        
        table { width: 100%; border-collapse: collapse; }
        table th { text-align: left; padding: 15px; background: #f0fdf4; color: #166534; font-weight: 600; }
        table td { padding: 15px; border-bottom: 1px solid #d1fae5; }
       .category-badge { padding: 4px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; }
       .ayurved { background: #dcfce7; color: #166534; }
       .food { background: #ffedd5; color: #9a3412; }
       .cosmetic { background: #f3e8ff; color: #6b21a8; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-leaf"></i> <span id="shopName">Patanjali Store</span></h1>
                <div style="color:#64748b; font-size:14px;">Store ID: <span id="shopIdDisplay"></span></div>
            </div>
            <button class="btn" id="addProductBtn"><i class="fa fa-plus"></i> Add Product</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-boxes"></i></div><h3>Total Products</h3><div class="value" id="totalProducts">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-pills"></i></div><h3>Medicines</h3><div class="value" id="medicineCount">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-shopping-bag"></i></div><h3>Today Sales</h3><div class="value" id="todaySales">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Revenue</h3><div class="value">₹<span id="revenue">0</span></div></div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-list"></i> Product Inventory</h2>
            <div id="loader">Loading...</div>
            <table id="productTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Product</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="productTableBody"></tbody>
            </table>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
