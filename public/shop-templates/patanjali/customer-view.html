<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patanjali Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f0fdf4; }
       .header { background: linear-gradient(135deg, #16a34a 0%, #15803d 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .category-tabs { display: flex; gap: 10px; overflow-x: auto; margin-bottom: 30px; padding-bottom: 10px; }
       .tab { background: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
       .tab.active { background: #16a34a; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); transition: 0.3s; }
       .product-card:hover { transform: translateY(-5px); }
       .product-icon { font-size: 40px; color: #16a34a; margin-bottom: 12px; text-align: center; }
       .product-name { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
       .product-price { font-size: 22px; font-weight: 800; color: #16a34a; }
       .btn-add { background: #16a34a; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .banner { background: white; padding: 25px; border-radius: 16px; margin-bottom: 30px; text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-leaf"></i> <span id="shopName">Patanjali Arogya Kendra</span></h1>
        <p>100% Natural | Ayurvedic | Swadeshi Products</p>
    </div>

    <div class="container">
        <div class="banner">
            <h2><i class="fa fa-award"></i> Baba Ramdev Approved Products</h2>
            <p>For Healthy Life & Natural Living</p>
        </div>

        <div class="category-tabs">
            <div class="tab active" onclick="filterCategory('All')">All</div>
            <div class="tab" onclick="filterCategory('Ayurvedic')">Medicines</div>
            <div class="tab" onclick="filterCategory('Food')">Food & Grains</div>
            <div class="tab" onclick="filterCategory('Cosmetic')">Personal Care</div>
            <div class="tab" onclick="filterCategory('Beverage')">Juices</div>
        </div>

        <div class="product-grid" id="productGrid">Loading...</div>
    </div>

    <div style="position:fixed; bottom:30px; right:30px; background:#16a34a; color:white; padding:15px 25px; border-radius:50px; font-weight:700; cursor:pointer;" onclick="alert('Cart me add ho gaya!')">
        <i class="fa fa-shopping-cart"></i> Cart: <span id="cartCount">0</span>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shopId');
        let allProducts = [];
        let cartCount = 0;

        async function loadShop() {
            const res = await fetch(`/api/local-market/shops/${shopId}`);
            const shop = await res.json();
            document.getElementById('shopName').innerText = shop.shopName;
            allProducts = shop.products || shop.items || [];
            displayProducts(allProducts);
        }

        function displayProducts(products) {
            const grid = document.getElementById('productGrid');
            if (products.length === 0) {
                grid.innerHTML = `<p style="grid-column:1/-1; text-align:center;">No products available</p>`;
                return;
            }
            grid.innerHTML = products.map(p => `
                <div class="product-card">
                    <div class="product-icon"><i class="fa ${getIcon(p.category)}"></i></div>
                    <div class="product-name">${p.name}</div>
                    <p style="color:#64748b; font-size:12px; margin-bottom:10px;">${p.category}</p>
                    <div class="product-price">₹${p.price}</div>
                    <p style="color:#64748b; font-size:12px;">Stock: ${p.stock} ${p.unit || 'pcs'}</p>
                    <button class="btn-add" onclick="addToCart()"><i class="fa fa-cart-plus"></i> Add to Cart</button>
                </div>
            `).join('');
        }

        function getIcon(cat) {
            if(cat==='Ayurvedic') return 'fa-pills'; if(cat==='Food') return 'fa-bowl-rice';
            if(cat==='Cosmetic') return 'fa-spa'; if(cat==='Beverage') return 'fa-bottle-droplet';
            return 'fa-box';
        }

        function filterCategory(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            const filtered = cat==='All'? allProducts : allProducts.filter(p => p.category === cat);
            displayProducts(filtered);
        }

        function addToCart() {
            cartCount++;
            document.getElementById('cartCount').innerText = cartCount;
        }

        loadShop();
    </script>
</body>
</html>
