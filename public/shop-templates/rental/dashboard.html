<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rental Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 28px; color: #7c2d12; display: flex; align-items: center; gap: 12px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #f97316; }
        .stat-card .icon { font-size: 32px; color: #f97316; margin-bottom: 12px; }
        .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
        
        .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; }
        .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
        .btn { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        
        .booking-card { border: 2px solid #ffedd5; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .booking-card:hover { border-color: #f97316; }
        .status-badge { padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; }
        .active { background: #dcfce7; color: #166534; }
        .upcoming { background: #dbeafe; color: #1e40af; }
        
        .item-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .item-card { background: #fff7ed; padding: 15px; border-radius: 12px; text-align: center; }
        .item-card .rent { font-size: 20px; font-weight: 700; color: #f97316; }
        .availability { font-size: 12px; padding: 4px 10px; border-radius: 8px; }
        .available { background: #dcfce7; color: #166534; }
        .rented { background: #fee2e2; color: #991b1b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-truck-moving"></i> <span id="shopName">Rental Service</span></h1>
                <div style="color:#64748b; font-size:14px;">Shop ID: <span id="shopIdDisplay"></span></div>
            </div>
            <button class="btn" id="addItemBtn"><i class="fa fa-plus"></i> Add Item</button>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-boxes"></i></div><h3>Total Items</h3><div class="value" id="totalItems">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-calendar-check"></i></div><h3>Active Rentals</h3><div class="value" id="activeRentals">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>This Month</h3><div class="value">₹<span id="monthEarning">0</span></div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-clock"></i></div><h3>Due Today</h3><div class="value" id="dueToday">0</div></div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-list-alt"></i> Current Bookings</h2>
            <div id="bookingList">Loading...</div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-couch"></i> My Rental Items</h2>
            <div class="item-grid" id="itemGrid">Loading...</div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
