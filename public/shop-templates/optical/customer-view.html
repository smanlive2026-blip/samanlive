<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #ecfeff; }
       .header { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin: 30px 0; text-align: center; border: 3px dashed #06b6d4; }
        
       .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 30px 0; }
       .service-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .service-price { font-size: 20px; font-weight: 800; color: #06b6d4; }
       .btn-book { background: #06b6d4; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .frame-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
       .frame-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-glasses"></i> <span id="shopName">Vision Plus Optical</span></h1>
        <p>Free Eye Test | 1 Hour Delivery | Branded Frames | Contact Lens</p>
    </div>

    <div class="container">
        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Super Offer</h3>
            <p>Free Eye Test + Free Frame Cleaning | Blue Cut Lens 20% OFF</p>
        </div>

        <h2 style="text-align:center; margin:20px 0;">Our Services</h2>
        <div class="service-grid" id="serviceGrid"></div>

        <h2 style="text-align:center; margin:30px 0;">Trending Frames</h2>
        <div class="frame-grid" id="frameGrid"></div>
    </div>

    <script>
        const services = [
            {name: "Free Eye Test", price: "₹0", desc: "Computerized Test", icon: "👁️"}, 
            {name: "Single Vision Lens", price: "₹1200", desc: "Blue Cut Available", icon: "🔍"},
            {name: "Progressive Lens", price: "₹4500", desc: "No Line Bifocal", icon: "👓"},
            {name: "Contact Lens", price: "₹800", desc: "Monthly + Yearly", icon: "👁️"},
            {name: "Designer Frame", price: "₹2200", desc: "Titan, Ray-Ban", icon: "🕶️"},
            {name: "Sunglasses", price: "₹1500", desc: "UV 400 Protection", icon: "😎"}
        ];

        const frames = [
            {name: "Ray-Ban Aviator", price: 8500, brand: "Ray-Ban", icon: "🕶️"}, 
            {name: "Titan Metal", price: 2200, brand: "Titan", icon: "👓"},
            {name: "Fastrack Sports", price: 1500, brand: "Fastrack", icon: "😎"},
            {name: "Vincent Chase", price: 1800, brand: "VC", icon: "👓"},
            {name: "Kids Frame", price: 999, brand: "Local", icon: "👓"},
            {name: "Pilot Frame", price: 3200, brand: "Premium", icon: "🕶️"}
        ];

        document.getElementById('serviceGrid').innerHTML = services.map(s => `
            <div class="service-card">
                <div style="font-size:40px; margin-bottom:10px;">${s.icon}</div>
                <h3>${s.name}</h3>
                <p style="color:#64748b; font-size:14px; margin:8px 0;">${s.desc}</p>
                <div class="service-price">${s.price}</div>
                <button class="btn-book" onclick="alert('Booking Done!')"><i class="fa fa-calendar"></i> Book Now</button>
            </div>
        `).join('');

        document.getElementById('frameGrid').innerHTML = frames.map(f => `
            <div class="frame-card">
                <div style="font-size:50px; margin-bottom:10px;">${f.icon}</div>
                <h3>${f.name}</h3>
                <p style="color:#64748b; font-size:12px;">${f.brand}</p>
                <div class="service-price">₹${f.price}</div>
                <button class="btn-book" onclick="alert('Try at Store!')"><i class="fa fa-cart-plus"></i> Buy Now</button>
            </div>
        `).join('');
    </script>
</body>
</html>
