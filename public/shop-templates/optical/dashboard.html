<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optical Shop Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1600px; margin: 0 auto; }
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
       .header h1 { font-size: 28px; color: #312e81; display: flex; align-items: center; gap: 12px; }
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #6366f1; }
       .stat-card .icon { font-size: 32px; color: #6366f1; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
       .btn { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
       .btn-success { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
       .product-card { border: 2px solid #e0e7ff; border-radius: 16px; padding: 18px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
       #catalogModal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:9999; backdrop-filter:blur(4px); align-items:center; justify-content:center; }
       #catalogModal > div { background:white; border-radius:20px; max-width:900px; width:95%; max-height:85vh; overflow:hidden; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-glasses"></i> <span id="shopName">Optical Store</span></h1>
                <div style="color:#64748b; font-size:14px;">Shop ID: <span id="shopIdDisplay"></span></div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" id="addItemBtn"><i class="fa fa-plus"></i> Add Product</button>
                <button class="btn btn-success" onclick="openCatalog()"><i class="fa fa-store"></i> Catalog se Add Kare</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-box"></i></div><h3>Total Products</h3><div class="value" id="items">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-users"></i></div><h3>Today Customers</h3><div class="value" id="customers">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Today Sale</h3><div class="value">₹<span id="revenue">0</span></div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-eye"></i></div><h3>Eye Tests</h3><div class="value" id="tests">0</div></div>
        </div>

        <div class="content-card">
            <h2><i class="fa fa-list"></i> Inventory</h2>
            <div id="inventoryList">Loading...</div>
        </div>
    </div>

    <div id="catalogModal">
        <div>
            <div style="padding:20px; border-bottom:1px solid #e2e8f0; display:flex; justify-content:space-between;">
                <h2><i class="fa fa-glasses"></i> Optical Catalog - 100+ Products</h2>
                <button onclick="closeCatalog()" style="background:none; border:none; font-size:28px; cursor:pointer;">×</button>
            </div>
            <div style="padding:20px;">
                <input type="text" id="searchCatalog" placeholder="Search... Frame, Sunglass, Lens..." onkeyup="filterCatalog()" style="width:100%; padding:12px; border:2px solid #e0e7ff; border-radius:10px; margin-bottom:15px;">
                <div id="catalogList" style="overflow-y:auto; max-height:60vh;"></div>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
