<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">General Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #f8fafc; }
       .header { background: linear-gradient(135deg, #1e40af 0%, #1e3a8a 100%); color: white; padding: 40px 20px; text-align: center; }
       .container { max-width: 1200px; margin: -20px auto 40px; padding: 20px; }
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 16px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
       .product-price { font-size: 20px; font-weight: 800; color: #1e40af; }
       .btn { background: #1e40af; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-store"></i> <span id="shopName">Shop</span></h1>
        <p id="shopAddress"></p>
    </div>

    <div class="container">
        <h2 style="margin-bottom:20px;">Products</h2>
        <div class="product-grid" id="productGrid">Loading...</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const shopId = urlParams.get('shopId');

        async function loadShop() {
            try {
                const res = await fetch(`/api/shops/general/${shopId}`); // ✅ tera wala route
                const result = await res.json();
                if(!result.success) return alert('Shop not found');

                const shop = result.shop;
                document.getElementById('shopName').innerText = shop.shopName;
                document.getElementById('pageTitle').innerText = shop.shopName;
                document.getElementById('shopAddress').innerText = shop.address || '';

                const items = shop.items || [];
                if(items.length === 0) {
                    document.getElementById('productGrid').innerHTML = '<p>No products yet</p>';
                    return;
                }

                document.getElementById('productGrid').innerHTML = items.map(p => `
                    <div class="product-card">
                        <h3>${p.name}</h3>
                        <div class="product-price">₹${p.price}</div>
                        <button class="btn" onclick="alert('Added to cart')">Add to Cart</button>
                    </div>
                `).join('');

            } catch(e) {
                console.error(e);
                document.getElementById('productGrid').innerHTML = '<p>Failed to load</p>';
            }
        }
        loadShop();
    </script>
</body>
</html>
