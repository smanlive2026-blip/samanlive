<!-- LOCATION: public/shop-templates/sports/user-view.html - V6 NO SHOP LOCALSTORAGE -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Sports Pro Store</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
:root{--orange:#f97316;--dark:#0f172a;--yellow:#facc15}
body{background:#f8fafc;color:#0f172a;padding-bottom:90px}
.header{background:var(--dark);color:#fff;position:sticky;top:0;z-index:100}
.top-strip{background:var(--orange);color:#fff;text-align:center;padding:8px;font-size:12px;font-weight:800;letter-spacing:.5px}
.nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;max-width:1400px;margin:0 auto;width:100%}
.h-left{display:flex;gap:12px;align-items:center}
.h-logo{width:42px;height:42px;background:var(--orange);color:#fff;display:grid;place-items:center;border-radius:12px;font-weight:900;font-size:18px}
.h-info b{font-size:15px;font-weight:900;display:block;line-height:1}
.h-info small{font-size:11px;color:#94a3b8;font-weight:600;display:flex;align-items:center;gap:5px}
.shop-status{padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900}
.shop-status.open{background:#dcfce7;color:#166534}.shop-status.closed{background:#fee2e2;color:#dc2626}
.h-right{display:flex;gap:8px;align-items:center}
.search-box{background:#1e293b;border:1px solid #334155;padding:10px 14px;border-radius:12px;display:flex;align-items:center;gap:8px;width:280px}
.search-box input{background:transparent;border:none;color:#fff;outline:none;width:100%;font-size:13px}
.search-box input::placeholder{color:#94a3b8}
.h-btn{height:42px;padding:0 16px;border-radius:12px;border:none;background:#fff;color:#0f172a;display:flex;align-items:center;gap:8px;font-weight:800;font-size:13px;cursor:pointer}
.cart-count{background:#ef4444;color:#fff;min-width:20px;height:20px;border-radius:20px;display:grid;place-items:center;font-size:11px;padding:0 5px}
.stock-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.stock-dot.ok{background:#22c55e}.stock-dot.low{background:#ef4444}
.hero{background:linear-gradient(105deg,#0f172a 0%,#7c2d12 60%,#f97316 100%);color:#fff;margin:12px;border-radius:24px;padding:20px;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;max-width:1400px;margin-left:auto;margin-right:auto}
.hero::after{content:'';position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(251,146,60,.3),transparent);right:-40px;top:-40px}
.hero h2{font-weight:900;font-size:20px;line-height:1.2;position:relative;z-index:1}
.hero h2 span{color:#fb923c}
.hero p{font-size:12px;opacity:.8;margin-top:4px;position:relative;z-index:1;color:#cbd5e1}
.hero-badge{background:var(--yellow);color:#000;padding:8px 14px;border-radius:30px;font-weight:900;font-size:12px;z-index:1}
.cats{display:flex;gap:8px;overflow:auto;padding:0 16px 12px 16px;scrollbar-width:none;max-width:1400px;margin:0 auto}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:10px 16px;border-radius:30px;background:#fff;border:1px solid #e2e8f0;font-weight:800;font-size:12px;cursor:pointer;transition:.2s;display:flex;gap:6px;align-items:center}
.cat.active{background:var(--dark);color:#fff;border-color:var(--dark);transform:scale(1.05)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 12px;max-width:1400px;margin:0 auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;border-radius:20px;border:1px solid #f1f5f9;overflow:hidden;position:relative;transition:.25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 15px 30px rgba(0,0,0,.08)}
.img-wrap{position:relative;background:#f8fafc;height:150px;display:grid;place-items:center;overflow:hidden}
.img-wrap img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:8px;left:8px;background:var(--orange);color:#fff;font-size:10px;font-weight:900;padding:4px 8px;border-radius:8px}
.brand-tag{position:absolute;top:8px;right:8px;background:var(--dark);color:#fff;font-size:9px;font-weight:800;padding:4px 8px;border-radius:20px}
.p{padding:10px 12px 12px 12px}
.p b{font-size:13px;font-weight:800;line-height:1.2;display:block;min-height:32px}
.meta{font-size:10px;color:#94a3b8;font-weight:600;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:end;margin-top:10px}
.price{font-weight:900;font-size:16px}.price small{font-size:10px;color:#94a3b8;text-decoration:line-through;margin-left:4px;font-weight:600}
.add{height:32px;padding:0 14px;border-radius:10px;background:#fff;border:1.5px solid var(--orange);color:var(--orange);font-weight:900;font-size:12px;cursor:pointer;transition:.2s}
.add.added{background:var(--orange);color:#fff}
.cart-bar{position:fixed;bottom:12px;left:12px;right:12px;background:var(--dark);color:#fff;padding:14px 18px;border-radius:18px;display:none;justify-content:space-between;align-items:center;z-index:50;box-shadow:0 20px 40px rgba(0,0,0,.3);max-width:500px;margin:0 auto}
#cartModal{position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(10px);display:none;z-index:200;align-items:end}
#cartBox{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:28px 28px 0 0;max-height:88vh;display:flex;flex-direction:column;animation:slideUp.3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.cart-head{padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9}
.cart-items{flex:1;overflow:auto;padding:0 16px}
.c-item{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid #f8fafc}
.qty-box{display:flex;align-items:center;background:#f1f5f9;border-radius:10px;overflow:hidden}
.qty-box button{width:32px;height:32px;border:none;background:transparent;font-weight:900;cursor:pointer}
.qty-box button.add-q{background:var(--orange);color:#fff}
@media(max-width:900px){.search-box{display:none}}
</style>
</head>
<body>

<div class="header">
  <div class="top-strip"><i class="fa-solid fa-bolt"></i> <span id="topStrip">FREE SHIPPING ABOVE ₹499 • 6 MONTH WARRANTY • GENUINE BRANDS</span></div>
  <div class="nav">
    <div class="h-left">
      <div class="h-logo"><i class="fa-solid fa-trophy"></i></div>
      <div class="h-info"><b id="shopName">Sports Store</b><small><span class="stock-dot ok"></span><span id="shopStatus">Open • Fast Delivery</span><span class="shop-status open" id="shopStatusBadge">Open</span></small></div>
    </div>
    <div class="h-right">
      <div class="search-box"><i class="fa-solid fa-magnifying-glass" style="color:#94a3b8"></i><input id="searchInput" placeholder="Search bat, ball, shoes..."></div>
      <button class="h-btn" onclick="openCart()"><i class="fa-solid fa-bag-shopping"></i> Cart <span class="cart-count" id="cartCount">0</span></button>
    </div>
  </div>
</div>

<div class="hero">
  <div><h2 id="heroTitle">Premium <span>Sports Gear</span><br>For Champions</h2><p id="shopAddress">Cricket, Football, Gym, Badminton - Original brands in Tharad</p></div>
  <div class="hero-badge"><i class="fa-solid fa-fire"></i> PRO</div>
</div>

<div class="cats" id="catBar"></div>
<div class="grid" id="productGrid"></div>

<div class="cart-bar" id="cartBar">
  <div><b id="cartTotalItems">0 items</b><br><small>₹<span id="cartTotal">0</span> • Free shipping above ₹499</small></div>
  <button onclick="openCart()" style="background:#f97316;color:#fff;border:none;padding:12px 20px;border-radius:12px;font-weight:900">View Cart <i class="fa-solid fa-arrow-right"></i></button>
</div>

<div id="cartModal" onclick="if(event.target==this)closeCart()">
  <div id="cartBox">
    <div class="cart-head"><h3 style="font-weight:900">Your Basket</h3><button onclick="closeCart()" style="width:36px;height:36px;border-radius:12px;border:1px solid #e2e8f0;background:#fff"><i class="fa-solid fa-xmark"></i></button></div>
    <div class="cart-items" id="cartItems"></div>
    <div style="padding:20px;border-top:1px solid #f1f5f9;background:#f8fafc">
      <div style="display:flex;justify-content:space-between;font-weight:900;font-size:16px;margin-bottom:12px"><span>Total</span><span>₹<span id="cartTotal2">0</span></span></div>
      <button onclick="checkout()" style="width:100%;background:#f97316;color:#fff;border:none;padding:16px;border-radius:16px;font-weight:900;font-size:15px"><i class="fa-brands fa-whatsapp"></i> Order on WhatsApp</button>
    </div>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const shopId = urlParams.get('shopId') || urlParams.get('id') || '';
if(!shopId){ alert('shopId missing! URL me ?shopId= lagao'); }

let allProducts=[], cart=JSON.parse(localStorage.getItem('sports_cart_'+shopId)||'[]'), shopData=null;

async function loadShop(){
  if(!shopId) return;
  try{
    const res = await fetch(`/api/shops/sports/${shopId}?t=${Date.now()}`, { cache: 'no-store' });
    const result = await res.json();
    if(!result.success) throw new Error(result.message);
    shopData=result.shop;
    document.getElementById('shopName').innerText=shopData.settings?.shopName||shopData.shopName||'Sports Store';
    document.getElementById('pageTitle').innerText=shopData.settings?.shopName||'Sports Store';
    document.getElementById('heroTitle').innerHTML=`Premium <span>${(shopData.settings?.shopName||'Sports').split(' ')[0]}</span><br>For Champions`;
    document.getElementById('shopAddress').innerText=shopData.settings?.address||'Cricket, Football, Gym - Original brands';
    document.getElementById('topStrip').innerText=shopData.settings?.announcement||'FREE SHIPPING ABOVE ₹499 • 6 MONTH WARRANTY • GENUINE BRANDS';
    const isOpen=shopData.settings?.isOpen??true;
    document.getElementById('shopStatus').innerText=isOpen?'Open • Fast Delivery':'Closed Now';
    const badge=document.getElementById('shopStatusBadge'); badge.innerText=isOpen?'Open':'Closed'; badge.className='shop-status '+(isOpen?'open':'closed');
    allProducts=shopData.products||shopData.items||[];
    renderCats(); renderProducts(allProducts); updateCartUI();
  }catch(e){ document.getElementById('productGrid').innerHTML=`<p style="grid-column:1/-1;padding:40px;text-align:center;color:red">Error: ${e.message}<br>URL me sahi shopId lagao</p>`; }
}
function renderCats(){
  const cats=[...new Set(allProducts.map(p=>p.category||'General'))];
  const bar=document.getElementById('catBar');
  bar.innerHTML=`<button class="cat active" onclick="filterCat('All',this)">🏆 All</button>`+cats.map(c=>`<button class="cat" onclick="filterCat('${c}',this)">${c}</button>`).join('');
}
function renderProducts(list){
  const grid=document.getElementById('productGrid');
  if(!list.length){grid.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:50px;color:#94a3b8">No sports products<br><small>Dashboard se Quick Add karo</small></div>';return;}
  grid.innerHTML=list.map(p=>{
    const disc=p.mrp?Math.round(((p.mrp-p.price)/p.mrp)*100):0;
    const inCart=cart.find(c=>c._id===p._id);
    return `<div class="card">
      <div class="img-wrap"><img src="${p.image||`https://source.unsplash.com/400x400/?${encodeURIComponent(p.category||'sports')}`}" onerror="this.src='https://placehold.co/400/f97316/fff?text=${encodeURIComponent(p.name.slice(0,10))}'">${disc>5?`<div class="off">${disc}% OFF</div>`:''}${p.brand?`<div class="brand-tag">${p.brand}</div>`:''}</div>
      <div class="p"><b>${p.name}</b><div class="meta">${p.category||''} • ${p.size||''}</div><div class="row"><div class="price">₹${p.price}<small>${p.mrp?'₹'+p.mrp:''}</small><br><span style="font-size:10px;color:${p.stock>0?'#16a34a':'#ef4444'}"><span class="stock-dot ${p.stock>0?'ok':'low'}"></span>${p.stock>0?p.stock+' in stock':'Out'}</span></div><button class="add ${inCart?'added':''}" onclick="addToCart('${p._id}')">${inCart?`${inCart.qty} Added`:'ADD'}</button></div></div></div>`;
  }).join('');
}
function filterCat(cat,el){document.querySelectorAll('.cat').forEach(b=>b.classList.remove('active'));if(el)el.classList.add('active');renderProducts(cat==='All'?allProducts:allProducts.filter(p=>(p.category||'General')===cat));}
document.getElementById('searchInput')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();renderProducts(allProducts.filter(p=>p.name.toLowerCase().includes(q)));});
function addToCart(id){const prod=allProducts.find(p=>p._id===id);if(!prod)return;const ex=cart.find(c=>c._id===id);if(ex)ex.qty+=1;else cart.push({...prod,qty:1});localStorage.setItem('sports_cart_'+shopId,JSON.stringify(cart));updateCartUI();renderProducts(allProducts);}
function updateCartUI(){const count=cart.reduce((s,c)=>s+c.qty,0),total=cart.reduce((s,c)=>s+c.price*c.qty,0);document.getElementById('cartCount').innerText=count;document.getElementById('cartTotal').innerText=total;document.getElementById('cartTotal2').innerText=total;document.getElementById('cartTotalItems').innerText=count+' items';document.getElementById('cartBar').style.display=count>0?'flex':'none';document.getElementById('cartItems').innerHTML=cart.map(c=>`<div class="c-item"><img src="${c.image||'https://placehold.co/100'}" style="width:52px;height:52px;border-radius:12px;object-fit:cover"><div style="flex:1"><b style="font-size:13px">${c.name}</b><br><small>₹${c.price} x ${c.qty}</small></div><div class="qty-box"><button onclick="changeQty('${c._id}',-1)">−</button><b style="width:28px;text-align:center">${c.qty}</b><button class="add-q" onclick="changeQty('${c._id}',1)">+</button></div></div>`).join('')||'<p style="text-align:center;padding:30px;color:#94a3b8">Empty</p>';}
function changeQty(id,d){const it=cart.find(c=>c._id===id);if(!it)return;it.qty+=d;if(it.qty<=0)cart=cart.filter(c=>c._id!==id);localStorage.setItem('sports_cart_'+shopId,JSON.stringify(cart));updateCartUI();}
function openCart(){document.getElementById('cartModal').style.display='flex';}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function checkout(){const total=cart.reduce((s,c)=>s+c.price*c.qty,0);const phone=(shopData.settings?.phone||'').replace(/\D/g,'');const lines=cart.map(c=>`• ${c.name} x${c.qty} = ₹${c.price*c.qty}`).join('%0A');const text=`*Sports Order - ${shopData.settings?.shopName||''}*%0A%0A${lines}%0A%0A*Total: ₹${total}*`;const url=phone?`https://wa.me/${phone}?text=${text}`:`https://wa.me/?text=${text}`;window.open(url,'_blank');cart=[];localStorage.setItem('sports_cart_'+shopId,JSON.stringify([]));updateCartUI();closeCart();}
loadShop();
</script>
</body>
</html>
