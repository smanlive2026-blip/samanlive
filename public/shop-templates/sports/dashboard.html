<!-- LOCATION: public/shop-templates/sports/dashboard.html - V5 FIXED FINAL -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports Dashboard - Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--dark:#0f172a;--bg:#f8fafc}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:var(--bg);color:var(--dark)}
.header{height:64px;background:rgba(255,255,255,.9);backdrop-filter:blur(20px);border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:19px;display:flex;gap:10px;align-items:center}
.logo span{background:var(--dark);color:#fff;padding:5px 10px;border-radius:10px;display:grid;place-items:center}
.btn{padding:10px 16px;border-radius:12px;border:none;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center;font-size:13px}
.btn-dark{background:var(--dark);color:#fff}
.btn-orange{background:var(--orange);color:#fff;box-shadow:0 8px 20px rgba(249,115,22,.3)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:20px}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border-radius:20px;padding:18px;border:1px solid #f1f5f9;position:relative;overflow:hidden}
.stat b{font-size:26px;font-weight:900;display:block}.stat p{font-size:11px;color:#64748b;font-weight:700;margin-top:2px;text-transform:uppercase;letter-spacing:.5px}
.stat i{position:absolute;right:14px;top:14px;width:40px;height:40px;display:grid;place-items:center;background:#fff7ed;color:var(--orange);border-radius:12px}
.main{display:grid;grid-template-columns:1fr 350px;gap:20px;padding:0 20px 20px}
@media(max-width:1100px){.main{grid-template-columns:1fr}}
.left{background:#fff;border-radius:24px;border:1px solid #e2e8f0;overflow:hidden}
.left-head{padding:16px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f5f9;flex-wrap:wrap;gap:10px}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:10px;background:#f8fafc;border:1px solid #e2e8f0;padding:10px 14px;border-radius:12px}
.search input{border:none;background:transparent;outline:none;width:100%;font-weight:600;font-size:13px}
.p-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;padding:16px}
.p-card{border:1px solid #f1f5f9;border-radius:18px;overflow:hidden;background:#fff;transition:.25s}
.p-card:hover{transform:translateY(-4px);box-shadow:0 15px 30px rgba(0,0,0,.06)}
.p-card img{width:100%;height:140px;object-fit:cover;background:#f8fafc}
.p-info{padding:12px}.p-info b{font-size:13px;line-height:1.2;display:block;min-height:32px}
.meta{font-size:10px;color:#94a3b8;font-weight:600;margin-top:2px}
.price-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.price{font-weight:900;font-size:15px}.brand-badge{background:#ffedd5;color:#9a3412;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:800}
.stock{font-size:10px;font-weight:800;padding:4px 8px;border-radius:20px}
.stock.ok{background:#dcfce7;color:#166534}.stock.low{background:#fee2e2;color:#b91c1c}
.right .box{background:#fff;border-radius:24px;border:1px solid #e2e8f0;padding:18px;margin-bottom:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;background:#0f172a;color:#fff;padding:12px 14px;border-radius:14px}
.switch{width:44px;height:26px;background:#334155;border-radius:20px;position:relative;transition:.3s;cursor:pointer}
.switch.on{background:var(--orange)}.switch::after{content:'';position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:4px;left:4px;transition:.3s}.switch.on::after{left:22px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 20px;border-radius:30px;font-weight:700;font-size:13px;display:none;z-index:999}
</style>
</head>
<body>

<div class="header">
  <div class="logo"><span><i class="fa-solid fa-trophy"></i></span> Sports Pro <small id="shopIdDisplay" style="background:#f1f5f9;padding:4px 8px;border-radius:8px;font-size:10px;margin-left:6px">ID: ...</small></div>
  <div style="display:flex;gap:8px">
    <button class="btn btn-dark" onclick="viewShop()"><i class="fa-solid fa-eye"></i> View Shop</button>
    <button class="btn btn-orange" onclick="goForm()"><i class="fa-solid fa-plus"></i> Add Item</button>
  </div>
</div>

<div class="stats">
  <div class="stat"><i class="fa-solid fa-box"></i><b id="items">0</b><p>Total Items</p></div>
  <div class="stat"><i class="fa-solid fa-cart-shopping"></i><b id="sale">0</b><p>Today Sale</p></div>
  <div class="stat"><i class="fa-solid fa-indian-rupee-sign"></i><b id="revenue">0</b><p>Today Revenue</p></div>
  <div class="stat"><i class="fa-solid fa-shirt"></i><b id="jersey">0</b><p>Jersey Orders</p></div>
</div>

<div class="main">
  <div class="left">
    <div class="left-head">
      <h3 style="font-weight:900">Inventory <span id="prodCount" style="color:#94a3b8">(0)</span></h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;flex:1;justify-content:end">
        <div class="search"><i class="fa-solid fa-magnifying-glass" style="color:#94a3b8"></i><input id="searchInput" placeholder="Search bat, jersey, shoes..."></div>
        <button class="btn btn-dark" onclick="goQuick()"><i class="fa-solid fa-bolt"></i> Quick Add</button>
      </div>
    </div>
    <div class="p-grid" id="inventoryList">Loading...</div>
  </div>
  <div class="right">
    <div class="box">
      <div class="toggle"><span><i class="fa-solid fa-store"></i> Shop: <b id="toggleText">Open</b></span><div class="switch on" id="toggleSwitch" onclick="toggleShop()"></div></div>
      <p style="font-size:11px;color:#64748b;margin-top:8px;font-weight:600">Band karne par customer order nahi kar payega.</p>
    </div>
    <div class="box"><h4 style="font-weight:900;margin-bottom:12px"><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b"></i> Low Stock</h4><div id="lowStock">Loading...</div></div>
    <div class="box"><h4 style="font-weight:900;margin-bottom:12px"><i class="fa-solid fa-tags" style="color:#f97316"></i> Categories</h4><div id="categories">Loading...</div></div>
  </div>
</div>

<div id="toast"></div>

<script>
const params = new URLSearchParams(location.search);
window.shopId = params.get('shopId') || params.get('id') || localStorage.getItem('last_sports_shopId') || '';
if (shopId) localStorage.setItem('last_sports_shopId', shopId);
document.getElementById('shopIdDisplay').innerText = 'ID: ' + (shopId ? shopId.slice(-6) : 'MISSING');
if (!shopId) alert('shopId missing! Add ?shopId= in URL');

function goForm() { location.href = `/shop-templates/sports/product-form.html?shopId=${shopId}` }
function goQuick() { location.href = `/shop-templates/sports/product-form.html?shopId=${shopId}&quick=1` }
function viewShop() { window.open(`/shop-templates/sports/user-view.html?shopId=${shopId}`, '_blank') }
function toast(m) { const t = document.getElementById('toast'); t.innerText = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2500) }

let allProducts = [];
async function load() {
  try {
    const r = await fetch(`/api/shops/sports/${shopId}?t=${Date.now()}`, { cache: 'no-store' });
    const d = await r.json();
    if (!d.success) throw new Error(d.message);
    const s = d.shop;
    document.getElementById('items').innerText = s.products?.length || 0;
    document.getElementById('prodCount').innerText = `(${s.products?.length || 0})`;
    document.getElementById('sale').innerText = s.stats?.todaySale || 0;
    document.getElementById('revenue').innerText = s.stats?.revenue || 0;
    document.getElementById('jersey').innerText = s.stats?.jerseyOrders || 0;
    const isOpen = s.settings?.isOpen ?? true;
    document.getElementById('toggleSwitch').className = 'switch ' + (isOpen ? 'on' : '');
    document.getElementById('toggleText').innerText = isOpen ? 'Open' : 'Closed';
    allProducts = s.products || [];
    render(allProducts);
    renderLow(d.shop.lowStock || allProducts.filter(p => p.stock <= 5));
    renderCats();
  } catch (e) { document.getElementById('inventoryList').innerHTML = `<p style="padding:20px;color:red">Error: ${e.message}</p>` }
}

function render(list) {
  const c = document.getElementById('inventoryList');
  if (!list.length) { c.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:50px"><div style="font-size:50px">🏏</div><h3 style="margin-top:10px">No items</h3><p style="color:#94a3b8;font-size:13px">Click Quick Add to add sports items</p></div>`; return; }
  c.innerHTML = list.map(p => `
    <div class="p-card">
      <img src="${p.image || `https://source.unsplash.com/400x300/?${encodeURIComponent(p.category || 'sports')}`}" onerror="this.src='https://placehold.co/400/f97316/fff?text=${encodeURIComponent(p.name.slice(0,10))}'">
      <div class="p-info">
        <b>${p.name}</b><div class="meta">${p.brand || ''} • ${p.category || 'General'} ${p.size || ''}</div>
        <div class="price-row"><div class="price">₹${p.price}<br><span class="brand-badge">${p.brand || 'Generic'}</span></div><div class="stock ${p.stock <= 5 ? 'low' : 'ok'}">${p.stock} LEFT</div></div>
        <div style="display:flex;gap:6px;margin-top:10px"><button onclick="edit('${p._id}')" style="flex:1;background:#f1f5f9;border:1px solid #e2e8f0;padding:7px;border-radius:10px;font-weight:800;font-size:11px;cursor:pointer">Edit</button><button onclick="del('${p._id}')" style="width:36px;background:#fff;border:1px solid #fee2e2;color:#ef4444;border-radius:10px;cursor:pointer"><i class="fa fa-trash"></i></button></div>
      </div>
    </div>
  `).join('');
}

function renderLow(list) {
  const c = document.getElementById('lowStock');
  if (!list.length) { c.innerHTML = '<div style="background:#f0fdf4;color:#166534;padding:10px;border-radius:10px;font-weight:800;font-size:12px;text-align:center">✓ All Stock OK</div>'; return; }
  c.innerHTML = list.slice(0, 5).map(p => `<div style="display:flex;justify-content:space-between;padding:10px;background:#fffbeb;border:1px solid #fde68a;border-radius:10px;margin-bottom:6px"><div><b style="font-size:12px">${p.name}</b><br><small style="color:#92400e;font-size:10px">${p.category || ''}</small></div><span style="background:#92400e;color:#fff;padding:3px 7px;border-radius:20px;font-size:10px;font-weight:900">${p.stock}</span></div>`).join('');
}

function renderCats() {
  const cats = [...new Set(allProducts.map(p => p.category || 'General'))];
  document.getElementById('categories').innerHTML = cats.map(cat => `<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:13px;font-weight:600"><span>${cat}</span><span style="background:#f1f5f9;padding:2px 8px;border-radius:20px;font-size:11px">${allProducts.filter(p => (p.category || 'General') === cat).length}</span></div>`).join('') || '<p style="color:#94a3b8;font-size:12px">No categories</p>';
}

// FIXED: filter naam badla -> searchFilter
function searchFilter() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  render(allProducts.filter(p => p.name.toLowerCase().includes(q) || (p.category || '').toLowerCase().includes(q)));
}
document.getElementById('searchInput').addEventListener('input', searchFilter);

async function del(id) { if (!confirm('Delete?')) return; const r = await fetch(`/api/shops/sports/${shopId}/item/${id}`, { method: 'DELETE' }); const d = await r.json(); if (d.success) { toast('Deleted'); load() } }
function edit(id) { location.href = `/shop-templates/sports/product-form.html?shopId=${shopId}&editId=${id}` }
async function toggleShop() { const sw = document.getElementById('toggleSwitch'); const isOpen = !sw.classList.contains('on'); sw.classList.toggle('on', isOpen); document.getElementById('toggleText').innerText = isOpen ? 'Open' : 'Closed'; await fetch(`/api/shops/sports/${shopId}/settings`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ isOpen }) }); toast(isOpen ? 'Shop Opened' : 'Closed') }
load();
</script>
</body>
</html>
