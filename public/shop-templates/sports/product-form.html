<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sports - Add Product</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;font-family:'Outfit',sans-serif;margin:0;padding:0}
body{background:#f8fafc;color:#0f172a}
.top{height:62px;background:#fff;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
.card{max-width:700px;margin:20px auto;background:#fff;border-radius:22px;border:1px solid #e2e8f0;padding:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.row{grid-template-columns:1fr}}
.input label{font-size:11px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:#64748b;margin-bottom:6px;display:block}
.input input,.input select,.input textarea{width:100%;padding:12px 14px;border:1px solid #e2e8f0;border-radius:12px;font-weight:600;font-size:13px;outline:none;background:#fff}
.input input:focus,.input select:focus,.input textarea:focus{border-color:#f97316;box-shadow:0 0 0 3px rgba(249,115,22,.15)}
.btn{width:100%;padding:14px;border:none;border-radius:14px;font-weight:900;font-size:14px;cursor:pointer;display:flex;justify-content:center;gap:8px;align-items:center;margin-top:6px}
.btn-orange{background:#f97316;color:#fff;box-shadow:0 10px 25px rgba(249,115,22,.3)}
.btn-dark{background:#0f172a;color:#fff}
.quick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-height:400px;overflow:auto;padding:10px;background:#f8fafc;border-radius:14px;border:1px solid #e2e8f0}
.q-item{background:#fff;border-radius:12px;padding:10px;border:1px solid #e2e8f0;display:flex;gap:8px;align-items:center}
.q-item.selected{border-color:#f97316;background:#fff7ed}
.q-item input[type=checkbox]{width:18px;height:18px}
</style>
</head>

<div class="top">

</div>

<div class="card" id="singleCard">

  </div>

  <div class="row" style="margin-top:12px">
    <div class="input"><label>Category *</label><select id="category"><option value="Cricket">🏏 Cricket</option><option value="Football">⚽ Football</option><option value="Badminton">🏸 Badminton</option><option value="Gym">🏋️ Gym</option><option value="Jersey">👕 Jersey</option><option value="Shoes">👟 Shoes</option><option value="Accessories">🎒 Accessories</option><option value="Tennis">🎾 Tennis</option><option value="Hockey">🏑 Hockey</option><option value="General">📦 General</option></select></div>
    <div class="input"><label>Price ₹ *</label><input id="price" type="number" placeholder="1500"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="input"><label>MRP ₹</label><input id="mrp" type="number" placeholder="2000"></div>
    <div class="input"><label>Stock Qty *</label><input id="stock" type="number" placeholder="10" value="10"></div>
  </div>
  <div class="row" style="margin-top:12px">
    <div class="input"><label>Size (optional)</label><input id="size" placeholder="Ex: M, L, 8, 9, 10"></div>
    <div class="input"><label>Color (optional)</label><input id="color" placeholder="Ex: Red, Blue, Black"></div>

  <div class="input" style="margin-top:12px"><label>Description</label><textarea id="description" rows="3" placeholder="Genuine product with warranty..."></textarea></div>

  <button class="btn btn-dark" onclick="goDashboard()" style="margin-top:8px;background:#f1f5f9;color:#0f172a;border:1px solid #e2e8f0">Cancel</button>
</div>

<div class="card" id="quickCard" style="display:none;max-width:1000px">

    <button onclick="selectAll(true)" style="padding:8px 14px;border-radius:30px;border:none;background:#f97316;color:#fff;font-weight:800;font-size:12px;cursor:pointer">Select All</button>

<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 20px;border-radius:30px;font-weight:800;font-size:13px;display:none;z-index:9999"></div>

function loadQuick(){
  renderQuick(bulkProducts);
}

function renderQuick(list){
  const grid=document.getElementById('quickGrid');
  grid.innerHTML=list.map((p,i)=>`
    <div class="q-item" data-cat="${p.category}">
      <input type="checkbox" id="chk${i}" value="${i}" onchange="updateCount()">
      <div style="flex:1"><b style="font-size:12px">${p.name}</b><br><small style="font-size:10px;color:#64748b">${p.brand} • ₹${p.price} • Stock:${p.stock}</small></div>
    </div>
  `).join('');
  updateCount();
}

function selectCat(cat){
  document.querySelectorAll('.cat-btn').forEach(b=>{b.style.background='#fff';b.style.color='#0f172a';});
  event.target.style.background='#0f172a';event.target.style.color='#fff';
  if(cat==='All') renderQuick(bulkProducts);
  else renderQuick(bulkProducts.map((p,i)=>({...p,idx:i})).filter(p=>p.category===cat));
}

function selectAll(val){
  document.querySelectorAll('#quickGrid input[type=checkbox]').forEach(c=>c.checked=val);
  document.querySelectorAll('.q-item').forEach(el=>{if(val)el.classList.add('selected');else el.classList.remove('selected')});
  updateCount();
}

function updateCount(){
  const c=document.querySelectorAll('#quickGrid input:checked').length;
  document.getElementById('selectedCount').innerText=c;
  document.querySelectorAll('.q-item').forEach(item=>{
    const chk=item.querySelector('input');
    if(chk.checked) item.classList.add('selected'); else item.classList.remove('selected');
  });
}

async function saveBulk(){
  const checked=[...document.querySelectorAll('#quickGrid input:checked')].map(c=>bulkProducts[parseInt(c.value)]);
  if(!checked.length) return toast('Koi item select karo bhai!');
  const btn=event.target; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Adding...'; btn.disabled=true;
  try{
    const res=await fetch(`/api/shops/sports/${shopId}/bulk`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({products:checked})});
    const data=await res.json();
    if(data.success){toast(`✅ ${checked.length} items added!`);setTimeout(()=>location.href=`/shop-templates/sports/dashboard.html?shopId=${shopId}`,1200)}
    else toast(data.message);
  }catch(e){toast(e.message)}
  btn.disabled=false; btn.innerHTML=`<i class="fa-solid fa-bolt"></i> Add ${checked.length} Items to Shop`;
}

async function saveSingle(){
  const payload={
    name:document.getElementById('name').value.trim(),
    brand:document.getElementById('brand').value.trim()||'Generic',
    category:document.getElementById('category').value,
    price:Number(document.getElementById('price').value),
    mrp:Number(document.getElementById('mrp').value)||Number(document.getElementById('price').value),
    stock:Number(document.getElementById('stock').value)||10,
    size:document.getElementById('size').value.trim(),
    color:document.getElementById('color').value.trim(),
    image:document.getElementById('image').value.trim(),
    description:document.getElementById('description').value.trim()
  };
  if(!payload.name||!payload.price) return toast('Name & Price required!');
  const btn=event.target; const old=btn.innerHTML; btn.innerHTML='Saving...'; btn.disabled=true;
  try{
    let url=`/api/shops/sports/${shopId}/item`;
    let method='POST';
    if(editId){url=`/api/shops/sports/${shopId}/item/${editId}`;method='PUT';}
    const res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    const data=await res.json();
    if(data.success){toast(editId?'Updated!':'Added!');setTimeout(()=>location.href=`/shop-templates/sports/dashboard.html?shopId=${shopId}`,800)}
    else toast(data.message);
  }catch(e){toast(e.message)}
  btn.disabled=false; btn.innerHTML=old;
}

// EDIT LOAD
async function loadEdit(){

  document.getElementById('formTitle').innerText='Edit Product';
  document.getElementById('saveText').innerText='Update Product';
  const res=await fetch(`/api/shops/sports/${shopId}?t=${Date.now()}`);
  const data=await res.json();
  const p=(data.shop.products||[]).find(x=>x._id===editId);
  if(!p) return;
  document.getElementById('name').value=p.name||'';
  document.getElementById('brand').value=p.brand||'';
  document.getElementById('category').value=p.category||'Cricket';
  document.getElementById('price').value=p.price||'';
  document.getElementById('mrp').value=p.mrp||'';
  document.getElementById('stock').value=p.stock||'';
  document.getElementById('size').value=p.size||'';
  document.getElementById('color').value=p.color||'';
  document.getElementById('image').value=p.image||'';
  document.getElementById('description').value=p.description||'';
}
loadEdit();
</script>
</body>
