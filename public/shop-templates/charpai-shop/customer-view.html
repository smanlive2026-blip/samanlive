<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charpai Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fffbeb; }
       .header { background: linear-gradient(135deg, #92400e 0%, #78350f 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .filter-bar { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .filter { background: white; padding: 10px 20px; border-radius: 12px; cursor: pointer; font-weight: 600; }
       .filter.active { background: #92400e; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #92400e; }
       .btn-buy { background: #92400e; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .service-box { background: white; padding: 25px; border-radius: 20px; margin: 30px 0; text-align: center; border: 2px dashed #92400e; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-bed"></i> <span id="shopName">Shree Charpai Bhandar</span></h1>
        <p>Wooden Charpai, Iron Charpai, Rassi, Gadda | Bunai Service | Home Delivery</p>
    </div>

    <div class="container">
        <div class="service-box">
            <h3><i class="fa fa-tools"></i> Free Services</h3>
            <p>Charpai Bunai | Rassi Fitting | Repair | Home Delivery | Old Charpai Exchange</p>
        </div>

        <div class="filter-bar">
            <div class="filter active" onclick="filter('All')">All</div>
            <div class="filter" onclick="filter('Charpai')">Charpai</div>
            <div class="filter" onclick="filter('Rassi')">Rassi</div>
            <div class="filter" onclick="filter('Gadda')">Gadda</div>
            <div class="filter" onclick="filter('Service')">Service</div>
        </div>

        <div class="product-grid" id="productGrid"></div>
    </div>

    <script>
        const products = [
            {name: "Sheesham Wood Charpai", price: 3500, size: "6x3 ft", cat: "Charpai", material: "Sheesham", icon: "🛏️"}, 
            {name: "Iron Pipe Charpai", price: 2200, size: "6x3 ft", cat: "Charpai", material: "Iron", icon: "🛏️"},
            {name: "Nylon Rassi 20m", price: 150, size: "20 Meter", cat: "Rassi", material: "Nylon", icon: "🪢"},
            {name: "Cotton Rassi 15m", price: 120, size: "15 Meter", cat: "Rassi", material: "Cotton", icon: "🪢"},
            {name: "Foam Gadda", price: 800, size: "6x3 ft", cat: "Gadda", material: "Foam", icon: "🛏️"},
            {name: "Bunai Service", price: 400, size: "Per Piece", cat: "Service", material: "Labor", icon: "🔧"},
            {name: "Repair Service", price: 200, size: "Per Piece", cat: "Service", material: "Repair", icon: "🔧"},
            {name: "Designer Charpai", price: 5000, size: "6x4 ft", cat: "Charpai", material: "Teak", icon: "🛏️"}
        ];

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:50px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.material} | ${p.size}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Order Placed!')"><i class="fa fa-phone"></i> Call Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.filter').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
