<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plastic Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #eff6ff; }
       .header { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1400px; margin: -30px auto 40px; padding: 0 20px; }
        
       .tabs { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; }
       .tab { background: white; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: 600; white-space: nowrap; }
       .tab.active { background: #3b82f6; color: white; }
        
       .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
       .product-card { background: white; border-radius: 20px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); text-align: center; }
       .product-price { font-size: 22px; font-weight: 800; color: #3b82f6; }
       .btn-buy { background: #3b82f6; color: white; padding: 10px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 12px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin-top: 30px; text-align: center; border: 2px dashed #3b82f6; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-box"></i> <span id="shopName">Plastic World</span></h1>
        <p>Bucket, Chair, Storage, Kitchen | Cello, Nilkamal, Tupperware | Wholesale Available</p>
    </div>

    <div class="container">
        <div class="tabs">
            <div class="tab active" onclick="filter('All')">All 80+</div>
            <div class="tab" onclick="filter('Bucket')">Bucket 10</div>
            <div class="tab" onclick="filter('Chair')">Chair 8</div>
            <div class="tab" onclick="filter('Storage')">Storage 10</div>
            <div class="tab" onclick="filter('Kitchen')">Kitchen 15</div>
            <div class="tab" onclick="filter('Toys')">Toys 10</div>
            <div class="tab" onclick="filter('Home')">Home 12</div>
            <div class="tab" onclick="filter('Bathroom')">Bathroom 15</div>
        </div>

        <div class="product-grid" id="productGrid"></div>

        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Special Offers</h3>
            <p style="margin-top:10px;">Wholesale Price | Bulk Order Discount | Home Delivery | All Brands Available</p>

    </div>

        function display(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <div class="product-card">
                    <div style="font-size:40px; margin-bottom:10px;">${p.icon}</div>
                    <h3>${p.name}</h3>
                    <p style="color:#64748b; font-size:12px;">${p.cat}</p>
                    <div class="product-price">₹${p.price}</div>
                    <button class="btn-buy" onclick="alert('Added to cart!')"><i class="fa fa-cart-plus"></i> Buy Now</button>
                </div>
            `).join('');
        }
        function filter(cat) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            display(cat==='All'? products : products.filter(p => p.cat === cat));
        }
        display(products);
    </script>
</body>
</html>
