<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Shop - SAMANLIVE</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); overflow: hidden; }
       .header { padding: 20px; border-bottom: 2px solid #f1f5f9; display: flex; align-items: center; gap: 16px; }
       .header h1 { margin: 0; font-size: 22px; color: #1e293b; }
       .back-btn { background: #f1f5f9; border: none; padding: 10px 14px; border-radius: 10px; cursor: pointer; }
       .form-body { padding: 24px; }
       .form-group { margin-bottom: 20px; }
       .form-group label { display: block; font-weight: 700; color: #334155; margin-bottom: 8px; font-size: 14px; }
       .form-group input,.form-group textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 14px; box-sizing: border-box; }
       .form-group input:focus,.form-group textarea:focus { outline: none; border-color: #10b981; }
       .upload-wrap { display: flex; gap: 20px; margin-bottom: 20px; }
       .upload-box { flex: 1; text-align: center; }
       .upload-box img { width: 100%; height: 150px; object-fit: cover; border-radius: 12px; border: 2px dashed #cbd5e1; margin-bottom: 8px; }
       .upload-box.logo-preview { width: 100px; height: 100px; border-radius: 50%; margin: 0 auto 8px; }
       .btn-upload { background: #f1f5f9; border: 2px solid #e2e8f0; padding: 10px 16px; border-radius: 10px; cursor: pointer; font-weight: 700; width: 100%; }
       .btn-save { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 16px; cursor: pointer; width: 100%; }
       .btn-save:hover { transform: translateY(-2px); }
       .loader { display: none; text-align: center; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <button class="back-btn" onclick="history.back()"><i class="fa fa-arrow-left"></i></button>
            <h1><i class="fa fa-edit"></i> Edit Shop Profile</h1>
        </div>

        <div class="loader" id="loader"><i class="fa fa-spinner fa-spin" style="font-size:32px;"></i></div>

        <div class="form-body" id="formBody" style="display:none;">
            <div class="upload-wrap">
                <div class="upload-box">
                    <label>Shop Cover Photo</label>
                    <img id="coverPreview" src="https://via.placeholder.com/800x200/f1f5f9/94a3b8?text=Cover+Photo">
                    <button class="btn-upload" onclick="document.getElementById('coverInput').click()"><i class="fa fa-camera"></i> Change Cover</button>
                    <input type="file" id="coverInput" accept="image/*" style="display:none">
                </div>
                <div class="upload-box">
                    <label>Shop Logo</label>
                    <img id="logoPreview" class="logo-preview" src="https://ui-avatars.com/api/?name=Shop">
                    <button class="btn-upload" onclick="document.getElementById('logoInput').click()"><i class="fa fa-camera"></i> Change Logo</button>
                    <input type="file" id="logoInput" accept="image/*" style="display:none">
                </div>
            </div>

            <div class="form-group">
                <label>Shop Name *</label>
                <input type="text" id="shopName" placeholder="Enter Shop Name">
            </div>

            <div class="form-group">
                <label>Owner Name *</label>
                <input type="text" id="ownerName" placeholder="Enter Owner Name">
            </div>

            <div class="form-group">
                <label>Shop Address</label>
                <textarea id="shopAddress" rows="3" placeholder="Full Shop Address"></textarea>
            </div>

            <div class="form-group">
                <label>Shop Description</label>
                <textarea id="shopDesc" rows="3" placeholder="About your shop"></textarea>
            </div>

            <button class="btn-save" onclick="saveShop()"><i class="fa fa-save"></i> Save Changes</button>
        </div>
    </div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const shopId = urlParams.get('shopId');
let currentShop = {};
let coverFile = null;
let logoFile = null;

if(!shopId) alert('Invalid Shop');

document.getElementById('coverInput').onchange = e => {
    coverFile = e.target.files[0];
    document.getElementById('coverPreview').src = URL.createObjectURL(coverFile);
}
document.getElementById('logoInput').onchange = e => {
    logoFile = e.target.files[0];
    document.getElementById('logoPreview').src = URL.createObjectURL(logoFile);
}

async function loadShop(){
    document.getElementById('loader').style.display = 'block';
    try {
        const res = await fetch(`/api/local-market/shops/${shopId}`);
        currentShop = await res.json();

        document.getElementById('shopName').value = currentShop.shopName || '';
        document.getElementById('ownerName').value = currentShop.ownerName || '';
        document.getElementById('shopAddress').value = currentShop.address || '';
        document.getElementById('shopDesc').value = currentShop.description || '';

        if(currentShop.coverPhoto) document.getElementById('coverPreview').src = currentShop.coverPhoto;
        if(currentShop.logo) document.getElementById('logoPreview').src = currentShop.logo;

        document.getElementById('loader').style.display = 'none';
        document.getElementById('formBody').style.display = 'block';
    } catch(err){
        alert('Failed to load shop: ' + err.message);
    }
}

async function saveShop(){
    const token = localStorage.getItem('token');
    if(!token) return alert('Login required');

    const formData = new FormData();
    formData.append('shopName', document.getElementById('shopName').value);
    formData.append('ownerName', document.getElementById('ownerName').value);
    formData.append('address', document.getElementById('shopAddress').value);
    formData.append('description', document.getElementById('shopDesc').value);
    if(coverFile) formData.append('coverPhoto', coverFile);
    if(logoFile) formData.append('logo', logoFile);

    try {
        const res = await fetch(`/api/local-market/shops/${shopId}/update-profile`, {
            method: 'PUT',
            headers: {'Authorization': 'Bearer ' + token},
            body: formData
        });
        const data = await res.json();
        if(res.ok){
            alert('Shop Updated Successfully!');
            window.location.href = `/shop-template/cloth/dashboard.html?shopId=${shopId}`;
        } else {
            alert(data.message || 'Update failed');
        }
    } catch(err){
        alert('Error: ' + err.message);
    }
}

loadShop();
</script>
</body>
</html>
