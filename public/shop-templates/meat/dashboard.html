<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meat Shop PRO</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #dc2626 0%, #7f1d1d 100%); min-height: 100vh; padding: 20px; }
       .container { max-width: 1600px; margin: 0 auto; }
        
       .header { background: white; padding: 25px 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
       .header h1 { font-size: 28px; color: #7f1d1d; display: flex; align-items: center; gap: 12px; }
        
       .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; }
       .stat-card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.1); border-left: 5px solid #dc2626; position: relative; overflow: hidden; }
       .stat-card .icon { font-size: 32px; color: #dc2626; margin-bottom: 12px; }
       .stat-card h3 { color: #64748b; font-size: 14px; margin-bottom: 8px; }
       .stat-card .value { font-size: 32px; font-weight: 700; color: #1e293b; }
       .stat-card .trend { font-size: 12px; color: #16a34a; margin-top: 5px; }
        
       .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 25px; }
       .content-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); margin-bottom: 25px; }
       .content-card h2 { font-size: 22px; margin-bottom: 20px; color: #1e293b; display: flex; align-items: center; gap: 10px; }
        
       .btn { background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%); color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
       .btn-small { padding: 6px 12px; font-size: 12px; }
        
       .order-card { border: 2px solid #fee2e2; border-radius: 16px; padding: 18px; margin-bottom: 15px; }
       .order-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
       .status { padding: 6px 12px; border-radius: 10px; font-size: 12px; font-weight: 700; }
       .status.pending { background: #fef3c7; color: #78350f; }
       .status.ready { background: #dbeafe; color: #1e40af; }
       .status.delivered { background: #dcfce7; color: #166534; }
        
       .stock-alert { background: #fef2f2; border-left: 4px solid #dc2626; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        
        table { width: 100%; border-collapse: collapse; }
        table th { text-align: left; padding: 15px; background: #fef2f2; color: #991b1b; font-weight: 600; }
        table td { padding: 15px; border-bottom: 1px solid #fee2e2; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1><i class="fa fa-drumstick-bite"></i> <span id="shopName">Meat Shop PRO</span></h1>
                <div style="color:#64748b; font-size:14px;">Shop ID: <span id="shopIdDisplay"></span> | <span id="currentTime"></span></div>
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn" id="newOrderBtn"><i class="fa fa-plus"></i> New Order</button>
                <button class="btn" id="billingBtn"><i class="fa fa-receipt"></i> Billing</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="icon"><i class="fa fa-shopping-bag"></i></div><h3>Today Orders</h3><div class="value" id="todayOrders">0</div><div class="trend">↑ 12% from yesterday</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-weight-scale"></i></div><h3>Total Kg Sold</h3><div class="value"><span id="totalKg">0</span> kg</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-rupee-sign"></i></div><h3>Today Revenue</h3><div class="value">₹<span id="revenue">0</span></div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-users"></i></div><h3>Active Customers</h3><div class="value" id="customers">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-triangle-exclamation"></i></div><h3>Low Stock</h3><div class="value" id="lowStock">0</div></div>
            <div class="stat-card"><div class="icon"><i class="fa fa-truck"></i></div><h3>Deliveries</h3><div class="value" id="deliveries">0</div></div>
        </div>

        <div class="content-grid">
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-list"></i> Live Orders</h2>
                    <div id="orderList">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-boxes"></i> Inventory</h2>
                    <table id="inventoryTable">
                        <thead><tr><th>Item</th><th>Price/kg</th><th>Stock</th><th>Action</th></tr></thead>
                        <tbody id="inventoryBody"></tbody>
                    </table>
                </div>
            </div>
            <div>
                <div class="content-card">
                    <h2><i class="fa fa-bell"></i> Stock Alerts</h2>
                    <div id="stockAlerts">Loading...</div>
                </div>
                <div class="content-card">
                    <h2><i class="fa fa-star"></i> Top Customers</h2>
                    <div id="topCustomers">Loading...</div>
                </div>
            </div>
        </div>
    </div>
    <script src="dashboard.js"></script>
</body>
</html>
