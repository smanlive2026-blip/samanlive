<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aata Chakki</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: #fffbeb; }
       .header { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; padding: 50px 20px; text-align: center; }
       .header h1 { font-size: 36px; }
       .container { max-width: 1000px; margin: -30px auto 40px; padding: 0 20px; }
        
       .service-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin: 20px 0; }
       .service-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
       .service-price { font-size: 24px; font-weight: 800; color: #f59e0b; }
       .btn-book { background: #f59e0b; color: white; padding: 12px; border: none; border-radius: 10px; width: 100%; font-weight: 700; cursor: pointer; margin-top: 15px; }
        
       .booking-form { background: white; padding: 30px; border-radius: 20px; margin-top: 30px; }
       .form-group { margin-bottom: 20px; }
       .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
       .form-group input, .form-group select { width: 100%; padding: 12px; border: 2px solid #fef3c7; border-radius: 10px; }
        
       .offer-box { background: white; padding: 25px; border-radius: 20px; margin-top: 20px; text-align: center; border: 2px dashed #f59e0b; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fa fa-wheat-awn"></i> <span id="shopName">Shri Ram Aata Chakki</span></h1>
        <p>Taja Aata | Ghar se Pickup | Home Delivery | 100% Pure</p>
    </div>

    <div class="container">
        <h2 style="text-align:center; margin:20px 0;">Our Services & Rate</h2>
        <div class="service-grid" id="serviceGrid"></div>

        <div class="booking-form">
            <h3><i class="fa fa-book"></i> Book Your Order</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" placeholder="Enter your name">
            </div>
            <div class="form-group">
                <label>Mobile</label>
                <input type="tel" id="mobile" placeholder="Enter mobile number">
            </div>
            <div class="form-group">
                <label>Select Service</label>
                <select id="service">
                    <option>Gehu Aata Pisai</option>
                    <option>Bajra Aata Pisai</option>
                    <option>Besan Pisai</option>
                    <option>Masala Pisai</option>
                    <option>Mixed Aata</option>
                </select>
            </div>
            <div class="form-group">
                <label>Weight in KG</label>
                <input type="number" id="weight" placeholder="Enter KG">
            </div>
            <div class="form-group">
                <label>Service Type</label>
                <select id="type">
                    <option>Shop me dekar jana</option>
                    <option>Ghar se Pickup chahiye</option>
                    <option>Home Delivery chahiye</option>
                </select>
            </div>
            <button class="btn-book" onclick="bookOrder()"><i class="fa fa-check"></i> Book Now</button>
        </div>

        <div class="offer-box">
            <h3><i class="fa fa-gift"></i> Special Offer</h3>
            <p style="margin-top:10px;">50KG se upar Free Home Delivery | Monthly Subscription 10% OFF</p>
        </div>
    </div>

    <script>
        const services = [
            {name: "Gehu Aata Pisai", price: 5, unit: "kg", desc: "Fresh Gehu se bana shuddh aata", icon: "🌾"}, 
            {name: "Bajra Aata Pisai", price: 6, unit: "kg", desc: "Sardiyo ke liye garam bajra aata", icon: "🌾"},
            {name: "Jowar Aata", price: 7, unit: "kg", desc: "Healthy jowar ka aata", icon: "🌾"},
            {name: "Besan Pisai", price: 8, unit: "kg", desc: "Chana dal se taja besan", icon: "🌾"},
            {name: "Masala Pisai", price: 20, unit: "kg", desc: "Dhaniya, Jeera, Mirchi pisai", icon: "🌶️"},
            {name: "Mixed Aata", price: 8, unit: "kg", desc: "Gehu + Chana + Jowar mix", icon: "🌾"},
            {name: "Makka Aata", price: 6, unit: "kg", desc: "Makka ka taja aata", icon: "🌽"},
            {name: "Ragi Aata", price: 10, unit: "kg", desc: "Healthy ragi aata", icon: "🌾"}
        ];

        document.getElementById('serviceGrid').innerHTML = services.map(s => `
            <div class="service-card">
                <div style="font-size:40px; margin-bottom:10px;">${s.icon}</div>
                <h3>${s.name}</h3>
                <p style="color:#64748b; font-size:14px; margin:10px 0;">${s.desc}</p>
                <div class="service-price">₹${s.price}/${s.unit}</div>
                <button class="btn-book" onclick="selectService('${s.name}')"><i class="fa fa-cart-plus"></i> Select</button>
            </div>
        `).join('');

        function selectService(name) {
            document.getElementById('service').value = name;
            window.scrollTo(0, document.querySelector('.booking-form').offsetTop);
        }

        function bookOrder() {
            const name = document.getElementById('name').value;
            const mobile = document.getElementById('mobile').value;
            const service = document.getElementById('service').value;
            const weight = document.getElementById('weight').value;
            
            if(!name || !mobile || !weight) {
                alert('Please fill all details');
                return;
            }
            alert(`Order Booked! \nName: ${name}\nService: ${service}\nWeight: ${weight}KG\nWe will call you soon.`);
        }
    </script>
</body>
</html>
